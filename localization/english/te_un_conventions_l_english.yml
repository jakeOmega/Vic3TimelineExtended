l_english:

 # ---- Convention on Cultural Diversity (redesign phase 7, §0.12 item 5) ----
 je_un_conv_name_cultural_diversity:0 "Convention on Cultural Diversity"
 je_un_chamber_propose_topic_cultural_diversity:0 "#tooltippable;tooltip:je_un_chamber_propose_topic_cultural_diversity_tt #bold $je_un_conv_name_cultural_diversity$#!#!"
 je_un_chamber_propose_topic_cultural_diversity_tt:0 "Its parties would protect their minority cultures: slower [concept_assimilation], minority homelands that fade more slowly, and less weight from the [concept_foreign_cultural_benchmark]. The cultural hegemon, if it ratifies, would project less [concept_cultural_pull]. It needs Charter Reform I and UNESCO in force.\n\n$je_un_chamber_raised_agenda$"
 je_un_chamber_propose_needs_unesco:0 "#bold Requires:#! #R UNESCO#!, which the Cultural Heritage Program founds, to be in force"
 je_un_chamber_propose_need_cultural_diversity:0 "The Convention on Cultural Diversity is not already in force"
 je_un_chamber_topic_cultural_diversity:0 "#bold Cultural Diversity#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_chamber_conseq_cultural_diversity:0 "  #bold If it carries:#! $un_vote_cultural_diversity_passed_tt$"
 je_un_chamber_conv_cultural_diversity:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_un_chamber_conv_cultural_diversity_tt #bold $je_un_conv_name_cultural_diversity$#!#!"
 je_un_chamber_conv_cultural_diversity_tt:0 "[GetStaticModifier('un_cultural_diversity_modifier').GetName|v]\n[GetStaticModifier('un_cultural_diversity_modifier').GetDesc]\n#lore Shown at ×1: ours is scaled by [concept_un_enforcement].#!"
 je_un_chamber_regime_cultural_hegemon:0 "    #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_un_chamber_regime_cultural_hegemon_tt #R Hegemon restrained#!#!: as the world's leading culture, we project less cultural pull."
 je_un_chamber_regime_cultural_hegemon_tt:0 "[GetStaticModifier('un_regime_cultural_hegemon_modifier').GetName|v]\n[GetStaticModifier('un_regime_cultural_hegemon_modifier').GetDesc]\n#lore Shown at ×1: ours is scaled by [concept_un_enforcement].#!"
 je_un_led_topic_cultural_diversity:0 "        Convention on Cultural Diversity"
 je_un_led_reason_1371:0 "      #lore refused a convention on cultural diversity: the nation, it said, has one culture#!"
 un_vote.1.t_cultural_diversity:0 "Cultural Diversity Vote"
 un_vote.1.d_cultural_diversity:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has proposed a Convention on Cultural Diversity. A vote in favor commits our country to protect the cultures of its minorities: they would assimilate more slowly and keep their homelands longer, and the world's leading culture would weigh less on our government. The leading power itself would give up part of its reach."
 un_vote.2.d_cultural_diversity_passed:0 "The Convention on Cultural Diversity has been adopted by the General Assembly. Its parties will protect the languages and customs of their minorities, and the world's cultural hegemon, should it ratify, makes room for other cultures."
 un_vote.2.d_cultural_diversity_failed:0 "The Convention on Cultural Diversity has failed to pass the General Assembly. Too many governments want one nation and one culture, and the leading power saw no reason to share the stage."
 un_vote_cultural_diversity_passed_tt:0 "The Convention on Cultural Diversity was adopted. #G UN credibility +1, moving [concept_un_authority]'s target.#! Its parties' minority cultures #Y assimilate 20% more slowly#!, their homelands fade #G 30% more slowly#!, and a party that trails the cultural hegemon feels #G half#! the [concept_foreign_cultural_benchmark]. The hegemon, if it ratifies, projects #R 10% less#! [concept_cultural_pull]. All at ×1, scaled by [concept_un_enforcement]."
 un_cultural_diversity_modifier:0 "Convention on Cultural Diversity"
 un_cultural_diversity_modifier_desc:0 "This country is party to the Convention on Cultural Diversity. Its minority cultures keep their languages and customs: they assimilate more slowly, so they stay minorities for longer, and their homelands fade more slowly. It resists the cultural hegemon's [concept_foreign_cultural_benchmark]. Scaled by UN enforcement."
 un_cultural_diversity_refusal_modifier:0 "Refused the Cultural Diversity Convention"
 un_cultural_diversity_refusal_modifier_desc:0 "This country refused to table a convention protecting minority cultures, insisting that the nation has one culture."
 un_regime_cultural_hegemon_modifier:0 "Cultural Diversity: The Hegemon Makes Room"
 un_regime_cultural_hegemon_modifier_desc:0 "This country leads the world in cultural pull and is party to the Convention on Cultural Diversity, which obliges it to make room for other cultures. It projects less cultural pull. Scaled by UN enforcement."
 un_propose_cultural_diversity_not_hegemon_tt:0 "We are not the world's cultural hegemon"
 un_propose_cultural_diversity_needs_unesco_tt:0 "The Cultural Heritage Program (UNESCO) is in force"
 un_cultural_diversity_terms_hegemon_tt:0 "As the world's cultural hegemon we would also project #R 10% less#! [concept_cultural_pull], scaled by [concept_un_enforcement]."
 un_events.37.t:0 "Cultural Diversity"
 un_events.37.d:0 "Delegations at the United Nations are drafting a convention to protect the world's minority cultures: their languages, their schools, their customs and the homelands they live in. Nothing is before the General Assembly yet: we could table it. For [ROOT.GetCountry.GetName] it would mean minorities who assimilate more slowly and keep their homelands longer, and a shield against the leading power's culture crowding out our own."
 un_events.37.d_benchmark:0 "The world's leading culture weighs on [ROOT.GetCountry.GetName]: our people measure our government against it, and our legitimacy suffers. Delegations at the United Nations are drafting a convention to protect the world's cultures, our own minorities' among them, and to restrain the hegemon's reach. Nothing is before the General Assembly yet: we could table it."
 un_events.37.f:0 "UNESCO adopted the Convention on the Protection and Promotion of the Diversity of Cultural Expressions in 2005, by 148 votes to 2. The United States, the world's largest exporter of films and music, voted against it."
 un_events.37.a:0 "Propose the Convention to the General Assembly."
 un_events.37.c:0 "Our nation has one culture."

 # ---- Treaty on the Prohibition of Nuclear Weapons (redesign phase 7, §0.12 item 8) ----
 je_un_conv_name_nuclear_ban:0 "Treaty on the Prohibition of Nuclear Weapons"
 je_un_chamber_propose_topic_nuclear_ban:0 "#tooltippable;tooltip:je_un_chamber_propose_topic_nuclear_ban_tt #bold $je_un_conv_name_nuclear_ban$#!#!"
 je_un_chamber_propose_topic_nuclear_ban_tt:0 "Its armed parties would take their arsenals apart over 25 years, its unarmed parties would build none, and the [concept_nuclear_taboo] would rise. It needs Charter Reform II and the Non-Proliferation Treaty in force.\n\n$je_un_chamber_raised_agenda$"
 je_un_chamber_propose_needs_npt:0 "#bold Requires:#! #R the Non-Proliferation Treaty#! to be in force"
 je_un_chamber_propose_need_nuclear_ban:0 "The Treaty on the Prohibition of Nuclear Weapons is not already in force"
 je_un_chamber_topic_nuclear_ban:0 "#bold Prohibition of Nuclear Weapons#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_chamber_conseq_nuclear_ban:0 "  #bold If it carries:#! $un_vote_nuclear_ban_passed_tt$"
 je_un_chamber_conv_nuclear_ban:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_un_chamber_conv_nuclear_ban_tt #bold $je_un_conv_name_nuclear_ban$#!#!"
 je_un_chamber_conv_nuclear_ban_tt:0 "[GetStaticModifier('un_nuclear_ban_modifier').GetName|v]\n[GetStaticModifier('un_nuclear_ban_modifier').GetDesc]\n#lore Shown at ×1: ours is scaled by [concept_un_enforcement].#!"
 je_un_chamber_regime_nuclear_ban_ceiling:0 "    #tooltippable;tooltip:je_un_chamber_regime_nuclear_ban_tt #R Arsenal held#!#!: to #v [THIS.ScriptValue('nd_disp_ban_ceiling')|0]#! warheads, lower again in #v [THIS.ScriptValue('nd_disp_ban_months_to_step')|0]#! months."
 je_un_chamber_regime_nuclear_ban_none:0 "    #tooltippable;tooltip:je_un_chamber_regime_nuclear_ban_tt #R No warheads#!#!: we may hold or build none."
 je_un_chamber_regime_nuclear_ban_tt:0 "The Treaty on the Prohibition of Nuclear Weapons holds us to the #v [GetPlayer.MakeScope.ScriptValue('nd_disp_ban_base')|0]#! warheads we held when we ratified it, a fifth less every five years and none after 25 years. Warheads above the ceiling are taken apart, a tenth of the excess a month, and our programme builds nothing while we are at it. The ceiling is not scaled by [concept_un_enforcement], but it does not step down while the UN is Moribund. Leaving the United Nations ends it, and the world counts that as walking out of an arms-control treaty."
 je_un_led_topic_nuclear_ban:0 "        Treaty on the Prohibition of Nuclear Weapons"
 je_un_led_reason_1381:0 "      #lore refused to table a ban on nuclear weapons: not while others keep theirs, it said#!"
 un_vote.1.t_nuclear_ban:0 "Prohibition of Nuclear Weapons Vote"
 un_vote.1.d_nuclear_ban:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has proposed a Treaty on the Prohibition of Nuclear Weapons. A vote in favor commits our country to it: a party that holds warheads keeps a fifth fewer every five years until it holds none, and a party without them may never build one."
 un_vote.2.d_nuclear_ban_passed:0 "The Treaty on the Prohibition of Nuclear Weapons has been adopted by the General Assembly. Its parties renounce the bomb: those that hold it will take it apart over 25 years, and the rest will never build it. The nuclear powers that stay outside find the world less willing to look away."
 un_vote.2.d_nuclear_ban_failed:0 "The Treaty on the Prohibition of Nuclear Weapons has failed to pass the General Assembly. The nuclear powers, and those sheltering under their deterrent, carried the vote. The bomb stays legal."
 un_vote_nuclear_ban_passed_tt:0 "The Treaty on the Prohibition of Nuclear Weapons was adopted. #G UN credibility +1, moving [concept_un_authority]'s target.#! A party that holds warheads is held to the number it had when it ratified, #R a fifth less every five years#! and none after 25 years; a party that holds none may build none. A member that joins later holding warheads is not bound. While it is in force the [concept_nuclear_taboo]'s target rises by up to #G 6#!, as strong as UN authority."
 un_nuclear_ban_modifier:0 "Treaty on the Prohibition of Nuclear Weapons"
 un_nuclear_ban_modifier_desc:0 "This country is party to the Treaty on the Prohibition of Nuclear Weapons, which earns it [concept_prestige]. If it held warheads when it ratified, it is held to that number, a fifth less every five years and none after 25 years; if it held none, it may build none. The prestige is scaled by UN enforcement; the ceiling is not."
 un_nuclear_ban_refusal_modifier:0 "Refused the Nuclear Weapons Ban"
 un_nuclear_ban_refusal_modifier_desc:0 "This country refused to table a treaty banning nuclear weapons while others keep theirs."
 un_propose_nuclear_ban_unarmed_tt:0 "We hold no nuclear weapons"
 un_propose_nuclear_ban_needs_npt_tt:0 "The Non-Proliferation Treaty (IAEA) is in force"
 un_nuclear_ban_terms_armed_tt:0 "We hold #v [ROOT.GetCountry.MakeScope.ScriptValue('nd_stockpile')|0]#! nuclear warheads. Ratifying holds us to that number, #R a fifth less every five years#! and #R none#! after 25 years; warheads above the ceiling are taken apart, a tenth of the excess a month."
 un_nuclear_ban_terms_unarmed_tt:0 "We hold no nuclear warheads. Ratifying means #R we may build none#!: any programme of ours is held."
 nd_taboo_arsenal_ban:0 "Held to #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_disp_ban_ceiling')|0]#! by the UN ban"
 un_events.38.t:0 "Prohibition of Nuclear Weapons"
 un_events.38.d:0 "The Non-Proliferation Treaty stopped the bomb from spreading, but the powers that already held it kept it. Delegations at the United Nations are drafting a treaty to ban nuclear weapons outright: its parties that hold them would take them apart over 25 years, and the rest would never build them. Nothing is before the General Assembly yet. [ROOT.GetCountry.GetName] holds none, and could table it. No nuclear power is likely to sign."
 un_events.38.d_used:0 "Nuclear weapons have been used in war, and the world has seen what they do. Delegations at the United Nations are drafting a treaty to ban them outright: its parties that hold them would take them apart over 25 years, and the rest would never build them. Nothing is before the General Assembly yet. [ROOT.GetCountry.GetName] holds none, and could table it."
 un_events.38.f:0 "The Treaty on the Prohibition of Nuclear Weapons was adopted at the United Nations on 7 July 2017, by 122 votes to 1, and entered into force in January 2021. None of the nine nuclear-armed states took part in the negotiations."
 un_events.38.a:0 "Propose the Treaty to the General Assembly."
 un_events.38.c:0 "Not while others keep theirs."

 # ---- Homelands: the removal track's own speed (the Convention on Cultural Diversity) ----
 state_homeland_removal_speed_mult:0 "[concept_homeland] Removal Speed"
 state_homeland_removal_speed_mult_desc:0 "Modifies how quickly a non-primary culture loses its [concept_homeland] here once its share has fallen below the removal threshold. Negative values let minority homelands last longer."
 TE_HOMELAND_REMOVAL_TRACK_ACTIVE:0 "+[State.MakeScope.ScriptValue('te_homeland_removal_monthly_points')|2] points/month"

 lgbtq_rights_struggle_active_modifier_desc:0 "The LGBTQ+ rights movement creates social tension as the nation debates equality."
 lgbtq_rights_triumph_modifier:0 "LGBTQ+ Rights Triumph"
 lgbtq_rights_triumph_modifier_desc:0 "LGBTQ+ rights have been achieved, earning the nation [concept_prestige] and social [concept_power_bloc_cohesion]."

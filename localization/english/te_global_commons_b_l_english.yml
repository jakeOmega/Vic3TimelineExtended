l_english:
 # Global Commons — seabed licences (docs/superpowers/specs/2026-10-16-global-commons-design.md § 2)
 rule_global_commons_rule:0 "Global Commons"
 setting_global_commons_enabled:0 "Global Commons Enabled"
 setting_global_commons_enabled_desc:0 "The seabed is a commons. Each of five ocean basins holds a fixed pool of seabed licences, shared out every year among the countries with Abyssal Plain Mining, and every $building_ocean_mine$ level needs one. The UN's Law of the Sea can regulate the seabed, research stations can winter on the Antarctic ice, and an Antarctic Treaty can close the Southern basin."
 setting_global_commons_disabled:0 "Global Commons Disabled"
 setting_global_commons_disabled_desc:0 "The $building_ocean_mine$ is uncapped: any coastal state can build it without limit. The Law of the Sea has no seabed terms, and there are no Antarctic research stations and no Antarctic Treaty. Launch windows and orbital debris follow the Space Race rule."
 concept_seabed_licence:0 "Seabed Licence"
 concept_seabed_licence_desc:0 "Each Deep-Sea Mine level needs a seabed licence. The Pacific ([GetPlayer.MakeScope.ScriptValue('te_seabed_pool_pacific')|0]), Atlantic ([GetPlayer.MakeScope.ScriptValue('te_seabed_pool_atlantic')|0]), Indian ([GetPlayer.MakeScope.ScriptValue('te_seabed_pool_indian')|0]), Southern ([GetPlayer.MakeScope.ScriptValue('te_seabed_pool_southern')|0]) and Arctic ([GetPlayer.MakeScope.ScriptValue('te_seabed_pool_arctic')|0]) basins each hold a fixed pool, shared out every January by claim weight among the countries with Abyssal Plain Mining. A basin where we have incorporated coastal states counts our coastal states twice, our port levels, and our navy in proportion to the coast there; any other basin counts a twentieth of our navy. Our seabed policy multiplies the weight.\n\nA licence belongs to the level, not to the country: it is recorded on the state the mine stands in and changes hands with it. Built levels are never taken away; a smaller share only stops new building. A level takes its own basin's licence first. When that basin's share is used up it takes another basin's, at -25% throughput (Long-Haul Seabed Operations), until a local licence frees up."
 te_seabed_long_haul:0 "Long-Haul Seabed Operations"
 te_seabed_long_haul_desc:0 "Some of this state's Deep-Sea Mine levels work on another ocean basin's [concept_seabed_licence]. Their crews and ore travel the long way round. The penalty falls as local licences replace the distant ones."
 te_seabed_policy_sponsor_cost:0 "Seabed Policy: Sponsor Contractors"
 te_seabed_policy_sponsor_cost_desc:0 "We sponsor contractors to claim seabed licences, the lawful route under the Law of the Sea."
 te_seabed_policy_unilateral_cost:0 "Seabed Policy: Unilateral Licensing"
 te_seabed_policy_unilateral_cost_desc:0 "We license seabed mining under our own law and back the claims with our navy."
 building_ocean_mine_throughput_add:0 "$building_ocean_mine$ building [concept_throughput]"
 building_ocean_mine_throughput_add_desc:0 "$building_ocean_mine$ building [concept_throughput]"
 te_seabed_gate_room_tt:0 "[concept_seabed_licence]s to spare: #v [GetPlayer.MakeScope.ScriptValue('te_seabed_room_shown')|0]#! (unbuilt: Pacific [GetPlayer.MakeScope.ScriptValue('te_seabed_unbuilt_disp_pacific')|0], Atlantic [GetPlayer.MakeScope.ScriptValue('te_seabed_unbuilt_disp_atlantic')|0], Indian [GetPlayer.MakeScope.ScriptValue('te_seabed_unbuilt_disp_indian')|0], Arctic [GetPlayer.MakeScope.ScriptValue('te_seabed_unbuilt_disp_arctic')|0], Southern [GetPlayer.MakeScope.ScriptValue('te_seabed_unbuilt_disp_southern')|0])"
 te_seabed_gate_next_local_tt:0 "The next level here takes a licence from this state's own basin"
 te_seabed_gate_next_distant_tt:0 "The next level here takes another basin's licence, at #R -25%#! throughput (Long-Haul Seabed Operations) until a local one frees up"
 te_window_tab_seabed:0 "Seabed"
 te_window_tab_seabed_tt:0 "Our [concept_seabed_licence]s in the five ocean basins, and our seabed policy."
 te_window_tab_seabed_locked_tt:0 "#b Seabed#!\nNot open yet. It opens at the first seabed sharing after:\n"
 te_window_tab_seabed_met_tt:0 "#b Not open yet#!\nIts conditions are met. It opens at the next seabed sharing, within a month."
 te_seabed_unlock_tech_tt:0 "We have researched $abyssal_plain_mining$"
 te_seabed_unlock_coast_tt:0 "We have a coastal state"
 te_seabed_tab_header:0 "Seabed Licences"
 te_seabed_ov_policy:0 "Policy"
 te_seabed_ov_policy_tt:0 "Our seabed policy multiplies our claim weight in every basin: ×[GetPlayer.MakeScope.ScriptValue('te_seabed_policy_factor_survey')|2] under Scientific Survey, ×[GetPlayer.MakeScope.ScriptValue('te_seabed_policy_factor_sponsor')|0] under Sponsor Contractors and Unilateral Licensing, which also counts our navy twice. A new policy's weight counts from the next sharing, in January; its [concept_influence] from the day it is chosen."
 te_seabed_policy_name_1:0 "Scientific Survey"
 te_seabed_policy_name_2:0 "Sponsor Contractors"
 te_seabed_policy_name_3:0 "Unilateral Licensing"
 te_seabed_ov_regime:0 "Regime"
 te_seabed_regime_name_1:0 "Open"
 te_seabed_regime_name_2:0 "Regulated"
 te_seabed_regime_name_3:0 "Scramble"
 te_seabed_ov_regime_tt:0 "How the pools are shared.\n#b Open#!: each pool by claim weight among every claimant.\n#b Regulated#! (the Law of the Sea in force): half of each pool is reserved for the parties whose GDP per head is below the members' average, and the other half is open to every claimant.\n#b Scramble#! (two or more great powers licensing unilaterally while it is regulated): each whole pool by weight, every navy counted twice."
 te_seabed_ov_itlos:0 "ITLOS party"
 te_seabed_ov_itlos_yes:0 "#G Yes#!"
 te_seabed_ov_itlos_no:0 "No"
 te_seabed_ov_itlos_tt:0 "A party to the Convention on the Law of the Sea for seabed purposes. Under the Regulated regime a party claims in the reserved half of each pool if its GDP per head is below the members' average, and pays royalties."
 te_seabed_ov_licences:0 "Licences"
 te_seabed_ov_licences_value:0 "#v [GetPlayer.MakeScope.ScriptValue('te_seabed_held_total')|0] / [GetPlayer.MakeScope.ScriptValue('te_seabed_entitled_total')|0]#!"
 te_seabed_ov_licences_tt:0 "The licences our Deep-Sea Mine levels hold, built or under construction, against our share of the pools. A licence stays with its level and passes with its state."
 te_seabed_ov_distant:0 "From other basins"
 te_seabed_ov_distant_value:0 "#R [GetPlayer.MakeScope.ScriptValue('te_seabed_distant_total')|0]#!"
 te_seabed_ov_distant_tt:0 "Levels working on another basin's licence because their own basin's share was used up: #R -[GetPlayer.MakeScope.ScriptValue('te_seabed_long_haul_penalty_pct')|0]%#! throughput (Long-Haul Seabed Operations). Each swaps for a local licence as soon as one frees up."
 te_seabed_ov_room:0 "Room to build"
 te_seabed_ov_room_value:0 "#v [GetPlayer.MakeScope.ScriptValue('te_seabed_room_shown')|0]#!"
 te_seabed_ov_room_tt:0 "Deep-Sea Mine levels we can still queue: our unbuilt share in every basin, less the levels not yet licensed. The shares are worked out again each January; built levels are never taken away."
 te_seabed_policy_header:0 "Seabed Policy"
 te_seabed_policy_effect_1_tt:0 "Adopt #b Scientific Survey#!: our claim weight ×[GetPlayer.MakeScope.ScriptValue('te_seabed_policy_factor_survey')|2], and no [concept_influence] held."
 te_seabed_policy_effect_2_tt:0 "Adopt #b Sponsor Contractors#!, the lawful route under the Law of the Sea: our claim weight ×[GetPlayer.MakeScope.ScriptValue('te_seabed_policy_factor_sponsor')|0], and #R [GetPlayer.MakeScope.ScriptValue('te_seabed_influence_sponsor')|0]#! [concept_influence] held while it stands."
 te_seabed_policy_effect_3_tt:0 "Adopt #b Unilateral Licensing#!: our claim weight ×[GetPlayer.MakeScope.ScriptValue('te_seabed_policy_factor_unilateral')|0] with our navy counted twice, and #R [GetPlayer.MakeScope.ScriptValue('te_seabed_influence_unilateral')|0]#! [concept_influence] held while it stands. Relations fall by #R [GetPlayer.MakeScope.ScriptValue('te_seabed_unilateral_relations')|0]#! a year with each other unilateral claimant in a basin we share. While the Law of the Sea regulates the seabed, a party that licenses unilaterally defects from it."
 te_seabed_policy_not_current_tt:0 "This is not already our policy"
 te_seabed_policy_influence_2_tt:0 "We have #b [GetPlayer.MakeScope.ScriptValue('te_seabed_influence_sponsor')|0]#! [concept_influence] available"
 te_seabed_policy_influence_3_tt:0 "We have #b [GetPlayer.MakeScope.ScriptValue('te_seabed_influence_unilateral')|0]#! [concept_influence] available"

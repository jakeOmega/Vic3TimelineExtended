l_english:
 # Global Commons — seabed licences (docs/superpowers/specs/2026-10-16-global-commons-design.md § 2)
 rule_global_commons_rule:0 "Global Commons"
 setting_global_commons_enabled:0 "Global Commons Enabled"
 setting_global_commons_enabled_desc:0 "The seabed is a commons. Each of five ocean basins holds a fixed pool of [concept_seabed_licence]s, shared out every year among the countries with Abyssal Plain Mining, and every Deep-Sea Mine level needs one. The UN's Law of the Sea can regulate the seabed and the Antarctic Treaty can close the Southern Ocean."
 setting_global_commons_disabled:0 "Global Commons Disabled"
 setting_global_commons_disabled_desc:0 "The Deep-Sea Mine is uncapped: any coastal state can build it without limit. The Law of the Sea's seabed terms and the Antarctic Treaty don't appear. Launch windows and orbital debris follow the Space Race rule."
 concept_seabed_licence:0 "Seabed Licence"
 concept_seabed_licence_desc:0 "Each Deep-Sea Mine level needs a seabed licence. The Pacific ([GetPlayer.MakeScope.ScriptValue('te_seabed_pool_pacific')|0]), Atlantic ([GetPlayer.MakeScope.ScriptValue('te_seabed_pool_atlantic')|0]), Indian ([GetPlayer.MakeScope.ScriptValue('te_seabed_pool_indian')|0]), Southern ([GetPlayer.MakeScope.ScriptValue('te_seabed_pool_southern')|0]) and Arctic ([GetPlayer.MakeScope.ScriptValue('te_seabed_pool_arctic')|0]) basins each hold a fixed pool, shared out every January by claim weight among the countries with Abyssal Plain Mining. A basin where we have incorporated coastal states counts our coastal states twice, our port levels, and our navy in proportion to the coast there; any other basin counts a twentieth of our navy. Our seabed policy multiplies the weight.\n\nA licence belongs to the level, not to the country: it is recorded on the state the mine stands in and changes hands with it. Built levels are never taken away; a smaller share only stops new building. A level takes its own basin's licence first. When that basin's share is used up it takes another basin's, at -25% throughput (Long-Haul Seabed Operations), until a local licence frees up."
 te_seabed_long_haul:0 "Long-Haul Seabed Operations"
 te_seabed_long_haul_desc:0 "Some of this state's Deep-Sea Mine levels work on another ocean basin's [concept_seabed_licence]. Their crews and ore travel the long way round. The penalty falls as local licences replace the distant ones."
 te_seabed_policy_sponsor_cost:0 "Seabed Policy: Sponsor Contractors"
 te_seabed_policy_sponsor_cost_desc:0 "We sponsor contractors to claim seabed licences, the lawful route under the Law of the Sea."
 te_seabed_policy_unilateral_cost:0 "Seabed Policy: Unilateral Licensing"
 te_seabed_policy_unilateral_cost_desc:0 "We license seabed mining under our own law and back the claims with our navy."
 building_ocean_mine_throughput_add:0 "$building_ocean_mine$ building [concept_throughput]"
 building_ocean_mine_throughput_add_desc:0 "$building_ocean_mine$ building [concept_throughput]"
 te_seabed_gate_room_tt:0 "[concept_seabed_licence]s to spare: #v [GetPlayer.MakeScope.ScriptValue('te_seabed_room_shown')|0]#! (unbuilt: Pacific [GetPlayer.MakeScope.ScriptValue('te_seabed_unbuilt_disp_pacific')|0], Atlantic [GetPlayer.MakeScope.ScriptValue('te_seabed_unbuilt_disp_atlantic')|0], Indian [GetPlayer.MakeScope.ScriptValue('te_seabed_unbuilt_disp_indian')|0], Arctic [GetPlayer.MakeScope.ScriptValue('te_seabed_unbuilt_disp_arctic')|0], Southern [GetPlayer.MakeScope.ScriptValue('te_seabed_unbuilt_disp_southern')|0])"
 te_seabed_gate_next_local_tt:0 "The next level here takes a licence from this state's own basin"
 te_seabed_gate_next_distant_tt:0 "The next level here takes another basin's licence, at #R -25%#! throughput (Long-Haul Seabed Operations) until a local one frees up"

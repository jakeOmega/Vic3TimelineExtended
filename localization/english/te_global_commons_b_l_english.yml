 TE_STATE_SEABED_TT:0 "#bold [concept_seabed_licence]s#!\nHere: #v [State.MakeScope.ScriptValue('te_seabed_state_records')|0]#! recorded, #v [State.MakeScope.ScriptValue('te_seabed_state_distant_records')|0]#! of them from other basins\n\n#bold Our licences#! (held, unbuilt; the world's records of the pool)\nPacific: #v [State.GetOwner.MakeScope.ScriptValue('te_seabed_held_disp_pacific')|0]#!, #v [State.GetOwner.MakeScope.ScriptValue('te_seabed_unbuilt_disp_pacific')|0]#!; [State.MakeScope.ScriptValue('te_seabed_world_records_disp_pacific')|0] of [State.MakeScope.ScriptValue('te_seabed_pool_pacific')|0] (weight [State.GetOwner.MakeScope.ScriptValue('te_seabed_w_disp_pacific')|1])\nAtlantic: #v [State.GetOwner.MakeScope.ScriptValue('te_seabed_held_disp_atlantic')|0]#!, #v [State.GetOwner.MakeScope.ScriptValue('te_seabed_unbuilt_disp_atlantic')|0]#!; [State.MakeScope.ScriptValue('te_seabed_world_records_disp_atlantic')|0] of [State.MakeScope.ScriptValue('te_seabed_pool_atlantic')|0] (weight [State.GetOwner.MakeScope.ScriptValue('te_seabed_w_disp_atlantic')|1])\nIndian: #v [State.GetOwner.MakeScope.ScriptValue('te_seabed_held_disp_indian')|0]#!, #v [State.GetOwner.MakeScope.ScriptValue('te_seabed_unbuilt_disp_indian')|0]#!; [State.MakeScope.ScriptValue('te_seabed_world_records_disp_indian')|0] of [State.MakeScope.ScriptValue('te_seabed_pool_indian')|0] (weight [State.GetOwner.MakeScope.ScriptValue('te_seabed_w_disp_indian')|1])\nArctic: #v [State.GetOwner.MakeScope.ScriptValue('te_seabed_held_disp_arctic')|0]#!, #v [State.GetOwner.MakeScope.ScriptValue('te_seabed_unbuilt_disp_arctic')|0]#!; [State.MakeScope.ScriptValue('te_seabed_world_records_disp_arctic')|0] of [State.MakeScope.ScriptValue('te_seabed_pool_arctic')|0] (weight [State.GetOwner.MakeScope.ScriptValue('te_seabed_w_disp_arctic')|1])\nSouthern: #v [State.GetOwner.MakeScope.ScriptValue('te_seabed_held_disp_southern')|0]#!, #v [State.GetOwner.MakeScope.ScriptValue('te_seabed_unbuilt_disp_southern')|0]#!; [State.MakeScope.ScriptValue('te_seabed_world_records_disp_southern')|0] of [State.MakeScope.ScriptValue('te_seabed_pool_southern')|0] (weight [State.GetOwner.MakeScope.ScriptValue('te_seabed_w_disp_southern')|1])\n\nRoom to build: #v [State.GetOwner.MakeScope.ScriptValue('te_seabed_room_shown')|0]#!\n\n#lore At home, weight is (2 × incorporated coastal states + port levels + navy × the basin's share of our coast) × the policy factor; elsewhere, a twentieth of the navy. Levels on another basin's licence work at -[State.MakeScope.ScriptValue('te_seabed_long_haul_penalty_pct')|0]% throughput.#!"

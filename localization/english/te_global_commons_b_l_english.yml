 te_seabed_how_header:0 "How Seabed Licences Work"
 te_seabed_how_sub_pools:0 "Pools"
 te_seabed_how_pools:0 "Each Deep-Sea Mine level needs a [concept_seabed_licence]. Each ocean basin holds a fixed pool: Pacific [GetPlayer.MakeScope.ScriptValue('te_seabed_pool_pacific')|0], Atlantic [GetPlayer.MakeScope.ScriptValue('te_seabed_pool_atlantic')|0], Indian [GetPlayer.MakeScope.ScriptValue('te_seabed_pool_indian')|0], Southern [GetPlayer.MakeScope.ScriptValue('te_seabed_pool_southern')|0] and Arctic [GetPlayer.MakeScope.ScriptValue('te_seabed_pool_arctic')|0]. Every January the pools are shared out by claim weight among the countries with $abyssal_plain_mining$, and a country that newly qualifies gets its share the month after. A share never falls below the licences a country holds: built levels are never taken away, and a smaller share only stops new building."
 te_seabed_how_sub_weight:0 "Claim Weight"
 te_seabed_how_weight:0 "In a basin where we have incorporated coastal states, our weight is twice those states, plus their port levels, plus our navy in proportion to our coast there. Anywhere else it is a twentieth of our navy, so a distant claim is small but never barred. An Antarctic research station adds [GetPlayer.MakeScope.ScriptValue('te_seabed_station_weight')|0] in the Southern basin."
 te_seabed_how_sub_licences:0 "Licences"
 te_seabed_how_licences:0 "A licence belongs to the level, not the country. It is recorded on the state the mine stands in and passes with it: a conquered mine keeps its licences, and the conqueror holds them. Levels that are downsized or destroyed give their licences back to their owner's share."
 te_seabed_how_distant:0 "A level takes its own basin's licence first. When that share is used up it takes one from the basin where we have the most to spare, at #R -[GetPlayer.MakeScope.ScriptValue('te_seabed_long_haul_penalty_pct')|0]%#! throughput (Long-Haul Seabed Operations), and swaps to a local licence as soon as one frees up."
 te_seabed_how_sub_policy:0 "Policy and Regime"
 te_seabed_how_policy:0 "Scientific Survey claims at a quarter of our weight and holds no [concept_influence]. Sponsor Contractors claims at full weight for [GetPlayer.MakeScope.ScriptValue('te_seabed_influence_sponsor')|0] influence. Unilateral Licensing counts our navy twice for [GetPlayer.MakeScope.ScriptValue('te_seabed_influence_unilateral')|0] influence, and costs relations each year with every other unilateral claimant in a basin we share."
 te_seabed_how_regime:0 "While the Law of the Sea is in force, half of each pool is reserved for its poorer parties and half is open to all. If two or more great powers license unilaterally, the regime falls into a scramble: whole pools, and every navy counted twice."

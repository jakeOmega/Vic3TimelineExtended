l_english:

#
# POWER_BLOCS
#
 power_bloc_banking_union_bool:0 "[concept_banking_common_currency] Banking Union"
 power_bloc_banking_union_bool_desc:0 "One supervisor and one deposit guarantee for the banks of every country using the currency, under any banking law but $law_unregulated_banking$. A [concept_banking_crash] spreads down the shared currency far less readily, and the leader pays a supervision cost for each adopter."
 power_bloc_can_enact_decree_cultural_emigration_initiative_bool:0 "Can Enact Cultural Emigration Initiative [Concept('concept_decree', 'Decree')]"
 power_bloc_can_enact_decree_cultural_emigration_initiative_bool_desc:0 "Can enact the Cultural Emigration Initiative [concept_decree], which encourages emigration of non-[concept_primary_cultures] to other countries."
 power_bloc_can_enact_greenest_grass_campaign_bool:0 "Can Enact Greenest Grass Campaign"
 power_bloc_can_enact_greenest_grass_campaign_bool_desc:0 "Can enact the Greenest Grass Campaign [concept_decree], an upgraded version of the Greener Grass Campaign decree."
 power_bloc_can_give_development_aid_bool:0 "Members Can Give Development Assistance"
 power_bloc_can_give_development_aid_bool_desc:0 "Can give development assistance to another country, at the cost of [concept_authority], raising the [concept_sol] of its poorest and increasing its dependence on the donor."
 power_bloc_can_give_education_aid_bool:0 "Members Can Give Education Aid"
 power_bloc_can_give_education_aid_bool_desc:0 "Can give educational assistance to another country, at the cost of [concept_bureaucracy], increasing [concept_education_access] in the target country."
 power_bloc_can_give_healthcare_aid_bool:0 "Members Can Give Healthcare Aid"
 power_bloc_can_give_healthcare_aid_bool_desc:0 "Can give healthcare aid to another country, at the cost of [concept_bureaucracy], widening [concept_health_care_access], decreasing mortality and increasing [concept_sol] in the target country."
 power_bloc_can_give_humanitarian_aid_bool:0 "Members Can Give Humanitarian Aid"
 power_bloc_can_give_humanitarian_aid_bool_desc:0 "Can give humanitarian aid to assist the poor in another country, increasing [concept_influence] and improving relations."
 power_bloc_can_give_science_aid_2_bool:0 "Members Can Give Large Science Aid"
 power_bloc_can_give_science_aid_2_bool_desc:0 "Can give science aid to another country, spending [concept_innovation], increasing [concept_technology_spread] in the target country."
 power_bloc_can_give_science_aid_bool:0 "Members Can Give Science Aid"
 power_bloc_can_give_science_aid_bool_desc:0 "Can give science aid to another country, spending [concept_innovation], increasing [concept_technology_spread] in the target country."
 power_bloc_can_give_security_aid_bool:0 "Members Can Give Security Aid"
 power_bloc_can_give_security_aid_bool_desc:0 "Can give security aid to another country, at the cost of [concept_bureaucracy], decreasing [concept_turmoil] in the target country."
 power_bloc_can_use_crisis_resolution_bool:0 "Leader Can Use Crisis Resolution [concept_diplomatic_action]"
 power_bloc_can_use_crisis_resolution_bool_desc:0 "Leader can use the Crisis Resolution [concept_diplomatic_action] to resolve crises and stabilize [Concept('concept_power_bloc_member', '$concept_power_bloc_members|q$')], at the cost of [concept_authority]."
 power_bloc_can_use_extend_influence_bool:0 "Can Use Extend Influence [concept_diplomatic_action]"
 power_bloc_can_use_extend_influence_bool_desc:0 "Can use the Extend Influence [concept_diplomatic_action] to increase the leverage of the [concept_power_bloc] in a [concept_country]."
 power_bloc_can_use_join_united_nations_bool:0 "Leader Can Require UN Membership"
 power_bloc_can_use_join_united_nations_bool_desc:0 "[Concept('concept_power_bloc_leader', '$concept_power_bloc_leader_short|q$')] can add the Require UN Membership article to treaties, binding another country into the United Nations."
 power_bloc_debt_administration_bool:0 "Leader Guarantees Member Debts"
 power_bloc_debt_administration_bool_desc:0 "Under the [concept_consortium_guarantee], the leader takes part of each member's debt-load [concept_banking_risk_premium] off it, and is called on when a member defaults."
 power_bloc_fiscal_backstop_bool:0 "Leader Is Lender of Last Resort to Adopters"
 power_bloc_fiscal_backstop_bool_desc:0 "The leader backs every adopter's debts: it takes part of each one's debt-load [concept_banking_risk_premium] off it, and pays for that in premium of its own, scaled by the adopter's GDP beside its own. A default calls the guarantee."
 power_bloc_grid_interconnection_bool:0 "Members’ Power Grids Interconnect"
 power_bloc_grid_interconnection_bool_desc:0 "Members' $building_grid_transfer_station$s join where they border, and their undersea cables where either one's range reaches the other, as under a $grid_interconnection_agreement$."
 power_bloc_leader_can_force_cultural_acceptance_bool:0 "Leader Can Force Cultural Acceptance"
 power_bloc_leader_can_force_cultural_acceptance_bool_desc:0 "[Concept('concept_power_bloc_leader', '$concept_power_bloc_leader_short|q$')] can force [Concept('concept_power_bloc_member', '$concept_power_bloc_members|q$')] to add the leader's [concept_primary_cultures] to their primary cultures."
 power_bloc_leader_can_force_cultural_adoption_bool:0 "Leader Can Force Cultural Adoption"
 power_bloc_leader_can_force_cultural_adoption_bool_desc:0 "[Concept('concept_power_bloc_leader', '$concept_power_bloc_leader_short|q$')] can force [Concept('concept_power_bloc_member', '$concept_power_bloc_members|q$')] to replace their [concept_primary_cultures] with the leader's primary cultures."
 power_bloc_leader_can_peacefully_annex_bool:0 "Leader Can Peacefully Annex Subjects"
 power_bloc_leader_can_peacefully_annex_bool_desc:0 "[Concept('concept_power_bloc_leader', '$concept_power_bloc_leader_short|q$')] can peacefully annex [Concept('concept_subject', '$concept_subjects|q$')] without a [concept_diplomatic_play], if the subject has low [concept_liberty_desire] and a sufficiently low [Concept('concept_gdp', 'GDP')]."
 power_bloc_reserve_currency_bool:0 "[concept_banking_common_currency] Is a Reserve Currency"
 power_bloc_reserve_currency_bool_desc:0 "Once a member has adopted, every country anchored on the leader's money counts toward its [concept_banking_currency_reach], treaty peggers included, and the most the world's holdings can take off the leader's [concept_banking_credit_standing] is doubled."
 power_bloc_shared_currency_bool:0 "Members May Adopt the [concept_banking_common_currency]"
 power_bloc_shared_currency_bool_desc:0 "Any member may give up its own money for the leader's. How Banking Works, in the Banking tab, lists what adopting requires and what leaving costs."
 principle_group_artistic_expression:0 "Artistic Expression"
 principle_group_artistic_expression_desc:0 "The [concept_power_bloc] encourages artistic expression and the development of culture."
 principle_group_conditionality:0 "Conditionality"
 principle_group_conditionality_desc:0 "The terms on which the [concept_power_bloc] rescues a member that defaults: how much of its government the leader takes over, and for how long."
 principle_group_cultural_plurality:0 "Cultural Plurality"
 principle_group_cultural_plurality_desc:0 "The [concept_power_bloc] encourages cultural plurality and understanding throughout its territories."
 principle_group_cultural_unity:0 "Cultural Unity"
 principle_group_cultural_unity_desc:0 "The [concept_power_bloc] enforces cultural unity among its members in the public sphere."
 principle_group_development_lending:0 "Development Lending"
 principle_group_development_lending_desc:0 "The [concept_power_bloc]'s richer members lend to its poorer ones: part of their private investment goes to build up the rest of the bloc."
 principle_group_education:0 "Education"
 principle_group_education_desc:0 "The [concept_power_bloc] encourages education and intellectual development."
 principle_group_engineering_and_logistics:0 "Engineering and Logistics"
 principle_group_engineering_and_logistics_desc:0 "The [concept_power_bloc] encourages military engineering and logistics development."
 principle_group_environmental_sustainability:0 "Environmental Sustainability"
 principle_group_environmental_sustainability_desc:0 "The [concept_power_bloc] encourages environmental sustainability and the protection of the environment."
 principle_group_global_security:0 "Global Security"
 principle_group_global_security_desc:0 "The [concept_power_bloc] encourages global security and views its mandate as a protector of international peace."
 principle_group_healthcare:0 "Healthcare"
 principle_group_healthcare_desc:0 "The [concept_power_bloc] encourages healthcare and the well-being of its citizens."
 principle_group_military_training:0 "Military Training"
 principle_group_military_training_desc:0 "The [concept_power_bloc] encourages military training and the development of military technology."
 principle_group_monetary_union:0 "Monetary Union"
 principle_group_monetary_union_desc:0 "The [concept_power_bloc] binds its members' money together — first their central banks, then their currency, and at last their debts."
 principle_group_multilateral_institutions:0 "Multilateral Institutions"
 principle_group_multilateral_institutions_desc:0 "The [concept_power_bloc] anchors itself in the international order, building up the United Nations and binding its members through a web of treaties and institutions."
 principle_group_rural:0 "Rural Development"
 principle_group_rural_desc:0 "The [concept_power_bloc] encourages rural development and the improvement of rural [concept_infrastructure]."
 principle_group_urban_planning:0 "Urban Planning"
 principle_group_urban_planning_desc:0 "The [concept_power_bloc] encourages urban planning and the development of cities."
 principle_group_welfare:0 "Welfare"
 principle_group_welfare_desc:0 "The [concept_power_bloc] encourages welfare and the well-being of its citizens."

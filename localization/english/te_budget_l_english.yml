 te_budget_chart_administration_group_tt:0 "#b $te_budget_chart_administration_group$#!\nGovernment Administration's weekly cost, split between your institutions and General Administration.\n$TOOLTIP_DELIMITER$\nAdministration cost: @money![TopScope.ScriptValue('te_budget_administration_cost')|D]\nBureaucracy produced: @bur![TopScope.ScriptValue('te_budget_produced_bureaucracy')|D]\nInstitution bureaucracy use: @bur![GetPlayer.GetInstitutionInvestmentBureaucracyCost|D]\nInstitution pool: @money![TopScope.ScriptValue('te_budget_institution_pool')|D]"
 te_budget_chart_administration_tt:0 "Government Administration's cost that no institution takes: unused capacity and bureaucracy used outside institutions."
 te_budget_chart_army:0 "Army"
 te_budget_chart_civil:0 "Other Civil Buildings"
 te_budget_chart_civil_tt:0 "Wages and goods of universities, ports and other civil buildings. Government Administration is split among your institutions under Administration, and the Space Program is under Programme Costs."
 te_budget_chart_construction_tt:0 "Goods for the government's construction. The Investment Pool Transfer, which funds private construction, is left out."
 te_budget_chart_diplomacy_expense:0 "Diplomatic Payments"
 te_budget_chart_diplomacy_income:0 "Diplomatic Income"
 te_budget_chart_expand_tt:0 "Show or hide the rows inside."
 te_budget_chart_expense:0 "Weekly Expenses"
 te_budget_chart_group_tt:0 "Includes the indented rows below it."
 te_budget_chart_how:0 "How the Breakdown Works"
 te_budget_chart_how_admin:0 "Government Administration produces bureaucracy and tax capacity rather than goods for sale. Its weekly operating deficit is the cost of its wages and input goods, including any slave upkeep.\n\nThe share allocated to institutions is their current bureaucracy use divided by all bureaucracy produced, capped at 100%. Each institution receives that pool in proportion to its current level, including institutions with reduced bureaucracy costs; targets still being implemented do not count. General Administration receives the remainder, including unused capacity and bureaucracy used outside institutions. With no production or no institution levels, all administration costs stay there.\n\nThe budget predicts wages while administration buildings report their latest weekly balance, so the allocation is capped at the government's civil wage, goods and slave-upkeep total."
 te_budget_chart_how_charts:0 "Income and expense totals leave out the Investment Pool Transfer. A share counts positive amounts only: a refund stays in the list with its sign and a zero share, so expanding a group never changes the whole, and a group whose costs and refunds cancel can still be expanded. Other Income and Other Expenses reconcile the listed rows to the budget's totals, including temporary flows and uncategorized items."
 te_budget_chart_how_civil:0 "Universities, ports and other civil buildings stay under Other Civil Buildings, except the Space Program: its weekly operating deficit, its wages and Launch Capacity, appears under Programme Costs as part of Space Race, capped at what the civil total holds after administration. Construction Goods leaves out the Investment Pool Transfer, which funds private construction."
 te_budget_chart_how_journal:0 "Banking, Covert Actions, Cultural Hegemony, the United Nations and other systems have rows of their own, each listing the sources applied now, with their multipliers and any decay. Their amounts are taken out of Additional Expenses or Income once, and only the unattributed remainder stays there. One-time treasury payments and costs in other resources are outside the weekly budget."
 te_budget_chart_how_military:0 "Military includes army and navy wages, goods, slave upkeep, warship construction and warship maintenance; Shipping covers supply ships and port connections. Each branch's wages are its forecast total less its goods. Materials and Support is its goods plus the whole operating deficit of logistics centers and naval fortifications, their wages, goods and slave upkeep together. Barracks, conscription and naval administration are already in the branch forecast and are not added again. Navy also includes warship construction and maintenance. Weekly operating balances can differ from wage forecasts, and Other Military Costs reconciles the difference."

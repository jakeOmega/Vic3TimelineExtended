 te_tax_est_goods:0 "Taxed goods: the effect depends on how much pops buy of these goods, so it is not estimated."
 te_tax_est_header:0 "Revenue Estimate"
 te_tax_est_header_tt:0 "A static estimate at today's economy, not a forecast. Each Budget line's receipts today are scaled by the rate existing law and the draft set in its month, against the rate in force at the economy snapshot. It assumes pops, wages, prices and purchases stay as they are. Receipts are counted where the law collects them; part of a tax may pass on through prices and wages.\n\nNot counted: taxed goods and agricultural relief; other collection modifiers, taken as unchanged; any tax outside the code that the same Budget line collects, scaled with the rest. Rural assessment and head tax share the Poll line, so while both are collected it shows the range any split between them allows, and bringing in or removing rural assessment or head tax moves some of the other's payers. Receipts can lag a new rate for some days after it takes effect.\n\nA tax that was not collected at the snapshot, or any tax before the first snapshot, has no receipts to scale: it shows no current base and no figure."
 te_tax_est_income:0 "About @money!#v [Multiply_CFixedPoint( GetPlayer.GetIncomeTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_income_bill') )|K]#! a week with this bill, against @money!#v [Multiply_CFixedPoint( GetPlayer.GetIncomeTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_income_law') )|K]#! under existing law: @money!#v [Multiply_CFixedPoint( GetPlayer.GetIncomeTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_income_delta') )|+K]#!"
 te_tax_est_nobase:0 "No current base — estimate unavailable."
 te_tax_est_none:0 "No economy snapshot yet: the first is taken the day after this country's taxes come under the code. Until then no tax has a current base to estimate from."
 te_tax_est_poll:0 "About @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_poll_bill_lo') )|K]#! a week with this bill, against @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_poll_law_lo') )|K]#! under existing law: @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_poll_delta_lo') )|+K]#!"
 te_tax_est_poll_range:0 "@money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_poll_bill_lo') )|K]#! to @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_poll_bill_hi') )|K]#! a week with this bill, against @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_poll_law_lo') )|K]#! to @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_poll_law_hi') )|K]#! under existing law: @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_poll_delta_lo') )|+K]#! to @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_poll_delta_hi') )|+K]#!. Rural assessment and head tax share this line, and today's receipts do not say how they divide."

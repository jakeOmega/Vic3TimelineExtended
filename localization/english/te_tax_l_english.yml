 te_tax_tt_cmd_draft_step_up:0 "Raises this tax by one step in the draft."
 te_tax_tt_cmd_draft_sunset_down:0 "Brings this change's expiry forward. Below 6 months it becomes permanent."
 te_tax_tt_cmd_draft_sunset_up:0 "Pushes this change's expiry back. A permanent change gets an expiry 6 months after it commences."
 te_tax_tt_cmd_introduce:0 "Introduces the draft as a tax bill. Debate starts, and each interest group decides whether to commit to it. No tax changes until the bill passes and commences."
 te_tax_tt_cmd_package_release:0 "Drops the passed bill and frees its slot. Nothing it would have changed takes effect. To enact its terms, pass them again as a new bill."
 te_tax_tt_cmd_package_reschedule:0 "The passed bill commences next month instead. Its expiry dates stay as approved."
 te_tax_tt_cmd_pass:0 "Passes the bill. It commences on the 1st of its commencement month and replaces any change a passed bill had scheduled for the same provisions in or after that month. Interest groups that opposed it disapprove for six months."

 te_tax_obl_state_tt:0 "Pending: binds only if this revision of the bill passes. Bound: starts when its bill takes effect. Then it must be delivered by its deadline and kept for its term, checked on the 1st of every month. Once in force it can be renegotiated. Breaking it never repeals the bill."
 te_tax_obl_what_bureaucracy:0 "No [concept_bureaucracy] deficit"
 te_tax_obl_what_fiscal:0 "Fixed income above fixed expenses"

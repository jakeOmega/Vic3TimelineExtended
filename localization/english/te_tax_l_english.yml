 te_tax_tt_cmd_draft_step_up:0 "Raises this tax by one step in the draft."
 te_tax_tt_cmd_draft_sunset_down:0 "Brings this change's expiry forward. Below 6 months it becomes permanent."
 te_tax_tt_cmd_draft_sunset_up:0 "Pushes this change's expiry back. A permanent change gets an expiry 6 months after it commences."
 te_tax_tt_cmd_force_through:0 "Passes the bill by [concept_legislative_override_capacity], without a committed majority. It commences as any passed bill does, and groups that opposed it disapprove as they would. The override's own cost and consequences follow."
 te_tax_tt_cmd_introduce:0 "Introduces the draft as a tax bill. Debate starts, and each interest group decides whether to commit to it. No tax changes until the bill passes and commences."
 te_tax_tt_cmd_obl_renegotiate:0 "A promise already in force can be renegotiated; it costs that group's trust. The government is released from it: the group disapproves, though less than for a broken promise, and trusts the government a step less. Nothing already done is undone."
 te_tax_tt_cmd_package_release:0 "Drops the passed bill, making room for another to wait. Nothing it would have changed takes effect. To enact its terms, pass them again as a new bill."
 te_tax_tt_cmd_package_reschedule:0 "The passed bill commences next month instead. Its expiry dates stay as approved."
 te_tax_tt_cmd_pass:0 "Passes the bill. It commences on the 1st of its commencement month and replaces any change a passed bill had scheduled for the same provisions in or after that month. Interest groups that opposed it disapprove for six months."
 te_tax_tt_cmd_reschedule:0 "Moves the bill's commencement to next month. Interest groups keep their commitments."
 te_tax_tt_cmd_revise:0 "Replaces the bill with the draft. Every interest group's commitment is released and debate starts again."
 te_tax_tt_cmd_withdraw:0 "Withdraws the bill. Every interest group's commitment to it and every day of its debate are lost; a bill introduced later starts over. An open draft is kept. The tax code and the bills already passed stay as they are."

 te_tax_lt_tt_level_falls:0 "#P Your tax level falls:#! no other tax sits on this step."
 te_tax_lt_tt_level_rises:0 "#N Your tax level rises:#! this becomes your heaviest tax."
 te_tax_lt_tt_levied:0 "Your taxation law levies this tax."
 te_tax_lt_tt_step_down:0 "Lowers this tax by one step, at once."
 te_tax_lt_tt_step_max:0 "Raises this tax to the highest rate your taxation law allows, at once."
 te_tax_lt_tt_step_min:0 "Lowers this tax to the lowest rate your taxation law allows, at once."
 te_tax_lt_tt_step_up:0 "Raises this tax by one step, at once."

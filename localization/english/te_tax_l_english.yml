 te_tax_ig_ideo:0 "Views on Taxation"
 te_tax_ig_ideo_tt:0 "The group's view of progressive taxation, from its stances on the taxation laws, set against whether the bill makes taxes more or less progressive."
 te_tax_ig_ideo_value:0 "[InterestGroup.MakeScope.ScriptValue('te_tax_disp_ig_ideo')|=+0]"
 te_tax_ig_mat:0 "Cost to Members"
 te_tax_ig_mat_tt:0 "What the bill's changes cost the group's members, weighted by how much of each tax they pay. Taxing a good counts as a higher consumption tax, staples most and luxuries least; relief the bill grants counts for those it relieves (agricultural relief for rural folk and landowners, regional relief for every group, less for industrialists and the petty bourgeoisie)."
 te_tax_ig_mat_value:0 "[InterestGroup.MakeScope.ScriptValue('te_tax_disp_ig_mat')|=+0]"
 te_tax_ig_name:0 "[InterestGroup.GetName]"
 te_tax_ig_offer_commits:0 "In return it commits to the bill."
 te_tax_ig_offer_est_agrel:0 "Revenue: reduces collections from agricultural wages; not estimated."
 te_tax_ig_offer_est_cons:0 "Revenue: about @money!#v [Multiply_CFixedPoint( GetPlayer.PredictConsumptionTaxes, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_cut_cons') )|+K]#! a week against the bill, a static estimate at today's economy."
 te_tax_ig_offer_est_div:0 "Revenue: about @money!#v [Multiply_CFixedPoint( GetPlayer.PredictDividendsTaxes, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_cut_div') )|+K]#! a week against the bill, a static estimate at today's economy."
 te_tax_ig_offer_est_head:0 "Revenue: about @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_cut_head') )|+K]#! a week against the bill, a static estimate at today's economy."
 te_tax_ig_offer_est_head_shared:0 "Revenue: between @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_cut_head') )|+K]#! and @money!#v 0#! a week against the bill, a static estimate at today's economy: rural assessment and head tax share one Budget line, and today's receipts do not say how they divide."
 te_tax_ig_offer_est_land:0 "Revenue: about @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_cut_land') )|+K]#! a week against the bill, a static estimate at today's economy."
 te_tax_ig_offer_est_land_shared:0 "Revenue: between @money!#v [Multiply_CFixedPoint( GetPlayer.GetPollTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_cut_land') )|+K]#! and @money!#v 0#! a week against the bill, a static estimate at today's economy: rural assessment and head tax share one Budget line, and today's receipts do not say how they divide."
 te_tax_ig_offer_est_nobase:0 "Revenue: no current base — estimate unavailable."
 te_tax_ig_offer_est_untax:0 "Revenue: the effect depends on how much pops buy of this good; not estimated."
 te_tax_ig_offer_est_wage:0 "Revenue: about @money!#v [Multiply_CFixedPoint( GetPlayer.GetIncomeTaxIncome, GetPlayer.MakeScope.ScriptValue('te_tax_view_est_cut_wage') )|+K]#! a week against the bill, a static estimate at today's economy."
 te_tax_ig_offer_less:0 "In return it will oppose the bill less; it commits only if its score reaches #v [GetPlayer.MakeScope.ScriptValue('te_tax_commit_threshold')|0]#!."
 te_tax_ig_offer_lifts:0 "In return its score rises; it commits only if that reaches #v [GetPlayer.MakeScope.ScriptValue('te_tax_commit_threshold')|0]#!."
 te_tax_ig_offer_line:0 "[InterestGroup.GetCustom('te_tax_ig_offer')] [SelectLocalization( EqualTo_CFixedPoint( InterestGroup.MakeScope.ScriptValue('te_tax_disp_ig_stance'), '(CFixedPoint)2' ), 'te_tax_ig_offer_commits', SelectLocalization( EqualTo_CFixedPoint( InterestGroup.MakeScope.ScriptValue('te_tax_disp_ig_stance'), '(CFixedPoint)4' ), 'te_tax_ig_offer_lifts', 'te_tax_ig_offer_less' ) )]"
 te_tax_ig_offer_tt:0 "What the group asks for its support. A change to the bill only softens what the bill raises or adds; a group the bill hurts some other way asks for a promise. A persuadable group commits if you accept; an opposed one, or one at its red line, only opposes the bill less. Accepting any offer makes a new revision of the bill: debate starts again and every group weighs it afresh, so a concession to one group can cost another's commitment. A group makes one offer a revision, never the same change twice in one bill and one promise a bill. A promise binds only if the bill passes."
 te_tax_ig_prom:0 "Promises"
 te_tax_ig_prom_tt:0 "Promises accepted under this bill. One made to this group counts while it stays on the bill, less if it only keeps what the group already has. Another group's promise of schools or health care counts for or against this group by its view of a country with none."
 te_tax_ig_prom_value:0 "[InterestGroup.MakeScope.ScriptValue('te_tax_disp_ig_prom')|=+0]"
 te_tax_ig_score:0 "[InterestGroup.MakeScope.ScriptValue('te_tax_disp_ig_score')|=+0]"
 te_tax_ig_score_tt:0 "The group's score for the bill: the sum of its reasons below, from −100 to +100."
 te_tax_ig_stance_1:0 "#G Committed#!"
 te_tax_ig_stance_2:0 "Persuadable"
 te_tax_ig_stance_3:0 "#R Opposed#!"
 te_tax_ig_stance_4:0 "#R Red Line#!"
 te_tax_ig_stance_5:0 "Marginal"
 te_tax_ig_stance_tt:0 "Committed: counts toward passage for this revision. Persuadable: scores 0 or more, short of committing. Opposed: scores below 0. Red line: scores at the red line or below. A group's score is weighed again every month. If the bill passes, every group scoring below 0 that has not committed disapproves of the government for a while. Marginal: too little clout to count either way, so not counted toward passage."
 te_tax_ig_trust:0 "Kept Promises"
 te_tax_ig_trust_tt:0 "The group's trust in the government's word: each promise kept with it raises this, and each one broken or renegotiated lowers it. A kept promise that only maintained what the group already had does not raise it. After #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_trust_recover_months')|0]#! months without either, it fades a step back toward neutral."
 te_tax_ig_trust_value:0 "[InterestGroup.MakeScope.ScriptValue('te_tax_disp_ig_trust')|=+0]"
 te_tax_inst_cons:0 "Consumption Tax"
 te_tax_inst_cons_tt:0 "The [concept_consumption_tax] rate on every good on the taxed goods list, paid when pops buy it."
 te_tax_inst_div:0 "Dividend Tax"
 te_tax_inst_div_tt:0 "Taxes the dividends paid to pops who own private buildings. Collected as [concept_budget_dividends_taxes]."
 te_tax_inst_head:0 "Head Tax"
 te_tax_inst_head_tt:0 "Taxes working adults who pay no rural assessment. Collected as [concept_budget_per_capita_taxes]."
 te_tax_inst_land:0 "Rural Assessment"
 te_tax_inst_land_tt:0 "Taxes peasants and farmers working agricultural buildings, who then pay no head tax. Collected as [concept_budget_land_taxes]."
 te_tax_inst_wage:0 "Wage Tax"
 te_tax_inst_wage_tt:0 "Taxes the wages of employed pops. Collected as [concept_budget_income_taxes]."
 te_tax_lt_col_range:0 "Range"
 te_tax_lt_col_range_tt:0 "The taxation law's rate at a Very Low tax level and at Very High."
 te_tax_lt_col_rate:0 "Rate"
 te_tax_lt_col_step:0 "Step"
 te_tax_lt_col_step_tt:0 "The lowest tax level whose rate under your taxation law is at or above this rate. The highest step among your taxes is your tax level."
 te_tax_lt_header:0 "Tax Rates"
 te_tax_lt_how_ai:0 "AI countries keep choosing their tax level as in the base game, and their taxes follow it: every tax at the law's rate for that level. Their interest groups react to each change as yours do."
 te_tax_lt_how_groups:0 "Each change draws a reaction from every interest group, by how much of the tax its members pay and by its views on taxation. A reaction that pleases a group counts half as much as one that angers it. Reactions add up to at most ±10 approval and fade by about a third each month."
 te_tax_lt_how_header:0 "How the Light Tax Code Works"
 te_tax_lt_how_law:0 "When you enact another taxation law, every rate moves into the new law's range. A tax the new law does not levy stops, and a tax it adds starts at the new law's rate for your current tax level."
 te_tax_lt_how_level:0 "Each rate sits on a step: the lowest tax level whose rate under your law is at or above it. Your tax level is the highest step among your taxes, and its legitimacy, radicalism and expected standard of living effects apply as in the base game. A tax below that step is collected at its own rate, so lowering a tax costs revenue but lowers the tax level only when no other tax shares its step."
 te_tax_lt_how_native:0 "The tax level buttons on the Budget panel are greyed, because your rates set the tax level. You still choose which goods carry consumption tax, and tariffs and subsidies work as in the base game."
 te_tax_lt_how_rates:0 "Each tax your taxation law levies has a range, from the rate the law sets at a Very Low tax level to the rate it sets at Very High. You move each tax in steps within that range, and the change applies at once. There are no bills and no debate."
 te_tax_lt_how_relief:0 "Groups also judge whom you spare. A group whose members pay taxes you keep below your tax level approves of the code for as long as you do: +1 at about one tax level of relief on the taxes it pays, +2 at about two. Each group still judges your taxation law itself as in the base game."
 te_tax_lt_how_sub_groups:0 "Interest Groups"
 te_tax_lt_how_sub_level:0 "Tax Level"
 te_tax_lt_how_sub_native:0 "The Budget Panel and the AI"
 te_tax_lt_how_sub_rates:0 "Rates"
 te_tax_lt_intro:0 "Set each tax within the range your taxation law allows. A change applies at once."
 te_tax_lt_law_other:0 "Another law"
 te_tax_lt_level_unset:0 "Not set"
 te_tax_lt_not_levied:0 "Not levied"
 te_tax_lt_ov_law:0 "Taxation Law"
 te_tax_lt_ov_law_tt:0 "The taxation law in force. Each tax it levies may range from the law's rate at a Very Low tax level to its rate at Very High; a tax it does not levy stays at zero. Enacting another taxation law moves every rate into the new law's range."
 te_tax_lt_ov_level:0 "Tax Level"
 te_tax_lt_ov_level_tt:0 "The highest step any of your taxes sits on. Its legitimacy, radicalism and expected standard of living effects are the base game's. A tax below that step is still collected at its own rate."
 te_tax_lt_ov_level_value:0 "#v [GetPlayer.GetCustom('te_tax_lt_level')]#!"
 te_tax_lt_ov_setter:0 "Set By"
 te_tax_lt_ov_setter_tt:0 "A tax on the tax level's step. Lowering it lowers the tax level, unless another tax sits on the same step."
 te_tax_lt_ov_title:0 "Light [concept_tax_code]"
 te_tax_lt_ov_title_tt:0 "Your taxation law sets the range of each tax it levies. Within that range you set each rate, and a change applies at once."
 te_tax_lt_row_cons_tt:0 "$te_tax_inst_cons_tt$ Click − or + to move it one step, shift-click to set it to the lowest or highest rate your taxation law allows. Which goods carry it is chosen on the Budget panel, as in the base game."
 te_tax_lt_row_div_tt:0 "$te_tax_inst_div_tt$ Click − or + to move it one step, shift-click to set it to the lowest or highest rate your taxation law allows."
 te_tax_lt_row_head_tt:0 "$te_tax_inst_head_tt$ Click − or + to move it one step, shift-click to set it to the lowest or highest rate your taxation law allows."
 te_tax_lt_row_land_tt:0 "$te_tax_inst_land_tt$ Click − or + to move it one step, shift-click to set it to the lowest or highest rate your taxation law allows."
 te_tax_lt_row_wage_tt:0 "$te_tax_inst_wage_tt$ Click − or + to move it one step, shift-click to set it to the lowest or highest rate your taxation law allows."
 te_tax_lt_tt_above_min:0 "The tax is above the lowest rate your taxation law allows."

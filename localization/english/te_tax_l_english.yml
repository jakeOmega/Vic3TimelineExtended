 te_tax_ig_fisc:0 "State of the Budget"
 te_tax_ig_fisc_tt:0 "The budget as it stood on the 1st of the month. In a deficit, a bill that raises revenue gains support and one that cuts it loses support. In surplus it is the other way round, half as strongly."

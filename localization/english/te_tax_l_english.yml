 te_tax_history_header:0 "History"
 te_tax_how_commencement:0 "A passed bill takes effect on the 1st of its month, all at once, and collections change then, or on the 2nd if the code was already updated once on the 1st, never before. A bill passed later that takes effect no later replaces whatever the two change in common. At most two passed bills can wait to take effect at once."
 te_tax_how_commencement_held:0 "A passed bill is held back whole, changing nothing, if a change made outside legislation reached a provision it changes before it took effect; it can then only be dropped. One whose month goes by is held back too. If it is at most #v [GetPlayer.MakeScope.ScriptValue('te_tax_reschedule_max_delay')|0]#! months late and no later bill has changed what it changes, it can be moved to next month."
 te_tax_how_commencement_sunset:0 "A temporary rate expires on the 1st of its month, and the rate beneath it returns. A later bill that changes the same tax replaces the expiry: a permanent change clears it, and a temporary one keeps the rate that was due to return."
 te_tax_how_customs:0 "Under this rule the tax code also sets [concept_tariffs] and [concept_subventions]. Each tradeable good has an import and an export level, changed by a bill like any tax. Only the country that owns a market sets its levels: one trading in another's market sees them as set by that market's owner, and its bills cannot change them. A country that comes to own its market takes its levels into the code the next month."
 te_tax_how_customs_sync:0 "On the 1st of every month the code sets each level back. A level that does not take, because a treaty forbids it or the tariff cooldown refuses it, is tried again each month; after #v [GetPlayer.MakeScope.ScriptValue('te_tax_customs_adopt_after')|0]#! months in a row the code takes the market's level instead, and the review marks the good as blocked. Losing the market keeps the code's levels on record, drops the customs changes of the open draft and bill, and holds back a passed bill that changes customs."
 te_tax_how_drafting:0 "A reform starts as a draft, and a draft changes nothing. Each tax moves in fixed steps. The draft names the month it takes effect, from next month to #v [GetPlayer.MakeScope.ScriptValue('te_tax_max_due_offset')|0]#! months ahead, #v [GetPlayer.MakeScope.ScriptValue('te_tax_default_due_offset')|0]#! by default. A change can be permanent, or expire after 6, 12, 24, 36 or 60 months, when the rate beneath it returns. Agricultural and regional relief move in bands of 25%, up to 50%, and regional relief names up to three of the country's incorporated states, each only while it stays the country's own; Choose States lists them. A draft opened while a bill is under debate starts from that bill."
 te_tax_how_drafting_baseline:0 "If a passed bill or a change made outside legislation alters a tax after the draft changed it, the draft must accept the new baseline before it can be introduced. It keeps its own value."
 te_tax_how_header:0 "How Tax Legislation Works"
 te_tax_how_passage:0 "Introducing the draft makes it a [concept_tax_bill] and opens debate. Each [concept_interest_group] weighs what the bill costs its members (its taxes, taxed goods and relief), its view of the taxation laws, the state of the budget on the 1st of the month and whether it is in government. One that scores #v [GetPlayer.MakeScope.ScriptValue('te_tax_commit_threshold')|0]#! or more commits to the bill's current revision, and one at #v [GetPlayer.MakeScope.ScriptValue('te_tax_redline_threshold')|0]#! or below draws a red line."
 te_tax_how_passage_force:0 "A bill short of a majority can be forced through by [concept_legislative_override_capacity] of at least 2, once committed groups hold #v [GetPlayer.MakeScope.ScriptValue('te_tax_force_share')|%0]#! of the clout and every other condition is met. It costs [concept_authority] and [concept_legitimacy], angers the opposition and spends override capacity, as forcing a law through does."
 te_tax_how_passage_offers:0 "A group that has not committed may make one offer a revision: a promise, a band of agricultural relief, or a change that softens what the bill raises, never below existing law. Accepting any offer makes a new revision, so debate starts again and every group reconsiders. A group that is persuadable when you accept commits for it; an opposed group, or one at its red line, only opposes the bill less, and commits only if its new score reaches the threshold. Promises accepted under a bill stay on each new revision until the bill passes, is withdrawn or is revised from the draft. A group never gains the same change twice in one bill, and a promise already pending or binding cannot be made again."
 te_tax_how_passage_rule:0 "The bill can pass once committed groups hold more than #v [GetPlayer.MakeScope.ScriptValue('te_tax_passage_share')|%0]#! of the [concept_clout] of every group that is not marginal, [concept_legitimacy] is at least #v [GetPlayer.MakeScope.ScriptValue('te_tax_passage_legitimacy')|0]#!, and it has been debated for #v [GetPlayer.MakeScope.ScriptValue('te_tax_debate_days_major')|0]#! days since its last revision. A minor bill, which moves at most two taxes by at most two steps each and no goods or relief, needs #v [GetPlayer.MakeScope.ScriptValue('te_tax_debate_days_minor')|0]#! days. Revising the bill releases every commitment and starts the debate again. Groups that opposed a bill that passes disapprove of the government, fading over #v [GetPlayer.MakeScope.ScriptValue('te_tax_opposed_approval_days')|0]#! days."
 te_tax_how_promises:0 "To win an [concept_interest_group]'s commitment the government can promise it something besides the bill's own terms. A promise is recorded on the bill under debate and binds only if that revision passes: a revision or a withdrawn bill releases it. It starts when its bill takes effect, and lapses without penalty if that bill is dropped or replaced before then. A promise does nothing by itself; it records what the government must bring about."
 te_tax_how_promises_kinds:0 "An institution at a level: reached within #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_months_per_level')|0]#! months a level from where it stands, plus #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_inst_grace')|0]#!, then kept for #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_maint_months')|0]#! months while the country has it. The level counted is the one reached, not the one it is growing to. A [concept_bureaucracy] deficit never breaks it: each month of deficit moves its deadline a month later, as the institution cannot grow meanwhile. No bureaucracy deficit within #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_deadline_bureaucracy')|0]#! months, kept for #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_maint_months')|0]#!. [concept_budget_military_wages] at a level or lower within #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_deadline_wages')|0]#! month, kept for #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_maint_months')|0]#!; only one such promise at a time. Fixed income above fixed expenses for #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_surplus_months')|0]#! months running within #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_deadline_fiscal')|0]#!, kept for #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_maint_months_fiscal')|0]#!. A promise of something the country already has is one to maintain it; the budget and the bureaucracy count as they stood on the 1st of the month."
 te_tax_how_promises_outcomes:0 "A promise kept for its whole term wins the group's approval and raises its trust in the government, unless it only maintained what the group already had. Missing the deadline breaks it. During its term an institution level or a wage level must hold every month; a bureaucracy or budget promise breaks only once it has failed #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_grace_2')|0]#! months running. A broken promise costs the group's approval and its trust. A promise already in force can be renegotiated instead; it costs that group's trust, and less approval than breaking it. Each reaction fades over #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_approval_days')|0]#! days, and trust fades a step back toward neutral after #v [GetPlayer.MakeScope.ScriptValue('te_tax_obl_trust_recover_months')|0]#! months without a kept, broken or renegotiated promise. Trust counts in the group's support for every later bill. Breaking a promise never repeals a tax bill."
 te_tax_how_replaces:0 "The five taxation laws cannot be enacted under the tax code. The country holds the $law_te_tax_code$ instead, and each rate is an amendment to it. The tax level stays at Medium, because the code's rates are the whole tax, and the list of taxed goods is the code's."
 te_tax_how_replaces_monthly:0 "On the 1st of every month the code puts its rates, taxed goods and relief back in place, so a change made any other way lasts at most until then. Tariffs and subsidies are not part of these rates."
 te_tax_how_replaces_monthly_customs:0 "On the 1st of every month the code puts its rates, taxed goods and relief back in place, and, for a country that owns its market, its tariffs and subsidies, so a change made any other way lasts at most until then."
 te_tax_how_replaces_views:0 "No group takes a stance on the tax code law itself. Instead each judges the code as the taxation law it comes closest to: $law_graduated_taxation$ if it taxes wages at 10% or more and dividends at least as heavily, $law_proportional_taxation$ if it taxes wages at 10% or more and dividends at all, $law_per_capita_based_taxation$ if it levies a wage tax and a head tax, $law_land_based_taxation$ if it levies a rural assessment, $law_consumption_based_taxation$ otherwise. Its approval then counts as it would for that law, so the change to the code leaves it as it was. The judgement is renewed on the 1st of every month."
 te_tax_how_sub_commencement:0 "Commencement"
 te_tax_how_sub_customs:0 "Customs"
 te_tax_how_sub_drafting:0 "Drafting"
 te_tax_how_sub_passage:0 "Passage"

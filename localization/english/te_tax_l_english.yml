# TAX
#
 je_tax_code:0 "Tax Code"
 je_tax_code_desc:0 "[SelectLocalization( GetScriptedGui('te_tax_show_light_sgui').IsShown( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).End ), 'je_tax_code_desc_light', 'je_tax_code_desc_full' )]"
 je_tax_code_desc_full:0 "The taxes the legislature has enacted, and the bills that would change them."
 je_tax_code_desc_light:0 "The taxes in force, each set within the range of the taxation law."
 je_tax_code_reason:0 "[SelectLocalization( GetScriptedGui('te_tax_show_light_sgui').IsShown( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).End ), 'je_tax_code_reason_light', 'je_tax_code_reason_full' )]"
 je_tax_code_reason_full:0 "Every tax is set by law. A rate in the [concept_tax_code] stays until a [concept_tax_bill] changes it or its expiry comes. A reform starts as a draft, is introduced as a bill, passes once enough [Concept('concept_interest_group','$concept_interest_groups$')] commit to it, and takes effect on its [concept_tax_commencement]."
 je_tax_code_reason_light:0 "Your taxation law sets the range of every tax it levies. Within that range you set each rate in the [concept_tax_code] yourself, and a change applies at once. Your tax level follows the heaviest tax, and [Concept('concept_interest_group','$concept_interest_groups$')] react to each change."
 je_tax_code_status_inactive:0 "The tax code takes over once this country's taxation law has been carried over into it: at the start of the game, or when the country is founded."
 je_tax_code_status_none:0 ""
 law_te_tax_code:0 "Legislated Tax Code"
 law_te_tax_code_desc:0 "This law sets no rates itself. Each tax is set by an amendment to it, and a tax with no amendment is not collected."
 rule_te_tax_code_rule:0 "Legislated Tax Code"
 setting_te_tax_code_disabled:0 "Tax Code Disabled"
 setting_te_tax_code_disabled_desc:0 "Taxes work as in the base game. The five taxation laws set the rates and the tax level on the Budget panel is yours to move."
 setting_te_tax_code_enabled:0 "Tax Code Enabled"
 setting_te_tax_code_enabled_customs:0 "Tax Code and Customs Enabled"
 setting_te_tax_code_enabled_customs_desc:0 "Experimental. As Tax Code Enabled, and tariffs and subsidies are set by legislation as well: a country that owns its market legislates its import and export levels like any tax. AI countries legislate their taxes through the same bills; their tariffs still follow the base game's trade decisions."
 setting_te_tax_code_enabled_desc:0 "Experimental. The five base game taxation laws can no longer be enacted. Every country holds the Legislated Tax Code instead, a law with no rates of its own, and each tax is set by an amendment to it. Tariffs and subsidies stay as in the base game. AI countries legislate through the same bills, which need the same interest-group support."
 setting_te_tax_code_light:0 "Light Tax Code"
 setting_te_tax_code_light_desc:0 "Experimental. The five taxation laws stay. Each sets a range for every tax it levies, from its rate at a Very Low tax level to its rate at Very High, and within that range you set each tax yourself on the Tax Code tab of the Budget panel. A change applies at once, with no bills. Your tax level follows your heaviest tax, and interest groups react to each change and favor a code that spares their members. AI countries keep choosing their tax level as in the base game, and their taxes follow it."

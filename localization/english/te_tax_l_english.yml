l_english:

#
# TAX
#
 law_te_tax_code:0 "Legislated Tax Code"
 law_te_tax_code_desc:0 "This law sets no rates itself. Each tax is set by an amendment to it, and a tax with no amendment is not collected."
 rule_te_tax_code_rule:0 "Legislated Tax Code"
 setting_te_tax_code_disabled:0 "Tax Code Disabled"
 setting_te_tax_code_disabled_desc:0 "Taxes work as in the base game. The five taxation laws set the rates and the tax level on the Budget panel is yours to move."
 setting_te_tax_code_enabled:0 "Tax Code Enabled"
 setting_te_tax_code_enabled_customs:0 "Tax Code and Customs Enabled"
 setting_te_tax_code_enabled_customs_desc:0 "As Tax Code Enabled, and tariffs and subsidies are set by legislation as well."
 setting_te_tax_code_enabled_desc:0 "The five base game taxation laws can no longer be enacted. Every country holds the Legislated Tax Code instead, a law with no rates of its own, and each tax is set by an amendment to it. Tariffs and subsidies stay as in the base game."
 te_tax_relief_ag_1:0 "Agricultural Tax Relief 25%"
 te_tax_relief_ag_1_desc:0 "The tax code lowers the wage tax paid by workers in agricultural buildings by a quarter."
 te_tax_relief_ag_2:0 "Agricultural Tax Relief 50%"
 te_tax_relief_ag_2_desc:0 "The tax code halves the wage tax paid by workers in agricultural buildings."
 te_tax_relief_region_1:0 "Regional Tax Relief 25%"
 te_tax_relief_region_1_desc:0 "The tax code names this state for regional relief. Every tax collected from its pops is lowered by a quarter."
 te_tax_relief_region_2:0 "Regional Tax Relief 50%"
 te_tax_relief_region_2_desc:0 "The tax code names this state for regional relief. Every tax collected from its pops is halved."
 te_tax_tt_bill_open:0 "A tax bill is under debate."
 te_tax_tt_cmd_draft_discard:0 "Discards the draft. The tax code does not change."
 te_tax_tt_cmd_draft_due_earlier:0 "Moves the draft's commencement one month earlier."
 te_tax_tt_cmd_draft_due_later:0 "Moves the draft's commencement one month later."
 te_tax_tt_cmd_draft_good:0 "Changes whether the draft taxes this good. Pressed again, the draft leaves the good as it is."
 te_tax_tt_cmd_draft_new:0 "Opens a draft reform of the tax code, copied from the bill under debate if there is one. No tax changes until a bill passes and commences."
 te_tax_tt_cmd_draft_rebase:0 "Accepts the change to this part of the code. The draft keeps its own value."
 te_tax_tt_cmd_draft_step_down:0 "Lowers this tax by one step in the draft."
 te_tax_tt_cmd_draft_step_max:0 "Sets this tax to its highest rate in the draft."
 te_tax_tt_cmd_draft_step_min:0 "Sets this tax to zero in the draft."
 te_tax_tt_cmd_draft_step_revert:0 "Takes this tax out of the draft. A bill made from it would leave the tax as it is."
 te_tax_tt_cmd_draft_step_up:0 "Raises this tax by one step in the draft."
 te_tax_tt_cmd_draft_sunset_down:0 "Brings this change's expiry forward. Below 6 months it becomes permanent."
 te_tax_tt_cmd_draft_sunset_up:0 "Pushes this change's expiry back. A permanent change gets an expiry 6 months after it commences."
 te_tax_tt_cmd_introduce:0 "Introduces the draft as a tax bill. Debate starts, and each interest group decides whether to commit to it. No tax changes until the bill passes and commences."
 te_tax_tt_cmd_pass:0 "Passes the bill. It commences on the 1st of its commencement month and replaces any change a passed bill had scheduled for the same provisions in or after that month. Interest groups that opposed it disapprove for six months."
 te_tax_tt_cmd_reschedule:0 "Moves the bill's commencement to next month. Interest groups keep their commitments."
 te_tax_tt_cmd_revise:0 "Replaces the bill with the draft. Every interest group's commitment is released and debate starts again."
 te_tax_tt_cmd_withdraw:0 "Withdraws the bill. The tax code and the bills already passed stay as they are."
 te_tax_tt_code_in_force:0 "The legislated tax code is in force."
 te_tax_tt_draft_baseline:0 "No provision the draft changes has been altered since the draft changed it. Accept each such change first."
 te_tax_tt_draft_changes:0 "The draft changes at least one provision."
 te_tax_tt_draft_differs:0 "The draft differs from the bill."
 te_tax_tt_draft_due_range:0 "The draft commences between next month and 60 months from now."
 te_tax_tt_draft_good_known:0 "The tax code can tax this good."
 te_tax_tt_draft_open:0 "A draft reform is open."
 te_tax_tt_due_room_earlier:0 "The draft commences later than next month."
 te_tax_tt_due_room_later:0 "The draft commences sooner than 60 months from now."
 te_tax_tt_no_bill:0 "No tax bill is under debate."
 te_tax_tt_no_draft:0 "No draft reform is open."
 te_tax_tt_pass_current:0 "Nothing outside legislation has changed a provision the bill changes since the bill was introduced."
 te_tax_tt_pass_debate:0 "The bill has been debated for [GetPlayer.MakeScope.ScriptValue('te_tax_debate_days_required')|0] days since its last revision ([GetPlayer.MakeScope.ScriptValue('te_tax_debate_days_left')|0] days left)."
 te_tax_tt_pass_due:0 "The bill's commencement month has not yet come. If it has, reschedule the bill."
 te_tax_tt_pass_legitimacy:0 "Legitimacy is at least [GetPlayer.MakeScope.ScriptValue('te_tax_passage_legitimacy')|0]."
 te_tax_tt_pass_slot:0 "Fewer than two passed bills are waiting to commence."
 te_tax_tt_pass_store:0 "The bill meets the scheduler's rules for a passed bill."
 te_tax_tt_pass_sunsets:0 "Every expiry in the bill falls at least one month after the bill commences."
 te_tax_tt_pass_support:0 "Committed interest groups hold more than [GetPlayer.MakeScope.ScriptValue('te_tax_passage_share')|%0] of the clout of all groups that are not marginal (now [GetPlayer.MakeScope.ScriptValue('te_tax_committed_share')|%0])."
 te_tax_tt_rebase_needed:0 "A passed bill or an outside change altered this part of the code after the draft changed it."
 te_tax_tt_reschedule_due_passed:0 "The bill's commencement month has come or passed."
 te_tax_tt_step_not_max:0 "The draft does not already set this tax to its highest rate."
 te_tax_tt_step_not_min:0 "The draft does not already set this tax to zero."
 te_tax_tt_step_room_down:0 "The draft rate is above zero."
 te_tax_tt_step_room_up:0 "The draft rate is below the highest the code allows."
 te_tax_tt_step_touched:0 "The draft changes this tax."
 te_tax_tt_sunset_room_down:0 "The change has an expiry."
 te_tax_tt_sunset_room_up:0 "The change expires sooner than 60 months after it commences."

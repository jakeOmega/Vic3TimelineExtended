 te_debug_launch_windows.1.t:0 "Launch Windows Test Console"
 te_debug_launch_windows.1.d:0 "Console-only shortcuts for testing Solar System Colonization's launch windows. None of these can happen in normal play.\n\nThe log options write TE_LAUNCH_WINDOWS lines to the debug log: each destination's cached window, the date's own answer, and what launching there would cost us."
 te_debug_launch_windows.1.f:0 "'Mars is on the far side of the Sun until spring after next.'\n\n'Then we build until spring after next.'"
 te_debug_launch_windows.1.a:0 "Stage two and a half colony fleets in orbit"
 te_debug_launch_windows.1.b:0 "Write every launch window to the debug log"
 te_debug_launch_windows.1.c:0 "Let the window_gate self-checks log again"
 te_debug_launch_windows.1.z:0 "Close"
 te_debug_sr_stage_fleets_tt:0 "Solar System Colonization's progress becomes two and a half colonies' goals"
 te_debug_sr_log_windows_tt:0 "The window cache is refreshed and written to the debug log"
 te_debug_sr_reset_window_checks_tt:0 "The three window_gate self-checks will log their next verdict"

l_english:
 je_space_race_widget_ov_staged_label:0 "#tooltippable Staged in Orbit#!"
 je_space_race_widget_ov_staged_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('sr_launch_staged_fleets')|1]#! fleets"
 je_space_race_widget_windows_header:0 "#tooltippable Next Windows#!"
 je_space_race_widget_windows_header_tt:0 "#header Launch Windows#!\nChemical rockets reach each world on the cheapest transfer orbit, which lines up only once a synodic period: the month of the best departure and a month either side. Mars has one every 26 months. The Moon and Mercury need none.\n\nWith #bold Asteroid Mining#!, propellant depots let a fleet leave outside its window at the premium the extra propellant costs, when our approach judges the months it saves worth the months that progress costs. With #bold Muon-Catalyzed Fusion Reactors#! there are no windows at all."
 sr_window_staged_intro:0 "#header Staged in Orbit#!\n#v [THIS.GetCountry.MakeScope.ScriptValue('sr_launch_staged_fleets')|1]#! colony fleets' worth of hardware, habitats and propellant wait in orbit for a launch window:"
 sr_window_staged_footer:0 "One fleet departs each month a destination's window is open, while staged progress covers a colony. Nothing built while we wait is wasted: every fleet staged now leaves in a later window."
 sr_window_staged_footer_chemical:0 "#bold Asteroid Mining#! will let a fleet leave outside its window, at a premium. #bold Muon-Catalyzed Fusion Reactors#! end the waiting."
 sr_window_staged_footer_depots:0 "Outside a window a fleet leaves when the months it saves are worth its premium to our approach (Mission Control). #bold Muon-Catalyzed Fusion Reactors#! end the waiting."
 sr_window_list_pending:0 "The launch windows are worked out on the first of the month."
 sr_window_list_fusion:0 "#G Fusion drives:#! no launch windows. Fleets leave as soon as they are ready."
 sr_window_line_mercury:0 "Mercury: any month, no window needed"
 sr_window_verdict_launches:0 "#G our approach would launch now#!"
 sr_window_verdict_waits:0 "our approach waits for a window"
 sr_window_verdict_safe:0 "the Safe approach waits for a window"

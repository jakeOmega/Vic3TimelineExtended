l_english:
 UN_PROPOSE_CEASEFIRE:0 "Propose a Binding Ceasefire"
 UN_PROPOSE_CEASEFIRE_DESC:0 "Move the General Assembly to order a country that started a war against a member to cease fire. Its record must give the Assembly grounds: a case strength of 40 or more (see #bold Our Record#! in the chamber for how a record is built). This is a #bold binding#! resolution. If it carries, the aggressor is under a ceasefire order for 24 months, and every month it goes on fighting a member its [concept_war_support] in that war falls by 2.5 × the UN's [concept_un_enforcement]. No peace is imposed: the war ends when the aggressor capitulates or makes peace. If a [concept_un_permanent_member] casts a [concept_un_veto], the Assembly can only call for a ceasefire, which lowers the aggressor's war support once and does nothing more. Requires Charter Reform II. #G UN credibility +1 if it carries.#!"
 UN_PROPOSE_CEASEFIRE_TT:0 "#bold A General Assembly vote has been called#! on a binding ceasefire. Human members can vote at once; AI members vote in the ninth to eleventh month, and a [concept_un_permanent_member] may [concept_un_veto] it. Results follow after a year."
 UN_PROPOSE_REFERENDUM:0 "Propose a Supervised Referendum"
 UN_PROPOSE_REFERENDUM_DESC:0 "Move the General Assembly to order a member to let one of its subjects vote on independence, under the Assembly's supervision. Needs the [concept_decolonization_system] Declaration in force, and a direct [concept_subject] of another member whose [concept_liberty_desire] is 50 or more. This is a #bold binding#! resolution: any [concept_un_permanent_member] may [concept_un_veto] it, and a veto blocks it outright. If it carries, the [concept_overlord] must hold the vote or refuse it. A vote held ends in independence with a chance equal to the subject's liberty desire, between 20% and 90%. Refusing costs the overlord standing, a mark on its record and its subjects' loyalty. Requires Charter Reform II. #G UN credibility +1 if it carries.#!"
 UN_PROPOSE_REFERENDUM_TT:0 "#bold A General Assembly vote has been called#! on a supervised self-determination referendum. Human members can vote at once; AI members vote in the ninth to eleventh month, and a [concept_un_permanent_member] may [concept_un_veto] it. Results follow after a year."
 je_un_chamber_conseq_ceasefire:0 "  #bold If it carries:#! $un_vote_ceasefire_passed_tt$"
 je_un_chamber_conseq_ceasefire_vetoed:0 "  #bold If it carries:#! $un_vote_ceasefire_passed_vetoed_tt$"
 je_un_chamber_conseq_referendum:0 "  #bold If it carries:#! $un_vote_referendum_passed_tt$"
 je_un_chamber_conseq_referendum_vetoed:0 "  #bold If it carries:#! $un_vote_referendum_passed_vetoed_tt$"
 je_un_chamber_propose_need_ceasefire:0 "A country that started a war against a member, and is not already under a ceasefire order, has a record that supports one (case strength 40 or more)"
 je_un_chamber_propose_need_referendum:0 "The [concept_decolonization_system] Declaration is in force, and another member's direct subject has [concept_liberty_desire] of 50 or more"
 je_un_chamber_propose_no_case_ceasefire:0 "#bold Target:#! #tooltippable;tooltip:je_un_chamber_propose_no_case_ceasefire_tt None#!"
 je_un_chamber_propose_no_case_ceasefire_tt:0 "No country that started a war against a member of the Assembly has a record that supports a ceasefire (case strength 40 or more), or every such country is already under an order."
 je_un_chamber_propose_no_case_referendum:0 "#bold Target:#! #tooltippable;tooltip:je_un_chamber_propose_no_case_referendum_tt None#!"
 je_un_chamber_propose_no_case_referendum_tt:0 "Either the [concept_decolonization_system] Declaration is not in force, or no other member holds a direct subject with [concept_liberty_desire] of 50 or more that is not at war with it."
 je_un_chamber_propose_target_ceasefire:0 "#bold Target:#! [AddLocalizationIf(SCOPE.sCountry('un_ceasefire_pick').Exists, SCOPE.sCountry('un_ceasefire_pick').GetName)][AddLocalizationIf(Not(SCOPE.sCountry('un_ceasefire_pick').Exists), 'je_un_chamber_country_gone')][AddLocalizationIf(SCOPE.sCountry('un_ceasefire_victim_pick').Exists, 'je_un_chamber_propose_target_ceasefire_victim')]"
 je_un_chamber_propose_target_ceasefire_victim:0 ", at war with [SCOPE.sCountry('un_ceasefire_victim_pick').GetName]"
 je_un_chamber_propose_target_referendum:0 "#bold Target:#! [AddLocalizationIf(SCOPE.sCountry('un_referendum_pick').Exists, SCOPE.sCountry('un_referendum_pick').GetName)][AddLocalizationIf(Not(SCOPE.sCountry('un_referendum_pick').Exists), 'je_un_chamber_country_gone')], for a vote in [SCOPE.sCountry('un_referendum_subject_pick').GetName] (#v [SCOPE.sCountry('un_referendum_subject_pick').MakeScope.ScriptValue('un_ref_independence_chance')|0]%#! chance of independence if it is held)"
 je_un_chamber_propose_topic_ceasefire:0 "#tooltippable;tooltip:je_un_chamber_propose_topic_ceasefire_tt #bold Binding Ceasefire#!#!"
 je_un_chamber_propose_topic_ceasefire_tt:0 "Orders a country waging a war on a member to stop. For 24 months its [concept_war_support] in every war it fights against a member falls each month, until it capitulates or makes peace. If the war ends while the order stands and the aggressor has taken nothing from the victim, peacekeepers deploy to the victim."
 je_un_chamber_propose_topic_referendum:0 "#tooltippable;tooltip:je_un_chamber_propose_topic_referendum_tt #bold Supervised Self-Determination Referendum#!#!"
 je_un_chamber_propose_topic_referendum_tt:0 "Orders a member to let one of its subjects vote on independence. The [concept_overlord] holds the vote, which ends in independence with a chance from the subject's [concept_liberty_desire], or refuses it and pays in standing, record and loyalty. A veto blocks it outright."
 je_un_chamber_topic_ceasefire:0 "#bold Binding Ceasefire#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_chamber_topic_referendum:0 "#bold Supervised Self-Determination Referendum#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_led_reason_30:0 "      #lore a war fought on under a ceasefire order of the Assembly#!"
 je_un_led_reason_30_on:0 "      #lore a war fought on under the Assembly's ceasefire order by#! $je_un_led_subject_country$"
 je_un_led_reason_31:0 "      #lore a war ended under a ceasefire order of the Assembly#!"
 je_un_led_reason_31_on:0 "      #lore the war waged by#! $je_un_led_subject_country$ #lore ended under the Assembly's ceasefire order#!"
 je_un_led_reason_32:0 "      #lore a binding order of the Assembly defied#!"
 je_un_led_reason_32_on:0 "      #lore a binding order of the Assembly defied by#! $je_un_led_subject_country$"
 je_un_led_reason_33:0 "      #lore a supervised self-determination referendum held#!"
 je_un_led_reason_33_on:0 "      #lore a supervised self-determination referendum held in#! $je_un_led_subject_country$"
 je_un_led_topic_ceasefire:0 "        Binding Ceasefire"
 je_un_led_topic_referendum:0 "        Supervised Self-Determination Referendum"
 je_un_standing_reason_39:0 "  Most recently: #R a war we fought on under a ceasefire order.#!"
 je_un_standing_reason_40:0 "  Most recently: a referendum we held under the Assembly's supervision."
 je_un_standing_reason_41:0 "  Most recently: #R a referendum the Assembly ordered that we refused.#!"
 un_ceasefire.1.a:0 "We have heard the Assembly."
 un_ceasefire.1.d_accepted:0 "We voted for the Assembly's resolution ourselves, and it has carried: we are ordered to cease fire in our war against its members. Having accepted the verdict, we are told to stop rather than censured. Every month we fight on will still cost us support for the war at home and add to the Assembly's file on our aggression."
 un_ceasefire.1.d_call:0 "The General Assembly voted to order us to cease fire in our war against its members, but a permanent member's veto reduced the order to a call for one. The call binds no one and carries no penalties beyond the vote itself, yet the news has shaken support for the war at home."
 un_ceasefire.1.d_order:0 "The General Assembly has ordered us to cease fire in our war against its members, and the order binds. For the next two years every month of fighting will cost us: support for the war at home will fall, the Assembly's file on our aggression will grow, and if we fight on past three months our standing among the nations will pay for it. Nobody will force a peace on us. The Assembly is counting on our own people to demand one."
 un_ceasefire.1.f:0 "'They have passed a resolution,' the foreign minister said. 'It asks us to stop.'\n\n'And if we do not?'\n\n'Then they will pass another one, and our own newspapers will print both.'"
 un_ceasefire.1.t_call:0 "A Call for a Ceasefire"
 un_ceasefire.1.t_order:0 "Ordered to Cease Fire"
 un_ceasefire.2.a:0 "Let them feel it at home."
 un_ceasefire.2.d:0 "The General Assembly has ordered [SCOPE.sCountry('un_cf_aggressor').GetName] to cease fire in its war against us. No one will impose a peace, but for the next two years every month it fights on will cost it support for the war at home. If the war ends while the order stands and [SCOPE.sCountry('un_cf_aggressor').GetName] has taken nothing from us, the Assembly will send peacekeepers to the state that suffered most."
 un_ceasefire.2.f:0 "In the shelters they listened to the radio read the resolution twice. An old man said it would not stop a single shell. His granddaughter said it might stop the next one."
 un_ceasefire.2.t:0 "The Assembly Orders a Ceasefire"
 un_ceasefire.3.a:0 "Hold the peace."
 un_ceasefire.3.d_aggressor:0 "Our war against members of the Assembly is over, and it ended while the Assembly's ceasefire order stood. The chamber counts the order as obeyed."
 un_ceasefire.3.d_proposer:0 "The war [SCOPE.sCountry('un_cf_aggressor').GetName] fought against members of the Assembly is over, and it ended while the ceasefire order we moved still stood. The chamber counts it as a success of the organisation."
 un_ceasefire.3.d_victim:0 "The war [SCOPE.sCountry('un_cf_aggressor').GetName] fought against us is over, and it ended while the Assembly's ceasefire order stood. The order won the war for no one, but it made the fighting cost the aggressor more at home than it was worth."
 un_ceasefire.3.f:0 "The ceasefire line was drawn on a map that both delegations agreed was wrong. Neither asked for a better one."
 un_ceasefire.3.t:0 "The Guns Fall Silent"
 un_ceasefire.4.a:0 "The Assembly will remember."
 un_ceasefire.4.d_aggressor:0 "Two years have passed since the General Assembly ordered us to cease fire, and we are still at war with its members. The order has run out, and the chamber records it as defied."
 un_ceasefire.4.d_proposer:0 "The ceasefire order we moved against [SCOPE.sCountry('un_cf_aggressor').GetName] has run out while its war against members of the Assembly is still under way. The chamber records the order as defied."
 un_ceasefire.4.d_victim:0 "The Assembly's ceasefire order against [SCOPE.sCountry('un_cf_aggressor').GetName] has run out, and its war against us goes on. The order cost the aggressor dearly at home, but it did not end the fighting."
 un_ceasefire.4.f:0 "The resolution was framed and hung in the delegates' lounge, beside the others."
 un_ceasefire.4.t:0 "The Ceasefire Order Runs Out"
 un_ceasefire.5.a:0 "A dark day for the Assembly."
 un_ceasefire.5.d_aggressor:0 "Our war is over. The country the General Assembly ordered us to stop fighting no longer exists. The chamber does not count a conquest as a ceasefire, and it records its order as defied."
 un_ceasefire.5.d_aggressor_gained:0 "Our war against [SCOPE.sCountry('un_cf_victim_scope').GetName] is over, and we came out of it with its land or its sovereignty in our hands. The General Assembly had ordered us to cease fire. It does not count a war won as an order obeyed, and it records its order as defied."
 un_ceasefire.5.d_proposer:0 "The country the Assembly ordered [SCOPE.sCountry('un_cf_aggressor').GetName] to stop fighting no longer exists. The war ended in conquest while the ceasefire order we moved still stood, and the chamber records the order as defied."
 un_ceasefire.5.d_proposer_gained:0 "The war [SCOPE.sCountry('un_cf_aggressor').GetName] fought against [SCOPE.sCountry('un_cf_victim_scope').GetName] is over, and the aggressor came out of it with its victim's land or sovereignty in its hands while the ceasefire order we moved still stood. The chamber does not count a war won as an order obeyed, and it records the order as defied."
 un_ceasefire.5.d_victim:0 "The war [SCOPE.sCountry('un_cf_aggressor').GetName] fought against us is over, and it ended in the aggressor's favour: it took our land or our sovereignty while the Assembly's ceasefire order stood. The chamber records the order as defied."
 un_ceasefire.5.f:0 "The delegation's chair was carried out of the chamber that afternoon. Someone kept the nameplate in a drawer."
 un_ceasefire.5.f_gained:0 "The map in the delegates' lounge was redrawn that week. Nobody in the chamber remembered voting for the new line."
 un_ceasefire.5.t:0 "Conquered Under a Ceasefire Order"
 un_ceasefire.5.t_gained:0 "Victory Under a Ceasefire Order"
 un_ceasefire_call_done_tt:0 "Our [concept_war_support] fell once in every war we fight against a member. No order follows."
 un_ceasefire_call_moot_tt:0 "[SCOPE.sCountry('un_vote_target').GetName] no longer fights any member of the Assembly, so the call changes nothing."
 un_ceasefire_call_tt:0 "[SCOPE.sCountry('un_vote_target').GetName]'s [concept_war_support] falls once in every war it fights against a member."
 un_ceasefire_defied_tt:0 "#R UN credibility −1, moving [concept_un_authority]'s target:#! a binding order of the Assembly defied."
 un_ceasefire_fight_on_accepted_tt:0 "#R International Standing: −2#! if we are still fighting a member three months from now. We accepted the censure, so the loss is lighter."
 un_ceasefire_fight_on_tt:0 "#R International Standing: −5#! if we are still fighting a member three months from now."
 un_ceasefire_kept_tt:0 "#G UN delivery +1.5, moving [concept_un_authority]'s target:#! a war ended under the Assembly's ceasefire order, with nothing taken from its victim. If the aggressor stopped within three months, #G its International Standing gains#! for a binding decision complied with."
 un_ceasefire_mission_opened_tt:0 "A #G [Concept('concept_un_mission_peacekeeping', 'UN peacekeeping mission')]#! deploys to the most devastated state of [SCOPE.sCountry('un_cf_victim_scope').GetName]. It succeeds after two years of peace for its host. If no member joins it within six months, it lapses."
 un_ceasefire_moot_tt:0 "[SCOPE.sCountry('un_vote_target').GetName] no longer fights any member of the Assembly, so no order is needed."
 un_ceasefire_not_ordered_tt:0 "We are not ourselves under a ceasefire order"
 un_ceasefire_order_accepted_tt:0 "[SCOPE.sCountry('un_vote_target').GetName] accepted the Assembly's censure, so it is told to stop rather than censured. The order and its monthly cost to its war support stand, but fighting on past three months costs it only #R 2 International Standing#!."
 un_ceasefire_order_terms_tt:0 "For 24 months, every month we fight on against a member of the Assembly, our [concept_war_support] in each such war falls by 2.5 × the UN's [concept_un_enforcement] (#v ×[GetGlobalVariable('un_enforcement_now').GetValue|1]#!), and our record of aggression grows by 1. If the war ends while the order stands, with nothing taken from the country we attacked, and we stopped within three months, #G our International Standing gains#! for a binding decision complied with. If we end it holding that country's capital, any of its land or its allegiance as our subject, the order counts as defied."
 un_ceasefire_order_tt:0 "[SCOPE.sCountry('un_vote_target').GetName] is under a ceasefire order for 24 months. If it is still fighting a member three months from now, it loses #R 5 International Standing#!."
 un_ceasefire_victim_terms_tt:0 "Each month [SCOPE.sCountry('un_cf_aggressor').GetName] fights on against a member, its [concept_war_support] in that war falls by 2.5 × the UN's [concept_un_enforcement] (#v ×[GetGlobalVariable('un_enforcement_now').GetValue|1]#!). The order stands for 24 months."
 un_order_ledger_tt_referendum_held:0 "#G UN delivery +1, moving [concept_un_authority]'s target:#! a supervised referendum held."
 un_order_ledger_tt_referendum_refused:0 "#R UN credibility −1, moving [concept_un_authority]'s target:#! a binding order of the Assembly refused."
 un_order_standing_held_tt:0 "#G International Standing:#! a referendum held under the Assembly's supervision. #v Gains are scaled down the higher our standing already is.#!"
 un_order_standing_refused_tt:0 "#R International Standing: −5#! for refusing the referendum the Assembly ordered."
 un_referendum.1.a:0 "Open the polling stations."
 un_referendum.1.b:0 "We will not put our union to a vote."
 un_referendum.1.d:0 "The General Assembly has ordered us to let [SCOPE.sCountry('un_ref_subject').GetName] vote on its independence, under the chamber's supervision. The observers are ready to sail. We can open the polling stations and accept the count, whatever it says, or refuse and answer for it before the Assembly."
 un_referendum.1.d_accepted:0 "We voted for the Assembly's resolution, and it has carried: [SCOPE.sCountry('un_ref_subject').GetName] will vote on its independence under the chamber's supervision. Having accepted the order, we cannot refuse it now. All that is left is to open the polling stations and accept the count."
 un_referendum.1.f:0 "The ballot had two boxes and no pictures. The observers had argued for a week over which box came first."
 un_referendum.1.t:0 "A Referendum Ordered"
 un_referendum.2.a:0 "A new flag on the map."
 un_referendum.2.d_proposer:0 "The referendum we moved in [SCOPE.sCountry('un_ref_subject').GetName] has been held under the Assembly's supervision, and its people voted to leave [SCOPE.sCountry('un_ref_overlord').GetName]. [SCOPE.sCountry('un_ref_subject').GetName] is independent."
 un_referendum.2.d_subject:0 "The count is in, and the observers have signed it: we voted to leave [SCOPE.sCountry('un_ref_overlord').GetName]. We are independent."
 un_referendum.2.f:0 "The observers left on the first boat out. The flags went up before it cleared the harbour."
 un_referendum.2.t:0 "Independence by Referendum"
 un_referendum.3.a:0 "The people have spoken."
 un_referendum.3.d_proposer:0 "The referendum we moved in [SCOPE.sCountry('un_ref_subject').GetName] has been held under the Assembly's supervision, and its people voted to stay with [SCOPE.sCountry('un_ref_overlord').GetName]. The chamber counts the vote held as its order obeyed."
 un_referendum.3.d_subject:0 "The count is in, and the observers have signed it: we voted to stay with [SCOPE.sCountry('un_ref_overlord').GetName]. The question has been asked and answered, and for now the case for leaving has lost its force."
 un_referendum.3.f:0 "The losing side demanded a recount. The observers obliged, and the result did not change."
 un_referendum.3.t:0 "The Union Holds"
 un_referendum.4.a:0 "The world has seen it."
 un_referendum.4.d_proposer:0 "[SCOPE.sCountry('un_ref_overlord').GetName] has refused the referendum the General Assembly ordered in [SCOPE.sCountry('un_ref_subject').GetName]. The chamber records it as defiance of a binding order."
 un_referendum.4.d_subject:0 "[SCOPE.sCountry('un_ref_overlord').GetName] has refused the vote the General Assembly ordered. There will be no polling stations and no observers. The refusal has done what a vote might not have: more of our people want to leave than ever."
 un_referendum.4.f:0 "The observers' ship turned back at the harbour mouth. On the quay, a crowd had been waiting since dawn."
 un_referendum.4.t:0 "The Referendum Refused"
 un_referendum_hold_odds_tt:0 "[SCOPE.sCountry('un_ref_subject').GetName] votes. With a #v [ROOT.GetCountry.MakeScope.Var('un_ref_chance').GetValue|0]%#! chance (its [concept_liberty_desire] to the nearest 5, held between 20% and 90%) it votes to leave and #R becomes independent#!. Otherwise it votes to stay, and its liberty desire #G falls by 20#!."
 un_referendum_independent_tt:0 "[SCOPE.sCountry('un_ref_subject').GetName] is no longer a [concept_subject] of [SCOPE.sCountry('un_ref_overlord').GetName]."
 un_referendum_moot_tt:0 "The subject the resolution named is no longer [SCOPE.sCountry('un_vote_target').GetName]'s, so there is no vote to hold."
 un_referendum_not_refusing_tt:0 "We have not refused a referendum the Assembly ordered in the last five years"
 un_referendum_ordered_accepted_tt:0 "[SCOPE.sCountry('un_vote_target').GetName] voted for the resolution, so it holds the vote in [SCOPE.sCountry('un_vote_target').MakeScope.Var('un_ref_named_subject_capital').GetState.GetCountry.GetName]: refusing is not open to it."
 un_referendum_ordered_tt:0 "[SCOPE.sCountry('un_vote_target').GetName] must now hold the vote in [SCOPE.sCountry('un_vote_target').MakeScope.Var('un_ref_named_subject_capital').GetState.GetCountry.GetName] or refuse it."
 un_referendum_refuse_tt:0 "We refuse the vote the Assembly ordered in [SCOPE.sCountry('un_ref_subject').GetName]. For five years we may not ask the Assembly for a referendum anywhere else."
 un_referendum_refused_modifier:0 "Referendum Refused"
 un_referendum_refused_modifier_desc:0 "We refused a referendum the General Assembly ordered in one of our subjects, and every subject we hold has taken note."
 un_referendum_refused_notice_tt:0 "The [concept_liberty_desire] of [SCOPE.sCountry('un_ref_subject').GetName] rose by 15, and the refusal goes on the record of [SCOPE.sCountry('un_ref_overlord').GetName]."
 un_referendum_stayed_tt:0 "The [concept_liberty_desire] of [SCOPE.sCountry('un_ref_subject').GetName] fell by 20."
 un_vote.1.d_ceasefire:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has asked the General Assembly to order [SCOPE.sCountry('un_vote_target').GetName] to cease fire in the war it started against [SCOPE.sCountry('un_vote_target').MakeScope.Var('un_cf_named_victim_capital').GetState.GetCountry.GetName], a member of this chamber. The order would bind: for two years, every month of fighting would cost the aggressor support for the war at home. No one would impose a peace. How shall [ROOT.GetCountry.GetName] vote?"
 un_vote.1.d_ceasefire_target:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has asked the General Assembly to order us to cease fire in our war against [ROOT.GetCountry.MakeScope.Var('un_cf_named_victim_capital').GetState.GetCountry.GetName]. If it carries, every month we fight on will cost us support for the war at home. To vote against is to deny the charge. To vote in favour is to accept the verdict, and to be told to stop rather than censured."
 un_vote.1.d_referendum:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has asked the General Assembly to order [SCOPE.sCountry('un_vote_target').GetName] to let [SCOPE.sCountry('un_vote_target').MakeScope.Var('un_ref_named_subject_capital').GetState.GetCountry.GetName] vote on its independence, under the chamber's supervision. The order would bind: the overlord could hold the vote or refuse it, and refusing would cost it dearly. A vote in favour stands with the right of peoples to decide their own future. How shall [ROOT.GetCountry.GetName] vote?"
 un_vote.1.d_referendum_target:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has asked the General Assembly to order us to let [ROOT.GetCountry.MakeScope.Var('un_ref_named_subject_capital').GetState.GetCountry.GetName] vote on its independence. If it carries, we must hold the vote or refuse it before the whole world. To vote in favour is to accept the referendum now, and it will then be held."
 un_vote.1.t_ceasefire:0 "Binding Ceasefire Vote"
 un_vote.1.t_referendum:0 "Supervised Referendum Vote"
 un_vote.2.d_ceasefire_failed:0 "The General Assembly has declined to order [SCOPE.sCountry('un_vote_target').GetName] to cease fire. The vote failed [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. The war goes on without the chamber's word against it."
 un_vote.2.d_ceasefire_passed:0 "The General Assembly has ordered [SCOPE.sCountry('un_vote_target').GetName] to cease fire. The resolution carried [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. For the next two years, every month it fights on against a member will cost it support for the war at home."
 un_vote.2.d_ceasefire_passed_vetoed:0 "The General Assembly voted to order [SCOPE.sCountry('un_vote_target').GetName] to cease fire, but a [concept_un_veto] in the [concept_un_security_council] reduced the order to a call for one. The call binds no one: it lowers the aggressor's support for the war once, and nothing follows."
 un_vote.2.d_referendum_failed:0 "The General Assembly has declined to order a referendum in [SCOPE.sCountry('un_vote_target').MakeScope.Var('un_ref_named_subject_capital').GetState.GetCountry.GetName]. The vote failed [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. Its future stays a matter between it and [SCOPE.sCountry('un_vote_target').GetName]."
 un_vote.2.d_referendum_passed:0 "The General Assembly has ordered [SCOPE.sCountry('un_vote_target').GetName] to hold a supervised referendum in [SCOPE.sCountry('un_vote_target').MakeScope.Var('un_ref_named_subject_capital').GetState.GetCountry.GetName]. The resolution carried [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. The overlord must now hold the vote or refuse it."
 un_vote.2.d_referendum_passed_vetoed:0 "The General Assembly voted for a supervised referendum in [SCOPE.sCountry('un_vote_target').MakeScope.Var('un_ref_named_subject_capital').GetState.GetCountry.GetName], and a [concept_un_permanent_member] struck it down. A referendum has no lesser form, so it is blocked outright and no vote is held. The majority is on the record, and nothing else."
 un_vote_ceasefire_passed_tt:0 "The Assembly ordered a ceasefire. #G UN credibility +1, moving [concept_un_authority]'s target.#! For 24 months, every month the aggressor fights on against a member, its [concept_war_support] in each such war falls by 2.5 × the UN's [concept_un_enforcement] (#v ×[GetGlobalVariable('un_enforcement_now').GetValue|1]#! at the current tier), its record of aggression grows and the UN's peace and order suffers. If the war ends while the order stands and the aggressor has taken nothing from its victim, the UN's delivery gains and peacekeepers deploy to the victim's most devastated state. If the order runs out with the war still on, or the aggressor ends the war holding the victim's capital, any of its land or the victim itself as a subject, UN credibility falls."
 un_vote_ceasefire_passed_vetoed_tt:0 "The ceasefire carried in the General Assembly but was vetoed in the [concept_un_security_council]. #G UN credibility +0.5, moving [concept_un_authority]'s target.#! The Assembly can only call for a ceasefire: the aggressor's [concept_war_support] in each war it fights against a member falls once, by 10 × the UN's [concept_un_enforcement] (#v ×[GetGlobalVariable('un_enforcement_now').GetValue|1]#!), and nothing more follows."
 un_vote_referendum_passed_tt:0 "The Assembly ordered a supervised referendum. #G UN credibility +1, moving [concept_un_authority]'s target.#! The [concept_overlord] must hold the vote or refuse it. Held, it ends in independence with a chance from the subject's [concept_liberty_desire] (20% to 90%), or else the subject's liberty desire falls by 20; the overlord gains standing and the UN's delivery gains. Refused, the overlord loses 5 standing and its record of defiance grows by 10, the subject's liberty desire rises by 15, the overlord's prestige and its subjects' loyalty suffer for five years, and UN credibility falls."
 un_vote_referendum_passed_vetoed_tt:0 "A [concept_un_permanent_member] cast a [concept_un_veto]. A referendum has no graduated form, so the resolution is blocked outright and no vote is held."
 je_un_chamber_ceasefire_bound:0 "#bold Binding Ceasefire:#! #R the Assembly has ordered us to cease fire#! for #v [THIS.ScriptValue('un_disp_cf_months_left')|0]#! more months. Each month we fight on against a member costs us #R [THIS.ScriptValue('un_disp_cf_drain')|1]#! war support in that war."
 je_un_chamber_ceasefire_protected:0 "#bold Binding Ceasefire:#! the Assembly has ordered [SCOPE.sCountry('un_cf_obligation_aggressor').GetName] to cease fire in its war against us; every month it fights on costs it war support."

 te_cmg_yugoslav_primary_tt:0 "A core culture of the merge is a primary culture here: $serb$, $croat$ or $bosniak$."
 te_cmg_yugoslav_sol_tt:0 "The core cultures live at similar standards of living: the gap between the best and the worst off is under [GetPlayer.MakeScope.ScriptValue('te_cm_sol_gap_open')|0] to begin, counted once every core culture is held and accepted, and a running merge stalls once it passes [GetPlayer.MakeScope.ScriptValue('te_cm_sol_gap_close')|0]. At the last census, [ROOT.GetCountry.MakeScope.Var('te_cm_sol_best_yugoslav').GetCulture.GetName] pops were the best off, at [ROOT.GetCountry.MakeScope.Var('te_cm_sol_hi_yugoslav').GetValue|1], and [ROOT.GetCountry.MakeScope.Var('te_cm_sol_worst_yugoslav').GetCulture.GetName] pops the worst off, at [ROOT.GetCountry.MakeScope.Var('te_cm_sol_lo_yugoslav').GetValue|1]: a gap of [ROOT.GetCountry.MakeScope.Var('te_cm_sol_gap_yugoslav').GetValue|1]."

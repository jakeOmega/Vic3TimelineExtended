 te_cmg_start_american_button:0 "Begin the $cm_american$ Merge"
 te_cmg_start_american_button_desc:0 "Starts the merge of $yankee$ and $dixie$. $cm_american$ becomes a primary culture here. Each constituent culture we hold that qualifies begins to assimilate into it: a slice of its pops each year, those in subjects and bloc members more slowly. A culture that qualifies later joins then. Once $cm_american$ holds [GetPlayer.MakeScope.ScriptValue('te_cm_switch_share')|%0] of a culture's homeland, every remaining pop of that culture switches at once."
 te_cmg_start_american_effect_tt:0 "$cm_american$ becomes a primary culture here and the merge begins. Each constituent culture we hold that qualifies starts to assimilate into it."

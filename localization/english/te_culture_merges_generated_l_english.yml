 te_cmg_start_american_button:0 "Begin the $cm_american$ Merge"
 te_cmg_start_american_button_desc:0 "Starts the merge of $yankee$ and $dixie$. $cm_american$ becomes a primary culture here. Each part we hold that qualifies begins to assimilate into it: a slice of its pops each year, those in subjects and bloc members more slowly. A part that qualifies later joins then. Once $cm_american$ holds [GetPlayer.MakeScope.ScriptValue('te_cm_switch_share')|%0] of a part's homeland, every remaining pop of that part switches at once."
 te_cmg_start_american_effect_tt:0 "$cm_american$ becomes a primary culture here and the merge begins. Each part we hold that qualifies starts to assimilate into it."
 te_cmg_start_andean_button:0 "Begin the $cm_andean$ Merge"
 te_cmg_start_andean_button_desc:0 "Starts the merge of $north_andean$, $south_andean$, $peruvian$ and $bolivian$. $cm_andean$ becomes a primary culture here. Each part we hold that qualifies begins to assimilate into it: a slice of its pops each year, those in subjects and bloc members more slowly. A part that qualifies later joins then. Once $cm_andean$ holds [GetPlayer.MakeScope.ScriptValue('te_cm_switch_share')|%0] of a part's homeland, every remaining pop of that part switches at once."
 te_cmg_start_andean_effect_tt:0 "$cm_andean$ becomes a primary culture here and the merge begins. Each part we hold that qualifies starts to assimilate into it."
 te_cmg_start_anglophone_button:0 "Begin the $cm_anglophone$ Merge"

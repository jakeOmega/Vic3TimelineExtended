 je_te_cm_american:0 "Cultural Merge: $cm_american$"
 je_te_cm_american_complete_conclusion_desc:0 "The merge is complete. $cm_american$ is the national culture across the sphere, and the cultures it brought in are one people."
 je_te_cm_american_reason:0 "Closely related peoples can come to see themselves as one nation. The core of this merge is $yankee$ and $dixie$. Over the decades their pops become $cm_american$, and once it holds most of a constituent culture's homeland, every remaining pop of that culture follows. $afro_american$ pops can join once they qualify as well."
 je_te_cm_american_status_accept_dixie:0 "$dixie$ pops are not fully accepted where many of them live: their acceptance in our sphere is below $full_acceptance$ ([ROOT.GetCountry.MakeScope.ScriptValue('te_cm_accept_open')|0]), and $second_rate_citizen$ is not enough."
 je_te_cm_american_status_accept_yankee:0 "$yankee$ pops are not fully accepted where many of them live: their acceptance in our sphere is below $full_acceptance$ ([ROOT.GetCountry.MakeScope.ScriptValue('te_cm_accept_open')|0]), and $second_rate_citizen$ is not enough."
 je_te_cm_american_status_busy_1:0 "$yankee$ pops are already part of another merge, which has to finish with them first."
 je_te_cm_american_status_busy_2:0 "$dixie$ pops are already part of another merge, which has to finish with them first."
 je_te_cm_american_status_complete:0 "The merge is complete: $cm_american$ is the national culture across the sphere. Cultures that qualify later can still join."
 je_te_cm_american_status_hold_dixie:0 "$dixie$ pops are out of reach: our sphere holds only [ROOT.GetCountry.MakeScope.Var('te_cm_held_american_dixie').GetValue|%0] of them in their homeland, and [ROOT.GetCountry.MakeScope.ScriptValue('te_cm_hold_open')|%0] is needed."
 je_te_cm_american_status_hold_yankee:0 "$yankee$ pops are out of reach: our sphere holds only [ROOT.GetCountry.MakeScope.Var('te_cm_held_american_yankee').GetValue|%0] of them in their homeland, and [ROOT.GetCountry.MakeScope.ScriptValue('te_cm_hold_open')|%0] is needed."
 je_te_cm_american_status_late:0 "The merge is complete for its core cultures, and $cm_american$ is their national culture. A culture that joined later is still converting: in its homeland $cm_american$ holds [ROOT.GetCountry.MakeScope.ScriptValue('te_cmg_american_lowest_dom_all')|%0] of the pops, and at [ROOT.GetCountry.MakeScope.ScriptValue('te_cm_switch_share')|%0] every remaining pop of that culture switches. #tooltippable;tooltip:[GetPlayer.GetTooltipTag],te_cm_speed_tt $country_culture_merge_speed_mult$: +[ROOT.GetCountry.MakeScope.ScriptValue('te_cm_speed_display')|%0]#!."
 je_te_cm_american_status_running:0 "The merge is running. In the homeland of the least converted constituent culture, $cm_american$ holds [ROOT.GetCountry.MakeScope.ScriptValue('te_cmg_american_lowest_dom')|%0] of the pops; at [ROOT.GetCountry.MakeScope.ScriptValue('te_cm_switch_share')|%0] every remaining pop of that culture switches. #tooltippable;tooltip:[GetPlayer.GetTooltipTag],te_cm_speed_tt $country_culture_merge_speed_mult$: +[ROOT.GetCountry.MakeScope.ScriptValue('te_cm_speed_display')|%0]#!."
 je_te_cm_american_status_sol_close:0 "The core cultures' standards of living are close enough now: the gap between the best and the worst off is [ROOT.GetCountry.MakeScope.Var('te_cm_sol_gap_american').GetValue|1], under [ROOT.GetCountry.MakeScope.ScriptValue('te_cm_sol_gap_open')|0]. The next yearly census will count it."
 je_te_cm_american_status_sol_wide:0 "The core cultures live at standards of living too far apart: [ROOT.GetCountry.MakeScope.Var('te_cm_sol_best_american').GetCulture.GetName] pops are the best off, at [ROOT.GetCountry.MakeScope.Var('te_cm_sol_hi_american').GetValue|1], and [ROOT.GetCountry.MakeScope.Var('te_cm_sol_worst_american').GetCulture.GetName] pops the worst off, at [ROOT.GetCountry.MakeScope.Var('te_cm_sol_lo_american').GetValue|1]. The gap of [ROOT.GetCountry.MakeScope.Var('te_cm_sol_gap_american').GetValue|1] must be under [ROOT.GetCountry.MakeScope.ScriptValue('te_cm_sol_gap_open')|0] to begin."
 je_te_cm_american_status_wait_dixie:0 "The merge waits while a country still has $je_acw_reincorporate$ open. It goes ahead after [ROOT.GetCountry.MakeScope.ScriptValue('te_cm_wait_cap_years')|0] years at most."

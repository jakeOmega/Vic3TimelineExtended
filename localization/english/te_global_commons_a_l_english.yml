l_english:
 pmg_launch_to_orbit_building_space_mine:0 "Launch to Orbit"
 pmg_transport_in_space_building_space_mine:0 "Transport in Space"
 pm_chemical_launch_building_space_mine:0 "Chemical Launch"
 pm_chemical_launch_building_space_mine_desc:0 "Crews, habitats and equipment ride chemical rockets to orbit, and the base pays for every tonne in Launch Capacity."
 pm_tethered_launch_building_space_mine:0 "Tethered Launch"
 pm_tethered_launch_building_space_mine_desc:0 "Cargo climbs to orbit on space elevator ribbons instead of burning propellant, so the base buys far less Launch Capacity."
 pm_chemical_tugs_building_space_mine:0 "Chemical Tugs"
 pm_chemical_tugs_building_space_mine_desc:0 "Chemical tugs haul ore and supplies between the asteroids and Earth orbit, and every tonne of their propellant is launched from Earth."
 pm_fusion_tugs_building_space_mine:0 "Fusion Tugs"
 pm_fusion_tugs_building_space_mine_desc:0 "Fusion-driven tugs make the same transfers on a fraction of the propellant, so less of it has to be launched from Earth."

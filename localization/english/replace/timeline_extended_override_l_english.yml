 law_subjecthood:0 "Sovereign Subjecthood"
 law_subjecthood_desc:0 "The state defines its people foremostly as subjects of a sovereign. Legal identity is tied to local tradition and community loyalty rather than a centralized national status."
 law_ethnostate:0 "Ancestral Citizenship"
 law_ethnostate_desc:0 "Citizenship is an immutable trait derived from the 'Right of Blood.' Only those of the core ancestral lineage are recognized as legal members of the nation."
 law_national_supremacy:0 "Cultural Citizenship"
 law_national_supremacy_desc:0 "Membership in the nation is determined by adherence to its primary spirit. Citizenship is reserved for those who share the language, traditions, and heritage of the dominant culture."
 law_racial_segregation:0 "Racialized Citizenship"
 law_racial_segregation_desc:0 "Citizenship is stratified based on perceived racial or ancestral proximity. Preference is given to specific lineages regardless of their cultural or linguistic adoption."
 law_cultural_exclusion:0 "Assimilatory Citizenship"
 law_cultural_exclusion_desc:0 "The state is open to all who are willing to merge into the national identity. Naturalization is a process of cultural adoption, requiring the abandonment of outside traditions."
 law_multicultural:0 "Universal Citizenship"
 law_multicultural_desc:0 "Citizenship is a matter of residency and the 'Right of Soil.' Every resident born within the borders is a full member of the nation, regardless of heritage or creed."

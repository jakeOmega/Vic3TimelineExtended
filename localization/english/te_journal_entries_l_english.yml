 je_iw_slots_detail_tooltip:0 "#bold [concept_operation_slots]#!\n#v [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_active_display')|0]#! in use, #v [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_available_slots_display')|0]#! free. At most #v [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_ops_max_per_type_display')|0]#! of any one type.\n\n#bold Where the slots come from#!\n[JournalEntry.GetCountry.GetModifier.GetValueWithBreakdownFor('country_covert_operation_slot_add')]\n\n#italic An unused slot is not wasted: each one is redirected to counterintelligence.#!\n#italic Up to one operation of each type, plus one each from Mainframe Computers and Cyber Warfare, plus one for a #bold Veteran#! agency (Tradecraft #v [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_tier_4_floor')|0]#!).#!"
 je_iw_stand_down_button:0 "Stand down"
 je_iw_stand_down_tooltip:0 "#bold Call this operation off#!\nIt ends now, with no infamy and no diplomatic fallout - that is the price of being caught, not of calling off. The slot is freed immediately and the months already invested are lost.\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'iw_tgt', ScriptContainer.MakeScope.Var('iw_target_capital').GetState.GetCountry.MakeScope ).End )]\n[ScriptedGui.ExecuteTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'iw_tgt', ScriptContainer.MakeScope.Var('iw_target_capital').GetState.GetCountry.MakeScope ).End )]"
 je_iw_status_defended:0 "#Y Defended.#! Our intelligence capabilities are adequate, though determined adversaries may find vulnerabilities."
 je_iw_status_exposed:0 "#O Exposed.#! Our intelligence [concept_infrastructure] has significant gaps. We are vulnerable to sustained covert campaigns."
 je_iw_status_fortress:0 "#bold INTELLIGENCE FORTRESS.#! #G [JournalEntry.GetCountry.GetName]'s counterintelligence is virtually impenetrable.#! Foreign operations face near-certain detection."
 je_iw_status_hardened:0 "#G Hardened.#! Our intelligence [concept_infrastructure] is well-defended. Only the most sophisticated operations have a chance of success."
 je_iw_status_vulnerable:0 "#R Vulnerable.#! Our nation's counterintelligence is dangerously weak. Foreign intelligence services operate with near impunity."
 je_iw_tradecraft_header:0 "[concept_tradecraft]"
 je_iw_tradecraft_line:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_display')|0]#! → [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_disp_tc_next_floor')|0]"
 je_iw_tradecraft_tooltip:0 "#bold How Tradecraft moves#!\nEach month, every operation past its preparatory phase adds up to #G [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_gain_per_op')|1]#!, and one still preparatory #G [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_prep_gain_fraction')|1]#! (at most [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_ops_counted')|0] operations' worth count; this month #v [JournalEntry.GetCountry.MakeScope.Var('iw_tradecraft_ops').GetValue|1]#!). Gains shrink above half.\nAn exposed operation costs #R [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_loss_mild')|0]#! (espionage), #R [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_loss_moderate')|0]#! (meddling), #R [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_loss_severe')|0]#! (attacking the state) or #R [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_loss_war')|0]#! (wartime sabotage). With no operation running it drifts down by #R [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_decay')|2]#! a month.\n\n#bold Each tier#! adds to [concept_intelligence_capacity] and grows our networks #G [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_net_gain_pct_display')|0]%#! faster:\n[JournalEntry.GetCountry.GetModifier.GetValueWithBreakdownFor('country_intelligence_capacity_mult')]\n\n#bold Unlocks#!\nFledgling at [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_tier_1_floor')|0]; #bold Established#! at [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_tier_2_floor')|0]: operations may run at priority 3; #bold Seasoned#! at [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_tier_3_floor')|0]; #bold Veteran#! at [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_tier_4_floor')|0]: one more operation of each type.\n#italic Nothing already running is ever ended when Tradecraft falls.#!"
 je_mental_health_crisis:0 "Mental Health Crisis"
 je_mental_health_crisis_desc:0 "Modern life has produced an epidemic of depression, anxiety, and addiction. Decide how the state will respond."
 je_mental_health_crisis_reason:0 "Modern life has produced a mental health epidemic. Depression, anxiety, and addiction sweep through the population, demanding a response."
 je_mental_health_status_crisis:0 "#R The mental health crisis deepens.#! Without rehabilitative justice, society treats symptoms as crimes."
 je_mental_health_status_rehab:0 "#G Rehabilitation-focused justice is in place,#! but comprehensive mental health [concept_infrastructure] is still needed."
 je_nuclear_how_header:0 "How Nuclear Weapons Work"
 je_nuclear_how_posture:0 "Three separate choices make up the posture: [concept_nuclear_doctrine], when we say we would use the bomb; [concept_nuclear_readiness], how quickly our forces can respond; and [concept_launch_authority], who may launch when a warning is uncertain. Each has a price in money, in reputation abroad or in risk at home, and each can be changed only so often: the rule is said above its choices under Nuclear Posture. The forces behind the posture move month by month: survivability with what we spend on hardening, command reliability with safeguards, and crew strain with readiness."
 je_nuclear_how_programme:0 "Each step of funding spends weekly [concept_innovation] on progress toward the next warhead, the bar below the programme. Once the first device exists, the same funding builds ten times as fast. Programme aid from another power speeds it up, sabotage and United Nations inspections slow it, and a pause treaty, an arsenal ceiling or dismantling stops it."
 je_nuclear_how_sub_crisis:0 "Crises"
 je_nuclear_how_sub_delivery:0 "Delivery and Defence"
 je_nuclear_how_sub_home:0 "At Home"
 je_nuclear_how_sub_posture:0 "Posture and Forces"
 je_nuclear_how_sub_powers:0 "Nuclear Powers"
 je_nuclear_how_sub_programme:0 "The Programme"
 je_nuclear_how_sub_reputation:0 "Reputation"
 je_nuclear_how_sub_taboo:0 "The Nuclear Taboo"
 je_nuclear_how_taboo:0 "The [concept_nuclear_taboo] is one score for the whole world, from 0 to 100, for how unthinkable nuclear weapons have become. Each month it moves a little toward a target set by the state of the world; hover the score for the target's parts. It falls when the bomb is used or brandished and rises with restraint. The higher it stands, the more a first use, a battlefield use or a public ultimatum costs, and from 40 up holding warheads is itself a burden."
 je_nuclear_ov_credibility_label:0 "Credibility #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_credibility')|0]#!"

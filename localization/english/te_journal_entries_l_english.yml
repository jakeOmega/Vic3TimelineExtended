 je_colonial_empire_tt_assimilation:0 "#header $je_colonial_empire_row_assimilation$#!\n$CE_CULTURAL_ASSIMILATION_BODY$\n\n#bold Bar contribution while active:#! #v [JournalEntry.GetCountry.MakeScope.ScriptValue('colonial_assim_effectiveness_display')|=+2]#! / month\n$TOOLTIP_DELIMITER$\n#title While active:#!\n[GetStaticModifier('colonial_cultural_assimilation_modifier').GetDesc]"

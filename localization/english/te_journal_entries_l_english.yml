 je_space_race_widget_how_approach:0 "A new milestone starts with no [concept_sr_approach]. It then drifts forward at 0.5 a month and never suffers a setback, but its funding is already billed. Safe halves the [concept_sr_setback_risk]; Ambitious adds half again to the pace. Approach, funding and mission choices count for the whole programme, not only for the milestone they sit on: every running milestone with an approach moves at the same pace, and the risk and pace changes add up across milestones."
 je_space_race_widget_how_first:0 "The first power to finish a milestone keeps its larger permanent reward; anyone who finishes it later keeps a lesser one. Hover the progress bar for both. Solar System Colonization has no first: each colony is a reward of its own."
 je_space_race_widget_how_funding:0 "Each [concept_sr_funding] level, on any milestone, adds 0.5 a month to the pace of every milestone with an approach and costs innovation every week, scaled by the milestone. The approach costs innovation on top: Safe as much as one more level, Ambitious as much as two. The cap rises with technology."
 je_space_race_widget_how_header:0 "How the Space Race Works"
 je_space_race_widget_how_programme:0 "The row at the foot of the overview is the whole programme: lit once achieved (a flag marks a first), half-lit while under way, faint otherwise. Each entry appears in the journal once the one before it is finished and its technology is researched. Finishing the Interstellar Probe opens Interstellar Probe: Awaiting Data, which counts down the probe's 132-month transit; nothing hurries it."
 je_space_race_widget_how_rivals:0 "Rivals lists every other power running the same milestone and moving it: players, and AI powers in the top three of the world ranking. An AI power outside the top three can hold a programme that never advances, so it is left out. Programmes are announced but their schedules are not, so how far a rival has come is not shown."
 je_space_race_widget_how_setbacks:0 "Each month, every running milestone with an approach rolls against its [concept_sr_setback_risk], which stays between 1% and 50% a month. A setback costs progress, more on Ambitious than on Safe. Most responses to an Ambitious failure also start a six-month post-setback review: no milestone can suffer another setback, and progress continues at full pace. A setback never ends a milestone. The estimate ignores setbacks."

 je_colonial_empire_decision_planned_tt:0 "Wind up the entire colonial empire at once. Every eligible territory is listed for confirmation before anything is released, and you can withdraw."
 je_colonial_empire_decision_release:0 "Release a Colonial Territory"
 je_colonial_empire_decision_release_tt:0 "A unilateral grant of independence to one colony and the states around it. You will be shown up to three candidates, with what each release would cost you, and can withdraw without releasing anything."
 je_colonial_empire_decision_round_table:0 "Round Table Conference"
 je_colonial_empire_decision_round_table_tt:0 "A negotiated transition for one well-accepted colony. It needs more than 200 [concept_authority] and angers the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName], but the new country starts on better terms with us, and the boost to [concept_colonial_stability] lasts longer than after a unilateral release. You will be shown up to three candidates and can withdraw."
 je_colonial_empire_decisions_header:0 "Decolonization"
 je_colonial_empire_desc:0 "The age of [concept_decolonization_system] is at hand. Whether through direct overseas possessions or colonial subjects, choose between integration, devolution, or repression for our overseas holdings."

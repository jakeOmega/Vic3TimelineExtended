 je_strategic_reserve_ov_income_label:0 "Sales Income"
 je_strategic_reserve_ov_income_tt:0 "#bold Weekly Sales Income:#! @money![JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_total_sale_profit')|D]\nGross revenue this week from the goods the reserve releases, at each good's current market price. It does not subtract what the reserve spends buying goods."
 je_strategic_reserve_ov_income_value:0 "@money![JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_total_sale_profit')|D]/wk"
 je_strategic_reserve_reason:0 "Your Strategic Reserve Hub lets you physically hoard strategic goods. Positive reserve rates make the hub buy from the market and add to the stockpile; negative rates make it release goods from the stockpile back onto the market. Stored goods decay slowly, so a large reserve is not free."

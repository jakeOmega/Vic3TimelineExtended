 je_colonial_empire_drift_rank:0 "Rank"
 je_colonial_empire_drift_rank_tt:0 "A [concept_great_power] holds its colonies more easily than a lesser power."
 je_colonial_empire_drift_total:0 "#bold Projected change#!"
 je_colonial_empire_drift_total_tt:0 "What the bar moves by this month: the rows above, after the monthly limit."
 je_colonial_empire_fail_tt:0 "Fails when the Colonial Stability bar reaches #R 0#! — the colonial system collapses. Up to three colonial territories break away as independent nations, each taking the connected lands that are its people's [concept_homeland]. Our colonial subjects' [concept_liberty_desire] surges, and this journal cannot return for ten years. Unless years of development or assimilation programmes let us negotiate the withdrawal, the collapse also costs [concept_prestige] and [concept_sol] for years."
 je_colonial_empire_history_header:0 "History"
 je_colonial_empire_how_bar_1:0 "The bar runs from 0 to 100 and moves once a month by the sum of everything acting on it, but never by more than ±[JournalEntry.GetCountry.MakeScope.ScriptValue('colonial_stability_drift_cap')|2] either way, so no single shock can empty it. Hover the bar at the top for every term with its current value; Why Stability Is Moving adds them up by group."
 je_colonial_empire_how_bar_2:0 "Where the bar stands sets the [concept_colonial_band], and the marker on the bar shows where the next one begins. Each band puts its own modifier on this journal entry; hover the band at the top to see it. In the lower three bands our colonial subjects gain [concept_liberty_desire], and in the lowest two civil rights movements radicalize."
 je_colonial_empire_how_bar_3:0 "The entry is won by holding the bar at 100 long enough (its completion conditions show the count), or by taking the Imperial Federation Act or the Civilizing Mission Compact. It fails if the bar reaches 0, and ends without penalty once we hold no colony or colonial subject."
 je_colonial_empire_how_decolonization:0 "Each decision opens an event that lists what it would release before anything happens: up to three candidates, largest first, for a single release, or every candidate for Planned Full Decolonization. Every event offers to reconsider. A territory is a candidate if it lies overseas, is populous enough and is not a homeland of our cultures. A Round Table Conference accepts only a territory with no severely unaccepted population."
 je_colonial_empire_how_header:0 "How the Colonial Empire Works"
 je_colonial_empire_how_moves:0 "A base decline is always there. Laws, some technologies and recent events add or take away, and so do powerful interest groups and our rank. War, revolution, [concept_turmoil] and [concept_colonial_overreach] drain the bar. Colonies with a severely unaccepted population drain it too, and overseas states where everyone is well accepted add to it. Overreach, great-power pressure and acceptance are counted at the monthly assessment; the other groups change as soon as their cause does."
 je_colonial_empire_how_pressure:0 "Each [concept_great_power] may condemn colonialism, back the colonial powers or stay out. Each counts in proportion to its [concept_prestige] against ours, from a quarter of a peer's weight up to double. When the condemning powers hold a third of the prestige of all great powers and ourselves we face diplomatic isolation, and at two thirds an international consensus against us. Each is a further monthly loss, and they stack."
 je_colonial_empire_how_programmes:0 "Each programme adds to the bar every month it runs, at the cost shown on its row; hover a row for all its effects. Our laws make each one worth more or less. The programme we run longest also decides how the empire ends."

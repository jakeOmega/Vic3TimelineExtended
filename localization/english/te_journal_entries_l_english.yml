 je_un_chamber_missions_header:0 "Missions in the Field"
 je_un_chamber_missions_help:0 "#lore Peacekeeping succeeds after two years of peace for its host; aid when its state has no famine and a standard of living of 10; stabilisation once the collapse is over and a year has passed. A mission fails if its host is attacked, or if every contributor goes home; it lapses after five years. Success is delivery for the United Nations and standing for its contributors; failure costs the Assembly credibility.\n\nAny [concept_major_power] member may send a contingent to a mission without waiting to be asked, at a quarter of a percent of its [Concept('concept_gdp', 'GDP')] a year for each mission; the peacekeeping programme pays for its members' peacekeeping and stabilisation contingents. A contingent brought home before the work is done costs standing and the host's regard, and cannot be sent back.#!"
 je_un_chamber_missions_intro:0 "#lore Every mission sits in one state. Its strength is the UN's [concept_un_enforcement], less what withheld [concept_un_dues] cost the budget, and more for every contributor up to three.#!"

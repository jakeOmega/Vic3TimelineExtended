 je_iw_net_row_strength_full:0 "Strength: #v [ScriptContainer.GetVariableValue('iw_net_strength')|0]#!: full report"
 je_iw_net_row_strength_to_ops:0 "Strength: #v [ScriptContainer.GetVariableValue('iw_net_strength')|0]#! → [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_net_intel_tier_2_strength')|0]: their operations revealed"
 je_iw_net_row_strength_to_service:0 "Strength: #v [ScriptContainer.GetVariableValue('iw_net_strength')|0]#! → [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_net_intel_tier_1_strength')|0]: their service revealed"
 je_iw_net_row_strength_tt:0 "#bold What the network reports#!\nFrom strength #v [GetPlayer.MakeScope.ScriptValue('covert_net_intel_tier_1_strength')|0]#!: their service, meaning its [concept_intelligence_capacity] and technology count beside ours.\nFrom strength #v [GetPlayer.MakeScope.ScriptValue('covert_net_intel_tier_2_strength')|0]#!: their operations, meaning how many [concept_covert_operations] they are running against us.\n\nThe marker on the bar sits where the next part of the report starts, and goes once the network reports everything. A burn that drops the network below a mark loses that part of the report at once."

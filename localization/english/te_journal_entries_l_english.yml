 je_colonial_empire_decision_release:0 "#bold Release a Colonial Territory#!\n#lore A unilateral grant of independence to one colony and the states around it. You will be shown up to three candidates, with what each release would cost you, and can withdraw without releasing anything.#!"
 je_colonial_empire_decision_round_table:0 "#bold Round Table Conference#!\n#lore A negotiated transition for one well-accepted colony: costlier up front, but the new country leaves on friendly terms and with no [concept_infamy]. You will be shown up to three candidates and can withdraw.#!"
 je_colonial_empire_decisions_header:0 "Decolonization"
 je_colonial_empire_desc:0 "The age of [concept_decolonization_system] is at hand. Whether through direct overseas possessions or colonial subjects, choose between integration, devolution, or repression for our overseas holdings."
 je_colonial_empire_fail_tt:0 "Fails when the Colonial Stability bar reaches #R 0#! — the colonial system collapses. All non-[concept_homeland] territories are released as independent nations and the country takes a long-duration unrest penalty."

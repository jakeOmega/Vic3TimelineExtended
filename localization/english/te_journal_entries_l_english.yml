 je_un_preview_dues_header:0 "If we are a member"
 je_un_preview_dues_tt:0 "Every member pays [concept_un_dues]: a share of its GDP a year that grows with the UN's tier, from 0.1% when Contested to 1% when Supranational. Withholding them saves the money but costs standing, and after 24 months in arrears our vote in the [concept_un_general_assembly]."
 je_un_preview_membership_benefits_header:0 "If our authority earns us membership benefits"
 je_un_preview_membership_benefits_tt:0 "From the Contested tier ([concept_un_authority] 20+) an active member receives the membership benefits modifier, scaled by authority ÷ 50. A Moribund UN pays nothing."
 je_un_preview_npt_header:0 "If the United Nations enforces non-proliferation"
 je_un_preview_npt_tt:0 "From the Strong tier, once the IAEA exists, a member without nuclear weapons is held to disarmament: any nuclear programme it runs is wiped back to nothing every week, for as long as it remains a member."
 je_un_preview_pariah_header:0 "If we stay outside while the UN is strong"
 je_un_preview_pariah_tt:0 "From the Established tier ([concept_un_authority] 45+) a country outside the UN is a pariah; from the Strong tier it also loses trade and leverage. Joining at any time clears both."
 je_un_preview_war_surcharge_header:0 "If we go to war without a mandate"
 je_un_preview_war_surcharge_tt:0 "From the Established tier, every war goal the initiator of a diplomatic play adds without a military mandate bound to that play costs it extra [concept_infamy]: #v 2#! at Established, #v 4#! at Strong, #v 10#! at Supranational, and twice that from Strong against a country under a UN peacekeeping deployment. Members and non-members alike."

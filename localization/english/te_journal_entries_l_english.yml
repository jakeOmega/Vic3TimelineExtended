 je_un_auth_charter_0:0 "#bold [concept_un_charter]:#! the founding charter. The target is held at #v 70#! or below, so the UN can be no more than Established."
 je_un_auth_charter_1:0 "#bold [concept_un_charter]:#! Reform I adopted. The target is held at #v 85#! or below, so the UN can be no more than Strong."
 je_un_auth_charter_2:0 "#bold [concept_un_charter]:#! both reforms adopted. The target may reach #v 100#!."
 je_un_auth_conference:0 "No United Nations exists. A founding conference is in session: a new organisation will be founded, weak and under the founding charter, unless the world's leading power wrecks the conference. The breakdown appears after its first monthly update."
 je_un_auth_crisis_clock:0 "#R The UN is in crisis, and the world has given up on it.#! Its target is below #v 5#!, so authority falls at least a quarter point a month: at this rate it #R dissolves in about [THIS.ScriptValue('un_crisis_months_to_collapse')|0] months#!. Only a change in the world that lifts the target to 5 or more stops the clock; the crisis ends if authority climbs back above 20. Great powers that could lift the target:"
 je_un_auth_crisis_linger:0 "#R The UN is in crisis#! (authority below 10 for #v [THIS.ScriptValue('un_disp_crisis_months')|0]#! months). Its target is 5 or more, so it lingers rather than collapses; it ends if authority climbs back above 20. Great powers that could lift the target:"
 je_un_auth_dissolved_cooldown:0 "The United Nations has been #R dissolved#!. No new one may be founded until [THIS.ScriptValue('un_refounding_year')|0]; then any [concept_great_power] may convene a founding conference."
 je_un_auth_dissolved_open:0 "The United Nations has been #R dissolved#!. Any [concept_great_power] with Intergovernmental Organizations may now convene a founding conference for a new one."
 je_un_auth_header_help:0 "How UN Authority Works"
 je_un_auth_header_history:0 "UN Authority History"
 je_un_auth_header_why:0 "Why UN Authority Is Moving"
 je_un_auth_help_1:0 "#bold UN authority follows the world.#! Each month it moves toward a target, the sum of seven pillars computed from what the world's powers are doing. A shock moves authority itself but not the target, so it fades unless the world changed underneath it."
 je_un_auth_help_2:0 "#bold Weight in world affairs.#! A country's weight is its share of world [concept_prestige] measured against a typical [concept_great_power]'s (×1), up to ×5. A micro-state's gestures barely register; a superpower's count several times over."
 je_un_auth_help_3:0 "#bold The pillars.#! Participation (who is in), great-power commitment (who champions or undermines it), funding (who runs its programmes) and peace and order (wars between members, nuclear use) are read from the world as it is each month. Credibility and delivery are ledgers: resolutions carried or vetoed, aid and peacekeepers delivered, mandates honoured or abused. Each entry fades over about four years."
 je_un_auth_help_4:0 "#bold What moves it:#! joining or leaving, championing or undermining the order, running UN programmes, carrying or blocking resolutions, delivering aid and peacekeepers, honouring or abusing mandates, wars between members, and nuclear use. A permanent member walking out is a shock."
 je_un_auth_help_5:0 "#bold What does not:#! switching a programme on and off. A programme counts for exactly as long as it runs, and never for more."
 je_un_auth_help_6:0 "#bold Tiers.#! Authority sets the UN's tier, and the tier sets its [concept_un_enforcement], the multiplier on every penalty the Assembly imposes: Moribund (below 20) ×0, Contested (20–45) ×0.5, Established (45–70) ×1, Strong (70–85) ×1.5, Supranational (85+) ×2.5. A tier is entered at its floor and left only four points below it, so it does not flicker."
 je_un_auth_help_7:0 "#bold The Charter.#! Under the founding charter the target is held at 70. Charter Reform I raises the ceiling to 85 and Reform II to 100. A reform may be tabled only after authority has held within five points of the ceiling for 24 months; it needs a two-thirds supermajority of all members, and any permanent member can [concept_un_veto] it outright. After a reform vote, carried or not, the next may not be tabled for five years."
 je_un_auth_help_8:0 "#bold The floor.#! Below 10 the UN is in crisis until authority climbs above 20. If its target falls below 5 as well, authority falls at least a quarter point a month, and at 0 the UN dissolves: its headquarters, agencies, conventions and mandates go, and power blocs fill the vacuum. After twenty years any [concept_great_power] may convene a founding conference for a new one; the world's leading power may join it, stay out, or wreck it."
 je_un_auth_log_empty:0 "Nothing has been entered in the UN's record yet."
 je_un_auth_log_intro:0 "Newest first. An entry fades from its pillar over about four years."
 je_un_auth_not_founded:0 "The United Nations has not been founded."
 je_un_auth_pending:0 "The pillars are computed at the start of each month. The breakdown appears after the first monthly update."
 je_un_auth_power_champion:0 "#G Championing the order#! — [THIS.GetCountry.GetName] (#v [THIS.ScriptValue('un_disp_power_share_pct')|1]%#! of world power)"
 je_un_auth_power_outsider:0 "#Y Outside the UN#! — [THIS.GetCountry.GetName], a [concept_great_power] (#v [THIS.ScriptValue('un_disp_power_share_pct')|1]%#! of world power)"
 je_un_auth_power_underminer:0 "#R Undermining the order#! — [THIS.GetCountry.GetName] (#v [THIS.ScriptValue('un_disp_power_share_pct')|1]%#! of world power)"
 je_un_auth_powers_none:0 "No member is championing or undermining the order, and every [concept_great_power] is a member."
 je_un_auth_reform_clock:0 "#lore The next charter reform can be tabled once authority has held at #v [THIS.ScriptValue('un_charter_reform_threshold')|0]#! or more for #v [THIS.ScriptValue('un_charter_reform_months_needed')|0]#! months running. So far: #v [THIS.ScriptValue('un_disp_charter_pressure_months')|0]#! months.#!"
 je_un_auth_reform_cooldown:0 "#Y A charter reform has come before the Assembly within the last five years:#! the next may not be tabled for another #v [THIS.ScriptValue('un_reform_cooldown_months_left')|0]#! months."
 je_un_auth_reform_ripe:0 "#G The organisation has outgrown its charter.#! Any member of [concept_major_power] rank or above may table Charter Reform [THIS.ScriptValue('un_charter_next_stage')|0] in the chamber above: a two-thirds supermajority of all members, and no [concept_un_veto]."
 je_un_auth_saviour_champion:0 "#G Could champion the order#! — [THIS.GetCountry.GetName]: target #G +[THIS.ScriptValue('un_crisis_rescue_gain')|1]#!"
 je_un_auth_saviour_join:0 "#G Could join#! — [THIS.GetCountry.GetName], outside the UN: target #G +[THIS.ScriptValue('un_crisis_rescue_gain')|1]#! by joining"
 je_un_auth_saviour_stop_undermining:0 "#G Could stop undermining#! — [THIS.GetCountry.GetName]: target #G +[THIS.ScriptValue('un_crisis_rescue_gain')|1]#!"
 je_un_auth_sub_ladder:0 "Tier and Charter"
 je_un_auth_sub_log:0 "Recent Entries"
 je_un_auth_sub_pillars:0 "Authority and Its Pillars"
 je_un_auth_sub_powers:0 "Champions, Underminers and Outsiders"
 je_un_auth_tbl_base_detail:0 "constant"
 je_un_auth_tbl_base_label:0 "Base"
 je_un_auth_tbl_base_tt:0 "#title Base#!\nA constant: what an organisation with no members, friends or record would be worth."
 je_un_auth_tbl_base_value:0 "[JournalEntry.GetCountry.MakeScope.ScriptValue('un_pillar_base')|0]"
 je_un_auth_tbl_commitment_detail:0 "champions minus underminers, by power"
 je_un_auth_tbl_commitment_label:0 "Great-power commitment"
 je_un_auth_tbl_commitment_tt:0 "#title Great-power commitment#! (−25 to +25)\n25 × each member's share of world power × its stance: +1 while it champions the order, −1 while it undermines it, plus its power bloc's Multilateral Institutions alignment. The champions and underminers are listed below the table."
 je_un_auth_tbl_commitment_value:0 "[JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_pillar_commitment')|+1]"
 je_un_auth_tbl_credibility_detail:0 "the Assembly's record, fading over years"
 je_un_auth_tbl_credibility_label:0 "Credibility"
 je_un_auth_tbl_credibility_tt:0 "#title Credibility#! (−15 to +15)\nA ledger of the Assembly's record. Resolutions carried add to it and resolutions that fall take from it. Vetoes take from it, weighted by the vetoer. Members backing or defying the organisation in UN events count, weighted by the member, as do lifted sanctions and violated mandates. Each entry halves every four years; the recent ones are listed below."
 je_un_auth_tbl_credibility_value:0 "[JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_pillar_credibility')|+1]"
 je_un_auth_tbl_delivery_detail:0 "aid, peacekeeping, missions and mandates delivered"
 je_un_auth_tbl_delivery_label:0 "Delivery"
 je_un_auth_tbl_delivery_tt:0 "#title Delivery#! (0 to +10)\nA ledger of what the UN has delivered: humanitarian aid and peacekeepers sent, aid and peacekeeping resolutions carried, emergency loans made, military mandates discharged as written, and #bold missions accomplished#! (+2 each; the chamber's Missions in the Field lists them). Each entry halves every four years."
 je_un_auth_tbl_delivery_value:0 "[JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_pillar_delivery')|+1]"
 je_un_auth_tbl_explain:0 "Each month authority closes a 48th of the gap to its target, at most 1 point. The target is the sum of the pillars below. Hover a pillar to see how it is computed."
 je_un_auth_tbl_funding_detail:0 "programmes [JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_funding_pct')|0]%, dues withheld [JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_arrears_share_pct')|0]%"
 je_un_auth_tbl_funding_label:0 "Funding"
 je_un_auth_tbl_funding_tt:0 "#title Funding#! (−10 to +10)\nWho pays for the United Nations. First, how much of the power of members of [concept_major_power] rank and above runs UN programmes: peacekeeping, development, human rights and arms control. Two programmes count in full, one counts half; this part runs from −5 to +10. Then the [concept_un_dues]: members withholding theirs cost up to 15 more points, in proportion to their share of the members' GDP."
 je_un_auth_tbl_funding_value:0 "[JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_pillar_funding')|+1]"
 je_un_auth_tbl_h_pillar:0 "#lore Pillar#!"
 je_un_auth_tbl_h_reading:0 "#lore What drives it now#!"
 je_un_auth_tbl_h_value:0 "#lore Value#!"
 je_un_auth_tbl_headline:0 "#bold [concept_un_authority]#! #v [JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_authority')|1]#!, moving toward #v [JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_target')|1]#! ([JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_step')|+2] this month)"
 je_un_auth_tbl_order_detail:0 "[JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_at_war_pct')|0]% of world power at war with members"
 je_un_auth_tbl_order_label:0 "Peace and order"
 je_un_auth_tbl_order_tt:0 "#title Peace and order#! (−20 to 0)\n−40 × the share of world power held by members at war with a fellow member (at most −15), plus a ledger of nuclear use that halves every four years. Nuclear use now: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_ledger_order')|+1]#!."
 je_un_auth_tbl_order_value:0 "[JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_pillar_order')|+1]"
 je_un_auth_tbl_participation_detail:0 "[JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_member_power_pct')|0]% of world power is in the UN"
 je_un_auth_tbl_participation_label:0 "Participation"
 je_un_auth_tbl_participation_tt:0 "#title Participation#! (0 to +25)\n25 × the share of world [concept_prestige] held by UN members. A [concept_great_power] outside the UN keeps its whole share out; a member absorbed into another member changes nothing."
 je_un_auth_tbl_participation_value:0 "[JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_pillar_participation')|+1]"
 je_un_auth_tbl_target_detail:0 "the sum, held under the [concept_un_charter]'s ceiling of [JournalEntry.GetCountry.MakeScope.ScriptValue('un_charter_cap')|0]"
 je_un_auth_tbl_target_label:0 "#bold Target#!"
 je_un_auth_tbl_target_tt:0 "#title Target#!\nThe sum of the pillars, held between 0 and the [concept_un_charter]'s ceiling: 70 under the founding charter, 85 after Reform I, 100 after Reform II. [concept_un_authority] moves a 48th of the way toward it each month, at most 1 point, so a sudden change in the world shows over years, not months. In a crisis whose target is below 5, it falls at least a quarter point a month."
 je_un_auth_tbl_target_value:0 "#bold [JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_target')|1]#!"
 je_un_auth_tbl_weight:0 "#bold Our weight in world affairs:#! #v ×[JournalEntry.GetCountry.MakeScope.ScriptValue('un_actor_weight')|2]#! ([JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_power_share_pct')|1]% of world [concept_prestige]). A typical [concept_great_power] counts ×1."
 je_un_auth_tbl_weight_tt:0 "Everything we do at the UN enters its pillars multiplied by this weight, up to ×5: our votes, vetoes, programmes and event choices. It is our share of world [concept_prestige] against a typical [concept_great_power]'s 10%."
 je_un_auth_tier_contested:0 "#bold Tier:#! #Y Contested#! — [concept_un_enforcement] ×0.5. Resolutions bite at half strength."
 je_un_auth_tier_established:0 "#bold Tier:#! #v Established#! — [concept_un_enforcement] ×1. Binding resolutions bite in full; great powers outside are pariahs."
 je_un_auth_tier_moribund:0 "#bold Tier:#! #R Moribund#! — [concept_un_enforcement] ×0. Resolutions are recommendations only, a [concept_un_veto] costs nothing, members receive no benefits, and power blocs fill the vacuum."
 je_un_auth_tier_strong:0 "#bold Tier:#! #G Strong#! — [concept_un_enforcement] ×1.5. Outsiders lose trade and leverage too."
 je_un_auth_tier_supranational:0 "#bold Tier:#! #B Supranational#! — [concept_un_enforcement] ×2.5."
 je_un_authority_heading:0 "Moving toward #v [SCOPE.GetRootScope.ScriptValue('un_disp_target')|0]#! ([SCOPE.GetRootScope.ScriptValue('un_disp_step')|+2] a month). See #bold Why UN Authority Is Moving#! below.\n"
 je_un_chamber_ballot_intro:0 "#lore Every ballot on the record, side by side with any pledged vote. A pledge is an undertaking, not a vote — it is never counted in the tally above.#!"
 je_un_chamber_binding_flat_block:0 "  [concept_un_resolution_binding] — any [concept_un_permanent_member] may [concept_un_veto] it, and a veto blocks it outright."
 je_un_chamber_binding_not_vetoed:0 "  [concept_un_resolution_binding] — any [concept_un_permanent_member] may still [concept_un_veto] it."
 je_un_chamber_commitment_broken:0 "#R Broken#! — [AddLocalizationIf(THIS.GetCountry.Exists, THIS.GetCountry.GetName)][AddLocalizationIf(Not(THIS.GetCountry.Exists), 'je_un_chamber_country_gone')] went back on a pledged vote."
 je_un_chamber_commitment_kept:0 "#G Delivered#! — [AddLocalizationIf(THIS.GetCountry.Exists, THIS.GetCountry.GetName)][AddLocalizationIf(Not(THIS.GetCountry.Exists), 'je_un_chamber_country_gone')] voted in favour, as pledged."
 je_un_chamber_commitment_pending:0 "#v Pledged#! — [AddLocalizationIf(THIS.GetCountry.Exists, THIS.GetCountry.GetName)][AddLocalizationIf(Not(THIS.GetCountry.Exists), 'je_un_chamber_country_gone')] undertook to vote in favour. No vote of theirs is on the record."

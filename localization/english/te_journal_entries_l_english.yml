 je_state_collapse:0 "State Collapse"
 je_state_collapse_desc:0 "Authority is failing. Restore order before the state fragments under [concept_turmoil], [concept_devastation], and corruption."
 je_state_collapse_reason:0 "State Collapse is the failure of a state to provide basic services and security to its citizens. This can be caused by a variety of factors, including corruption, conflict, and natural disasters. State Collapse can lead to widespread suffering, displacement, and violence."
 je_strategic_reserve:0 "Strategic Reserve"
 je_strategic_reserve_desc:0 "Manage the national stockpile of grain, ammunition, oil, small arms, artillery, aeroplanes, and tanks. Set a signed weekly reserve rate for each good: positive values store goods, negative values withdraw them, and zero idles that lane. Each good can instead be handed a price-triggered policy — Buy When Cheap, Release When Expensive or Stabilize Prices — which re-decides its rate every week from the national market price, within limits you set.\nMax rate: [ROOT.GetCountry.GetModifier.GetValueWithBreakdownFor('country_st_res_weekly_rate_cap_add')] units/week. Stored goods decay over time, so a large reserve is not free."
 je_strategic_reserve_profit_line:0 "\n#bold Weekly Sales Income:#! @money![ROOT.GetCountry.MakeScope.ScriptValue('st_res_total_sale_profit')|D]\n#italic Gross revenue this week from goods being released (negative rates), priced at the current market rate per good. Does not subtract the cost of goods being purchased on positive rates.#!"
 je_strategic_reserve_rate_line:0 "\n#bold Hub Flow Cap:#! [ROOT.GetCountry.GetModifier.GetValueWithBreakdownFor('country_st_res_weekly_rate_cap_add')] / week per good"
 je_strategic_reserve_reason:0 "Your Strategic Reserve Hub lets you physically hoard strategic goods. Positive reserve rates make the hub buy from the market and add to the stockpile; negative rates make it release goods from the stockpile back onto the market. Stored goods decay slowly, so a large reserve is not free."
 je_strategic_reserve_status_active:0 "National Stockpile"
 je_strategic_reserve_status_deactivated:0 "#R Hub is deactivated right now: ensure full [concept_occupancy] to reactivate.#!"
 je_strategic_reserve_status_no_hub:0 "No Strategic Reserve Hub exists. Build one in your capital to begin operations."
 je_strategic_reserve_widget_step_badge:0 "#bold Reserve Inventory#!  ·  #bold Adjustment Step:#! [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_adjust_step_value')|0] per click"

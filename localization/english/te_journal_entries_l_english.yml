 je_space_race_suborbital_failure_header:0 "Suborbital Program Suspended"
 je_space_race_suborbital_first_outcome_header:0 "If we are first across the Kármán line"
 je_space_race_suborbital_first_outcome_tt:0 "Our nation will be remembered as the first to touch space — a generational propaganda [concept_coup], fast-tracked innovation, and a magnetic pull on the world's imagination."
 je_space_race_suborbital_on_completion_header:0 "We have flown to the edge of space"
 je_space_race_suborbital_on_failure_header:0 "Our suborbital ambitions are on hold"
 je_space_race_suborbital_reason:0 "Our scientists are developing rocketry capable of reaching the edge of space. A successful suborbital flight will demonstrate our nation's technological prowess."
 je_space_race_suborbital_setback_header:0 "If the program is grounded"
 je_space_race_suborbital_setback_tt:0 "Without an active orbital program, the Suborbital Flight goal is shelved and any committed resources are written off. Restore the program to try again."
 je_space_race_suborbital_status:0 "Rocketry good enough to touch the edge of space."
 je_space_race_suborbital_status_ambitious:0 "#bold Approach:#! Ambitious\n#bold Status:#! Rapid test launches with human-rated payloads. Fortune favors the bold."
 je_space_race_suborbital_status_default:0 "#bold Status:#! Our rocketry program is ready to reach for the skies. Select an approach to begin the [concept_space_race]."
 je_space_race_suborbital_status_safe:0 "#bold Approach:#! Safe\n#bold Status:#! Careful, incremental test flights building toward the edge of space."
 je_space_race_suborbital_subsequent_outcome_header:0 "If others reach space before us"
 je_space_race_suborbital_subsequent_outcome_tt:0 "Even a follow-up flight matters. Our scientific community gains credibility and a modest cultural lift, but the headlines belong to whoever flew first."

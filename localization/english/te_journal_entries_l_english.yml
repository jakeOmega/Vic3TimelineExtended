 je_un_security_council_member:0 "\n#bold [concept_un_security_council]:#! [SCOPE.GetRootScope.ScriptValue('un_permanent_seat_count')|0] of 5 permanent members. #G We hold a seat#! and may [concept_un_veto] [concept_un_resolution_binding]s."
 je_un_security_council_nonmember:0 "\n#bold [concept_un_security_council]:#! [SCOPE.GetRootScope.ScriptValue('un_permanent_seat_count')|0] of 5 permanent members. We do not hold a seat. The five permanent seats are reserved for the founder and the first four [Concept('concept_great_power', 'Great Powers')] to join during the 5-year founding window — once those seats fill or the window closes, no new permanent members are seated automatically. A 2/3 General Assembly vote can expel an existing permanent member; the vacated seat is then granted to the highest-ranking eligible [Concept('concept_great_power', 'Great Power')] outside the Council. Only [concept_un_permanent_member]s may [concept_un_veto] binding resolutions."

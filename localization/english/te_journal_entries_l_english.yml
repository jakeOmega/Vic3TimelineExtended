 je_un_statistics:0 "\n#bold [concept_un_general_assembly]:#! [SCOPE.GetRootScope.ScriptValue('un_member_count')|0] of [SCOPE.GetRootScope.ScriptValue('un_eligible_country_count')|0] eligible nations are represented. Members hold [SCOPE.GetRootScope.ScriptValue('un_member_gdp_share')|0]% of world [Concept('concept_gdp', 'GDP')] and [SCOPE.GetRootScope.ScriptValue('un_member_pop_share')|0]% of its population.\n#bold [Concept('concept_great_power', 'Great Powers')]:#! [SCOPE.GetRootScope.ScriptValue('un_gp_member_count')|0] of [SCOPE.GetRootScope.ScriptValue('un_total_gp_count')|0] are members\n"
 je_un_statistics_suspended_many:0 "\n#bold [concept_un_general_assembly]:#! [SCOPE.GetRootScope.ScriptValue('un_member_count')|0] of [SCOPE.GetRootScope.ScriptValue('un_eligible_country_count')|0] eligible nations are represented. [SCOPE.GetRootScope.ScriptValue('un_suspended_member_count')|0] more member states have [Concept('concept_un_suspended_representation', 'suspended representation')] because they lack diplomatic autonomy. Members hold [SCOPE.GetRootScope.ScriptValue('un_member_gdp_share')|0]% of world [Concept('concept_gdp', 'GDP')] and [SCOPE.GetRootScope.ScriptValue('un_member_pop_share')|0]% of its population.\n#bold [Concept('concept_great_power', 'Great Powers')]:#! [SCOPE.GetRootScope.ScriptValue('un_gp_member_count')|0] of [SCOPE.GetRootScope.ScriptValue('un_total_gp_count')|0] are members\n"
 je_un_statistics_suspended_one:0 "\n#bold [concept_un_general_assembly]:#! [SCOPE.GetRootScope.ScriptValue('un_member_count')|0] of [SCOPE.GetRootScope.ScriptValue('un_eligible_country_count')|0] eligible nations are represented. 1 more member state has [Concept('concept_un_suspended_representation', 'suspended representation')] because it lacks diplomatic autonomy. Members hold [SCOPE.GetRootScope.ScriptValue('un_member_gdp_share')|0]% of world [Concept('concept_gdp', 'GDP')] and [SCOPE.GetRootScope.ScriptValue('un_member_pop_share')|0]% of its population.\n#bold [Concept('concept_great_power', 'Great Powers')]:#! [SCOPE.GetRootScope.ScriptValue('un_gp_member_count')|0] of [SCOPE.GetRootScope.ScriptValue('un_total_gp_count')|0] are members\n"
 je_un_status_conference:0 "#bold No United Nations exists.#! A founding conference convened by [GetGlobalVariable('un_founding_conference').GetCountry.GetName] is in session: the new organisation is founded in #v [SCOPE.GetRootScope.ScriptValue('un_conference_months_left')|0]#! months, unless the world's leading power wrecks the conference.\n"
 je_un_status_dissolved:0 "#R The United Nations was dissolved in [SCOPE.GetRootScope.ScriptValue('un_disp_dissolved_year')|0].#! Any [concept_great_power] may convene a founding conference for a new one from [SCOPE.GetRootScope.ScriptValue('un_refounding_year')|0].\n"
 je_un_status_member:0 "#G Active member.#! Benefits scale with authority (×authority ÷ 50, from the Contested tier up).\n"
 je_un_status_not_eligible:0 "#v Not a member, and not eligible.#! We do not conduct our own foreign policy, so we cannot join: only an independent country, or a dominion, protectorate or tributary, may ([concept_un_suspended_representation]).\n"
 je_un_status_not_member:0 "#v Not a member.#! Join to gain #bold +5 Diplo Rep#!, #bold +5 Leverage#!, and access to UN programs.\n"
 je_un_status_suspended:0 "#R Member, representation suspended.#! We do not conduct our own foreign policy, so we cast no vote and table nothing, and nobody carries our seat: membership brings us nothing ([concept_un_suspended_representation]).\n"
 je_un_status_suspended_carried:0 "#R Member, representation suspended.#! We do not conduct our own foreign policy, so we cast no vote and table nothing. [ROOT.GetCountry.GetOverlord.GetName] carries our seat: it pays our dues, and we keep the benefits of membership ([concept_un_suspended_representation]).\n"
 je_un_tier_line_contested:0 "#Y [concept_un_authority]: Contested#! (20–45). Resolutions bite at half strength ([concept_un_enforcement] ×0.5). Membership benefits are paid, scaled by authority.\n"
 je_un_tier_line_established:0 "#v [concept_un_authority]: Established#! (45–70). Binding resolutions bite in full ([concept_un_enforcement] ×1), and great powers outside the UN are treated as pariahs.\n"
 je_un_tier_line_moribund:0 "#R [concept_un_authority]: Moribund#! (below 20). Resolutions are recommendations only ([concept_un_enforcement] ×0), a [concept_un_veto] costs nothing, and members receive no benefits. Power blocs fill the vacuum.\n"
 je_un_tier_line_strong:0 "#G [concept_un_authority]: Strong#! (70–85). Resolutions bite at ×1.5 ([concept_un_enforcement]), and outsiders also lose trade and leverage. Reached only under [Concept('concept_un_charter','Charter Reform I')].\n"
 je_un_tier_line_supranational:0 "#B [concept_un_authority]: Supranational#! (85+). Resolutions bite at ×2.5 ([concept_un_enforcement]). Reached only under [Concept('concept_un_charter','Charter Reform II')].\n"
 je_united_nations:0 "United Nations"
 je_united_nations_desc:0 "Membership in the United Nations grants diplomatic benefits that scale with [concept_un_authority]. The institution is as strong as the world's powers make it: who joins, who champions it, and whether its decisions are carried out."
 je_united_nations_reason:0 "The United Nations is an intergovernmental organization promoting international cooperation. Its members gain diplomatic benefits that scale with [concept_un_authority].\n\n#bold [concept_un_authority]#! (0–100) follows the world. Each month it moves toward a target: a base plus six pillars. #bold Participation#! is how much of the world's power is in the UN. #bold Great-power commitment#! is who champions or undermines it. #bold Credibility#! is its record of resolutions carried, vetoed and defied. #bold Funding#! is who runs its programmes. #bold Peace and order#! covers wars between members and nuclear use. #bold Delivery#! is aid, peacekeeping and mandates delivered. Every act counts in proportion to the actor's share of world [concept_prestige]. See #bold Why UN Authority Is Moving#! below.\n\n#bold Membership benefits#! (while authority is 30 or more) scale with authority ÷ 50. At 50: #G +10% relations improvement speed, +1% research speed, +3% [concept_prestige]#!. At 100: twice that.\n\n#bold Security Council:#! five permanent seats carry the [concept_un_veto]. The founder takes one at the founding; the others go to the [Concept('concept_great_power','Great Power')] members with the most [concept_prestige] that hold none, never to whoever joined first: when the signing period closes a year after the founding, and whenever a seat falls vacant. A seat is lost by leaving, by ten years below great-power rank, or by a two-thirds expulsion vote. The permanent members are named in the chamber.\n\n#bold Headquarters:#! the founder hosts the UN and may build the United Nations Headquarters in its territory. If the host leaves, another member takes over.\n\n#bold Specialized agencies#! are founded when the General Assembly adopts the matching convention: WHO, UNESCO, ICJ, UNHRC, IAEA, UNEP, UNHCR and UNOOSA.\n\n#bold Resolutions#! are tabled and voted on in the General Assembly chamber below. A permanent member can veto the binding ones.\n\n#bold Programmes#! (peacekeeping, development, human rights and arms control) each carry a cost, and count toward the UN's funding while they run."
 je_world_war:0 "The Gathering Storm"
 je_world_war_desc:0 "Ideological tensions are pushing the [Concept('concept_great_power', 'great powers')] toward a global war. Pick a side, prepare, or try to stop it."
 je_world_war_reason:0 "Ideological tensions between the [Concept('concept_great_power', 'great powers')] are escalating. Democratic, fascist, and communist blocs eye one another with growing hostility. The world teeters on the brink of a conflict unlike any before."
 je_world_war_status_active_war:0 "#bold THE WORLD IS AT WAR.#! Our forces are engaged in total combat against the enemy bloc. Every factory, every citizen, every resource is committed to victory."
 je_world_war_status_crisis:0 "#R CRISIS:#! War is imminent. The [Concept('concept_great_power', 'great powers')] have drawn their lines. Any incident could ignite the powder keg."
 je_world_war_status_high_tension:0 "#Y HIGH TENSION:#! The ideological divide deepens. Military buildups accelerate. Diplomatic channels are strained to breaking point."
 je_world_war_status_observing:0 "The [Concept('concept_great_power', 'great powers')] are at war. We remain outside the conflict: for now. Pressure mounts to choose a side."
 je_world_war_status_post_war:0 "The guns have fallen silent. The world holds its breath as the victors and vanquished negotiate the shape of the post-war order."
 je_world_war_status_rising_tension:0 "Tensions are rising between the ideological blocs. Arms races have begun, and border incidents grow more frequent."
 je_world_war_status_simmering:0 "The [Concept('concept_great_power', 'great powers')] watch each other warily. Ideological differences simmer beneath the surface of diplomacy."
 je_world_war_status_total_war:0 "#bold TOTAL WAR.#! #R The conflict has raged for years. Cities lie in ruins. Entire generations are being consumed by the furnace of war.#!"
 je_world_war_status_war_declared:0 "#bold WAR HAS BEEN DECLARED.#! The ideological blocs have taken up arms. The world holds its breath."

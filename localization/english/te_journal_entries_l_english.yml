 je_covert_warfare_desc:0 "Conduct espionage, sabotage, and counter-intelligence in the shadow war between [Concept('concept_great_power', 'great powers')]."
 je_covert_warfare_reason:0 "The covert battlefield is invisible but decisive. Our intelligence services wage shadow wars of subversion and sabotage, while our [concept_intelligence_capacity] protects us from foreign interference."
 je_create_new_religion:0 "Create New Religion"
 je_create_new_religion_desc:0 "Found a new faith and shape its tenets, doctrine, and reach."
 je_create_new_religion_reason:0 "We have the opportunity to create a new religion that will shape the beliefs and practices of our people. This will require significant resources and effort, but the potential benefits are immense. What path shall we choose?"
 je_cultural_hegemony:0 "Cultural Hegemony"
 je_cultural_hegemony_desc:0 "Project our nation's arts, language, and ideals abroad for [concept_prestige] and durable influence."
 je_cultural_hegemony_reason:0 "Our nation's arts, technology, and way of life project influence across the globe. The world watches, imitates, or resents our cultural dominance."
 je_cultural_hegemony_status:0 "#bold [ROOT.GetCountry.GetCustom('ch_tier_text')]#!\n[ROOT.GetCountry.GetCustom('ch_tier_blurb')]\n"
 je_digital_rights:0 "Digital Rights & Surveillance"
 je_digital_rights_desc:0 "Balance state surveillance against citizen privacy as the digital age arrives."
 je_digital_rights_reason:0 "As digital surveillance becomes ubiquitous, citizens demand privacy protections. The state must balance security against liberty in the digital age."
 je_digital_rights_status_minimal:0 "#Y Minimal privacy protections exist,#! but the surveillance state grows."
 je_digital_rights_status_moderate:0 "#G Moderate data privacy laws are in place,#! but comprehensive digital rights remain unachieved."
 je_digital_rights_status_surveillance:0 "#R An intrusive surveillance apparatus monitors the population.#! Privacy advocates fight an uphill battle."
 je_global_warming:0 "Global Warming"
 je_global_warming_desc:0 "Confront the long-term climate consequences of industrial coal and oil consumption: emissions policy, adaptation, and the politics of decarbonization."
 je_global_warming_progress:0 "#bold Global Temperature:#! #v [ROOT.GetCountry.MakeScope.ScriptValue('temperature_anomaly_display')|2]#! °C - [ROOT.GetCountry.GetCustom('gw_severity_short')]"
 je_global_warming_reason:0 "Global Warming is the long-term rise in Earth's average surface temperature driven by the burning of coal and oil. Its consequences - crop failures, coastal flooding, mass displacement, and surging mortality - threaten every nation on Earth.\n\nWarming scales linearly: the hotter the planet, the worse every penalty becomes. At #v 0.5°C#! the effects are mild; at #v 1.0°C#! moderate; at #v 2.0°C#! severe; at #v 3.0°C#! catastrophic. A market leader can cut emissions directly through market-wide policy, and every nation can spend on adaptation and resilience.\n\n#lore The climate dashboard above carries the current readings, this market's emissions and its share of the world total, and the eight policies you can adopt or repeal.#!"
 je_global_warming_status:0 "[ROOT.GetCountry.GetCustom('gw_severity_text')]"
 je_global_warming_status_catastrophic:0 "#bold Warming:#! #R Catastrophic#! - Temperatures have surpassed 3°C. Cascading ecological failures are now irreversible."
 je_global_warming_status_moderate:0 "#bold Warming:#! #Y Moderate#! - The planet has warmed noticeably. Crop disruptions and erratic weather become common."
 je_global_warming_status_negligible:0 "#bold Warming:#! #G Negligible#! - Global temperatures remain near pre-industrial levels."
 je_global_warming_status_severe:0 "#bold Warming:#! #R Severe#! - The climate crisis is dire. Famine, ecological collapse, and surging mortality threaten civilisation."
 je_global_warming_status_significant:0 "#bold Warming:#! #O Significant#! - Warming has reached dangerous levels. Coastal flooding, drought, and mass displacement accelerate."
 je_global_warming_status_slight:0 "#bold Warming:#! #Y Slight#! - Global temperatures have risen slightly. Early signs of shifting weather patterns emerge."
 je_group_covert_warfare:0 "Covert Warfare"
 je_group_environment:0 "Environment"
 je_group_soft_power:0 "Soft Power"
 je_heir_education:0 "Heir Education"
 je_heir_education_desc:0 "The future of the realm hangs upon the character of the next sovereign. By setting the direction of our [concept_heir]'s education: choosing between administrative, diplomatic, and military training, and selecting tutors of various political persuasions: we shape the next generation of leadership. Education proceeds gradually; the heir's aptitudes, ideology, and factional loyalties will be determined when they come of age."
 je_heir_education_reason:0 "Set educational focuses for the [concept_heir]. Each active focus has a monthly chance of advancing that area of study.\n\n#bold Trait Focuses:#! Administrative, diplomatic, or military: only one at a time. Greater investment improves chances of developing better aptitude traits.\n\n#bold Ideology:#! Progressive or conservative tutors shape the heir's political outlook.\n\n#bold Faction:#! Establishment or reformist mentors influence the heir's [concept_interest_group] affiliation.\n\n#bold Completion:#! The heir's education resolves when they reach adulthood. Outcomes are probabilistic: sustained focus improves odds but guarantees nothing."
 je_heir_education_status_active:0 "#G Education Active#!\nThe [concept_heir] is being educated. Use the focus buttons to direct their studies."
 je_heir_education_status_bright:0 "#G The [concept_heir] is a quick study.#! Education is progressing well."
 je_heir_education_status_no_focus:0 "No educational focus is set. Select a trait focus, ideology, or faction mentorship to begin shaping the [concept_heir]'s development."
 je_heir_education_status_slow:0 "#R The [concept_heir] struggles to grasp concepts.#! Education makes slow progress."
 je_human_augmentation:0 "Human Augmentation Debate"
 je_human_augmentation_desc:0 "Set the legal status of mechanical and biotechnological enhancement of the human body."
 je_human_augmentation_reason:0 "Augmentation technology forces society to confront fundamental questions about human identity. The divide between enhanced and natural citizens threatens social [concept_power_bloc_cohesion]."

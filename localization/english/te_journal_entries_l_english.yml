 je_colonial_empire_cost_garrison:0 "#lore Ongoing [concept_authority] upkeep and [concept_infamy] on activation#!  ·  #lore stability#! #v [JournalEntry.GetCountry.MakeScope.ScriptValue('colonial_garrison_effectiveness_display')|=+2]#!#lore /mo#!"

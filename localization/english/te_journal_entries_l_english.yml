 je_colonial_empire_pressure_share_tt:0 "#lore Condemning powers hold#! #v [ROOT.GetCountry.MakeScope.Var('colonial_empire_condemner_share').GetValue|%0]#! #lore of the [concept_prestige] of all [Concept('concept_great_power', 'great powers')] and ourselves. At a third we face diplomatic isolation, at two-thirds an international consensus against us.#!"
 je_colonial_empire_programmes_header:0 "Colonial Programmes"
 je_colonial_empire_reason:0 "Our nation controls overseas territories that are not part of our cultural [concept_homeland]. The era of [concept_decolonization_system] is upon us - will we integrate these lands fully into our nation, or release them to self-governance?"
 je_colonial_empire_row_assimilation:0 "#bold Cultural Assimilation Programme#!"
 je_colonial_empire_row_garrison:0 "#bold Military Garrison#!"
 je_colonial_empire_row_invest:0 "#bold Colonial Development Investment#!"
 je_colonial_empire_stability_header:0 "Colonial Stability"
 je_colonial_empire_status_collapsing:0 "#R Colonial empire is on the verge of collapse!#! Immediate action is needed or we will lose everything."
 je_colonial_empire_status_crumbling:0 "#R Colonial empire is crumbling.#! Unrest is widespread and maintaining control grows more costly by the day."
 je_colonial_empire_status_pending:0 "Our officials are still taking stock of the empire."
 je_colonial_empire_status_solidified:0 "#G Colonial empire nearly fully integrated.#! The overseas territories are becoming a permanent part of the nation."
 je_colonial_empire_status_stable:0 "#Y Colonial holdings are stable.#! Integration is proceeding, though challenges remain."
 je_colonial_empire_status_strained:0 "#O Colonial empire is under strain.#! Rising tensions and international pressure threaten our hold."

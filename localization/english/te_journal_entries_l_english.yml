 je_state_collapse:0 "State Collapse"
 je_state_collapse_desc:0 "Authority is failing. Restore order before the state fragments under [concept_turmoil], [concept_devastation], and corruption."
 je_state_collapse_reason:0 "State Collapse is the failure of a state to provide basic services and security to its citizens. This can be caused by a variety of factors, including corruption, conflict, and natural disasters. State Collapse can lead to widespread suffering, displacement, and violence."
 je_strategic_reserve:0 "Strategic Reserve"
 je_strategic_reserve_desc:0 "Manage the national stockpile of grain, ammunition, oil, small arms, artillery, aeroplanes, tanks, and chemicals. Set a signed weekly reserve rate for each good: positive values store goods, negative values withdraw them, and zero idles that lane. Each good can instead be handed a price-triggered policy — Buy When Cheap, Release When Expensive or Stabilize Prices — which re-decides its rate every week from the national market price, within limits you set.\nMax rate: [ROOT.GetCountry.GetModifier.GetValueWithBreakdownFor('country_st_res_weekly_rate_cap_add')] units/week. Stored goods decay over time, so a large reserve is not free."
 je_strategic_reserve_how_decay:0 "Stock decays every week at a yearly rate that technology lowers. The hub buys each week's decay on top of whatever rate you set, so a rate of 0 holds a stockpile steady at a small ongoing cost. A row's tooltip breaks the good's decay rate down by source."
 je_strategic_reserve_how_header:0 "How the Strategic Reserve Works"
 je_strategic_reserve_how_hub:0 "The [GetBuildingType('building_strategic_reserve_hub').GetName] in your capital holds the reserve and does all its buying and selling. It gives every good its storage and its weekly [concept_st_res_flow_cap], a limit for each good rather than a shared pool. Each level of a [GetBuildingType('building_strategic_reserve_silo').GetName], in any state, adds storage for every good and raises every good's flow cap. The hub trades only while it is fully staffed."
 je_strategic_reserve_how_income:0 "Sales Income is the gross revenue from the week's releases, at each good's current market price, and does not subtract what the reserve spends buying. The budget panel shows the two sides separately: sales under Additional Income, and purchases with the hub's inputs under Goods for Government Buildings."
 je_strategic_reserve_how_policies:0 "Instead of setting a rate by hand, you can give a good a [concept_st_res_policy] that sets its rate every week from the national market price, measured against the good's base price and averaged over the weeks of its price memory. Buy When Cheap buys while the averaged price is below the purchase threshold, Release When Expensive sells while it is above the release threshold, and Stabilize Prices does both. The response ramp spreads the reaction out: the flow rises from nothing at a threshold to the maximum that many points beyond it, and at 0 the policy runs at full flow as soon as the price crosses. A row's own buttons and Reset Reserve Rates switch goods back to Manual. Policies keep running while the journal entry is closed."
 je_strategic_reserve_how_presets:0 "Eight settings shape a policy, and the three presets fill them all in one click. A preset keeps a good's maximum weekly flow and weekly purchase budget in step with your capacity and GDP every week, until you change either by hand; the preset in force is grayed out, and changing any setting by hand ends it. The budget is an estimate and a cap for each week, and what goes unspent does not carry over. The protected and target stockpiles bound what a policy sells and buys; every preset leaves them at the whole capacity."
 je_strategic_reserve_how_rates:0 "A positive [concept_st_res_rate_setting] buys that many units a week from your national market into the reserve; a negative one releases that many onto the market. Buying adds demand and raises the price; releasing adds supply and lowers it. Each click of a row's decrease or increase button moves the rate by the [concept_st_res_adjustment_step], which Cycle Step Size sets for every good; the stop button sets it to 0. The game keeps each rate within the flow cap and the room or stock left, and sets it to 0 when the reserve fills or empties. Reset Reserve Rates sets every rate to 0."
 je_strategic_reserve_how_status:0 "Storing and Withdrawing mean the rate you set is being applied, clipped by the flow cap if it is larger. Idle means no rate is set. Blocked means the stockpile is full, or empty while a release is set, or the hub is understaffed. A row's tooltip gives the reason for its status."

 je_un_security_council_member:0 "\n#bold [concept_un_security_council]:#! [SCOPE.GetRootScope.ScriptValue('un_permanent_seat_count')|0] of 5 permanent members. #G We hold a seat#! and may [concept_un_veto] [concept_un_resolution_binding]s. Every permanent member is named in the chamber below."
 je_un_security_council_nonmember:0 "\n#bold [concept_un_security_council]:#! [SCOPE.GetRootScope.ScriptValue('un_permanent_seat_count')|0] of 5 permanent members. We do not hold a seat. The founder is seated at the founding; every other seat goes to the [Concept('concept_great_power', 'Great Power')] member with the most [concept_prestige] that holds none, never to whoever joined first: the four beyond the founder's when the signing period closes, a year after the founding, and any seat that falls vacant later. A seat falls vacant when its holder leaves the UN, spends ten years below [Concept('concept_great_power', 'Great Power')] rank, or is expelled by a 2/3 General Assembly vote. The permanent members, and who is in line for a seat, are named in the chamber below. Only [concept_un_permanent_member]s may [concept_un_veto] binding resolutions."
 je_un_standing_effects_disgraced:0 "  In force: #R $un_standing_disgraced_modifier$#! — $un_standing_disgraced_modifier_desc$"
 je_un_standing_effects_exemplary:0 "  In force: #G $un_standing_exemplary_modifier$#! — $un_standing_exemplary_modifier_desc$"

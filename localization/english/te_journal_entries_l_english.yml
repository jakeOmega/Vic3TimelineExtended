 je_un_chamber_exposure_header:0 "Our Record"
 je_un_chamber_exposure_help:0 "#lore The record fades by half every five years. It grows with every war we begin without a mandate (more against a greater power), every binding resolution we refuse, every sanctions regime we bust, every ruling of the court we defy, every mandate we abuse, every severe covert operation of ours that is exposed, and every nuclear strike. Infamy counts as well, up to 50. A country with a clean record cannot be censured, sanctioned or made the target of a mandate at all.#!"

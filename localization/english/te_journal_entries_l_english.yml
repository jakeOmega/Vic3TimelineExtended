 je_colonial_empire_conditions_body:0 "#title Where that comes from:#!\n  Base imperial decline: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('colonial_stability_drift_base')|=+2]#!\n  Laws, [concept_technology|E]s and recent events: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('colonial_stability_drift_laws')|=+2]#!\n  Domestic [concept_interest_group|E]s: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('colonial_stability_drift_igs')|=+2]#!\n  Rank and standing: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('colonial_stability_drift_rank')|=+2]#!\n  Active programmes: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('colonial_stability_drift_policies')|=+2]#!\n  War, revolution and [concept_turmoil]: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('colonial_stability_drift_domestic')|=+2]#!\n  Imperial overreach: #v [JournalEntry.GetCountry.MakeScope.Var('colonial_empire_d_overreach').GetValue|=+2]#!\n  [concept_great_power|E] pressure: #v [JournalEntry.GetCountry.MakeScope.Var('colonial_empire_d_gp').GetValue|=+2]#!\n  Colonial acceptance: #v [JournalEntry.GetCountry.MakeScope.Var('colonial_empire_d_acceptance').GetValue|=+2]#!"

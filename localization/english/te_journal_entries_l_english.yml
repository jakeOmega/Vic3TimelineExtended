 je_iw_how_sub_tradecraft:0 "Tradecraft"
 je_iw_how_tradecraft:0 "[concept_tradecraft] is our agency's experience, from 0 to [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_max')|0]. Operations past their preparatory phase raise it each month, an exposed operation lowers it, and with no operation running it drifts down. Each tier adds to our [concept_intelligence_capacity] and makes our networks grow #G [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_net_gain_pct_display')|0]%#! faster.\n#bold Fledgling#! at [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_tier_1_floor')|0]; #bold Established#! at [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_tier_2_floor')|0]: priority [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_op_priority_max')|0]; #bold Seasoned#! at [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_tier_3_floor')|0]: Regime Change and Nuclear Programme Sabotage; #bold Veteran#! at [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_tradecraft_tier_4_floor')|0]: one more operation of each type.\nFalling below a tier never ends a running operation. Hover Tradecraft in the overview for this month's figures."

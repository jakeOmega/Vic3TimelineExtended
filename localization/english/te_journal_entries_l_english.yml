 je_iw_funding_cost_now_label:0 "Cost now"
 je_iw_funding_cost_tt:0 "The weekly cost grows with our [Concept('concept_gdp', 'GDP')], the funding level and the operations running, each weighted by its priority. A base share is paid even with no operation running: the defensive benefits are part of what funding buys."
 je_iw_funding_dormant_banner:0 "@warning! #R Funding is at zero.#! No operation runs, none can be launched, and any pact still standing will lapse."
 je_iw_funding_header:0 "Funding"
 je_iw_funding_state:0 "[JournalEntry.GetCountry.GetCustom('covert_funding_state_line')]"
 je_iw_funding_step_down_tooltip:0 "#bold Decrease covert funding#!\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)0' ) ).End )]\n[ScriptedGui.ExecuteTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)0' ) ).End )]"
 je_iw_funding_step_up_tooltip:0 "#bold Increase covert funding#!\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)1' ) ).End )]\n[ScriptedGui.ExecuteTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)1' ) ).End )]"
 je_iw_funding_stepper_label:0 "Level"
 je_iw_funding_stepper_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_funding_level_display')|0]#! [JournalEntry.GetCountry.GetCustom('covert_funding_level_name')]"
 je_iw_funding_sub_levels:0 "Funding Levels"
 je_iw_how_ci:0 "Our [concept_intelligence_capacity] also catches operations run against us. Each unused operation slot is redirected to counterintelligence, and funding from level 2 adds capacity. Three covert defences, economic, military and ideological, come from laws; each is added to our capacity against operations of its kind, as a target's is against ours.\n\nWhen our counterintelligence catches a foreign operation, its sponsor is named under Last Caught for ten years. Nothing else names the country behind an operation against us, though a strong network inside its service can count them."
 je_iw_how_detection:0 "Each operation rolls its own monthly [concept_operation_detection] chance, shown on its row. It starts at the base risk, falls with funding stealth and with our network in the target, rises with priority and with the target's counterintelligence (its [concept_intelligence_capacity] plus its [concept_target_defenses] against that kind of operation, compared with ours), and is then cut by our [concept_covert_efficiency]. At most one operation is exposed a month.\n\nAn exposed operation ends. It costs [concept_infamy] and relations, more for a more hostile operation and for one that has run longer, it costs [concept_tradecraft], and it costs its network #R [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_net_burn_loss')|0]#! strength."
 je_iw_how_funding:0 "Every operation needs [concept_covert_funding] of at least 1, so stepping down to 0 ends them all; the step down warns first. Each level from 2 up cuts every operation's detection risk and adds [concept_intelligence_capacity], as the Funding Levels list shows. The weekly cost grows with our [Concept('concept_gdp', 'GDP')], the level and the operations running, each weighted by its priority, and a base share is paid even with no operation running: the defensive benefits are part of what funding buys. From level [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_net_maintain_funding_level')|0], idle networks decay half as fast."
 je_iw_how_header:0 "How Covert Warfare Works"
 je_iw_how_ops:0 "We launch [concept_covert_operations] from another country's [Concept('concept_diplomatic_action', 'diplomatic actions')], and each takes an [Concept('concept_operation_slots', 'operation slot')]. An operation does nothing while Preparatory, works at base strength once Establishing, and at #G ×[JournalEntry.GetCountry.MakeScope.ScriptValue('covert_op_phase_full_mult')|0]#! once Fully Operational; its row shows the months to the next phase. A strong [Concept('concept_agent_network', 'network')] in the target gives a new operation a head start.\n\nPriority, from 1 to [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_op_priority_max')|0], multiplies what an operation does, what it costs and how easily it is caught. A click changes detection at once and the effects at the start of next month. Raising it raises upkeep at once; lowering it cuts upkeep only once the effects have followed. Priority [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_op_priority_max')|0] needs an #bold Established#! agency.\n\n#bold Stand down#! ends an operation now, with no [concept_infamy] and no diplomatic fallout: those are the price of being caught, not of calling it off. The slot is freed at once and the months invested are lost."
 je_iw_how_standing:0 "Our [concept_intelligence_capacity] is rated against the world's best: #bold Fortress#! from [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_disp_standing_floor_4')|0]%, #bold Hardened#! from [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_disp_standing_floor_3')|0]%, #bold Defended#! from [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_disp_standing_floor_2')|0]%, #bold Exposed#! from [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_disp_standing_floor_1')|0]%, and #bold Vulnerable#! below that. The overview's first icon shows the rating."

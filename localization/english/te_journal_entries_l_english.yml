 je_colonial_empire_complete_tt:0 "Completes when the Colonial Stability bar holds at #G 100#! for 60 sustained months (current: #v [ROOT.GetCountry.MakeScope.Var('colonial_at_100_months').GetValue|0] / 60#!). Drops below 100 reset the counter. Alternatively, completes when the Imperial Federation Act is taken; that decision separately requires sustaining the Solidified band (bar ≥ 90) for 36 months (current: #v [ROOT.GetCountry.MakeScope.Var('colonial_solidified_months').GetValue|0] / 36#!) plus the Act's other prerequisites."

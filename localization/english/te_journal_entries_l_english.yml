 je_colonial_empire_drift_igs_tt:0 "Powerful Landowners and Armed Forces steady the empire; powerful Intelligentsia and Trade Unions erode it."
 je_colonial_empire_drift_laws:0 "Laws, [concept_technology|E]s and events"
 je_colonial_empire_drift_laws_tt:0 "What our laws, some technologies and the modifiers recent events left behind add or take away. Hover the stability bar for each source."

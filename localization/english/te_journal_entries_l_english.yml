 je_un_tier_line_contested:0 "#Y [concept_un_authority]: Contested#! (20–45). Resolutions bite at half strength ([concept_un_enforcement] ×0.5). Membership benefits are paid, scaled by authority."
 je_un_tier_line_established:0 "#v [concept_un_authority]: Established#! (45–70). Binding resolutions bite in full ([concept_un_enforcement] ×1), and great powers outside the UN are treated as pariahs."
 je_un_tier_line_moribund:0 "#R [concept_un_authority]: Moribund#! (below 20). Resolutions are recommendations only ([concept_un_enforcement] ×0), a [concept_un_veto] costs nothing, and members receive no benefits. Power blocs fill the vacuum."
 je_un_tier_line_strong:0 "#G [concept_un_authority]: Strong#! (70–85). Resolutions bite at ×1.5 ([concept_un_enforcement]), and outsiders also lose trade and leverage. Reached only under [Concept('concept_un_charter','Charter Reform I')]."
 je_un_tier_line_supranational:0 "#B [concept_un_authority]: Supranational#! (85+). Resolutions bite at ×2.5 ([concept_un_enforcement]). Reached only under [Concept('concept_un_charter','Charter Reform II')]."
 je_united_nations:0 "United Nations"
 je_united_nations_desc:0 "Membership in the United Nations grants diplomatic benefits that scale with [concept_un_authority]. The institution is as strong as the world's powers make it: who joins, who champions it, and whether its decisions are carried out."
 je_united_nations_reason:0 "The United Nations is an intergovernmental organization promoting international cooperation. Its members gain diplomatic benefits that scale with [concept_un_authority].\n\n#bold [concept_un_authority]#! (0–100) follows the world. Each month it moves toward a target: a base plus six pillars. #bold Participation#! is how much of the world's power is in the UN. #bold Great-power commitment#! is who champions or undermines it. #bold Credibility#! is its record of resolutions carried, vetoed and defied. #bold Funding#! is who runs its programmes. #bold Peace and order#! covers wars between members and nuclear use. #bold Delivery#! is aid, peacekeeping and mandates delivered. Every act counts in proportion to the actor's share of world [concept_prestige]. See #bold Why UN Authority Is Moving#! below.\n\n#bold Membership benefits#! (from the Contested tier, authority 20 or more) scale with authority ÷ 50. At 50: #G +10% relations improvement speed, +1% research speed, +3% [concept_prestige]#!. At 100: twice that.\n\n#bold Security Council:#! five permanent seats carry the [concept_un_veto]. The founder takes one at the founding; the others go to the [Concept('concept_great_power','Great Power')] members with the most [concept_prestige] that hold none, never to whoever joined first: when the signing period closes a year after the founding, and whenever a seat falls vacant. A seat is lost by leaving, by ten years below great-power rank, or by a two-thirds expulsion vote. The permanent members are named in the chamber.\n\n#bold Headquarters:#! the founder hosts the UN and may build the United Nations Headquarters in its territory. If the host leaves, another member takes over.\n\n#bold Specialized agencies:#! ten are founded when the General Assembly adopts the matching convention (WHO, UNESCO, UNHRC, IAEA, UNEP, UNHCR, UNOOSA, ITLOS, the ICC and the regime for the physical protection of nuclear material). The ICJ is founded when a country first accepts a World Court ruling against it.\n\n#bold Resolutions#! are tabled and voted on in the General Assembly chamber below. A permanent member can veto the binding ones.\n\n#bold Programmes#! (peacekeeping, development, human rights and arms control) each carry a cost, and count toward the UN's funding while they run."
 je_world_war:0 "The Gathering Storm"
 je_world_war_desc:0 "Ideological tensions are pushing the [Concept('concept_great_power', 'great powers')] toward a global war. Pick a side, prepare, or try to stop it."
 je_world_war_ideology_authoritarian:0 "\n#bold Our Ideology:#! Authoritarian"
 je_world_war_ideology_communist:0 "\n#bold Our Ideology:#! #R Communist#!"
 je_world_war_ideology_democratic:0 "\n#bold Our Ideology:#! #G Democratic#!"
 je_world_war_ideology_fascist:0 "\n#bold Our Ideology:#! #R Fascist#!"
 je_world_war_ideology_nonaligned:0 "\n#bold Our Ideology:#! Non-Aligned"
 je_world_war_reason:0 "Ideological tensions between the [Concept('concept_great_power', 'great powers')] are escalating. Democratic, fascist, and communist blocs eye one another with growing hostility. The world teeters on the brink of a conflict unlike any before."
 je_world_war_status_active_war:0 "#bold THE WORLD IS AT WAR.#! Our forces are engaged in total combat against the enemy bloc. Every factory, every citizen, every resource is committed to victory."
 je_world_war_status_crisis:0 "#R CRISIS:#! War is imminent. The [Concept('concept_great_power', 'great powers')] have drawn their lines. Any incident could ignite the powder keg."
 je_world_war_status_high_tension:0 "#Y HIGH TENSION:#! The ideological divide deepens. Military buildups accelerate. Diplomatic channels are strained to breaking point."
 je_world_war_status_observing:0 "The [Concept('concept_great_power', 'great powers')] are at war. We remain outside the conflict: for now. Pressure mounts to choose a side."
 je_world_war_status_post_war:0 "The guns have fallen silent. The world holds its breath as the victors and vanquished negotiate the shape of the post-war order."
 je_world_war_status_rising_tension:0 "Tensions are rising between the ideological blocs. Arms races have begun, and border incidents grow more frequent."
 je_world_war_status_simmering:0 "The [Concept('concept_great_power', 'great powers')] watch each other warily. Ideological differences simmer beneath the surface of diplomacy."
 je_world_war_status_total_war:0 "#bold TOTAL WAR.#! #R The conflict has raged for years. Cities lie in ruins. Entire generations are being consumed by the furnace of war.#!"
 je_world_war_status_war_declared:0 "#bold WAR HAS BEEN DECLARED.#! The ideological blocs have taken up arms. The world holds its breath."

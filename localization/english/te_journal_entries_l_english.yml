 je_united_nations:0 "United Nations"
 je_united_nations_desc:0 "Membership in the United Nations grants diplomatic benefits that scale with [concept_un_authority]. Joining programs and adopting resolutions strengthens — or weakens — the institution."
 je_united_nations_reason:0 "The United Nations is an intergovernmental organization promoting international cooperation. As a member, your country gains diplomatic benefits that #bold scale with [concept_un_authority]#!.\n\n#bold UN Authority#! (0–100) measures institutional [concept_legitimacy]:\n• Drifts toward 50 each month (±0.25)\n• #G [Concept('concept_great_power', 'Great Powers')] with Humanitarian Regulations: +0.1/month each#!\n• #G [Concept('concept_great_power', 'Great Powers')] with Limited War: +0.2/month each#!\n• #R At war with another member state: −1/month#!\n• Joining programs raises it; defying resolutions lowers it\n\n#bold Membership Benefits#! (when Authority ≥ 30):\nScaled by Authority ÷ 50: at 50 you get 1× base benefit (#bold +5 Diplo Rep#!, #bold +1% Research#!, #bold +25 [concept_prestige]#!). At 100, 2×.\n\n#bold Security Council:#! First 5 Great Powers to join get permanent seats (+10 Diplo Rep, +20 Leverage, +25 Authority). Lost if you leave or drop below GP rank.\n\n#bold Headquarters:#! First signatory hosts [concept_hq] (+10 Diplo Rep, +100 Prestige, +10 Leverage).\n\n#bold Specialized Agencies#! (7) are created when members first adopt resolutions on each topic: WHO (health), UNESCO (heritage), ICJ (justice), UNHRC (human rights), IAEA (nuclear), UNEP (environment), UNHCR (refugees).\n\n#bold Resolutions & Events:#!\nEach month, UN members may receive resolution events based on a weighted random draw. Eligibility depends on your country's rank, laws, technologies, and current programs. Events fire individually: not all members receive the same event. Higher-rank nations see more diplomatic and reform events; all members can receive humanitarian, heritage, and arms control proposals.\n\n#bold Available Programs:#!\n• Peacekeeping: +5 Diplo Rep, +25 Prestige, +3% Military Costs\n• Development: +5 Diplo Rep, +25 Prestige, −50 [concept_bureaucracy]\n• Human Rights: +5 Diplo Rep, +25 Prestige, +5% [concept_institution] Speed\n• Arms Control: +5 Diplo Rep, −5% [concept_kill_rate], −15% [concept_devastation]\n• Sanctions: Target a rival with −15% Trade Competitiveness"
 je_world_war:0 "The Gathering Storm"
 je_world_war_desc:0 "Ideological tensions are pushing the [Concept('concept_great_power', 'great powers')] toward a global war. Pick a side, prepare, or try to stop it."
 je_world_war_reason:0 "Ideological tensions between the [Concept('concept_great_power', 'great powers')] are escalating. Democratic, fascist, and communist blocs eye one another with growing hostility. The world teeters on the brink of a conflict unlike any before."
 je_world_war_status_active_war:0 "#bold THE WORLD IS AT WAR.#! Our forces are engaged in total combat against the enemy bloc. Every factory, every citizen, every resource is committed to victory."
 je_world_war_status_crisis:0 "#R CRISIS:#! War is imminent. The [Concept('concept_great_power', 'great powers')] have drawn their lines. Any incident could ignite the powder keg."
 je_world_war_status_high_tension:0 "#Y HIGH TENSION:#! The ideological divide deepens. Military buildups accelerate. Diplomatic channels are strained to breaking point."
 je_world_war_status_observing:0 "The [Concept('concept_great_power', 'great powers')] are at war. We remain outside the conflict: for now. Pressure mounts to choose a side."
 je_world_war_status_post_war:0 "The guns have fallen silent. The world holds its breath as the victors and vanquished negotiate the shape of the post-war order."
 je_world_war_status_rising_tension:0 "Tensions are rising between the ideological blocs. Arms races have begun, and border incidents grow more frequent."
 je_world_war_status_simmering:0 "The [Concept('concept_great_power', 'great powers')] watch each other warily. Ideological differences simmer beneath the surface of diplomacy."
 je_world_war_status_total_war:0 "#bold TOTAL WAR.#! #R The conflict has raged for years. Cities lie in ruins. Entire generations are being consumed by the furnace of war.#!"
 je_world_war_status_war_declared:0 "#bold WAR HAS BEEN DECLARED.#! The ideological blocs have taken up arms. The world holds its breath."

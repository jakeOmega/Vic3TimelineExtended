 je_iw_net_header:0 "Agent Networks"
 je_iw_net_header_tooltip:0 "Every country we have run operations against keeps a network of agents that outlives the operations. It grows while operations run there, #v faster with more of them#! and #v slower above half strength#!, and decays once they stop — #v half as fast#! at funding level [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_net_maintain_funding_level')|0] or above. A burned operation costs its network #R [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_net_burn_loss')|0]#! strength.\n\nA strong network lowers the detection risk of every operation in that country (up to #G -[JournalEntry.GetCountry.MakeScope.ScriptValue('covert_net_detect_reduction_max_display')|1]#! points before efficiency) and gives a new operation there a head start of up to #G [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_net_head_start_max')|0]#! months.\n\nA strong network also reports on the service it has penetrated: from strength #v [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_net_intel_tier_1_strength')|0]#! its [concept_intelligence_capacity] and technology count, from #v [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_net_intel_tier_2_strength')|0]#! how many operations it is running against us - the only way to learn of an operation our counterintelligence has not caught. The marker on a network's strength bar sits where the next part of its report starts."
 je_iw_net_row_benefit:0 "Head start for a new operation: #v [ScriptContainer.GetVariableValue('iw_net_head_start_offer')|0]#! months"
 je_iw_net_row_intel_none:0 "Their service: nothing yet"
 je_iw_net_row_intel_ops:0 "Their operations against us: #v [ScriptContainer.GetVariableValue('iw_net_intel_ops')|0]#! running"
 je_iw_net_row_intel_ops_locked:0 "Their operations against us: not yet known"
 je_iw_net_row_intel_ops_tooltip:0 "Counted by our agents inside their service at the last monthly report, whether or not our own counterintelligence has noticed any of them. Every phase counts, from an operation's first month.\n\nIt says how many, not which operations or what they are doing. Our counterintelligence still has to catch each one to expose it."
 je_iw_net_row_intel_service:0 "Their service: #v [ScriptContainer.GetVariableValue('iw_net_intel_ic')|0]#! [concept_intelligence_capacity] (ours [JournalEntry.GetCountry.MakeScope.ScriptValue('intelligence_capacity_total')|0]), #v [ScriptContainer.GetVariableValue('iw_net_intel_techs')|0]#! technologies (ours [JournalEntry.GetCountry.MakeScope.ScriptValue('covert_techs_researched_display')|0])"
 je_iw_net_row_intel_service_tooltip:0 "What our agents inside their service reported at the last monthly report; our own figures are today's.\n\nAt strength #v [GetPlayer.MakeScope.ScriptValue('covert_net_intel_tier_2_strength')|0]#! the network also counts the [concept_covert_operations] they are running against us. A burn that drops it below a threshold loses that part of the report at once."

 je_colonial_empire_drift_base:0 "Base decline"
 je_colonial_empire_drift_base_tt:0 "Every colonial empire loses some stability each month as the age of empire ends."
 je_colonial_empire_drift_cap:0 "Monthly limit"
 je_colonial_empire_drift_cap_tt:0 "Stability moves at most ±[JournalEntry.GetCountry.MakeScope.ScriptValue('colonial_stability_drift_cap')|2] a month either way. This is what the limit takes off the rows above."
 je_colonial_empire_drift_domestic:0 "War, revolution and [concept_turmoil]"
 je_colonial_empire_drift_domestic_tt:0 "Being at war, a revolution, and [concept_turmoil] at home all drain stability."

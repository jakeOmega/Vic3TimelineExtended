 je_civil_rights:0 "Civil Rights Movement"
 je_civil_rights_complete_bar_tt:0 "Movement support reaches 100"
 je_civil_rights_desc:0 "A [concept_political_movement] demanding equal rights for discriminated communities has taken root. How we respond will shape our nation's character."
 je_civil_rights_reason:0 "Discriminated communities are demanding equal treatment under the law."
 je_civil_rights_status_active:0 "The movement is on the front page. Marches draw crowds, and the cabinet is forced to take public positions. Compromise proposals circulate; some cities have already moved on their own."
 je_civil_rights_status_growing:0 "Sit-ins and chapter networks are spreading. Sympathetic editorials are starting to outnumber dismissive ones. Pressure is building, but the levers of power haven't moved."
 je_civil_rights_status_imminent:0 "Reform is at the door. Mass mobilization meets cabinet-level proposals; a march on the capital is a question of weeks, not years. The country is choosing what it will be."
 je_civil_rights_status_marginal:0 "The movement is marginal — small chapters, scattered leafleting, and a press that still calls them [Concept('concept_agitator', 'agitators')]. Most of the country has not yet decided this is a story."
 je_civil_rights_status_pressuring:0 "The movement now sets the tempo. Legislators position themselves around the next vote. Backlash organizes openly, and confrontations sharpen. The status quo is no longer cheap to defend."

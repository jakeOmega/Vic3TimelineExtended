 je_un_chamber_council_full:0 "All five permanent seats on the [concept_un_security_council] are held. A seat falls vacant when its holder leaves the UN, spends ten years below [Concept('concept_great_power', 'Great Power')] rank, or is expelled by a 2/3 vote; it then goes to the [Concept('concept_great_power', 'Great Power')] member with the most [concept_prestige] that holds none."
 je_un_chamber_council_in_line_entry:0 "#Y In line for a seat#! — [THIS.GetCountry.GetName] ([THIS.ScriptValue('un_prestige_order_value')|0] [concept_prestige])"
 je_un_chamber_council_member_entry:0 "#v Permanent member#! — [THIS.GetCountry.GetName]"
 je_un_chamber_council_no_un:0 "No United Nations exists, so no one holds a permanent seat on a [concept_un_security_council]."
 je_un_chamber_council_open:0 "[THIS.ScriptValue('un_permanent_seat_count')|0] of the 5 permanent seats on the [concept_un_security_council] are held. At the start of each month an open seat goes to the [Concept('concept_great_power', 'Great Power')] member with the most [concept_prestige] that holds none."
 je_un_chamber_council_signing:0 "The founder took its permanent seat on the [concept_un_security_council] at the founding. The other seats stay open until the signing period closes in #v [THIS.ScriptValue('un_seat_signing_months_left_display')|0]#! months, and then go to the [Concept('concept_great_power', 'Great Power')] members with the most [concept_prestige] that hold none — not to whoever signed first."
 je_un_chamber_country_gone:0 "a former member"
 je_un_chamber_details_header:0 "Voting Details"
 je_un_chamber_docket_intro:0 "The Assembly takes up real situations as they arise, the gravest first and at most one every three months, and sends each to the countries it concerns. A wronged country is asked first; business with no party goes to a human delegation first when one qualifies."
 je_un_chamber_docket_last_1:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold a nuclear strike#! by [GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName]."
 je_un_chamber_docket_last_10:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold the end of a war between great powers#!."
 je_un_chamber_docket_last_11:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold a charter the organisation has outgrown#!."
 je_un_chamber_docket_last_12:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold a trade embargo involving [GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName]#!."
 je_un_chamber_docket_last_13:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold Assembly business#! with no crisis behind it."
 je_un_chamber_docket_last_14:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold a banking contagion in [GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName]#!, and an offer from the emergency lending facility."
 je_un_chamber_docket_last_2:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold a war of aggression#! waged by [GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName]."
 je_un_chamber_docket_last_3:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold an exposed covert operation#! run by [GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName]."
 je_un_chamber_docket_last_4:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold the collapse of [GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName]#!, and a call for peacekeepers."
 je_un_chamber_docket_last_5:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold famine in [GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName]#!, and an appeal for aid."
 je_un_chamber_docket_last_6:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold the first nuclear weapon of [GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName]#!, and the Non-Proliferation Treaty."
 je_un_chamber_docket_last_7:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold a warming threshold crossed#!, and the Climate Accord."
 je_un_chamber_docket_last_8:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold the collapse of the colonial empire of [GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName]#!, and decolonization."
 je_un_chamber_docket_last_9:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold humanity reaching another world#!, and space cooperation."
 je_un_chamber_docket_last_other:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: a matter since overtaken by events."
 je_un_chamber_docket_next:0 "  The next item can be taken up in #v [GetGlobalVariable('un_docket_months_left').GetValue|0]#! month(s)."
 je_un_chamber_docket_none:0 "  Nothing has been taken up yet."
 je_un_chamber_docket_open:0 "  The docket is open: the next situation grave enough will be taken up."
 je_un_chamber_dues_article_19:0 "#bold [concept_un_dues]:#! #R withheld, and our vote is lost (Article 19).#! We are #v [THIS.ScriptValue('un_disp_arrears_months')|0]#! months in arrears and owe @money!#v [THIS.ScriptValue('un_disp_arrears_owed')|D]#!. Until we pay, we cast no ballot, table no resolution, and are not counted in a two-thirds supermajority."
 je_un_chamber_dues_budget:0 "#lore The paying members fund the United Nations with @money![THIS.ScriptValue('un_disp_budget_weekly')|D] a week. Members holding [THIS.ScriptValue('un_disp_arrears_share_pct')|0]% of the members' GDP withhold their dues, which costs the funding pillar [THIS.ScriptValue('un_disp_arrears_funding_cost')|1] points.#!"
 je_un_chamber_dues_carried:0 "  Our assessment includes the seats of #v [THIS.ScriptValue('un_carried_seat_count')|0]#! subject members whose representation is suspended. While we pay, they keep the benefits of membership."
 je_un_chamber_dues_none:0 "#bold [concept_un_dues]:#! none. A Moribund United Nations assesses nothing."
 je_un_chamber_dues_owed_outside:0 "We left owing the United Nations @money!#v [THIS.ScriptValue('un_disp_arrears_owed')|D]#! in [concept_un_dues]. If we rejoin, we rejoin in arrears."
 je_un_chamber_dues_paying:0 "#bold [concept_un_dues]:#! #v [THIS.ScriptValue('un_disp_dues_rate_pct')|1]%#! of our GDP a year at this tier, @money!#v [THIS.ScriptValue('un_dues_weekly_value')|D]#! a week. #G Paid in full.#!"
 je_un_chamber_dues_suspended:0 "#bold [concept_un_dues]:#! none of our own while our representation is suspended. Our overlord is assessed for our seat if it is represented."
 je_un_chamber_dues_withheld:0 "#bold [concept_un_dues]:#! #R withheld.#! We are #v [THIS.ScriptValue('un_disp_arrears_months')|0]#! months in arrears and owe @money!#v [THIS.ScriptValue('un_disp_arrears_owed')|D]#!. In #v [THIS.ScriptValue('un_disp_article_19_months_left')|0]#! more months we lose our vote in the [concept_un_general_assembly] (Article 19)."
 je_un_chamber_dues_withheld_moribund:0 "#bold [concept_un_dues]:#! #R withheld.#! A Moribund United Nations assesses nothing, so nothing more is owed, but the @money!#v [THIS.ScriptValue('un_disp_arrears_owed')|D]#! from before still stands."
 je_un_chamber_exposure_case:0 "A case strength of #v [THIS.ScriptValue('un_case_strength')|0]#! out of 100 — infamy #v [THIS.ScriptValue('un_case_infamy_term')|0]#!, aggression #v [THIS.ScriptValue('un_disp_dos_aggression')|0]#!, defiance #v [THIS.ScriptValue('un_disp_dos_defiance')|0]#!, violated mandates #v [THIS.ScriptValue('un_disp_dos_violation')|0]#!, covert operations #v [THIS.ScriptValue('un_disp_dos_covert')|0]#!, nuclear use #v [THIS.ScriptValue('un_disp_dos_nuclear')|0]#!."
 je_un_chamber_exposure_clean:0 "#G Our record supports no punitive resolution against us.#! A condemnation needs 30, sanctions 50, a military mandate 60."
 je_un_chamber_exposure_condemn:0 "#Y Our record would support a condemnation of us#! (30 or more). Sanctions need 50, a military mandate 60."
 je_un_chamber_exposure_header:0 "Our Exposure"
 je_un_chamber_exposure_help:0 "#lore The record fades by half every five years. It grows with every war we begin without a mandate (more against a greater power), every binding resolution we refuse, every sanctions regime we bust, every ruling of the court we defy, every mandate we abuse, every severe covert operation of ours that is exposed, and every nuclear strike. Infamy counts as well, up to 50. A country with a clean record cannot be censured, sanctioned or made the target of a mandate at all.#!"
 je_un_chamber_exposure_mandate:0 "#R Our record would support an authorized military mandate against us#! (60 or more) — and sanctions and a condemnation too."
 je_un_chamber_exposure_no_un:0 "No United Nations exists to keep a record on us."
 je_un_chamber_exposure_sanctions:0 "#R Our record would support sanctions against us#! (50 or more) — and a condemnation. A military mandate needs 60."
 je_un_chamber_exposure_standing_case:0 "#R A standing case of [THIS.ScriptValue('un_case_standing_value')|0]:#! a supranational United Nations holds every outsider of [concept_major_power] rank, and every outsider with a nuclear programme or arsenal, answerable for staying out. Joining ends it."
 je_un_chamber_grounds:0 "  #bold Grounds:#! the case against the target stood at #v [THIS.Var('un_res_case').GetValue|0]#! when it was tabled; this topic needs #v [THIS.ScriptValue('un_res_case_threshold')|0]#!."

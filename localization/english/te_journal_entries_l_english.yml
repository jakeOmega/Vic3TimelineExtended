 je_strategic_reserve_ov_hub_staffed:0 "Hub Operating"
 je_strategic_reserve_ov_hub_tt:0 "#bold [GetBuildingType('building_strategic_reserve_hub').GetName]#!\n#bold Staffing:#! [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_hub_staffing')|%0]\nThe hub buys and sells only while it is fully staffed. Below full [concept_occupancy] it trades nothing and cannot replace what decays, so every good reads Blocked."

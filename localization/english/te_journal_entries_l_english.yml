 je_nuclear_program_widget_stockpile_value:0 "#N [JournalEntry.GetCountry.MakeScope.ScriptValue('nuclear_program_display_stockpile')|0]#!"
 je_post_scarcity:0 "Post-Scarcity Transition"
 je_post_scarcity_desc:0 "Automation and AI render traditional labor obsolete. Decide what comes next as the old economic order ends."
 je_post_scarcity_reason:0 "Automation and AI are making traditional labor obsolete. Society must decide what comes next as the old economic order crumbles."
 je_post_scarcity_status_early:0 "#Y The age of automation dawns.#! Mass unemployment looms as machines replace workers across all sectors."
 je_post_scarcity_status_transition:0 "#G Post-scarcity technology exists.#! The final transition to a new economic paradigm awaits political will."
 je_post_scarcity_status_ubi:0 "#G Universal Basic Income is in place,#! but the full transition to post-scarcity remains distant."
 je_space_race_interstellar_probe:0 "Interstellar Probe"
 je_space_race_interstellar_probe_completion_header:0 "Probe Leaves the Solar System"
 je_space_race_interstellar_probe_desc:0 "Build and launch a probe capable of reaching another star system."
 je_space_race_interstellar_probe_failure_header:0 "Interstellar Program Suspended"
 je_space_race_interstellar_probe_first_outcome_header:0 "If we send the first probe beyond the Sun"
 je_space_race_interstellar_probe_first_outcome_tt:0 "An interstellar mission resets the [concept_prestige] and innovation ceiling — durable research [concept_throughput], durable influence, and a long shadow of [concept_cultural_pull]."
 je_space_race_interstellar_probe_on_completion_header:0 "Our probe sails beyond the Sun"
 je_space_race_interstellar_probe_on_failure_header:0 "Our interstellar mission is on hold"
 je_space_race_interstellar_probe_reason:0 "We are developing a probe capable of reaching another star system, pushing the boundaries of what is possible."
 je_space_race_interstellar_probe_setback_header:0 "If the interstellar program is cancelled"
 je_space_race_interstellar_probe_setback_tt:0 "Without an active orbital program, the interstellar goal is shelved and committed resources written off."
 je_space_race_interstellar_probe_status:0 "A probe built to leave the solar system entirely and reach another star. The programme's approach, funding and pace are in the panel below."
 je_space_race_interstellar_probe_status_ambitious:0 "#bold Approach:#! Ambitious\n#bold Status:#! Aggressive development of interstellar propulsion systems. High risk of mission failure, but the probe could launch years ahead of schedule."
 je_space_race_interstellar_probe_status_default:0 "#bold Status:#! Designing and building a probe to reach Alpha Centauri. Select an approach to proceed."
 je_space_race_interstellar_probe_status_safe:0 "#bold Approach:#! Safe\n#bold Status:#! Methodical development and testing of interstellar drive systems. Slower but reliable."
 je_space_race_interstellar_probe_subsequent_outcome_header:0 "If we follow others into the void"
 je_space_race_interstellar_probe_subsequent_outcome_tt:0 "Even a follow-on interstellar probe earns substantial [concept_prestige], research speed, and [concept_cultural_pull]."
 je_space_race_interstellar_results:0 "Interstellar Probe: Awaiting Data"
 je_space_race_interstellar_results_completion_header:0 "Signal From the Stars"
 je_space_race_interstellar_results_desc:0 "Await scientific data from the interstellar probe — what the probe finds is genuinely uncertain."
 je_space_race_interstellar_results_on_completion_header:0 "Our probe sends back its findings"
 je_space_race_interstellar_results_outcome_header:0 "What the probe finds is yet to be known"
 je_space_race_interstellar_results_outcome_tt:0 "After 132 months in transit, the probe transmits its first scientific data. What it sees out there is genuinely uncertain — dead worlds, astrophysical wonders, anomalous signals, even the rare possibility of contact. The discovery, whatever it is, will reshape our research and our place in the world."
 je_space_race_interstellar_results_reason:0 "Our interstellar probe is transmitting data from the void between stars. The results could reshape our understanding of the universe."
 je_space_race_interstellar_results_status:0 "Our probe is en route to Alpha Centauri. At best speed, the journey will take five to six years. Electromagnetic transmissions must then cross 4.37 light-years back to Earth. We wait."
 je_space_race_mars_landing:0 "Mars Landing"
 je_space_race_mars_landing_completion_header:0 "Boots on Mars"
 je_space_race_mars_landing_desc:0 "Send a crewed mission to land on Mars."
 je_space_race_mars_landing_failure_header:0 "Mars Program Suspended"
 je_space_race_mars_landing_first_outcome_header:0 "If our flag flies first on Mars"
 je_space_race_mars_landing_first_outcome_tt:0 "The first crewed Mars landing is the achievement of the century. [concept_prestige], research speed, and [concept_cultural_pull] all leap forward."
 je_space_race_mars_landing_on_completion_header:0 "Humanity walks on Mars"
 je_space_race_mars_landing_on_failure_header:0 "Our Mars ambitions are on hold"
 je_space_race_mars_landing_reason:0 "The red planet beckons. A crewed Mars landing would be humanity's greatest achievement in space exploration."
 je_space_race_mars_landing_setback_header:0 "If the Mars program is cancelled"
 je_space_race_mars_landing_setback_tt:0 "Without an active orbital program, the Mars landing goal is shelved and committed resources written off."
 je_space_race_mars_landing_status:0 "A crewed landing on Mars, and the return trip that makes it worth doing. The programme's approach, funding and pace are in the panel below."
 je_space_race_mars_landing_status_ambitious:0 "#bold Approach:#! Ambitious\n#bold Status:#! Crews are training for the long transit to Mars. Every test brings us closer: and every failure could set us back years."
 je_space_race_mars_landing_status_default:0 "#bold Status:#! We have begun planning for a crewed Mars mission. Select an approach to begin making progress."
 je_space_race_mars_landing_status_direct:0 "#bold Strategy:#! Direct Landing\nWe will attempt a bold direct landing on Mars, prioritizing speed over caution."
 je_space_race_mars_landing_status_orbital_first:0 "#bold Strategy:#! Orbital-First\nWe will establish orbital [concept_infrastructure] around Mars before attempting a surface landing."
 je_space_race_mars_landing_status_robotic:0 "#bold Strategy:#! Robotic Precursors\nRobots will prepare a landing site and cache supplies before human arrival."
 je_space_race_mars_landing_status_safe:0 "#bold Approach:#! Safe\n#bold Status:#! Careful incremental testing of life support, propulsion, and landing systems for the Mars transit."
 je_space_race_mars_landing_subsequent_outcome_header:0 "If we follow others to Mars"
 je_space_race_mars_landing_subsequent_outcome_tt:0 "Even a follow-on Mars expedition delivers major [concept_prestige] and research gains, plus durable cultural reach."
 je_space_race_moon_base:0 "Moon Base"
 je_space_race_moon_base_completion_header:0 "Permanent Moon Base Established"
 je_space_race_moon_base_desc:0 "Establish a permanent crewed outpost on the lunar surface."
 je_space_race_moon_base_failure_header:0 "Lunar Base Program Suspended"
 je_space_race_moon_base_first_outcome_header:0 "If our flag flies first on a permanent Moon base"
 je_space_race_moon_base_first_outcome_tt:0 "A continuously crewed lunar outpost cements us as the era's space hegemon — [concept_prestige], research, influence, and [concept_cultural_pull] all swell."
 je_space_race_moon_base_on_completion_header:0 "Our outpost on the Moon is permanent"
 je_space_race_moon_base_on_failure_header:0 "Our lunar base is on hold"
 je_space_race_moon_base_reason:0 "A permanent lunar outpost will serve as a stepping stone for deeper space exploration and a symbol of our civilization's ambition."
 je_space_race_moon_base_setback_header:0 "If the Moon base program is cancelled"
 je_space_race_moon_base_setback_tt:0 "Without an active orbital program, the lunar base goal is shelved and committed resources written off."
 je_space_race_moon_base_status:0 "A permanently crewed station on the lunar surface. The programme's approach, funding and pace are in the panel below."
 je_space_race_moon_base_status_ambitious:0 "#bold Approach:#! Ambitious\n#bold Status:#! Rapid-deployment habitat modules are being launched in quick succession. The base takes shape with breathtaking speed."
 je_space_race_moon_base_status_default:0 "#bold Status:#! With a successful landing behind us, we can now establish a permanent lunar presence. Select an approach."
 je_space_race_moon_base_status_industrial:0 "#bold Purpose:#! Industrial Facility\nThe lunar base focuses on mining helium-3 and rare minerals for export."
 je_space_race_moon_base_status_military_purpose:0 "#bold Purpose:#! Military Installation\nThe lunar base provides strategic observation and force projection capabilities."
 je_space_race_moon_base_status_safe:0 "#bold Approach:#! Safe\n#bold Status:#! Each module is thoroughly tested on Earth before launch. The base grows slowly but reliably."
 je_space_race_moon_base_status_scientific:0 "#bold Purpose:#! Scientific Outpost\nThe lunar base is dedicated to pure research and international collaboration."
 je_space_race_moon_base_subsequent_outcome_header:0 "If we follow others to a Moon base"
 je_space_race_moon_base_subsequent_outcome_tt:0 "Even a follow-on lunar base earns serious [concept_prestige] and research benefits, with a steady trickle of cultural and influence gains."
 je_space_race_moon_landing:0 "Moon Landing"
 je_space_race_moon_landing_completion_header:0 "Boots on the Moon"
 je_space_race_moon_landing_desc:0 "Land humans on the Moon and return them safely to Earth."
 je_space_race_moon_landing_failure_header:0 "Lunar Program Suspended"
 je_space_race_moon_landing_first_outcome_header:0 "If we are first on the Moon"
 je_space_race_moon_landing_first_outcome_tt:0 "Boots on lunar regolith, broadcast worldwide, becomes the defining national achievement of the era. Massive [concept_prestige], research [concept_throughput], and [concept_cultural_pull] follow."
 je_space_race_moon_landing_on_completion_header:0 "Humanity walks on the Moon"
 je_space_race_moon_landing_on_failure_header:0 "Our lunar ambitions are on hold"
 je_space_race_moon_landing_reason:0 "The ultimate prize of the [concept_space_race]: landing humans on the Moon and returning them safely to Earth."
 je_space_race_moon_landing_setback_header:0 "If the Moon program is grounded"
 je_space_race_moon_landing_setback_tt:0 "Without an active orbital program, the lunar goal is shelved and committed resources are written off."
 je_space_race_moon_landing_status:0 "Boots, or at least a lander, on the surface of the Moon. The programme's approach, funding and pace are in the panel below."
 je_space_race_moon_landing_status_ambitious:0 "#bold Approach:#! Ambitious\n#bold Status:#! The lunar lander is being fast-tracked through testing. Bold decisions and compressed timelines push us toward the Moon."
 je_space_race_moon_landing_status_default:0 "#bold Status:#! We are planning a crewed mission to the Moon's surface. Select an approach and landing site."
 je_space_race_moon_landing_status_equatorial:0 "#bold Landing Site:#! Equatorial Plain (Low Risk)\n#bold Approach:#! Methodical survey and landing at a well-mapped equatorial site."
 je_space_race_moon_landing_status_far_side:0 "#bold Landing Site:#! Far Side of the Moon\n#bold Approach:#! Landing where no radio from Earth can reach: ideal for deep-space observation."
 je_space_race_moon_landing_status_safe:0 "#bold Approach:#! Safe\n#bold Status:#! Robotic precursor missions map the surface in detail before any crew is committed."
 je_space_race_moon_landing_status_shackleton:0 "#bold Landing Site:#! Shackleton Crater (High Risk)\n#bold Approach:#! Targeting the permanently shadowed south polar crater: treacherous terrain, but immense scientific potential."
 je_space_race_moon_landing_status_tranquility:0 "#bold Landing Site:#! Sea of Tranquility\n#bold Approach:#! Targeting a flat, iconic expanse for maximum symbolic impact."
 je_space_race_moon_landing_subsequent_outcome_header:0 "If we follow others to the Moon"
 je_space_race_moon_landing_subsequent_outcome_tt:0 "A late-arriving lunar program still reshapes how the world sees us — meaningful [concept_prestige], research speed, and cultural reach, even without the historic first."
 je_space_race_orbital:0 "Orbital Flight"
 je_space_race_orbital_completion_header:0 "Earth Orbit Achieved"
 je_space_race_orbital_desc:0 "Place a satellite or capsule into stable orbit around Earth."
 je_space_race_orbital_failure_header:0 "Orbital Program Suspended"
 je_space_race_orbital_first_outcome_header:0 "If we are first to orbit Earth"
 je_space_race_orbital_first_outcome_tt:0 "Putting the first spacecraft into orbit reframes our nation as the leading scientific power. [concept_prestige], innovation, and [concept_cultural_pull] all surge."
 je_space_race_orbital_on_completion_header:0 "Our spacecraft circles the Earth"
 je_space_race_orbital_on_failure_header:0 "Our orbital ambitions are on hold"
 je_space_race_orbital_reason:0 "Having achieved suborbital flight, our engineers are working to put a satellite or crewed capsule into stable orbit around the Earth."
 je_space_race_orbital_setback_header:0 "If the orbital program is grounded"
 je_space_race_orbital_setback_tt:0 "Without an active orbital program, the goal is shelved and current investments written off. Restore the program to try again."
 je_space_race_orbital_status:0 "A satellite, and then a crew, in a stable orbit around the Earth. The programme's approach, funding and pace are in the panel below."
 je_space_race_orbital_status_ambitious:0 "#bold Approach:#! Ambitious\n#bold Status:#! Accelerated testing of orbital insertion systems. The race to put a person in orbit is on."
 je_space_race_orbital_status_civilian:0 "#bold Astronaut:#! Civilian Volunteer\nOur first orbital mission will carry a civilian, demonstrating that space belongs to all humanity."
 je_space_race_orbital_status_default:0 "#bold Status:#! With suborbital flight mastered, we now set our sights on a full orbital mission. Select an approach."
 je_space_race_orbital_status_military:0 "#bold Astronaut:#! Military Test Pilot\nA military pilot will fly our first orbital mission, bringing precision and discipline."
 je_space_race_orbital_status_safe:0 "#bold Approach:#! Safe\n#bold Status:#! Methodical testing of heat shields, life support, and orbital mechanics. Each step carefully validated."
 je_space_race_orbital_status_scientist:0 "#bold Astronaut:#! Scientist-Astronaut\nA scientist will fly our first orbital mission, turning it into a research expedition."
 je_space_race_orbital_subsequent_outcome_header:0 "If another nation orbits first"
 je_space_race_orbital_subsequent_outcome_tt:0 "A second-place orbital flight is still a major engineering feat. Our scientific community gains credibility, even if the headlines have already been claimed."
 je_space_race_probe:0 "Deep-Space Probe"
 je_space_race_probe_completion_header:0 "Probe Reaches Its Target"
 je_space_race_probe_desc:0 "Dispatch unmanned probes to nearby worlds and the asteroid belt."
 je_space_race_probe_failure_header:0 "Probe Program Suspended"
 je_space_race_probe_first_outcome_header:0 "If our probe arrives first"
 je_space_race_probe_first_outcome_tt:0 "Returning the first interplanetary data is a generational scientific [concept_coup]. Our research culture surges and our [concept_prestige] carries the discovery."
 je_space_race_probe_on_completion_header:0 "Our probe sends back data from another world"
 je_space_race_probe_on_failure_header:0 "Our planetary probe is on hold"
 je_space_race_probe_reason:0 "With orbital capability proven, we can now send unmanned probes to nearby worlds and the asteroid belt, gathering data for the next phase of the [concept_space_race]."
 je_space_race_probe_setback_header:0 "If the probe program is cancelled"
 je_space_race_probe_setback_tt:0 "Without an active orbital program, the planetary probe goal is shelved and committed resources written off."
 je_space_race_probe_status:0 "An unmanned probe sent out past the inner planets. The programme's approach, funding and pace are in the panel below."
 je_space_race_probe_status_ambitious:0 "#bold Approach:#! Ambitious\n#bold Status:#! The probe is being built to an aggressive timeline with cutting-edge but unproven instruments."
 je_space_race_probe_status_asteroid:0 "#bold Target:#! Asteroid Belt\nOur probe will chart future industrial routes through the belt and survey promising resource bodies."
 je_space_race_probe_status_default:0 "#bold Status:#! We are designing an unmanned probe mission beyond Earth orbit. Select an approach."
 je_space_race_probe_status_mars:0 "#bold Target:#! Mars\nOur probe will search for evidence of water and past life on the red planet."
 je_space_race_probe_status_safe:0 "#bold Approach:#! Safe\n#bold Status:#! Proven instrument packages and conservative flight plans ensure the probe reaches its destination intact."
 je_space_race_probe_status_venus:0 "#bold Target:#! Venus\nOur probe will study Venus's atmosphere and greenhouse dynamics."
 je_space_race_probe_subsequent_outcome_header:0 "If others reach the target before us"
 je_space_race_probe_subsequent_outcome_tt:0 "Even a follow-on probe expands our knowledge of the inner solar system and earns modest [concept_prestige] and research benefits."
 je_space_race_solar_colonization:0 "Solar System Colonization"
 je_space_race_solar_colonization_desc:0 "Establish permanent settlements throughout the solar system."
 je_space_race_solar_colonization_reason:0 "The colonization of the solar system represents the next great chapter for our civilization, establishing permanent settlements beyond Earth."
 je_space_race_solar_colonization_status:0 "Permanent settlements, one world at a time, across the solar system. Each completed colony resets the bar and claims its world for good."
 je_space_race_solar_colonization_status_complete:0 "#bold Solar System Colonization Complete#!\nEvery colony across the solar system has been established. Our civilization's presence spans from Mercury to the Kuiper Belt."
 je_space_race_solar_colonization_status_stage1:0 "#bold Stage 1: Inner Solar System#!\nEstablishing colonies on Mars and the asteroid belt."
 je_space_race_solar_colonization_status_stage2:0 "#bold Stage 2: Gas Giant Frontier#!\nColonizing Jupiter's moons and the upper atmosphere of Venus."
 je_space_race_solar_colonization_status_stage3:0 "#bold Stage 3: Mid-System Expansion#!\nEstablishing footholds on Mercury and Saturn's moons."
 je_space_race_solar_colonization_status_stage4:0 "#bold Stage 4: Ice Giant Frontier#!\nPushing outward to the moons of Uranus and Neptune."
 je_space_race_solar_colonization_status_stage5:0 "#bold Stage 5: Kuiper Belt & Beyond#!\nThe final frontier: dwarf planets and trans-Neptunian objects."
 je_space_race_suborbital:0 "Suborbital Flight"
 je_space_race_suborbital_completion_header:0 "Edge of Space Reached"
 je_space_race_suborbital_desc:0 "Develop rocketry capable of reaching the edge of space."
 je_space_race_suborbital_failure_header:0 "Suborbital Program Suspended"
 je_space_race_suborbital_first_outcome_header:0 "If we are first across the Kármán line"
 je_space_race_suborbital_first_outcome_tt:0 "Our nation will be remembered as the first to touch space — a generational propaganda [concept_coup], fast-tracked innovation, and a magnetic pull on the world's imagination."
 je_space_race_suborbital_on_completion_header:0 "We have flown to the edge of space"
 je_space_race_suborbital_on_failure_header:0 "Our suborbital ambitions are on hold"
 je_space_race_suborbital_reason:0 "Our scientists are developing rocketry capable of reaching the edge of space. A successful suborbital flight will demonstrate our nation's technological prowess."
 je_space_race_suborbital_setback_header:0 "If the program is grounded"
 je_space_race_suborbital_setback_tt:0 "Without an active orbital program, the Suborbital Flight goal is shelved and any committed resources are written off. Restore the program to try again."
 je_space_race_suborbital_status:0 "Rocketry good enough to touch the edge of space. The programme's approach, funding and pace are in the panel below."
 je_space_race_suborbital_status_ambitious:0 "#bold Approach:#! Ambitious\n#bold Status:#! Rapid test launches with human-rated payloads. Fortune favors the bold."
 je_space_race_suborbital_status_default:0 "#bold Status:#! Our rocketry program is ready to reach for the skies. Select an approach to begin the [concept_space_race]."
 je_space_race_suborbital_status_safe:0 "#bold Approach:#! Safe\n#bold Status:#! Careful, incremental test flights building toward the edge of space."
 je_space_race_suborbital_subsequent_outcome_header:0 "If others reach space before us"
 je_space_race_suborbital_subsequent_outcome_tt:0 "Even a follow-up flight matters. Our scientific community gains credibility and a modest cultural lift, but the headlines belong to whoever flew first."

#
# JOURNAL_ENTRIES
#
 je_augmentation_status_banned:0 "Augmentation technology is banned or strictly forbidden. Society has rejected mechanical enhancement of the human body."
 je_augmentation_status_mandatory:0 "Augmentation is mandatory for all citizens. The state enforces technological enhancement as a civic duty."
 je_augmentation_status_medical:0 "Augmentation is permitted only for medical purposes. Therapeutic prosthetics and corrective implants are allowed, but elective enhancement is prohibited."
 je_augmentation_status_regulated:0 "Augmentation is legal but subject to government regulation. Citizens may enhance themselves within approved guidelines."
 je_augmentation_status_unrestricted:0 "The augmentation market operates freely with no government oversight. Any enhancement is available to those who can afford it."
 je_banking_cycle:0 "[GetPlayer.GetCustom('te_banking_cycle_title')]"
 je_banking_cycle_command_economy:0 "Logistics & Allocation Gauge"
 je_banking_cycle_cooperative_ownership:0 "Cooperative Finance Dashboard"
 je_banking_cycle_desc:0 "Steer the boom-bust cycle through the policy rate, prudential regulation, and bailouts to keep credit flowing without inflating bubbles."
 je_banking_cycle_reason:0 "[ROOT.GetCountry.GetCustom('te_banking_cycle_reason')]"
 je_banking_cycle_reason_command_economy:0 "In a Command Economy the cycle should be read as a logistics coordination gauge: momentum and [concept_bubble_pressure] track supply-chain synchronization and administrative strain rather than investor confidence. Use plan revisions, emergency allocations and production target reductions to resolve bottlenecks."
 je_banking_cycle_reason_cooperative_ownership:0 "Under Cooperative Ownership the cycle tracks the balance between worker consumption and capital availability. High [concept_bubble_pressure] reflects excessive payouts and low reinvestment; interventions include mutual aid funds and council directives to prioritize long-term viability."
 je_banking_cycle_reason_market:0 "In a Market Economy the [concept_banking_cycle] should be read as a liquidity and sentiment gauge: momentum captures investor-driven growth, while [concept_bubble_pressure] signals overvaluation and systemic fragility. Steer the cycle with the policy rate, macroprudential tightening, targeted bailouts, and open-market operations; [concept_fx_swap_lines] are arranged with another country by treaty. Apply measured regulatory tightening and liquidity drains to cool speculative excess; when contagion risk appears, deploy guarantees, asset-relief, or emergency liquidity to preserve credit and the real economy. Expect political trade-offs — some tools slow growth or strain public finances."
 je_banking_cycle_title_market:0 "Boom & Bust Cycle"
 je_ch_board_row_hint_tt:0 "#lore The bracketed figure is the change since the last recount.#!"
 je_ch_how_benchmark:0 "A country with this journal entry whose share trails the leading cultural power's by more than a few points carries the [concept_foreign_cultural_benchmark]: its people measure their government against the leader's, and [concept_legitimacy] falls. The wider the gap, the larger the loss. The leader never carries it. While we do, the overview shows it."
 je_ch_how_board:0 "The ten countries with the largest [concept_cultural_pull_share], recounted about twice a year and after every war. The bracketed figure is the change since the last recount; hover a row for that country's components at the recount. The arrow marks us, and outside the top ten our own rank follows the list."
 je_ch_how_header:0 "How Cultural Hegemony Works"
 je_ch_how_models:0 "The leading cultural power's model is its [concept_ch_exported_model]. In every country that carries the [concept_foreign_cultural_benchmark], the political movements matching it grow more active and attract more pops. The push is nothing while the model's share of world culture is small, and grows with it; the overview shows the current model and its push."
 je_ch_how_programmes:0 "Funding and every programme need [GetLawType('law_ministry_of_culture').GetName]. If it is repealed, funding drops to zero and every programme stops at the next monthly update. Each funding step adds pull for a weekly cost that grows with our GDP. The programmes run until we end them, and Global Media Campaign and Cultural Protectionism exclude each other. Hover a programme's name for what it gives while it runs, and a button for what it would change and anything still missing."
 je_ch_how_pull:0 "Each line is one of the [concept_cultural_pull_components]; hover its name for how it is scored. Lines that add nothing are left out. Their sum, raised by the [Concept('concept_ch_modifier_bonus','Pull Multiplier')], is our [concept_cultural_pull_raw_score]."
 je_ch_how_share:0 "Our [concept_cultural_pull_share] is our raw [concept_cultural_pull] as a percentage of every country's raw pull added together, so it stays meaningful as the world grows. The world total is recounted about twice a year and after every war, so the share can step without our own output changing. The share sets our [concept_ch_influence_tier] and the strength of the Cultural Hegemony modifier. The arrow beside it compares this month's reading with last month's."

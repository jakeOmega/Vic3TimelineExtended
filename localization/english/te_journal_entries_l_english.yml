 je_nuclear_ov_taboo_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_disp_taboo')|0]#! → [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_disp_taboo_target')|0] ([JournalEntry.GetCountry.MakeScope.ScriptValue('nd_disp_taboo_step')|+2]/mo)"
 je_nuclear_ov_warheads_label:0 "Warheads #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_stockpile')|0]#!"
 je_nuclear_ov_warheads_tt:0 "#tooltip_header Warheads#!\n$TOOLTIP_DELIMITER$\nWe hold #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_stockpile')|0]#!, and the world estimates #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_public_estimate')|0]#!. Other countries re-observe an arsenal once a year, with an error, and learn the truth after a test or a strike.\n\nWarheads are what a nuclear strike spends, one each; a disarmament settlement takes all of them."
 je_nuclear_program:0 "Nuclear Weapons"
 je_nuclear_program_desc:0 "Build nuclear weapons, decide when we say we will use them and how ready our forces stand, and live through the crises they bring — the threats we make and the ones made against us."
 je_nuclear_program_reason:0 "A weapons programme is the most expensive thing a state can build out of pure research, and whoever finishes first changes every calculation made about them. Once built, an arsenal is not only a stock of weapons. It is a promise about when they will be used, a standing force that must be paid for and kept ready, and a chain of command that has to hold under pressure. Every choice here buys something abroad or at home, and every one of them changes how likely it is that something goes wrong."
 je_nuclear_program_status_line:0 "[ROOT.GetCountry.GetCustom('nd_taboo_status_line')][ROOT.GetCountry.GetCustom('nuclear_program_status_line')] Warheads held: #N [ROOT.GetCountry.MakeScope.ScriptValue('nuclear_program_display_stockpile')|0]#!.[ROOT.GetCountry.GetCustom('nd_status_line')]"
 je_nuclear_program_widget_defence_label:0 "Home defence"
 je_nuclear_program_widget_defence_tt:0 "#tooltip_header Interception#!\n$TOOLTIP_DELIMITER$\nHow much of an incoming warhead's chance of arriving our own defences take away, in our capital. A $building_military_base$ with missile defense adds more in its own state.[JournalEntry.GetCountry.GetCustom('te_nuke_defense_aviation')][JournalEntry.GetCountry.GetCustom('te_nuke_defense_radar')][JournalEntry.GetCountry.GetCustom('te_nuke_defense_missile')][JournalEntry.GetCountry.GetCustom('te_nuke_defense_directed_energy')][JournalEntry.GetCountry.GetCustom('te_nuke_defense_orbital')]"
 je_nuclear_program_widget_defence_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nuclear_program_display_defense_rating')|0]%#!"
 je_nuclear_program_widget_delivery_label:0 "Delivery capability"
 je_nuclear_program_widget_delivery_tt:0 "#tooltip_header Delivery#!\n$TOOLTIP_DELIMITER$\nHow likely one of our warheads is to arrive, before the defender's interception is taken off it.[JournalEntry.GetCountry.GetCustom('te_nuke_attack_nuclear_weapons')][JournalEntry.GetCountry.GetCustom('te_nuke_attack_icbms')][JournalEntry.GetCountry.GetCustom('te_nuke_attack_hypersonic')][JournalEntry.GetCountry.GetCustom('te_nuke_attack_orbital')]"
 je_nuclear_program_widget_delivery_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nuclear_program_display_attack_rating')|0]%#!"
 je_nuclear_program_widget_first_device_label:0 "First device"
 je_nuclear_program_widget_first_device_value:0 "[JournalEntry.GetCountry.GetCustom('nuclear_program_first_device')][JournalEntry.GetCountry.GetCustom('nuclear_program_world_first_note')]"
 je_nuclear_program_widget_funding_label:0 "Programme funding"
 je_nuclear_program_widget_funding_tt:0 "#tooltip_header Programme funding#!\n$TOOLTIP_DELIMITER$\nEvery step of funding buys one more unit of warhead progress a month, paid for out of weekly [concept_innovation]. One step is worth:\n[GetStaticModifier('nuclear_weapon_program_funding').GetDesc]"
 je_nuclear_program_widget_funding_value:0 "Step #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nuclear_program_display_funding')|0]#! · @innovation! #N [JournalEntry.GetCountry.MakeScope.ScriptValue('nuclear_program_display_weekly_cost')|0]#!/week"
 je_nuclear_program_widget_next_label:0 "Next warhead in"
 je_nuclear_program_widget_next_tt:0 "#tooltip_header Time to the next warhead#!\n$TOOLTIP_DELIMITER$\nThe remaining #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nuclear_program_display_progress_remaining')|1]#! of progress at the current rate. The bar below this panel draws the same figure against the #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nuclear_weapon_program_goal_value')|0]#! a warhead takes."
 je_nuclear_program_widget_next_value:0 "[JournalEntry.GetCountry.GetCustom('nuclear_program_next_warhead')]"
 je_nuclear_program_widget_odds_header:0 "Delivery and Defence"
 je_nuclear_program_widget_odds_note:0 "#lore A strike's chance of landing is our delivery capability less the defender's interception, held inside a floor and a ceiling so that neither side is ever certain.#!"
 je_nuclear_program_widget_powers_header:0 "Nuclear Powers"
 je_nuclear_program_widget_powers_legend:0 "#lore The ten largest arsenals as the world estimates them. Each is re-observed once a year and snaps to the truth after a test or a strike; our own exact count is the Warheads figure at the top of this entry.#!"
 je_nuclear_program_widget_programme_header:0 "The Programme"
 je_nuclear_program_widget_rate_label:0 "Warhead production"
 je_nuclear_program_widget_rate_tt:0 "#tooltip_header Warhead production#!\n$TOOLTIP_DELIMITER$\nProgress toward the next warhead, per month; the weekly pulse applies a quarter of it.[JournalEntry.GetCountry.GetCustom('nuclear_program_rate_note')][JournalEntry.GetCountry.GetCustom('nuclear_program_aid_note')]"
 je_nuclear_program_widget_rate_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nuclear_program_display_monthly_progress')|1]#! / month"
 je_nuclear_program_widget_taboo_burden_label:0 "Burden of our arsenal"
 je_nuclear_program_widget_taboo_burden_tt:0 "#tooltip_header The Burden of the Bomb#!\n$TOOLTIP_DELIMITER$\nThe world holds nuclear weapons in horror, and holds it against those who keep them: from a taboo of 40 up, the larger our arsenal (up to fifty warheads), the heavier the burden. It turns the bomb's prestige against us, takes away the leverage it brought, and sets our restraint-minded interest groups against the arsenal itself. Hold the arsenal to a ceiling, or give it up, to lighten it."
 je_nuclear_program_widget_taboo_burden_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_disp_taboo_burden_pct')|0]%#! · prestige #R [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_disp_taboo_prestige_cost_pct')|0]%#! · leverage #R [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_disp_taboo_leverage_cost_pct')|0]%#!"
 je_nuclear_program_widget_taboo_costs_tt:0 "#tooltip_header What the Taboo Costs#!\n$TOOLTIP_DELIMITER$\nWhat a nuclear act costs us today. Every figure moves with the taboo: at zero, nothing; at its height, a first use makes a state a pariah. An answer to a strike on us, or on a country we protect, costs no infamy."
 je_nuclear_program_widget_taboo_header:0 "The Nuclear Taboo"
 je_nuclear_program_widget_taboo_heading_label:0 "Heading toward"
 je_nuclear_program_widget_taboo_heading_value:0 "#v [GetGlobalVariable('nd_taboo_target').GetValue|0]#! [JournalEntry.GetCountry.GetCustom('nd_taboo_heading')]"
 je_nuclear_program_widget_taboo_history_header:0 "The Taboo Over Time"
 je_nuclear_program_widget_taboo_note:0 "[JournalEntry.GetCountry.GetCustom('nd_taboo_last_use')]"
 je_nuclear_program_widget_taboo_score_label:0 "Nuclear taboo"
 je_nuclear_program_widget_taboo_score_tt:0 "#tooltip_header The Nuclear Taboo#!\n$TOOLTIP_DELIMITER$\nHow unthinkable the world finds nuclear weapons. It moves each month toward where the world's state puts it:\n"
 je_nuclear_program_widget_taboo_score_value:0 "#v [GetGlobalVariable('nd_taboo').GetValue|0]#! — [JournalEntry.GetCountry.GetCustom('nd_taboo_band_name')]"
 je_nuclear_program_widget_taboo_strategic_label:0 "First use on a city"
 je_nuclear_program_widget_taboo_strategic_value:0 "#R +[JournalEntry.GetCountry.MakeScope.ScriptValue('nd_taboo_infamy_strategic')|0]#! infamy · relations #R [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_taboo_world_relations_strategic')|0]#!"
 je_nuclear_program_widget_taboo_tactical_label:0 "First use on a battlefield"
 je_nuclear_program_widget_taboo_tactical_value:0 "#R +[JournalEntry.GetCountry.MakeScope.ScriptValue('nd_taboo_infamy_tactical')|0]#! infamy · relations #R [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_taboo_world_relations_tactical')|0]#!"
 je_nuclear_program_widget_taboo_threat_label:0 "A public ultimatum"

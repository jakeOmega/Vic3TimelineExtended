 je_ch_widget_model_tt:0 "The political model of the world's leading cultural power, and how much of the world's culture comes from countries running something in the same family: their combined cultural pull, not a head count.\n\nEvery country that trails the hegemon feels a constant push toward the political movements matching this model. The push is nothing while the model is marginal and grows with its share of world culture; its current strength is #v ×[JournalEntry.GetCountry.MakeScope.ScriptValue('ch_model_pressure_mult')|2]#!. Events can add a temporary spike on top. Recounted with the leaderboard, about twice a year."

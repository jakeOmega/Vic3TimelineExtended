 je_un_chamber_obligations_header:0 "Our Obligations"
 je_un_chamber_obligations_help:0 "#lore Dues grow with the tier: 0.1% of GDP a year when Contested, 0.2% when Established, 0.4% when Strong, 1% when Supranational. Withholding them saves the money, but costs our standing, weakens the funding pillar, and after 24 months in arrears takes our vote until everything owed is paid. Each convention's member modifier, and our terms under it, are scaled by the UN's [concept_un_enforcement]; we are re-assessed when the tier changes and once a year.#!"
 je_un_chamber_obligations_no_un:0 "No United Nations exists to ask anything of us."

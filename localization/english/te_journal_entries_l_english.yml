 je_un_standing_effects_poor:0 "  In force: #R $un_standing_poor_modifier$#! — $un_standing_poor_modifier_desc$"
 je_un_standing_effects_respected:0 "  In force: #G $un_standing_respected_modifier$#! — $un_standing_respected_modifier_desc$"
 je_un_standing_effects_withheld:0 "  #R The benefits our standing has earned are withheld.#! Nothing is applied while the suspension holds, however high the score."
 je_un_standing_help_intro:0 "#bold International Standing is our own record in the organisation#! — what we have delivered and what we have complied with. It is not [concept_un_authority], which measures how much the institution itself is worth. Standing runs from 0 to 100; a new member starts at 50. Disgraced below 20, Poor 20–39, Neutral 40–59, Respected 60–79, Exemplary 80 and above.\n"
 je_un_standing_help_limits:0 "#bold What it will not do:#!\n Programme accrual is capped at #bold 6 points a year#! across all five programmes together, and every gain is scaled by how far we already are from 100 — at 75 a delivery is worth half its face value, at the ceiling a tenth. Losses are never scaled down. Toggling a programme off and on again resets its clock to zero and costs 2, so there is nothing to farm. Voting is not delivery: agreeing with a resolution earns nothing, and a [concept_un_veto] is a lawful act that costs nothing — unless we had pledged that vote to the resolution's sponsor, in which case casting it the other way is going back on our word, however we cast it. A token donation or an observers-only mission earns nothing at all.\n"
 je_un_standing_help_losses:0 "#bold What loses it:#!\n Abandoning a programme before two years (−2). Undermining the international order (−0.15 a month, and after two years every benefit is suspended). Refusing a binding resolution, busting a sanctions regime or defying the court (−5). A rebuke (−3), a censure (−8), partial sanctions (−3), full sanctions (−6). Breaking, abandoning or forfeiting an authorized military mandate (−12, and every benefit suspended for ten years). Having our permanent seat voted away (−5, suspended five years). Going back on a vote we pledged to a resolution's sponsor (−4, and the favour we were owed is struck off). Walking out of the United Nations (−5; the rest of the score is frozen, not erased, and waits for us if we return).\n"
 je_un_standing_help_sources:0 "#bold What earns it:#!\n Each of the five ongoing programmes — peacekeeping contributions, development funding, championing human rights, arms control, championing the order — pays #bold 0.3 a month#! once it has run #bold two full years without interruption#!. Delivering real humanitarian aid or a real peacekeeping deployment pays 3. Taking on a share of an aid or peacekeeping programme the Assembly has voted through pays 2, and earns goodwill with the country that asked. Complying with a binding decision we argued against, enforcing sanctions, or accepting a ruling against us pays 2. Discharging an authorized military mandate as written pays 6. Delivering a vote we pledged to a resolution's sponsor pays a token amount — a kept word is worth something, but it is not a programme.\n"
 je_un_standing_nonmember:0 "  #v We hold no standing: it is a record of membership, and we are outside the organisation.#!"

 je_strategic_reserve_how_sub_status:0 "Status"
 je_strategic_reserve_inv_col_good:0 "Good"
 je_strategic_reserve_inv_col_rate:0 "Rate"
 je_strategic_reserve_inv_col_rate_tt:0 "Decrease, stop or increase the good's [concept_st_res_rate_setting] by the [concept_st_res_adjustment_step]. Changing a rate by hand switches the good to the Manual policy."
 je_strategic_reserve_inv_col_status:0 "Status"
 je_strategic_reserve_inv_col_status_tt:0 "#G Storing#! or #O Withdrawing#!: the good's rate is being applied. #Y Idle#!: no rate is set, and the hub only replaces what decays. #R Blocked#!: the stockpile is full, or empty with a release set, or the hub is understaffed. Hover a row for its reason."
 je_strategic_reserve_inv_col_stock:0 "Stock"
 je_strategic_reserve_inv_col_stock_tt:0 "How full each good's reserve is. While a good's policy can buy, a marker stands at its target stockpile; while it can sell, one stands at its protected stockpile. A policy that uses the whole capacity shows neither."
 je_strategic_reserve_inv_header:0 "Reserve Inventory"
 je_strategic_reserve_inv_step:0 "#bold [concept_st_res_adjustment_step]:#! [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_adjust_step_value')|0] per click"

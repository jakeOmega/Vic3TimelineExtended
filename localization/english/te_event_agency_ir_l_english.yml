l_english:
 te_ea_ir_military_buildup_modifier:0 "Military Buildup"
 te_ea_ir_military_buildup_modifier_desc:0 "We are expanding our armed forces to outmatch a rival power, and paying for every division of it."
 TE_EA_IR_BUILDUP_RIVAL_TT:0 "[SCOPE.sCountry('arms_race_instigator').GetName] will see the buildup and decide how to answer it."
 te_ea_ir_propaganda_offensive_modifier:0 "Propaganda Offensive"
 te_ea_ir_propaganda_offensive_modifier_desc:0 "Our broadcasters and friendly foreign papers are running a coordinated campaign against a rival power's institutions."
 TE_EA_IR_PROPAGANDA_RIVAL_TT:0 "[SCOPE.sCountry('propaganda_instigator').GetName] will hear the broadcasts and decide whether to answer them."
 te_ea_ir_agent_in_place_modifier:0 "Agent in Place"
 te_ea_ir_agent_in_place_modifier_desc:0 "An agent inside a rival's defence ministry is passing its weapons designs to our engineers."
 TE_EA_IR_AGENT_CAUGHT_TT:0 "The agent is caught: [SCOPE.sCountry('espionage_catcher').GetName] decides what to do with him, and when we hear of it his reports stop."
 TE_EA_IR_AGENT_UNDETECTED_TT:0 "The agent works undetected."
 te_ea_ir_election_meddling_modifier:0 "Election Meddling Abroad"
 te_ea_ir_election_meddling_modifier_desc:0 "Diplomatic capital is going into a disinformation campaign in a rival's election."
 TE_EA_IR_MEDDLING_RIVAL_TT:0 "[SCOPE.sCountry('interference_target').GetName]'s analysts will notice the campaign and trace it to us, and its government will decide how to answer."
 TE_EA_IR_CELL_UNCOVERED_TT:0 "The cell is uncovered: [SCOPE.sCountry('terror_cell_target').GetName] traces it to us and decides how to answer."
 TE_EA_IR_CELL_HIDDEN_TT:0 "The cell stays hidden."
 STE_TELEPATHIC_PROPOSAL_TT:0 "[SCOPE.sCountry('telepathic_partner').GetName] decides whether to open the channel. If it accepts, both governments gain #bold $ste_telepathic_diplomacy$#! and relations between us improve."
 STE_TELEPATHIC_ACCEPTED_TT:0 "[SCOPE.sCountry('telepathic_proposer').GetName] also gains #bold $ste_telepathic_diplomacy$#!."
 STE_TELEPATHIC_DECLINED_TT:0 "[SCOPE.sCountry('telepathic_proposer').GetName] is told that we declined."

l_english:
 # ---- The World Development Fund (redesign phase 7, §0.12 item 7) ----
 concept_un_development_fund:0 "World Development Fund"
 concept_un_development_fund_desc:0 "An institution of the United Nations, founded by a resolution of the [concept_un_general_assembly] once the [concept_un_charter] carries Charter Reform II.\n\nWhile it stands, a quarter of the UN budget (the [concept_un_dues] the paying members pay) goes out every week to the members whose [concept_gdp_per_capita] is below half the members' average. Only a member with a seat in the Assembly that pays its own dues receives a grant, and the grants are shared by population. A recipient takes its grant into its [concept_investment_pool], or into its [concept_treasury] when its laws allow no investment pool or it has no banking system yet. The line and the grants are worked out again every month.\n\nThe richer members pay most of the dues that fund it and receive nothing back. The emergency lending facility lends from what the Fund and the Standing UN Force leave of the budget."
 UN_PROPOSE_DEVELOPMENT_FUND:0 "Propose the World Development Fund"
 UN_PROPOSE_DEVELOPMENT_FUND_DESC:0 "Move the [concept_un_general_assembly] to found the [concept_un_development_fund]: a quarter of the UN budget, paid every week to the members whose [concept_gdp_per_capita] is below half the members' average, into their [concept_investment_pool]. It is recommendatory and a simple majority carries it. #G UN credibility +1 if it passes.#! Requires Charter Reform II, and a UN whose members are assessed dues."
 UN_PROPOSE_DEVELOPMENT_FUND_TT:0 "#bold A General Assembly vote has been called#! to found the World Development Fund. Human members can vote at once; AI members vote in the ninth to eleventh month. Results follow after a year."
 un_development_fund_budget_tt:0 "The UN has a budget to share: its members are assessed [concept_un_dues] (from the [concept_un_tier_contested] tier)"
 je_un_chamber_propose_need_development_fund:0 "The [concept_un_development_fund] does not already stand"
 je_un_chamber_propose_topic_development_fund:0 "#tooltippable;tooltip:je_un_chamber_propose_topic_development_fund_tt #bold World Development Fund#!#!"
 je_un_chamber_propose_topic_development_fund_tt:0 "Would found the [concept_un_development_fund]: a quarter of the UN budget, paid every week to the members below half the members' average [concept_gdp_per_capita], shared by population, into their [concept_investment_pool]. The richer members pay for it and draw nothing; the lending facility lends from what is left."
 je_un_chamber_propose_no_case_development_fund:0 "#tooltippable;tooltip:je_un_chamber_propose_no_case_development_fund_tt #G In Force#!#!"
 je_un_chamber_propose_no_case_development_fund_tt:0 "The [concept_un_development_fund] already stands. What it pays us is under Our Obligations, and what it takes of the budget beside the members' dues."
 je_un_chamber_preview_development_fund:0 "#bold Grants:#! #v [THIS.ScriptValue('un_disp_dev_fund_budget_base_pct')|0]%#! of the budget, @money!#v [THIS.ScriptValue('un_disp_dev_fund_pot_preview')|D]#! a week today, for #v [THIS.ScriptValue('un_disp_dev_fund_recipients')|0]#! members below @money!#v [THIS.ScriptValue('un_disp_dev_fund_line')|1]#! of GDP per head"
 je_un_chamber_preview_development_fund_ours:0 "We are below the line (@money!#v [THIS.ScriptValue('un_disp_dev_fund_our_gdp_ph')|1]#! a head) and would receive about @money!#v [THIS.ScriptValue('un_disp_dev_fund_our_grant_preview')|D]#! a week."
 je_un_chamber_preview_development_fund_withholding:0 "We are below the line, but a member withholding its [concept_un_dues] receives nothing."
 je_un_chamber_preview_development_fund_not_ours:0 "Our GDP per head is @money!#v [THIS.ScriptValue('un_disp_dev_fund_our_gdp_ph')|1]#!, above the line: we would receive nothing."
 je_un_chamber_topic_development_fund:0 "#bold World Development Fund#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_chamber_conseq_development_fund:0 "  #bold If it carries:#! $un_vote_development_fund_passed_tt$"
 je_un_led_topic_development_fund:0 "        World Development Fund"
 un_vote_development_fund_passed_tt:0 "The [concept_un_development_fund] is founded. #G UN credibility +1, moving [concept_un_authority]'s target.#! From next month a quarter of the UN budget goes out every week to the members below half the members' average [concept_gdp_per_capita], shared by population, into their [concept_investment_pool]. The lending facility lends from what is left."
 un_vote.1.t_development_fund:0 "World Development Fund Vote"
 un_vote.1.d_development_fund:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has moved that the General Assembly found a World Development Fund. Every week a quarter of the UN budget would go to the members whose GDP per head is below half the members' average, shared by their population, into their investment pools. The poorer members would gain. The richer members pay most of the dues that fund it and would receive nothing back, and the lending facility would have less to lend."
 un_vote.2.d_development_fund_passed:0 "The General Assembly has founded the World Development Fund. The resolution carried [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. From next month a quarter of the UN budget goes out every week to the members below half the members' average GDP per head."
 un_vote.2.d_development_fund_failed:0 "The General Assembly has declined to found a World Development Fund. The vote failed [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. The UN budget stays with the lending facility."
 un_dev_fund_pool_grant_modifier:0 "World Development Fund Grant"
 un_dev_fund_pool_grant_modifier_desc:0 "Our share of the [concept_un_development_fund]'s grants, paid into our [concept_investment_pool] every week. The Fund shares a quarter of the UN budget among the members below half the members' average [concept_gdp_per_capita], by population, and works the shares out again each month."
 un_dev_fund_treasury_grant_modifier:0 "World Development Fund Grant"
 un_dev_fund_treasury_grant_modifier_desc:0 "Our share of the [concept_un_development_fund]'s grants, paid into our [concept_treasury] every week as income: our laws allow no [concept_investment_pool], or we have no banking system yet. The Fund shares a quarter of the UN budget among the members below half the members' average [concept_gdp_per_capita], by population, and works the shares out again each month."
 je_un_chamber_dev_fund_moribund:0 "#bold [concept_un_development_fund]:#! nothing to pay out while the UN is [concept_un_tier_moribund]: its members are assessed no dues."
 je_un_chamber_dev_fund_pool:0 "#bold [concept_un_development_fund]:#! we receive @money!#v [THIS.ScriptValue('un_disp_dev_fund_our_grant')|D]#! a week, into our [concept_investment_pool]."
 je_un_chamber_dev_fund_treasury:0 "#bold [concept_un_development_fund]:#! we receive @money!#v [THIS.ScriptValue('un_disp_dev_fund_our_grant')|D]#! a week, into our [concept_treasury]: our laws allow no investment pool, or we have no banking system yet."
 je_un_chamber_dev_fund_next_month:0 "#bold [concept_un_development_fund]:#! we are below its line, and our first grant comes at the start of next month."
 je_un_chamber_dev_fund_withholding:0 "#bold [concept_un_development_fund]:#! #R nothing while we withhold our dues#!, though we are below its line."
 je_un_chamber_dev_fund_above_line:0 "#bold [concept_un_development_fund]:#! nothing for us. Our GDP per head, @money!#v [THIS.ScriptValue('un_disp_dev_fund_our_gdp_ph')|1]#!, is above its line of @money!#v [THIS.ScriptValue('un_disp_dev_fund_line')|1]#!."
 je_un_chamber_dev_fund_none:0 "#bold [concept_un_development_fund]:#! nothing for us: it pays only members with a seat in the Assembly."
 je_un_chamber_budget_force:0 "The Standing UN Force takes #v [THIS.ScriptValue('un_disp_force_budget_pct')|0]%#! of it: @money!#v [THIS.ScriptValue('un_disp_force_budget_weekly')|D]#! a week."
 je_un_chamber_budget_dev_fund:0 "The [concept_un_development_fund] takes #v [THIS.ScriptValue('un_disp_dev_fund_budget_pct')|0]%#!: @money!#v [THIS.ScriptValue('un_disp_dev_fund_pot')|D]#! a week, shared by #v [THIS.ScriptValue('un_disp_dev_fund_recipients')|0]#! members below @money!#v [THIS.ScriptValue('un_disp_dev_fund_line')|1]#! of GDP per head."
 je_un_chamber_budget_free:0 "Left for the emergency lending facility: @money!#v [THIS.ScriptValue('un_disp_budget_free_weekly')|D]#! a week, so at most @money!#v [THIS.ScriptValue('un_disp_loan_budget_cap')|D]#! in one loan."
 # ---- The World Food Reserve (redesign phase 7, §0.12 item 10) ----
 concept_un_food_reserve:0 "World Food Reserve"
 concept_un_food_reserve_desc:0 "An institution of the United Nations, founded by a resolution of the [concept_un_general_assembly]. It needs no charter reform.\n\n#bold Pledges.#! A member with a seat in the Assembly whose Strategic Reserve can store grain may pledge to it, and withdraw the pledge, from the United Nations journal entry.\n\n#bold Draws.#! When a new [concept_un_mission_aid] opens, the Reserve draws on the pledgers holding at least 500 units of grain, other than the mission's host: up to a quarter of each one's grain and at most 2,500 units, 5,000 units in all. Once the pledges could give more than that, each pledger gives the same share of its offer. The grain leaves the pledgers' Strategic Reserves. The mission's state gets #G +0.15#! food security and #G -5%#! mortality for a year, in proportion to the grain that came, and each pledger drawn on gains international standing. A Moribund UN cannot call on it.\n\n#bold Hunger.#! While it stands, the UN answers for hunger: the delivery pillar of [concept_un_authority] loses up to 10 points as the share of the members' people living in [concept_famine]-struck states rises to 5%, and gains 3 while that share is below half a percent."
 UN_PROPOSE_FOOD_RESERVE:0 "Propose the World Food Reserve"
 UN_PROPOSE_FOOD_RESERVE_DESC:0 "Move the [concept_un_general_assembly] to found the [concept_un_food_reserve]: members pledge grain from their Strategic Reserves, and every new [concept_un_mission_aid] draws on the pledges to feed its state. While it stands, hunger among the members' people moves the delivery pillar of [concept_un_authority]. It is recommendatory and a simple majority carries it. #G UN credibility +1 if it passes.#!"
 UN_PROPOSE_FOOD_RESERVE_TT:0 "#bold A General Assembly vote has been called#! to found the World Food Reserve. Human members can vote at once; AI members vote in the ninth to eleventh month. Results follow after a year."
 je_un_chamber_propose_need_food_reserve:0 "The [concept_un_food_reserve] does not already stand"
 je_un_chamber_propose_topic_food_reserve:0 "#tooltippable;tooltip:je_un_chamber_propose_topic_food_reserve_tt #bold World Food Reserve#!#!"
 je_un_chamber_propose_topic_food_reserve_tt:0 "Would found the [concept_un_food_reserve]: members pledge grain from their Strategic Reserves, and every new [concept_un_mission_aid] draws on the pledges to feed its state for a year. While it stands, the delivery pillar of [concept_un_authority] answers for hunger among the members' people. Needs no charter reform."
 je_un_chamber_propose_no_case_food_reserve:0 "#tooltippable;tooltip:je_un_chamber_propose_no_case_food_reserve_tt #G In Force#!#!"
 je_un_chamber_propose_no_case_food_reserve_tt:0 "The [concept_un_food_reserve] already stands. Our pledge, if we make one, is under Our Obligations."
 je_un_chamber_preview_food_reserve:0 "#bold Grain on hand:#! #v [THIS.ScriptValue('un_disp_food_holders')|0]#! members keep at least #v [THIS.ScriptValue('un_fr_min_stock')|0]#! units of grain in a Strategic Reserve, #v [THIS.ScriptValue('un_disp_food_holders_grain')|0]#! units in all"
 je_un_chamber_preview_food_reserve_hunger:0 "#bold Hunger:#! #v [THIS.ScriptValue('un_disp_food_famine_pct')|1]%#! of the members' people live in [concept_famine]-struck states. With the Reserve in force that would move the delivery pillar by #v [THIS.ScriptValue('un_disp_food_hunger_term_potential')|+1]#!."
 je_un_chamber_topic_food_reserve:0 "#bold World Food Reserve#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_chamber_conseq_food_reserve:0 "  #bold If it carries:#! $un_vote_food_reserve_passed_tt$"
 je_un_led_topic_food_reserve:0 "        World Food Reserve"
 un_vote_food_reserve_passed_tt:0 "The [concept_un_food_reserve] is founded. #G UN credibility +1, moving [concept_un_authority]'s target.#! Members may pledge grain from their Strategic Reserves, and every new [concept_un_mission_aid] draws on the pledges. From next month the delivery pillar of authority answers for hunger among the members: down to #R -10#! with famine, #G +3#! while almost no one goes hungry."
 un_vote.1.t_food_reserve:0 "World Food Reserve Vote"
 un_vote.1.d_food_reserve:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has moved that the General Assembly found a World Food Reserve. Members with a Strategic Reserve could pledge part of their grain to it, and every new UN aid mission would draw on the pledges to feed the state it serves. The UN would also answer for hunger: while the Reserve stands, famine among the members' people would weigh on its authority, and the absence of famine would add to it."
 un_vote.2.d_food_reserve_passed:0 "The General Assembly has founded the World Food Reserve. The resolution carried [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. Members may now pledge grain from their Strategic Reserves, and the next UN aid mission will draw on what they pledge."
 un_vote.2.d_food_reserve_failed:0 "The General Assembly has declined to found a World Food Reserve. The vote failed [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. UN aid missions go out with what their donors send and no more."
 un_food_reserve_relief_state_modifier:0 "World Food Reserve Relief"
 un_food_reserve_relief_state_modifier_desc:0 "Grain from the [concept_un_food_reserve], sent with a [concept_un_mission_aid]. It lasts a year, and is stronger the more grain the pledgers could send."
 UN_FOOD_RESERVE_PLEDGE:0 "Pledge Grain to the World Food Reserve"
 UN_FOOD_RESERVE_PLEDGE_DESC:0 "Pledge grain from our Strategic Reserve to the [concept_un_food_reserve]. Whenever a new [concept_un_mission_aid] opens anywhere but in our own country, the Reserve may take up to a quarter of the grain we hold, at most 2,500 units, while we hold at least 500. Each time it draws on us our international standing rises. We may withdraw the pledge at any time."
 un_food_reserve_needs_reserve_tt:0 "We have a Strategic Reserve Hub, and our Strategic Reserve can store grain"
 un_food_reserve_pledge_effect_tt:0 "We pledge grain from our Strategic Reserve to the [concept_un_food_reserve]. Each new UN aid mission may draw up to a quarter of what we hold, at most 2,500 units."
 UN_FOOD_RESERVE_WITHDRAW:0 "Withdraw Our Grain Pledge"
 UN_FOOD_RESERVE_WITHDRAW_DESC:0 "Withdraw our pledge to the [concept_un_food_reserve]. The Reserve draws nothing more from our Strategic Reserve; what it already took stays given."
 un_food_reserve_withdraw_effect_tt:0 "We withdraw our grain pledge: the [concept_un_food_reserve] draws nothing more from our Strategic Reserve."
 je_un_chamber_food_reserve_pledged:0 "#bold [concept_un_food_reserve]:#! we pledge up to #v [THIS.ScriptValue('un_disp_food_pledge_pct')|0]%#! of the grain in our Strategic Reserve (#v [THIS.ScriptValue('un_disp_food_our_grain')|0]#! units now: #v [THIS.ScriptValue('un_disp_food_our_offer')|0]#! to the next aid mission at most). Drawn from us so far: #v [THIS.ScriptValue('un_disp_food_drawn_total')|0]#! units."
 je_un_chamber_food_reserve_can_pledge:0 "#bold [concept_un_food_reserve]:#! we pledge nothing. We could pledge grain from our Strategic Reserve with the journal entry's Pledge Grain button."
 je_un_chamber_food_reserve_cannot_pledge:0 "#bold [concept_un_food_reserve]:#! only a member with a seat in the Assembly and a Strategic Reserve Hub can pledge grain to it."
 je_un_auth_tbl_delivery_hunger_tt:0 "While the [concept_un_food_reserve] stands, the pillar also answers for hunger: it loses up to 10 points as the share of the members' people living in [concept_famine]-struck states rises to 5%, and gains 3 while that share is below half a percent."
 je_un_auth_tbl_delivery_hunger_detail:0 "; hunger [JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_food_hunger_term')|+1], with #v [JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_food_famine_pct')|1]%#! of the members' people in famine"
 je_un_led_reason_34:0 "      #lore the World Food Reserve sent grain to a UN aid mission#!"
 je_un_led_reason_34_on:0 "      #lore the World Food Reserve sent grain to the#! [Concept('concept_un_mission_aid', 'aid mission')] #lore in#! $je_un_led_subject_state$"
 je_un_standing_reason_42:0 "  Most recently: the World Food Reserve sent our pledged grain to a UN aid mission."
 notification_un_food_reserve_drawn_notice_name:0 "Our Grain Feeds a UN Aid Mission"
 notification_un_food_reserve_drawn_notice_desc:0 "The [concept_un_food_reserve] has drawn #v [GetPlayer.MakeScope.ScriptValue('un_disp_food_last_draw')|0]#! units of grain from our Strategic Reserve for the UN aid mission in [SCOPE.sState('un_msn_state').GetName], as we pledged. Our international standing rises for it."
 notification_un_food_reserve_drawn_notice_tooltip:0 "#header $notification_un_food_reserve_drawn_notice_name$#!\n$notification_un_food_reserve_drawn_notice_desc$"
 notification_un_food_reserve_relief_notice_name:0 "Grain from the World Food Reserve"
 notification_un_food_reserve_relief_notice_desc:0 "The [concept_un_food_reserve] is sending grain with the UN aid mission to [SCOPE.sState('un_msn_state').GetName]. Its food security rises for a year."
 notification_un_food_reserve_relief_notice_tooltip:0 "#header $notification_un_food_reserve_relief_notice_name$#!\n$notification_un_food_reserve_relief_notice_desc$"
 notification_un_food_reserve_empty_notice_name:0 "The World Food Reserve Is Empty"
 notification_un_food_reserve_empty_notice_desc:0 "A UN aid mission has opened in [SCOPE.sState('un_msn_state').GetName], but no member that pledged to the [concept_un_food_reserve] holds grain to send. The mission goes without it."
 notification_un_food_reserve_empty_notice_tooltip:0 "#header $notification_un_food_reserve_empty_notice_name$#!\n$notification_un_food_reserve_empty_notice_desc$"

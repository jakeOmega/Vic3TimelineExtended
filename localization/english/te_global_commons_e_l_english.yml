l_english:
 # ---- The Global Commons game rule (the seabed branch defines the same keys; keep one) ----
 rule_global_commons_rule:0 "Global Commons"
 setting_global_commons_enabled:0 "Global Commons Enabled"
 setting_global_commons_enabled_desc:0 "Seabed licences cap the $building_ocean_mine$ in five ocean basins that powers claim shares of. The Law of the Sea can regulate the seabed, research stations can winter on the Antarctic ice, and an Antarctic Treaty can close the Southern basin."
 setting_global_commons_disabled:0 "Global Commons Disabled"
 setting_global_commons_disabled_desc:0 "The $building_ocean_mine$ is uncapped. The Law of the Sea has no seabed terms, and there are no Antarctic research stations and no Antarctic Treaty."

 # ---- The seabed under the Law of the Sea ----
 je_un_terms_law_of_sea_seabed:0 "#bold The seabed#! (not scaled), under the Global Commons rule and once any country has researched $abyssal_plain_mining$: while the convention is in force the seabed is #bold Regulated#!. Half of each basin's licences, the reserved half, go by weight to the parties whose GDP per head is below the members' average, the [concept_un_development_fund]'s yardstick; the other half to every claimant. A party pays royalties of #v 4%#! of its $building_ocean_mine$ levels' base output value a week, about @money!1,788 a level, to the [concept_un_development_fund] while it stands and to the UN budget otherwise. A party that switches to Unilateral Licensing defects: #R 10#! infamy, #R 5#! standing and #R 10#! to the case against it, no place in the reserved half and no royalties. It is a party again #v 5#! years after it leaves Unilateral Licensing. While two or more [Concept('concept_great_power','great powers')] license unilaterally the seabed is a #bold Scramble#!: no reserved half, no royalties, every navy counts double. It is Regulated again two years after fewer than two remain. A member outside the convention, or a country outside the UN, claims in the open half only and pays nothing."
 te_seabed_royalty_modifier:0 "Seabed Royalties"
 te_seabed_royalty_modifier_desc:0 "This country is party to the Convention on the Law of the Sea while it regulates the seabed, and pays royalties on its $building_ocean_mine$ levels: 4% of their base output value a week. The money goes to the World Development Fund while it stands, otherwise to the UN budget."
 te_seabed_defection_tt:0 "#R We defect from the Law of the Sea's regulated seabed#!: no place in the reserved half and no royalties while we license on our own terms. Once we leave Unilateral Licensing we are a party again after #v 5#! years."
 te_seabed_defection_standing_tt:0 "#R International Standing: −5#! for defecting from the regulated seabed."
 te_seabed_defection_case_tt:0 "#R The defection goes on our record#! (+10 to the case the Assembly could make against us)"
 te_seabed_party_cooldown_tt:0 "We leave Unilateral Licensing: we are a party to the Law of the Sea's seabed terms again in #v 5#! years."
 je_un_chamber_seabed_regulated:0 "    #bold The seabed is Regulated#!: half of each basin is reserved for the poorer parties, and parties pay royalties on their $building_ocean_mine$ levels."
 je_un_chamber_seabed_scramble:0 "    #R The seabed is in a Scramble#!: two or more great powers license it on their own terms. Every pool is open to all, every navy counts double, and no royalties are owed."
 je_un_chamber_seabed_open:0 "    #bold The seabed is Open#!: each basin is shared by weight among all claimants."
 je_un_chamber_seabed_royalty:0 "    #R Royalties#!: @money![THIS.Var('te_seabed_royalty_cached').GetValue|0] a week on our $building_ocean_mine$ levels."
 je_un_chamber_seabed_defected:0 "    #R Defected#!: we license on our own terms, so we hold no place in the reserved half."
 je_un_chamber_seabed_cooling:0 "    #bold Returning#!: we are a party to the seabed terms again in [THIS.ScriptValue('te_seabed_party_cooldown_left')|0] months."
 je_un_chamber_seabed_reserved:0 "    #G Reserved half#!: our GDP per head is below the members' average, so we claim in it."
 je_un_standing_reason_48:0 "  Most recently: #R we licensed seabed mining on our own terms while the Law of the Sea regulated it.#!"
 notification_te_seabed_regime_open_notice_name:0 "The Seabed Is Open"
 notification_te_seabed_regime_open_notice_desc:0 "The Law of the Sea no longer regulates the seabed. Each basin's licences are shared by weight among all claimants, and no royalties are owed."
 notification_te_seabed_regime_open_notice_tooltip:0 "#header $notification_te_seabed_regime_open_notice_name$#!\n$notification_te_seabed_regime_open_notice_desc$"
 notification_te_seabed_regime_regulated_notice_name:0 "The Law of the Sea Regulates the Seabed"
 notification_te_seabed_regime_regulated_notice_desc:0 "Half of each ocean basin's licences are now reserved for the poorer parties to the Convention on the Law of the Sea, and parties pay royalties on their $building_ocean_mine$ levels."
 notification_te_seabed_regime_regulated_notice_tooltip:0 "#header $notification_te_seabed_regime_regulated_notice_name$#!\n$notification_te_seabed_regime_regulated_notice_desc$"
 notification_te_seabed_regime_scramble_notice_name:0 "A Scramble for the Seabed"
 notification_te_seabed_regime_scramble_notice_desc:0 "Two or more great powers license the seabed on their own terms. The reserved half and the royalties are gone: every pool is open to all claimants, and every navy counts double."
 notification_te_seabed_regime_scramble_notice_tooltip:0 "#header $notification_te_seabed_regime_scramble_notice_name$#!\n$notification_te_seabed_regime_scramble_notice_desc$"

 # ---- The Antarctic research station ----
 te_decision_open_antarctic_station:0 "Open an Antarctic Research Station"
 te_decision_open_antarctic_station_desc:0 "Send a wintering party south and keep it there: ice cores, ozone readings, the long night's sky. The station costs a tenth of a percent of our GDP a year, and never less than @money!1,000 a week, for research, a higher innovation cap and a claim on the Southern seabed."
 te_decision_close_antarctic_station:0 "Close the Antarctic Research Station"
 te_decision_close_antarctic_station_desc:0 "Bring the wintering party home. The station's research and its upkeep end."
 te_antarctic_station_upkeep_tt:0 "#R Upkeep#!: a tenth of a percent of our GDP a year, billed by the week, and never less than @money!1,000 a week."
 te_antarctic_tt_not_in_default:0 "We are not in default"
 te_antarctic_station_treaty_term_tt:0 "As a party to the Antarctic Treaty, our station also shares its science with the other parties' (#G +3%#! research speed, scaled by [concept_un_enforcement]) from our next monthly UN review."
 te_antarctic_station_modifier:0 "Antarctic Research Station"
 te_antarctic_station_modifier_desc:0 "This country keeps a research station on the Antarctic ice."
 te_antarctic_station_upkeep:0 "Antarctic Research Station Upkeep"
 te_antarctic_station_upkeep_desc:0 "The weekly cost of keeping a research station on the Antarctic ice: a tenth of a percent of GDP a year, and never less than 1,000 a week."

 # ---- The Antarctic Treaty ----
 je_un_conv_name_antarctic:0 "Antarctic Treaty"
 je_un_chamber_topic_antarctic:0 "#bold Antarctic Treaty#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_chamber_conseq_antarctic:0 "  #bold If it carries:#! $un_vote_antarctic_passed_tt$ #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_un_terms_antarctic_tt #bold Its terms#!#!"
 je_un_chamber_propose_topic_antarctic:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_un_chamber_propose_topic_antarctic_tt #bold $je_un_conv_name_antarctic$#!#!"
 je_un_chamber_propose_topic_antarctic_tt:0 "Founds the Antarctic Treaty Secretariat (ATS).\n\n$je_un_terms_antarctic_tt$\n\n$je_un_chamber_raised_antarctic$"
 je_un_chamber_raised_antarctic:0 "The docket also offers it when a country opens its first Antarctic research station."
 je_un_chamber_propose_need_antarctic:0 "The Antarctic Treaty is not already in force"
 je_un_chamber_conv_antarctic:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_un_chamber_conv_antarctic_tt #bold $je_un_conv_name_antarctic$#!#!"
 je_un_chamber_conv_antarctic_tt:0 "$je_un_terms_antarctic$"
 je_un_chamber_regime_antarctic_station:0 "    #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_un_chamber_regime_antarctic_station_tt #G Station science shared#!#!: our Antarctic research station works with the other parties'."
 je_un_chamber_regime_antarctic_station_tt:0 "[GetStaticModifier('un_regime_antarctic_station_modifier').GetName|v]\n[GetStaticModifier('un_regime_antarctic_station_modifier').GetDesc]\n#lore Shown at ×1: ours is scaled by [concept_un_enforcement].#!"
 je_un_led_topic_antarctic:0 "        Antarctic Treaty"
 je_un_led_reason_1401:0 "      #lore refused to table the Antarctic Treaty: the ice, it said, will not stay closed for ever#!"
 je_un_terms_antarctic:0 "#bold Every party#! (scaled):\n[GetStaticModifier('un_antarctic_treaty_modifier').GetDesc]\n#bold Every party#! (not scaled): it holds no new Southern seabed licences, and the levels it built before ratifying keep theirs. It counts toward [concept_un_authority]'s target:\n[GetStaticModifier('un_antarctic_policy_modifier').GetDesc]\n#bold A party with an Antarctic research station#! (scaled):\n[GetStaticModifier('un_regime_antarctic_station_modifier').GetDesc]\n#bold Denouncing it#! costs #R 10#! infamy, #R 5#! standing and #R 10#! to the case against the denouncer, which rejoining the UN does not undo. #bold It lapses#! when two or more [Concept('concept_great_power','great powers')] outside it hold Southern licences, and the Southern basin opens to all.\n$je_un_terms_scaled$"
 je_un_terms_antarctic_tt:0 "$je_un_terms_antarctic$\n\n$je_un_terms_common$"
 je_un_ov_agency_ats_tt:0 "#b ATS#!: Antarctic Treaty Secretariat, for the Antarctic Treaty[SelectLocalization( EqualTo_CFixedPoint( JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_agency_ats'), '(CFixedPoint)1' ), 'je_un_ov_agency_founded', 'je_un_ov_agency_not_founded' )]\n\n$je_un_terms_antarctic$"
 je_un_chamber_docket_last_15:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold the first Antarctic research station of [GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName]#!, and the Antarctic Treaty."
 un_vote.1.t_antarctic:0 "Antarctic Treaty Vote"
 un_vote.1.d_antarctic:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has proposed an Antarctic Treaty: the continent set aside for science, closed to weapons and to mining. A vote in favor commits our country to it: its parties hold no new Southern seabed licences, share their stations' science, and add to the UN's authority."
 un_vote.2.d_antarctic_passed:0 "The General Assembly has adopted the Antarctic Treaty and established the Antarctic Treaty Secretariat. Ratifying members keep the ice for science: no new Southern seabed licences for any of them."
 un_vote.2.d_antarctic_failed:0 "The Antarctic Treaty has failed to pass the General Assembly. The Southern Ocean's seabed stays open to every claimant."
 un_vote_antarctic_passed_tt:0 "The Antarctic Treaty was adopted and the Antarctic Treaty Secretariat (ATS) established. #G UN credibility +1, moving [concept_un_authority]'s target.#! Its parties hold no new Southern seabed licences, those with an Antarctic research station gain research, and every party adds to [concept_un_authority]'s target."
 un_antarctic_terms_tt:0 "As a party we hold no new Southern seabed licences (the levels we have keep theirs). An Antarctic research station of ours gains #G +3%#! research speed, scaled by [concept_un_enforcement], and we add #G 0.25#! to [concept_un_authority]'s target, × our weight in world affairs."
 un_antarctic_treaty_modifier:0 "Antarctic Treaty"
 un_antarctic_treaty_modifier_desc:0 "This country is party to the Antarctic Treaty, which earns it [concept_prestige]. It holds no new Southern seabed licences; the levels it built before ratifying keep theirs. The prestige is scaled by UN enforcement; the rule on licences is not."
 un_antarctic_refusal_modifier:0 "Refused the Antarctic Treaty"
 un_antarctic_refusal_modifier_desc:0 "This country refused to table the Antarctic Treaty and cannot propose it while this penalty lasts."
 un_regime_antarctic_station_modifier:0 "Antarctic Treaty: Station Science Shared"
 un_regime_antarctic_station_modifier_desc:0 "This country runs an Antarctic research station and is party to the Antarctic Treaty, whose stations share what they learn. Scaled by UN enforcement."
 un_antarctic_policy_modifier:0 "Antarctic Treaty: Cooperation on the Ice"
 un_antarctic_policy_modifier_desc:0 "This country is party to the Antarctic Treaty. Its cooperation counts toward the UN's authority, × its weight in world affairs. Not scaled by UN enforcement."
 un_antarctic_station_somewhere_tt:0 "A country runs an Antarctic research station"
 un_antarctic_not_lapsing_tt:0 "Fewer than two [Concept('concept_great_power','great powers')] outside a treaty hold Southern seabed licences"
 te_decision_denounce_antarctic_treaty:0 "Denounce the Antarctic Treaty"
 te_decision_denounce_antarctic_treaty_desc:0 "Leave the Antarctic Treaty and claim the Southern seabed like any other basin. The Assembly will hold it against us."
 te_antarctic_tt_may_denounce:0 "We are a party to the Antarctic Treaty and a UN member whose representation is not suspended"
 te_antarctic_denounce_tt:0 "#R We leave the Antarctic Treaty#!: free to claim Southern seabed licences, without the treaty's research or its share of [concept_un_authority]'s target. Rejoining the UN does not bring us back in; only a new treaty does."
 te_antarctic_denounce_standing_tt:0 "#R International Standing: −5#! for denouncing the Antarctic Treaty."
 te_antarctic_denounce_case_tt:0 "#R The denunciation goes on our record#! (+10 to the case the Assembly could make against us)"
 je_un_standing_reason_49:0 "  Most recently: #R we denounced the Antarctic Treaty.#!"
 notification_te_antarctic_treaty_lapsed_notice_name:0 "The Antarctic Treaty Lapses"
 notification_te_antarctic_treaty_lapsed_notice_desc:0 "Two great powers outside the Antarctic Treaty hold Southern seabed licences, and it can no longer hold. Its parties are released, and the Southern basin is open to every claimant."
 notification_te_antarctic_treaty_lapsed_notice_tooltip:0 "#header $notification_te_antarctic_treaty_lapsed_notice_name$#!\n$notification_te_antarctic_treaty_lapsed_notice_desc$"
 un_events.40.t:0 "The Antarctic Treaty"
 un_events.40.d_cause_station:0 "A new research station winters on the Antarctic ice, and the Assembly is asked who the continent belongs to.\n\n"
 un_events.40.d_station:0 "Our own wintering party has seen what the ice holds for science. The delegates ask us to table a treaty that would keep the continent for research alone: no weapons, no claims pressed, no mining. Its parties would hold no new Southern seabed licences, would share their stations' science, and would add to the UN's authority."
 un_events.40.d:0 "Research stations winter on the Antarctic ice, and the delegates ask us to table a treaty that would keep the continent for research alone: no weapons, no claims pressed, no mining. Its parties would hold no new Southern seabed licences, would share their stations' science, and would add to the UN's authority."
 un_events.40.f:0 "The 1959 treaty froze every claim to the continent. The Madrid Protocol of 1991 added the ban that mattered most: no mining, for fifty years at least."
 un_events.40.a:0 "Table the Antarctic Treaty."
 un_events.40.c:0 "The ice will not stay closed for ever."

 # ---- The Moratorium on Destructive Anti-Satellite Tests ----
 je_un_conv_name_asat:0 "Moratorium on Destructive Anti-Satellite Tests"
 je_un_chamber_topic_asat:0 "#bold Moratorium on Destructive Anti-Satellite Tests#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_chamber_conseq_asat:0 "  #bold If it carries:#! $un_vote_asat_passed_tt$ #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_un_terms_asat_tt #bold Its terms#!#!"
 je_un_chamber_propose_topic_asat:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_un_chamber_propose_topic_asat_tt #bold $je_un_conv_name_asat$#!#!"
 je_un_chamber_propose_topic_asat_tt:0 "Charges the UN Office for Disarmament Affairs (UNODA) with it.\n\n$je_un_terms_asat_tt$\n\n$je_un_chamber_raised_asat$"
 je_un_chamber_raised_asat:0 "The docket also offers it after a destructive anti-satellite strike."
 je_un_chamber_propose_need_asat:0 "The Moratorium on Destructive Anti-Satellite Tests is not already in force"
 je_un_chamber_conv_asat:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_un_chamber_conv_asat_tt #bold $je_un_conv_name_asat$#!#!"
 je_un_chamber_conv_asat_tt:0 "$je_un_terms_asat$"
 je_un_led_topic_asat:0 "        Moratorium on Destructive Anti-Satellite Tests"
 je_un_led_reason_1411:0 "      #lore refused to table the anti-satellite moratorium: it keeps the weapon in reserve#!"
 je_un_led_reason_40:0 "      #lore a party to the anti-satellite moratorium kept orbit clean#!"
 je_un_terms_asat:0 "#bold Every party#! (scaled):\n[GetStaticModifier('un_asat_moratorium_modifier').GetDesc]\n#bold A party that makes a destructive anti-satellite strike#! (not scaled): the strike costs it #R twice#! the infamy and twice the case strength.\n#bold A party running a debris-removal method#! on its $building_space_program$: once a year it counts toward the Delivery pillar of [concept_un_authority]'s target, #G 0.25#! × its weight in world affairs, as aid delivered does.\n$je_un_terms_scaled$"
 je_un_terms_asat_tt:0 "$je_un_terms_asat$\n\n$je_un_terms_common$"
 je_un_ov_agency_unoda_tt:0 "#b UNODA#!: Office for Disarmament Affairs, for the Moratorium on Destructive Anti-Satellite Tests[SelectLocalization( EqualTo_CFixedPoint( JournalEntry.GetCountry.MakeScope.ScriptValue('un_disp_agency_unoda'), '(CFixedPoint)1' ), 'je_un_ov_agency_founded', 'je_un_ov_agency_not_founded' )]\n\n$je_un_terms_asat$"
 je_un_chamber_docket_last_16:0 "  Last taken up, #v [GetGlobalVariable('un_dkt_last_age').GetValue|0]#! month(s) ago: #bold a destructive anti-satellite strike by [GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName]#!, and the Moratorium on Destructive Anti-Satellite Tests."
 un_vote.1.t_asat:0 "Anti-Satellite Moratorium Vote"
 un_vote.1.d_asat:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has proposed a moratorium on destructive anti-satellite tests. A vote in favor commits our country to it: a strike of our own would cost us twice the infamy and twice the case, our standing in the world would rise, and our debris removal would count toward the UN's delivery."
 un_vote.2.d_asat_passed:0 "The General Assembly has adopted the Moratorium on Destructive Anti-Satellite Tests, under the UN Office for Disarmament Affairs. Ratifying members forswear the strikes that leave orbit strewn with debris."
 un_vote.2.d_asat_failed:0 "The Moratorium on Destructive Anti-Satellite Tests has failed to pass the General Assembly. A strike costs what it costs, and no more."
 un_vote_asat_passed_tt:0 "The Moratorium on Destructive Anti-Satellite Tests was adopted. #G UN credibility +1, moving [concept_un_authority]'s target.#! A party's destructive anti-satellite strike costs it twice the infamy and twice the case strength, and a party running a debris-removal method counts toward the Delivery pillar."
 un_asat_terms_tt:0 "As a party, a destructive anti-satellite strike would cost us #R twice#! the infamy and twice the case strength, and a debris-removal method on our $building_space_program$ would count toward the UN's Delivery pillar each year."
 un_asat_moratorium_modifier:0 "Anti-Satellite Moratorium"
 un_asat_moratorium_modifier_desc:0 "This country is party to the Moratorium on Destructive Anti-Satellite Tests, which earns it [concept_prestige]. A destructive anti-satellite strike costs it twice the infamy and twice the case strength. The prestige is scaled by UN enforcement; the doubling is not."
 un_asat_refusal_modifier:0 "Refused the Anti-Satellite Moratorium"
 un_asat_refusal_modifier_desc:0 "This country refused to table the Moratorium on Destructive Anti-Satellite Tests and cannot propose it while this penalty lasts."
 un_propose_asat_not_striker_tt:0 "We have not made a destructive anti-satellite strike in the last two years"
 un_asat_strike_seen_tt:0 "A destructive anti-satellite strike has been made"
 un_events.41.t:0 "A Moratorium on Anti-Satellite Tests"
 un_events.41.d_cause_strike:0 "[GetGlobalVariable('un_dkt_last_subject').GetCountry.GetName] has destroyed a satellite in orbit, and its debris now threatens every craft that shares the altitude.\n\n"
 un_events.41.d:0 "The delegates ask us to table a moratorium on destructive anti-satellite tests. Its parties would pay twice the price for a strike of their own, gain standing in the world, and count their debris removal toward the UN's delivery."
 un_events.41.f:0 "In 2022 the General Assembly called on every state to stop destructive direct-ascent anti-satellite missile tests. One hundred and fifty-five voted for it."
 un_events.41.a:0 "Table the moratorium."
 un_events.41.c:0 "Keep the weapon in reserve."

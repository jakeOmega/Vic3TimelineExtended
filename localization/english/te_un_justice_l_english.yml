l_english:
 UN_PROPOSE_ARMS_EMBARGO:0 "Propose an Arms Embargo"
 UN_PROPOSE_ARMS_EMBARGO_DESC:0 "Ask the General Assembly to impose a [concept_un_arms_embargo] on a country whose record gives it grounds (a case strength of 40 or more; see #bold Our Exposure#! in the chamber for how a record is built) and that is our rival or at war with a member. A #bold binding#! resolution, carried by a simple majority. If it carries, for ten years the target's [concept_trade_advantage] in every [Concept('concept_military_good', 'military good')] falls by 30%, imports and exports alike, and its military goods cost 5% more, both scaled by the UN's [concept_un_enforcement]. A [concept_un_veto] leaves a voluntary embargo: half the penalty, for five years. Requires Charter Reform I, and that we are not under an arms embargo ourselves."
 UN_PROPOSE_ARMS_EMBARGO_TT:0 "#bold A General Assembly vote has been called#! on an arms embargo. Human members can vote at once; AI members vote in the ninth to eleventh month, and a [concept_un_permanent_member] may [concept_un_veto] it. Results follow after a year."
 UN_PROPOSE_COURT_REFERRAL:0 "Refer a Dispute to the World Court"
 UN_PROPOSE_COURT_REFERRAL_DESC:0 "Ask the General Assembly to send one of our [Concept('concept_claim', 'claims')] to the [concept_un_world_court]: a state we claim, held by a represented member that is neither our overlord, our subject nor at war with us. The case we name is the one with the best odds for us. A #bold binding#! resolution, carried by a simple majority, and it needs no case against the holder's record. If it carries, the court rules about a month after the vote. If it finds for us, the holder must cede the state or defy the court, and a holder that defies it opens the way to a military mandate. If it finds for the holder, our claim on the region is withdrawn, and for twenty years a [concept_war_goal] we add there costs extra [concept_infamy]. A [concept_un_veto] turns the ruling into an advisory opinion: nothing changes hands. Requires Charter Reform I, and an International Standing of 20 or more."
 UN_PROPOSE_COURT_REFERRAL_TT:0 "#bold A General Assembly vote has been called#! on referring our claim to the World Court. Human members can vote at once; AI members vote in the ninth to eleventh month, and a [concept_un_permanent_member] may [concept_un_veto] it. Results follow after a year, and the court rules about a month later."
 UN_PROPOSE_CREDENTIALS:0 "Propose Suspending a Member's Credentials"
 UN_PROPOSE_CREDENTIALS_DESC:0 "Ask the General Assembly to suspend the [concept_un_credentials] of a member whose record gives it grounds (a case strength of 50 or more; see #bold Our Exposure#! in the chamber) and that breaches the terms of the Declaration of Human Rights or has defied the Assembly's binding decisions (a defiance record of 10 or more). A [concept_un_permanent_member] can be named only after Charter Reform II. It carries with two thirds of the members with a vote, and no [concept_un_veto] can stop it. If it carries, the member's representation is suspended for five years, or until its case falls below 30: it casts no vote, tables nothing, draws no benefits of membership and loses any permanent seat, but it still pays its [concept_un_dues]. Requires Charter Reform I, and an International Standing of 20 or more."
 UN_PROPOSE_CREDENTIALS_TT:0 "#bold A General Assembly vote has been called#! on suspending a member's credentials. Human members can vote at once; AI members vote in the ninth to eleventh month. It carries with two thirds of the members with a vote. Results follow after a year."
 concept_un_arms_embargo:0 "UN Arms Embargo"
 concept_un_arms_embargo_desc:0 "A binding resolution of the [concept_un_general_assembly] that cuts a country's trade in arms. It may be tabled against a country whose case strength is 40 or more and that is the proposer's rival or at war with a member. For ten years the target's [concept_trade_advantage] falls by 30% in every [Concept('concept_military_good', 'military good')]: small arms, ammunition, artillery, tanks, aeroplanes, man-o'-wars and ironclads. Victoria 3 keeps one trade advantage per good, so the penalty bites on imports and exports alike. Its military goods also cost 5% more. Both are scaled by the UN's [concept_un_enforcement]. The target loses 6 International Standing. If a [concept_un_permanent_member] vetoes it, a voluntary embargo of half the strength runs for five years instead, at a cost of 3 standing; a target that voted for its own embargo takes the voluntary one too."
 concept_un_credentials:0 "Credentials"
 concept_un_credentials_desc:0 "A member's right to speak and vote in the [concept_un_general_assembly]. Once the [concept_un_charter] carries Charter Reform I, the Assembly may suspend the credentials of a member whose case strength is 50 or more and that breaches the terms of the Declaration of Human Rights or has defied its binding decisions (a defiance record of 10 or more); a [concept_un_permanent_member] only after Charter Reform II. The motion needs two thirds of the members with a vote and cannot be vetoed. A member whose credentials are suspended keeps its membership and pays its [concept_un_dues], but its representation is suspended as a subject's is: it casts no vote, tables nothing, draws no benefits of membership, runs no UN programme and gives up any permanent seat for good. It loses 8 International Standing (4 if it voted for its own suspension). The suspension lasts five years, or until its case falls below 30."
 concept_un_world_court:0 "World Court"
 concept_un_world_court_desc:0 "The UN's court for disputes between states. Once the [concept_un_charter] carries Charter Reform I, a member may ask the [concept_un_general_assembly] to refer a [concept_claim] of its own: a state held by another represented member that is not its overlord, its subject or at war with it. The court rules about a month after the vote, finding for the claimant with odds between 10% and 90%. They start at 50% and move with who lives in the state (20% for a party whose [concept_primary_cultures] are half its people, 10% for a quarter), whose [concept_homeland] it is (10%), whether the holder has incorporated it (10% against the claimant), the parties' International Standing (0.3% a point of difference, up to 15%) and their records (0.15% a point of the other side's case strength, up to 15%).\n\nA ruling for the claimant obliges the holder to cede the state or defy the court. A holder that defies it is recorded as defying the Assembly, loses standing and costs the UN credibility, and for ten years the claimant may move for a military mandate over the region against it without the usual case of 60. A ruling for the holder withdraws the claimant's claim on the region, and for twenty years a [concept_war_goal] the claimant adds there costs extra [concept_infamy]. If a [concept_un_permanent_member] vetoes the referral, the court gives an advisory opinion instead: nothing changes hands, and a holder it goes against loses 2 standing."
 je_un_chamber_conseq_arms_embargo:0 "  #bold If it carries:#! $un_vote_arms_embargo_passed_tt$"
 je_un_chamber_conseq_arms_embargo_vetoed:0 "  #bold If it carries:#! $un_vote_arms_embargo_passed_vetoed_tt$"
 je_un_chamber_conseq_court_referral:0 "  #bold If it carries:#! the [concept_un_world_court] rules on [THIS.Var('un_res_court_state').GetState.GetName] about a month after the vote. When the case was tabled it gave the claimant #v [THIS.Var('un_res_court_odds').GetValue|0]%#!; it reckons the odds again when it rules. A ruling for the claimant binds the holder to cede the state or defy the court; a ruling for the holder withdraws the claimant's claim on the region. #G UN credibility +1, moving [concept_un_authority]'s target.#!"
 je_un_chamber_conseq_court_referral_vetoed:0 "  #bold If it carries:#! $un_vote_court_referral_passed_vetoed_tt$"
 je_un_chamber_conseq_credentials:0 "  #bold If it carries:#! $un_vote_credentials_passed_tt$"
 je_un_chamber_court_odds_10:0 "    #tooltippable;tooltip:je_un_chamber_court_odds_tt #bold Odds of a ruling for us:#! about 10%#!"
 je_un_chamber_court_odds_20:0 "    #tooltippable;tooltip:je_un_chamber_court_odds_tt #bold Odds of a ruling for us:#! about 20%#!"
 je_un_chamber_court_odds_30:0 "    #tooltippable;tooltip:je_un_chamber_court_odds_tt #bold Odds of a ruling for us:#! about 30%#!"
 je_un_chamber_court_odds_40:0 "    #tooltippable;tooltip:je_un_chamber_court_odds_tt #bold Odds of a ruling for us:#! about 40%#!"
 je_un_chamber_court_odds_50:0 "    #tooltippable;tooltip:je_un_chamber_court_odds_tt #bold Odds of a ruling for us:#! about 50%#!"
 je_un_chamber_court_odds_60:0 "    #tooltippable;tooltip:je_un_chamber_court_odds_tt #bold Odds of a ruling for us:#! about 60%#!"
 je_un_chamber_court_odds_70:0 "    #tooltippable;tooltip:je_un_chamber_court_odds_tt #bold Odds of a ruling for us:#! about 70%#!"
 je_un_chamber_court_odds_80:0 "    #tooltippable;tooltip:je_un_chamber_court_odds_tt #bold Odds of a ruling for us:#! about 80%#!"
 je_un_chamber_court_odds_90:0 "    #tooltippable;tooltip:je_un_chamber_court_odds_tt #bold Odds of a ruling for us:#! about 90%#!"
 je_un_chamber_court_odds_tt:0 "The odds the [concept_un_world_court] would find for us if it ruled today, to the nearest ten. They start at 50%. Our [concept_primary_cultures] being at least half the state's people adds 20% (a quarter, 10%), and the holder's take away as much. A [concept_homeland] of ours adds 10%, one of the holder's takes 10% away, and so does the holder having incorporated the state. Each point of International Standing we hold above the holder adds 0.3%, up to 15% either way. Each point of the holder's case strength adds 0.15%, and each point of ours takes 0.15% away, each up to 15%. They never fall below 10% or rise above 90%, and the court reckons them again when it rules."
 je_un_chamber_propose_need_arms_embargo:0 "A rival, or a country at war with a member, has a record that supports an arms embargo (case strength 40 or more) and is not already under one"
 je_un_chamber_propose_need_court_referral:0 "A state we claim is held by a represented member that is neither our overlord, our subject nor at war with us"
 je_un_chamber_propose_need_credentials:0 "A represented member's record supports suspending its credentials (case strength 50 or more), and it breaches the human-rights terms or has defied the Assembly (a defiance record of 10 or more)"
 je_un_chamber_propose_no_case_arms_embargo:0 "#bold Target:#! #tooltippable;tooltip:je_un_chamber_propose_no_case_arms_embargo_tt None#!"
 je_un_chamber_propose_no_case_arms_embargo_tt:0 "No rival of ours, and no country at war with a member, has a record that supports an arms embargo (case strength 40 or more) without already being under one."
 je_un_chamber_propose_no_case_court_referral:0 "#bold Target:#! #tooltippable;tooltip:je_un_chamber_propose_no_case_court_referral_tt None#!"
 je_un_chamber_propose_no_case_court_referral_tt:0 "No represented member that is neither our overlord, our subject nor at war with us holds a state we claim."
 je_un_chamber_propose_no_case_credentials:0 "#bold Target:#! #tooltippable;tooltip:je_un_chamber_propose_no_case_credentials_tt None#!"
 je_un_chamber_propose_no_case_credentials_tt:0 "No represented member has a record that supports suspending its credentials (case strength 50 or more) while it breaches the human-rights terms or carries a defiance record of 10 or more. A [concept_un_permanent_member] can be named only after Charter Reform II."
 je_un_chamber_propose_target_arms_embargo:0 "#bold Target:#! [AddLocalizationIf(SCOPE.sCountry('un_arms_embargo_pick').Exists, SCOPE.sCountry('un_arms_embargo_pick').GetName)][AddLocalizationIf(Not(SCOPE.sCountry('un_arms_embargo_pick').Exists), 'je_un_chamber_country_gone')]"
 je_un_chamber_propose_target_court_referral:0 "#bold Target:#! [AddLocalizationIf(SCOPE.sCountry('un_court_referral_pick').Exists, SCOPE.sCountry('un_court_referral_pick').GetName)][AddLocalizationIf(Not(SCOPE.sCountry('un_court_referral_pick').Exists), 'je_un_chamber_country_gone')], over #bold [SCOPE.sState('un_court_referral_state').GetName]#!"
 je_un_chamber_propose_target_credentials:0 "#bold Target:#! [AddLocalizationIf(SCOPE.sCountry('un_credentials_pick').Exists, SCOPE.sCountry('un_credentials_pick').GetName)][AddLocalizationIf(Not(SCOPE.sCountry('un_credentials_pick').Exists), 'je_un_chamber_country_gone')]"
 je_un_chamber_propose_topic_arms_embargo:0 "#tooltippable;tooltip:je_un_chamber_propose_topic_arms_embargo_tt #bold Arms Embargo#!#!"
 je_un_chamber_propose_topic_arms_embargo_tt:0 "Cuts the target's trade in arms for ten years: its [concept_trade_advantage] falls by 30% in every [Concept('concept_military_good', 'military good')], imports and exports alike, and its military goods cost 5% more, scaled by the UN's [concept_un_enforcement]. Vetoed, it leaves a voluntary embargo at half strength for five years."
 je_un_chamber_propose_topic_court_referral:0 "#tooltippable;tooltip:je_un_chamber_propose_topic_court_referral_tt #bold Refer a Dispute to the World Court#!#!"
 je_un_chamber_propose_topic_court_referral_tt:0 "The peaceful road to a state we claim. The [concept_un_world_court] weighs who lives there, whose homeland it is, whether the holder has incorporated it, and both sides' standing and records, and rules about a month after the vote. A ruling for us binds the holder to cede the state or defy the court; a ruling for the holder withdraws our claim on the region. Vetoed, the court gives an advisory opinion that changes nothing."
 je_un_chamber_propose_topic_credentials:0 "#tooltippable;tooltip:je_un_chamber_propose_topic_credentials_tt #bold Suspension of Credentials#!#!"
 je_un_chamber_propose_topic_credentials_tt:0 "Takes a member's voice in the Assembly for five years, or until its record improves: no vote, no motions, no benefits of membership and no permanent seat. It keeps paying its [concept_un_dues]. Decided by two thirds of the members with a vote; no [concept_un_veto] can stop it."
 je_un_chamber_topic_arms_embargo:0 "#bold [concept_un_arms_embargo]#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_chamber_topic_court_referral:0 "#bold Referral to the [concept_un_world_court]#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_chamber_topic_credentials:0 "#bold Suspension of [concept_un_credentials]#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_led_reason_27:0 "      #lore a member ceded a state as the World Court ruled#!"
 je_un_led_reason_27_on:0 "      #lore ceded#! $je_un_led_subject_state$ #lore as the World Court ruled#!"
 je_un_led_reason_28:0 "      #lore a member defied the World Court#!"
 je_un_led_reason_28_on:0 "      #lore defied the World Court's ruling in the case brought by#! $je_un_led_subject_country$"
 je_un_led_reason_29:0 "      #lore a ruling of the World Court#!"
 je_un_led_reason_29_on:0 "      #lore a ruling of the World Court over#! $je_un_led_subject_state$"
 je_un_led_topic_arms_embargo:0 "        [concept_un_arms_embargo]"
 je_un_led_topic_court_referral:0 "        Referral to the World Court"
 je_un_led_topic_credentials:0 "        Suspension of Credentials"
 je_un_standing_reason_36:0 "  Most recently: #R the arms embargo imposed on us.#!"
 je_un_standing_reason_37:0 "  Most recently: #R the suspension of our credentials.#!"
 je_un_standing_reason_38:0 "  Most recently: #R an advisory opinion of the World Court against us.#!"
 notification_un_arms_embargo_lifted_notice_desc:0 "The arms embargo the General Assembly imposed on us has run its course. Our trade in military goods is free again."
 notification_un_arms_embargo_lifted_notice_name:0 "The Arms Embargo Ends"
 notification_un_arms_embargo_lifted_notice_tooltip:0 "#header $notification_un_arms_embargo_lifted_notice_name$#!\n$notification_un_arms_embargo_lifted_notice_desc$"
 notification_un_court_bar_notice_desc:0 "We added a war goal against a region the World Court found we have no claim to. For twenty years after its ruling, a goal there costs 10 extra infamy, scaled by the UN's enforcement."
 notification_un_court_bar_notice_name:0 "A Claim the Court Struck Down"
 notification_un_court_bar_notice_tooltip:0 "#header $notification_un_court_bar_notice_name$#!\n$notification_un_court_bar_notice_desc$"
 notification_un_credentials_restored_notice_desc:0 "The suspension of our delegation's credentials has ended. We vote, table resolutions and draw the benefits of membership again. A permanent seat we lost is not given back."
 notification_un_credentials_restored_notice_name:0 "Our Credentials Are Restored"
 notification_un_credentials_restored_notice_tooltip:0 "#header $notification_un_credentials_restored_notice_name$#!\n$notification_un_credentials_restored_notice_desc$"
 notification_un_credentials_suspended_notice_desc:0 "The General Assembly has suspended our delegation's credentials. We remain a member and still pay our UN dues, but we cast no vote and table no resolution, any permanent seat and our UN programmes are given up, and we draw none of the benefits of membership. The suspension lasts five years, or until our record improves to a case strength below 30."
 notification_un_credentials_suspended_notice_name:0 "Our Credentials Are Suspended"
 notification_un_credentials_suspended_notice_tooltip:0 "#header $notification_un_credentials_suspended_notice_name$#!\n$notification_un_credentials_suspended_notice_desc$"
 un_arms_embargo_grounds_tt:0 "A rival, or a country at war with a member, has a record that supports an arms embargo (case strength 40 or more) and is not already under one"
 un_arms_embargo_self_tt:0 "We are not under a UN arms embargo ourselves"
 un_arms_embargo_target_modifier:0 "UN Arms Embargo"
 un_arms_embargo_target_modifier_desc:0 "The General Assembly has embargoed arms to this country. Its trade in every military good is choked, imports and exports alike, and its armies cost more to supply."
 un_arms_embargo_voluntary_modifier:0 "Voluntary UN Arms Embargo"
 un_arms_embargo_voluntary_modifier_desc:0 "Members of the General Assembly have agreed to withhold arms from this country of their own accord. Its trade in military goods suffers, though less than under a full embargo."
 un_court.2.a:0 "We abide by the ruling."
 un_court.2.b:0 "The court has no say over our soil."
 un_court.2.d:0 "The [concept_un_world_court] has ruled on the dispute the General Assembly sent it, and found for [SCOPE.sCountry('un_crt_claimant').GetName]: [SCOPE.sState('un_crt_state').GetName] should pass to them. The judges weighed the case at #v [GetGlobalVariable('un_court_ruled_odds').GetValue|0]%#! for the claimant. The ruling binds us. We can cede the state and be seen to keep the law, or keep the state and defy the court before the world."
 un_court.2.f:0 "'The court has no army,' the defence minister said.\n\n'No,' the foreign minister said, folding the judgment back into its envelope. 'It has every other member of the Assembly, and they will all remember what we do this week.'"
 un_court.2.t:0 "The World Court Rules Against Us"
 un_court.3.a:0 "So the court has spoken."
 un_court.3.d_advisory_claimant_lost:0 "The [concept_un_world_court] has given its advisory opinion on our claim to [SCOPE.sStateRegion('un_crt_region').GetName], and it is for [SCOPE.sCountry('un_crt_holder').GetName]. The judges gave our case #v [GetGlobalVariable('un_court_ruled_odds').GetValue|0]%#! and still found the holder's title the stronger. The referral was vetoed, so the opinion binds no one, and our claim stands."
 un_court.3.d_advisory_claimant_won:0 "The [concept_un_world_court] has given its advisory opinion on our claim to [SCOPE.sStateRegion('un_crt_region').GetName], and it is for us: the judges, who gave our case #v [GetGlobalVariable('un_court_ruled_odds').GetValue|0]%#!, hold that the state should be ours. A veto took the force out of the opinion, so nothing changes hands, but [SCOPE.sCountry('un_crt_holder').GetName]'s standing in the Assembly suffers for it."
 un_court.3.d_advisory_holder_lost:0 "The [concept_un_world_court] has given its advisory opinion on [SCOPE.sCountry('un_crt_claimant').GetName]'s claim to [SCOPE.sStateRegion('un_crt_region').GetName], and it is against us. A veto in the [concept_un_security_council] means it binds no one and the state stays ours, but the opinion is on the record and our standing suffers for it."
 un_court.3.d_advisory_holder_won:0 "The [concept_un_world_court] has given its advisory opinion on [SCOPE.sCountry('un_crt_claimant').GetName]'s claim to [SCOPE.sStateRegion('un_crt_region').GetName], and it is for us. The referral was vetoed, so the opinion binds no one, but the claim has been heard and found wanting."
 un_court.3.d_claimant_lost:0 "The [concept_un_world_court] has found for [SCOPE.sCountry('un_crt_holder').GetName]. The judges gave our case #v [GetGlobalVariable('un_court_ruled_odds').GetValue|0]%#! and hold that [SCOPE.sStateRegion('un_crt_region').GetName] stays where it is. Our claim on the region is withdrawn, and for twenty years any war goal we add there will cost us dearly in [concept_infamy]."
 un_court.3.d_defied:0 "[SCOPE.sCountry('un_crt_holder').GetName] has defied the [concept_un_world_court]. The judges found that [SCOPE.sStateRegion('un_crt_region').GetName] should be ours, and [SCOPE.sCountry('un_crt_holder').GetName] refuses to hand it over. The Assembly will not forget it: for ten years we may move for a military mandate over the region against them without the case against their record that a mandate usually needs."
 un_court.3.d_holder_won:0 "The [concept_un_world_court] has found for us. [SCOPE.sCountry('un_crt_claimant').GetName]'s claim on [SCOPE.sStateRegion('un_crt_region').GetName] is struck down and withdrawn, and for twenty years a war goal it adds against that region costs it extra [concept_infamy]."
 un_court.3.d_moot_claimant:0 "The [concept_un_world_court] has struck our case over [SCOPE.sStateRegion('un_crt_region').GetName] off its list. [SCOPE.sCountry('un_crt_holder').GetName] no longer holds the state, so the judges have nothing left to rule on."
 un_court.3.d_moot_holder:0 "The [concept_un_world_court] has struck [SCOPE.sCountry('un_crt_claimant').GetName]'s case over [SCOPE.sStateRegion('un_crt_region').GetName] off its list. We no longer hold the state, so the judges have nothing left to rule on."
 un_court.3.d_obeyed:0 "[SCOPE.sCountry('un_crt_holder').GetName] has bowed to the [concept_un_world_court]'s ruling over [SCOPE.sStateRegion('un_crt_region').GetName] and handed the state to us. What years of claiming could not win, a month in court has."
 un_court.3.f:0 "The president of the court read the operative paragraph twice, once in French and once in English. Nobody in the gallery moved until she had finished, and then both delegations stood at once, as if each had won."
 un_court.3.t:0 "The World Court Has Ruled"
 un_court.3.t_advisory:0 "An Advisory Opinion of the World Court"
 un_court.3.t_moot:0 "A Case Struck Off"
 un_court_advisory_standing_tt:0 "#R International Standing: −2#! for an advisory opinion of the World Court against us."
 un_court_cede_moot_tt:0 "[SCOPE.sState('un_crt_state').GetName] is no longer ours to cede: the ruling is moot."
 un_court_claim_struck_tt:0 "[SCOPE.sCountry('un_crt_claimant').GetName]'s [concept_claim] on [SCOPE.sStateRegion('un_crt_region').GetName] is withdrawn. For twenty years a [concept_war_goal] it adds there costs it extra [concept_infamy]."
 un_court_claim_withdrawn_tt:0 "Our [concept_claim] on [SCOPE.sStateRegion('un_crt_region').GetName] is withdrawn. For twenty years a [concept_war_goal] we add against a state there costs 10 extra [concept_infamy], scaled by the UN's [concept_un_enforcement]."
 un_court_defied_mandate_tt:0 "For ten years [SCOPE.sCountry('un_crt_claimant').GetName] may move for a military mandate over [SCOPE.sStateRegion('un_crt_region').GetName] against us without the case of 60 a mandate otherwise needs."
 un_court_mandate_open_tt:0 "For ten years we may move for a military mandate over [SCOPE.sStateRegion('un_crt_region').GetName] against [SCOPE.sCountry('un_crt_holder').GetName] without the case of 60 a mandate otherwise needs."
 un_court_referral_case_tt:0 "A state we claim is held by a represented member that is neither our overlord, our subject nor at war with us"
 un_court_referral_standing_tt:0 "Our International Standing is 20 or more: the Assembly does not hear a disgraced claimant"
 un_credentials_grounds_tt:0 "A represented member's record supports suspending its credentials (case strength 50 or more), and it breaches the human-rights terms or carries a defiance record of 10 or more"
 un_credentials_standing_tt:0 "Our International Standing is 20 or more: a disgraced member cannot challenge another's credentials"
 un_standing_arms_embargo_accepted_tt:0 "#R International Standing: −3#! for accepting the Assembly's [concept_un_arms_embargo]."
 un_standing_arms_embargo_partial_tt:0 "#R International Standing: −3#! for being placed under a voluntary [concept_un_arms_embargo]."
 un_standing_arms_embargo_tt:0 "#R International Standing: −6#! for being placed under a [concept_un_arms_embargo]."
 un_standing_credentials_accepted_tt:0 "#R International Standing: −4#! for accepting the suspension of our [concept_un_credentials]."
 un_standing_credentials_tt:0 "#R International Standing: −8#! for having our [concept_un_credentials] suspended by the [concept_un_general_assembly]."
 un_vote.1.d_arms_embargo:0 "[SCOPE.sCountry('un_vote_proposer').GetName] asks the General Assembly to impose an arms embargo on [SCOPE.sCountry('un_vote_target').GetName]. Its record gives the Assembly grounds, and its wars are the reason: cut off from the world's rifles, shells and aircraft, it would find them harder to wage. How shall [ROOT.GetCountry.GetName] vote?"
 un_vote.1.d_arms_embargo_target:0 "[SCOPE.sCountry('un_vote_proposer').GetName] asks the General Assembly to impose an arms embargo on us. If it carries, our trade in every military good will suffer for ten years and our armies will cost more to keep. We may fight the resolution, or vote for it and accept a voluntary embargo, at half the penalty and for half as long, in place of the full one."
 un_vote.1.d_court_referral:0 "[SCOPE.sCountry('un_vote_proposer').GetName] asks the General Assembly to send its claim on [GetGlobalVariable('un_court_tabled_state').GetState.GetName], held by [SCOPE.sCountry('un_vote_target').GetName], to the [concept_un_world_court]. The court would weigh who lives in the state, whose homeland it is and whether it has been incorporated, and both parties' standing and records. Today it would find for the claimant with odds of #v [GetGlobalVariable('un_court_tabled_odds').GetValue|0]%#!. Its ruling would bind the loser: the holder to cede the state or defy the court, the claimant to give up its claim. How shall [ROOT.GetCountry.GetName] vote?"
 un_vote.1.d_court_referral_target:0 "[SCOPE.sCountry('un_vote_proposer').GetName] asks the General Assembly to send its claim on our state of [GetGlobalVariable('un_court_tabled_state').GetState.GetName] to the [concept_un_world_court]. If the referral carries, the court rules about a month after the vote, and today it would find against us with odds of #v [GetGlobalVariable('un_court_tabled_odds').GetValue|0]%#!. A ruling against us would leave two choices: cede the state, or defy the court before the world. A ruling for us would end the claim for twenty years."
 un_vote.1.d_credentials:0 "[SCOPE.sCountry('un_vote_proposer').GetName] asks the General Assembly to suspend the credentials of [SCOPE.sCountry('un_vote_target').GetName]'s delegation. Its record gives the Assembly grounds. If two thirds of the members with a vote agree, [SCOPE.sCountry('un_vote_target').GetName] keeps its membership and its dues but loses its voice: no vote, no motions, no benefits of membership and no permanent seat, for five years or until its record improves. No veto can save it. How shall [ROOT.GetCountry.GetName] vote?"
 un_vote.1.d_credentials_target:0 "[SCOPE.sCountry('un_vote_proposer').GetName] asks the General Assembly to suspend our delegation's credentials. If two thirds of the members with a vote agree, we stay a member and go on paying our dues, but we lose our voice: no vote, no motions, no benefits of membership and no permanent seat, for five years or until our record improves. No veto can save us. We may fight the motion, or vote for it and own the charge, which costs us half the standing."
 un_vote.1.t_arms_embargo:0 "Arms Embargo Vote"
 un_vote.1.t_court_referral:0 "Referral to the World Court"
 un_vote.1.t_credentials:0 "Credentials Vote"
 un_vote.2.d_arms_embargo_failed:0 "The General Assembly has refused to embargo arms to [SCOPE.sCountry('un_vote_target').GetName]. The vote failed [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. Its arsenals stay open to the world's sellers."
 un_vote.2.d_arms_embargo_passed:0 "The General Assembly has imposed an arms embargo on [SCOPE.sCountry('un_vote_target').GetName], [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] votes to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. For ten years its trade in arms and munitions is choked, and every army it keeps costs more to supply."
 un_vote.2.d_arms_embargo_passed_vetoed:0 "The Assembly carried the arms embargo, and a [concept_un_permanent_member] vetoed it in the [concept_un_security_council]. What remains is a voluntary embargo: [SCOPE.sCountry('un_vote_target').GetName]'s arms trade suffers half the penalty, for five years."
 un_vote.2.d_court_referral_failed:0 "The General Assembly has refused to send our claim on [GetGlobalVariable('un_court_tabled_state').GetState.GetName] to the World Court. The vote failed [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. The claim stands, and [SCOPE.sCountry('un_vote_target').GetName] keeps the state."
 un_vote.2.d_court_referral_passed:0 "The General Assembly has sent our claim on [GetGlobalVariable('un_court_tabled_state').GetState.GetName] to the World Court, [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] votes to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. [SCOPE.sCountry('un_vote_target').GetName] must now answer to the judges, who will rule within a month."
 un_vote.2.d_court_referral_passed_vetoed:0 "The Assembly carried the referral, and a [concept_un_permanent_member] vetoed it in the [concept_un_security_council]. The World Court will still hear the case, but its word will be an advisory opinion: whichever way it goes, [GetGlobalVariable('un_court_tabled_state').GetState.GetName] stays where it is."
 un_vote.2.d_credentials_failed:0 "The motion to suspend [SCOPE.sCountry('un_vote_target').GetName]'s credentials fell short of two thirds of the members with a vote: [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] for, [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0] against. Its delegation keeps its voice."
 un_vote.2.d_credentials_passed:0 "The General Assembly has suspended the credentials of [SCOPE.sCountry('un_vote_target').GetName], [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] votes to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. Its delegation keeps its chairs and pays its dues, but it will not vote or move a motion for five years, or until its record improves."
 un_vote_arms_embargo_passed_tt:0 "The arms embargo carried. #G UN credibility +1, moving [concept_un_authority]'s target.#! For ten years the target's [concept_trade_advantage] in every [Concept('concept_military_good', 'military good')] falls by 30% and its military goods cost 5% more, scaled by the UN's [concept_un_enforcement] (#v ×[GetGlobalVariable('un_enforcement_now').GetValue|1]#! at the current tier). A target that voted for its own embargo takes the voluntary one instead: half the penalty, for five years."
 un_vote_arms_embargo_passed_vetoed_tt:0 "The embargo passed the General Assembly but was vetoed in the [concept_un_security_council]. #G UN credibility +0.5, moving [concept_un_authority]'s target.#! A voluntary embargo instead: half the penalty, for five years, scaled by the UN's [concept_un_enforcement] (#v ×[GetGlobalVariable('un_enforcement_now').GetValue|1]#!)."
 un_vote_court_referral_passed_tt:0 "The Assembly sent the dispute to the [concept_un_world_court]. #G UN credibility +1, moving [concept_un_authority]'s target.#! The court rules about a month from now, on the odds as they stand then. If it finds for the claimant, the holder must cede the state or defy the court; if it finds for the holder, the claimant's claim on the region is withdrawn."
 un_vote_court_referral_passed_vetoed_tt:0 "The referral passed the General Assembly but was vetoed in the [concept_un_security_council], so the [concept_un_world_court] gives an advisory opinion instead of a ruling. #G UN credibility +0.5, moving [concept_un_authority]'s target.#! Nothing changes hands; if the opinion goes against the holder, it loses 2 International Standing."
 un_vote_credentials_passed_tt:0 "The Assembly suspended the member's [concept_un_credentials]. #G UN credibility +1, moving [concept_un_authority]'s target.#! For five years, or until its case falls below 30, its representation is suspended: it casts no vote, tables nothing, draws no benefits of membership and gives up any permanent seat, but it still pays its [concept_un_dues]."

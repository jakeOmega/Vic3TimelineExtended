 setting_banking_system_disabled:0 "Banking System Disabled"
 setting_banking_system_disabled_desc:0 "The [concept_banking_cycle] [concept_journal_entry] is disabled. [concept_financial_regulation] laws keep their general economic effects, such as Urban Center [concept_throughput], [concept_investment_pool] contributions, innovation, and government [concept_dividends], but banking-specific modifiers are inactive."
 setting_banking_system_enabled:0 "Banking System Enabled"
 setting_banking_system_enabled_desc:0 "The [concept_banking_cycle] [concept_journal_entry] is active. [concept_financial_regulation] laws provide banking intervention tools, momentum effects, and crash chance modifiers that interact with the banking cycle system."
 setting_banking_system_simplified:0 "Banking System Simplified"
 setting_banking_system_simplified_desc:0 "The [concept_banking_cycle] [concept_journal_entry] is active, without monetary policy: no policy rate to set, no inflation, no exchange rate, and no currency pegs, swap lines or shared currency. Your government still borrows at the world reference rate plus its own risk premium."
 setting_covert_warfare_disabled:0 "Covert Warfare Disabled"
 setting_covert_warfare_disabled_desc:0 "The covert warfare [concept_journal_entry] is disabled. [concept_intelligence_capacity] modifiers from technologies still appear but [concept_covert_operations] are unavailable."
 setting_covert_warfare_early_unlock:0 "Covert Warfare: Early Unlock"
 setting_covert_warfare_early_unlock_desc:0 "The [concept_covert_warfare_system] [concept_journal_entry] opens with $central_archives$. Until $mainframe_computers$ or the $law_ministry_of_intelligence_and_security$ law, funding stops at Professional, and only operations whose technology you have can be launched: espionage and wartime sabotage at first."
 setting_covert_warfare_enabled:0 "Covert Warfare: Late Unlock"
 setting_covert_warfare_enabled_desc:0 "The [concept_covert_warfare_system] [concept_journal_entry] opens with $mainframe_computers$ or the $law_ministry_of_intelligence_and_security$ law. Nations build [concept_intelligence_capacity] through technology and [concept_literacy], and launch [concept_covert_operations] against rivals."
 setting_cultural_hegemony_disabled:0 "Cultural Hegemony Disabled"
 setting_cultural_hegemony_disabled_desc:0 "The cultural hegemony [concept_journal_entry] is disabled. [concept_cultural_pull] modifiers from technologies and events still apply to tooltips but have no gameplay effect."
 setting_cultural_hegemony_early_unlock:0 "Cultural Hegemony: Early Unlock"
 setting_cultural_hegemony_early_unlock_desc:0 "As Late Unlock, but the [concept_journal_entry] opens once any country has the $electric_telegraph$, and International Cultural Outreach needs the telegraph rather than $mass_media$. The Global Media Campaign and the events about broadcast media still wait for $mass_media$."
 setting_cultural_hegemony_enabled:0 "Cultural Hegemony: Late Unlock"
 setting_cultural_hegemony_enabled_desc:0 "The [concept_cultural_hegemony_system] [concept_journal_entry] opens once any country has $mass_media$. Nations compete for global cultural influence through art, [concept_prestige], living standards, and technology, and the dominant cultural power attracts migrants."
 setting_culture_merges_disabled:0 "Culture Merges Disabled"
 setting_culture_merges_disabled_desc:0 "Related cultures stay separate and no merge starts. Turned off mid-game, a running merge pauses where it stands: pops that have converted keep their new culture, and the merge resumes if the rule is turned back on. The laws, technologies and institutions that speed merges keep their other effects."
 setting_culture_merges_enabled:0 "Culture Merges Enabled"
 setting_culture_merges_enabled_desc:0 "Related cultures can merge into one national culture. A country that holds most of a set of closely related cultures, such as $north_german$ and $south_german$, treats them as equals and has the right technology can start a merge, which takes a few decades."
 setting_custom_religions_allowed:0 "Custom Religions Allowed"
 setting_custom_religions_allowed_desc:0 "Custom religions are allowed in this game. You will receive a [concept_journal_entry] allowing you to select the ideology and name of your religion."
 setting_custom_religions_not_allowed:0 "Custom Religions Not Allowed"
 setting_custom_religions_not_allowed_desc:0 "Custom religions are not allowed in this game."
 setting_decolonization_disabled:0 "Decolonization Disabled"
 setting_decolonization_disabled_desc:0 "The colonial empire [concept_journal_entry] is disabled. [concept_decolonization_system] technology effects still apply but the decolonization event chain and [concept_colonial_stability] tracking are inactive."
 setting_decolonization_enabled:0 "Decolonization Enabled"
 setting_decolonization_enabled_desc:0 "The colonial empire [concept_journal_entry] is active. Nations with overseas colonies face [concept_decolonization_system] pressures, [concept_colonial_stability] tracking, and related events after researching decolonization technology."
 setting_demographics_disabled:0 "Disabled"
 setting_demographics_disabled_desc:0 "No census and no Demographics panel. [concept_inheritance_concentration] still works."
 setting_demographics_display_only:0 "Display only"
 setting_demographics_display_only_desc:0 "Experimental. The census and its panel only: births and deaths follow the game's own rules."
 setting_demographics_full:0 "Full"
 setting_demographics_full_desc:0 "Experimental. Every state keeps a census of its people by age and sex, shown on the Demographics panel. The census sets births, deaths and workforce in place of most law and technology effects on them; severe starvation, war and other shocks still apply."
 setting_free_market_construction_disabled:0 "Free Market Construction Disabled"
 setting_free_market_construction_disabled_desc:0 "Construction works as in the base game, with the $te_construction_market_site$ as the construction sector. There is no construction good and no construction maintenance, and your economic-system law sets the private share. #b Construction Sites must currently be built from the state view.#!"
 setting_free_market_construction_enabled:0 "Free Market Construction Enabled"
 setting_free_market_construction_enabled_desc:0 "[concept_construction] is a traded good. $building_construction_sector$ buildings sell it, the government buys what you set in the construction panel, and investors buy from the [concept_investment_pool]. Industry and infrastructure use some as maintenance, and more after changing production methods. See [concept_te_construction_market]."
 setting_free_market_construction_no_ai_retooling:0 "Free Market Construction without AI Retooling Costs"
 setting_free_market_construction_no_ai_retooling_desc:0 "As Free Market Construction Enabled, but AI countries pay no retooling costs: switching production methods does not raise the construction their buildings use as maintenance. Players still pay them. See [concept_te_construction_market]."
 setting_free_market_construction_no_maintenance:0 "Free Market Construction without Maintenance"
 setting_free_market_construction_no_maintenance_desc:0 "As Free Market Construction Enabled, but buildings use no construction as maintenance, so switching production methods costs none either. [concept_construction] is still traded, and a few company buildings use it in production. See [concept_te_construction_market]."
 setting_free_market_construction_no_retooling:0 "Free Market Construction without Retooling Costs"
 setting_free_market_construction_no_retooling_desc:0 "As Free Market Construction Enabled, but buildings do not retool: switching production methods does not raise the construction a building uses as maintenance. See [concept_te_construction_market]."
 setting_global_commons_disabled:0 "Global Commons Disabled"
 setting_global_commons_disabled_desc:0 "The $building_ocean_mine$ is uncapped: any coastal state can build it without limit. The Law of the Sea has no seabed terms, and there are no Antarctic research stations and no Antarctic Treaty. Launch windows and orbital debris follow the Space Race rule."
 setting_global_commons_enabled:0 "Global Commons Enabled"
 setting_global_commons_enabled_desc:0 "The seabed is a commons. Each of five ocean basins holds a fixed pool of seabed licenses, shared out yearly among coastal countries by claim weight, and every $building_ocean_mine$ level needs one. The UN can regulate the seabed, and an Antarctic Treaty can close the Southern basin."
 setting_global_warming_disabled:0 "Global Warming Disabled"
 setting_global_warming_disabled_desc:0 "The global warming [concept_journal_entry] is disabled. There is no climate change: greenhouse gas emissions are not tracked, the world does not warm, and no climate events occur. Policies and technologies that reduce [concept_pollution_system] still do so."
 setting_global_warming_enabled:0 "Global Warming Enabled"
 setting_global_warming_enabled_desc:0 "The global warming [concept_journal_entry] is active. Greenhouse gas emissions are tracked and climate policies affect global temperature rise. Environmental modifiers provide both emissions reduction and [concept_pollution_system] reduction effects."
 setting_grand_monuments_disabled:0 "Grand Monuments Disabled"
 setting_grand_monuments_disabled_desc:0 "The Grand Monument cannot be built, and no monument ceremony, contest, trophy or journal entry runs."
 setting_grand_monuments_enabled:0 "Grand Monuments Enabled"
 setting_grand_monuments_enabled_desc:0 "Countries may raise Grand Monuments to their crown, republic, revolution, leader, faith or nation. What a monument honors can fall with the regime that raised it, and the next government decides whether to pull it down, rededicate it or keep it as heritage. An occupying army can carry one off as a trophy."
 setting_heir_education_disabled:0 "Heir Education Disabled"
 setting_heir_education_disabled_desc:0 "The [concept_heir] education [concept_journal_entry] is disabled. Heirs do not receive education investments and their future capabilities are unaffected by this system. Characters only have administrative, diplomatic, and military aptitude traits if Universal Aptitude Traits is enabled."
 setting_heir_education_enabled:0 "Heir Education Enabled"
 setting_heir_education_enabled_desc:0 "The [concept_heir] education [concept_journal_entry] is active. Nations can invest in the education of their heirs, affecting their future capabilities and governance."
 setting_internal_resettlement_ai_voluntary:0 "Internal Resettlement: AI Voluntary Only"
 setting_internal_resettlement_ai_voluntary_desc:0 "As enabled, but AI countries run only voluntary programs. Penal Transportation, Special Settlements and Rustication remain open to players."
 setting_internal_resettlement_disabled:0 "Internal Resettlement Disabled"
 setting_internal_resettlement_disabled_desc:0 "The Settlement Authority cannot be built and no resettlement programs run."
 setting_internal_resettlement_enabled:0 "Internal Resettlement Enabled"
 setting_internal_resettlement_enabled_desc:0 "Countries may build a Settlement Authority on a thinly populated frontier and run government resettlement programs into it, from land grants to penal transportation, as their laws allow."
 setting_nuclear_weapons_disabled:0 "Nuclear Weapons Disabled"
 setting_nuclear_weapons_disabled_desc:0 "The nuclear weapons [concept_journal_entry] is disabled. Nuclear weapons technology can still be researched but the [concept_nuclear_program] progression, stockpile tracking, and related events are inactive."
 setting_nuclear_weapons_enabled:0 "Nuclear Weapons Enabled"
 setting_nuclear_weapons_enabled_desc:0 "The nuclear weapons [concept_journal_entry] is active. [Concept('concept_great_power', 'Great powers')] and eligible [Concept('concept_major_power', 'major powers')] can pursue nuclear weapons programs with funding levels, stockpile tracking, and related diplomatic consequences."
 setting_social_movements_disabled:0 "Social Movements Disabled"
 setting_social_movements_disabled_desc:0 "The social movement journal entries are disabled: civil rights, human augmentation, morphological freedom, digital rights and surveillance, the post-scarcity transition, and mental health, with the events they fire. Related technologies and laws still exist."
 setting_social_movements_enabled:0 "Social Movements Enabled"
 setting_social_movements_enabled_desc:0 "The social movement journal entries are active. As nations research the relevant technologies, they work through civil rights, the human augmentation and morphological freedom debates, digital rights and surveillance, the post-scarcity transition, and mental health awareness."
 setting_space_race_colonies_full:0 "[concept_space_race]: Full Colonies"
 setting_space_race_colonies_full_desc:0 "As Simple Colonies, and wars reach space. Space Command builds warships that fight between the planets and blockade, seize or destroy colonies, and marines garrison them. An enemy fleet in Earth orbit can stop your launches, and holding Earth orbit supports your troops on the ground."
 setting_space_race_colonies_simple:0 "[concept_space_race]: Simple Colonies"
 setting_space_race_colonies_simple_desc:0 "As Races Only, and colonies are built up, held and lost. A colony fleet claims the site you choose when it lands, and settlers and modules fill the colony. A colony can be ceded by treaty or taken in war, and as it grows it can break away and live on as a free colony."
 setting_space_race_disabled:0 "[concept_space_race] Disabled"
 setting_space_race_disabled_desc:0 "The [concept_space_race] journal entries are disabled. Space-related technologies can still be researched but the milestone competition system, funding programs, and space race events are inactive."
 setting_space_race_enabled:0 "[concept_space_race]: Races Only"
 setting_space_race_enabled_desc:0 "The [concept_space_race] journal entries are active. [Concept('concept_great_power', 'Great powers')] and [Concept('concept_major_power', 'major powers')] race through milestones from suborbital flight to interstellar probes, at a pace their funding sets. A colony stays with the power that founded it."
 setting_te_principle_slots_eight:0 "Up to Eight"
 setting_te_principle_slots_eight_desc:0 "A [concept_power_bloc] can hold up to #v 8#! [Concept('concept_power_bloc_principle', '$concept_power_bloc_principles|q$')]. On top of the base game's slots from [concept_power_bloc_rank] and members, each of $intergovernmental_organizations$, $containerization$, $globalization$ and $universal_digital_identity$ the leader has researched adds a slot."
 setting_te_principle_slots_four:0 "Four (Base Game)"
 setting_te_principle_slots_four_desc:0 "A [concept_power_bloc] holds up to #v 4#! [Concept('concept_power_bloc_principle', '$concept_power_bloc_principles|q$')], opened by [concept_power_bloc_rank] and members as in the base game. Technologies add no slots."
 setting_united_nations_disabled:0 "United Nations Disabled"
 setting_united_nations_disabled_desc:0 "The United Nations [concept_journal_entry] is disabled. Intergovernmental organization technology can still be researched but the UN founding, membership, voting, and related diplomatic events are inactive."
 setting_united_nations_early_unlock:0 "United Nations: Early Unlock"
 setting_united_nations_early_unlock_desc:0 "As Late Unlock, but a great power can found the organization with $multilateral_alliances$, as the League of Nations was. Until some country has $intergovernmental_organizations$, its charter can't be reformed, which keeps it at Established or below."
 setting_united_nations_enabled:0 "United Nations: Late Unlock"
 setting_united_nations_enabled_desc:0 "The United Nations [concept_journal_entry] opens with $intergovernmental_organizations$. Nations can found and join the UN, vote in the General Assembly, contribute to peacekeeping, and engage with UN-related diplomatic events."
 setting_universal_aptitude_traits_disabled:0 "Universal Aptitude Traits Disabled"
 setting_universal_aptitude_traits_disabled_desc:0 "Administrative, diplomatic and military aptitude traits exist only with Heir Education enabled, and only rulers and heirs have them. A ruler who leaves the throne loses them, and regains the same ones on returning to power."
 setting_universal_aptitude_traits_enabled:0 "Universal Aptitude Traits Enabled"
 setting_universal_aptitude_traits_enabled_desc:0 "Every adult character is assigned administrative, diplomatic, and military aptitude traits, even with Heir Education disabled (the traits simply cannot be shaped through education). Useful for total conversions where any character might gain a political role."
 setting_world_war_disabled:0 "World War Disabled"
 setting_world_war_disabled_desc:0 "The world war [concept_journal_entry] is disabled. Ideological tensions and world war events will not occur."
 setting_world_war_early_unlock:0 "World War: Early Unlock"
 setting_world_war_early_unlock_desc:0 "As Late Unlock, but the [concept_journal_entry] opens with $trench_works$, and until $combined_arms$ a liberal great power and an autocratic one count as opposed, as in 1914. A great power that fought a world war before $combined_arms$ can fight another after it."
 setting_world_war_enabled:0 "World War: Late Unlock"
 setting_world_war_enabled_desc:0 "The world war [concept_journal_entry] opens for [Concept('concept_great_power', 'great powers')] with $combined_arms$. Ideological tensions between great powers can escalate into a global conflict with leadup, active war, and post-war phases."

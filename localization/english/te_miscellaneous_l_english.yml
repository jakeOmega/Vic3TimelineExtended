 nd_tt_doctrine_alarms_rivals:0 "Our rivals' opinion of us worsens by #R 10#!"
 nd_tt_doctrine_permits_strike:0 "Our nuclear doctrine permits using them against this enemy now"
 nd_tt_doctrine_tenure:0 "Our doctrine has been in force at least two years"
 nd_tt_exercise_continued:0 "The exercise continues for six more weeks, and so does their alarm"
 nd_tt_exercise_effect:0 "For #v 6#! weeks the crisis danger rises by #R 10#!, and if we made the threat, their pressure to concede rises by #G 10#!"

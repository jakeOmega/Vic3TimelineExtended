 SR_OLIVE_BRANCH_RELATIONS_TT:0 "#G +10#! relations with all nations with rocketry."
 SR_ORBITAL_CIVILIAN_CHOSEN_TT:0 "Our first astronaut will be a civilian volunteer, demonstrating that space belongs to all humanity. The symbolic flight will translate into lasting [concept_prestige] and cultural influence."
 SR_ORBITAL_MILITARY_CHOSEN_TT:0 "Our first astronaut will be a military test pilot, bringing precision and discipline to the mission. The military expertise will accelerate our military research and diplomatic influence."
 SR_ORBITAL_SCIENTIST_CHOSEN_TT:0 "Our first astronaut will be a scientist, turning orbital flight into a research mission. The scientific findings will permanently raise our research speed and innovation cap."
 SR_PROBE_ASTEROID_CHOSEN_TT:0 "Our probe will chart the asteroid belt, yielding navigation data and prospecting surveys for future industrial expansion. The prospecting data will permanently raise our innovation cap and speed up the space-race program."
 SR_PROBE_MARS_CHOSEN_TT:0 "Our probe will target Mars, searching for evidence of water and past life. The Mars survey will yield enduring [concept_prestige] and the strongest boost to our space-race progress."
 SR_PROBE_VENUS_CHOSEN_TT:0 "Our probe will target Venus, studying its atmosphere and greenhouse dynamics. The atmospheric data will accelerate our research and the wider space-race program."

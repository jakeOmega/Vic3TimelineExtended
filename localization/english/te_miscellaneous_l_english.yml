 un_mission_aid_joined_tt:0 "We join, or open, a #G UN aid mission#! in the famine-stricken state. It succeeds when the famine is over and the state's standard of living has recovered on its own account, not just by the mission's help."
 un_mission_aid_opened_tt:0 "A #G UN aid mission#! goes to the requester's state most in need, with the members who pledge as its donors. It works in that state, and succeeds when the state's standard of living has risen on its own account, not just by the mission's help: to 10, or past where it started if that was higher."

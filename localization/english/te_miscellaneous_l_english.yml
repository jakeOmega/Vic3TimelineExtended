 banking_mon_delegate_off_tt:0 "Takes the rate target back from the central bank. It stays where the bank last left it until you move it."
 banking_mon_delegate_on_tt:0 "Hands the rate target to the central bank, which will set it from its mandate at each monthly update."
 banking_mon_mandate_peg_set_tt:0 "Orders your central bank to hold the rate target on the world rate, to the tenth of a point — up to a point above it while the vault is short of gold — so that gold does not drain away, and to ignore your own cycle while it does. It takes effect at the next monthly update."
 banking_mon_mandate_set_tt:0 "Changes the rule your central bank follows. It takes effect at the next monthly update."
 banking_mon_monetise_step_tt:0 "Changes how much of your spending is paid for with money your bank creates rather than money you borrow. Every step is worth about #b 1%#! of a year's economic output in newly minted money — a fifth again on top of an ordinary mint for a small economy, and a good deal more for a large one, because the ordinary mint stops growing once an economy passes a certain size. Every step is also worth about #b 2.5%#! on inflation for as long as it runs, more again once lenders and workers come to expect it, and #b 0.5%#! on everything you borrow, because lenders price a government that is printing to pay them. Adding a step buys all of that; taking one away gives it back. It takes effect at the next monthly update."
 banking_mon_recapitalise_tt:0 "Moves @money!#v [GetPlayer.MakeScope.ScriptValue('te_mon_bank_recap_amount')|D]#! from your treasury into the central bank's gold reserve — a tenth of the reserve's limit, or whatever room is left in it. It is how a government with money defends a peg without a recession. The gold is the bank's from then on: it cannot be taken back."
 banking_mon_step_tt:0 "Moves the rate target by one point — #b Ctrl#!-click for a tenth of a point, #b Shift#!-click to go straight to the limit your monetary law allows. The rate itself follows at about a third of a point a month, so a one-point change arrives over a quarter."
 banking_mon_tt_above_floor:0 "The target is above the lowest rate your monetary law allows"
 banking_mon_tt_below_ceiling:0 "The target is below the highest rate your monetary law allows"
 banking_mon_tt_can_monetise:0 "[GetPlayer.GetCustom('te_mon_monetise_condition')]"
 banking_mon_tt_commodity_ceiling:0 "The target is below the ceiling your coinage leaves you — three points over the world rate"
 banking_mon_tt_commodity_floor:0 "The target is above the floor your coinage leaves you — one point under the world rate"
 banking_mon_tt_currently_delegated:0 "The dial is currently delegated to the bank"
 banking_mon_tt_gold_only:0 "Your currency is on a gold standard, and convertible"
 banking_mon_tt_mandate_binds:0 "The mandate actually drives the dial — the bank is delegated or independent"
 banking_mon_tt_mandate_other:0 "This is not the mandate already in force"
 banking_mon_tt_monetise_above_floor:0 "Some of your spending is already being paid for with printed money"
 banking_mon_tt_monetise_below_ceiling:0 "You are not yet printing as much as this lever allows"
 banking_mon_tt_needs_dial:0 "Your country sets its own policy rate"
 banking_mon_tt_not_cbi:0 "Your central bank is not independent of the government"
 banking_mon_tt_not_delegated:0 "The dial is in your hands, not delegated to the bank"
 banking_mon_tt_not_yet_delegated:0 "The dial is not already delegated"
 banking_mon_tt_peg_defend_floor:0 "The target is above the floor your defence of the peg committed you to — four points over the world rate, for a year"
 banking_mon_tt_recap_cash:0 "Your treasury holds the gold to pay for it — a recapitalisation cannot be made on credit"
 banking_mon_tt_recap_has_flows:0 "Your currency is on a convertible gold standard with a national bank"
 banking_mon_tt_recap_room:0 "The bank's gold reserve is below its limit"
 banking_omo_inflation_cost_tt:0 "The money the bank creates to buy those securities is spent into an economy that has nothing more to sell, so it pushes inflation up by about #b 1%#! for as long as the programme runs — and further still once lenders and workers come to expect it. That is the price of reaching past the rate, and it is charged whether or not the purchases work."
 banking_omo_rate_floor_tt:0 "Your policy rate has run out of room to fall — zero under a fiat currency, and lower still under a digital currency, which abolishes the cash people would otherwise hoard. Buying assets is only worth the balance sheet once the rate can go no lower; while there is still room to cut, a cut does the same job more cheaply and is easier to undo."
 banking_omo_unbacked_money_tt:0 "A currency convertible into metal cannot create money to buy bonds without losing its reserves; only a fiat or digital currency can run open-market operations."

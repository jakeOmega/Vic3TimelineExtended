 SR_DECREASE_FUNDING_EFFECT:0 "Funding reduced. Progress will slow but innovation drain is lessened."
 SR_ELEVATOR_BOOST_TT:0 "Our space elevator dramatically reduces launch costs, accelerating progress."
 SR_EQUATORIAL_CHOSEN_TT:0 "We will target the Equatorial Plain: a reliable, well-mapped landing zone with modest scientific yield, granting steady [concept_prestige] and research efficiency."
 SR_FAR_SIDE_CHOSEN_TT:0 "We will target the far side of the Moon: radio-shielded from Earth, perfect for deep-space observation. The radio-shielded observatory will deliver lasting research speed and innovation gains."
 SR_FLARE_DAMAGE_TT:0 "The particle flux overwhelmed shielding: sensitive equipment was damaged."
 SR_FLARE_SURVIVED_TT:0 "Existing shielding held against the solar particle event."
 SR_INCREASE_FUNDING_DESC:0 "Allocate additional resources to accelerate the [concept_space_race]."
 SR_INCREASE_FUNDING_EFFECT:0 "Funding increased. Progress accelerates but innovation is further reduced."

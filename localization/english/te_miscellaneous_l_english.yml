 gw_cond_not_treaty_bound:0 "We are not bound by an emissions-reduction treaty"
 gw_cond_penalty_label:0 "Warming Penalty Scale"
 gw_cond_penalty_tt:0 "The penalties below are applied to this country every month, with every value multiplied by the current temperature anomaly. At the scale shown, multiply each line by that figure.\n$TOOLTIP_DELIMITER$\n[GetStaticModifier('global_warming').GetDesc]"
 gw_cond_penalty_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('gw_warming_penalty_scale_display')|2]#!x"
 gw_cond_role_label:0 "Our Role"
 gw_cond_role_tt:0 "Only the leader of a market can adopt or repeal the three market-wide policies - a carbon tax, renewable investment and emission standards - and they then bind every member of that market.\n\n#lore The other five policies are ours alone, whoever leads the market.#!"
 gw_cond_role_value:0 "[JournalEntry.GetCountry.GetCustom('gw_market_role_text')]"
 gw_cond_share_label:0 "Share of World Emissions"
 gw_cond_share_tt:0 "This market's share of world annual emissions - the honest measure of how much of the warming is ours to fix.\n\n#lore A market that captures more carbon than it emits reads 0% here and shows its negative figure in the emissions row. Updated each January.#!"
 gw_cond_share_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('gw_share_pct_display')|0]#!%"
 gw_cond_temp_label:0 "Global Temperature"
 gw_cond_temp_tt:0 "The [concept_temperature_anomaly]: how far the planet has warmed above its pre-industrial average. The journal entry's bar runs to #v 4°C#!, the point at which the model treats the damage as unbounded.\n\n#lore Every nation carries the same anomaly; what differs is how much of it each economy caused.#!"

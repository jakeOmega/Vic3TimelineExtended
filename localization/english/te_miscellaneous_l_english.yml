 st_res_policy_band_possible:0 "Keeps the buy and release price bands from overlapping"
 st_res_policy_buy_cheap:0 "Buy When Cheap"
 st_res_policy_buy_cheap_tooltip:0 "#bold Buy When Cheap#!\nEach week, buy into the reserve while the averaged national market price sits below your purchase threshold. With a response ramp of 0 it buys at full flow and stops once the price recovers past that threshold plus [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_buy_band')|0] points; with a ramp above 0 the flow scales with how far the price sits below the threshold. Never sells.\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)1' ) ).End )]"
 st_res_policy_label_budget:0 "Weekly purchase budget (@money! estimated)"
 st_res_policy_label_budget_down_tooltip:0 "#bold Lower the weekly purchase budget#!\nSpend less on purchases each week.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_budget_step')|0]; #bold Shift#!-click for [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_budget_step_shift')|0], #bold Ctrl#!-click for [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_budget_step_ctrl')|0].\n#italic Estimated: the hub pays for goods through its production method like any other building, so this cap is applied as units the budget can cover at the current price, after replacing this week's decay. It is a per-week cap, not a pot that carries over.#!\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)30' ) ).End )]"
 st_res_policy_label_budget_up_tooltip:0 "#bold Raise the weekly purchase budget#!\nAllow more spending on purchases each week, up to what a full week at the maximum-flow ceiling costs at today's price, and never less than @money![JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_budget_max_base')|0].\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_budget_step')|0]; #bold Shift#!-click for [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_budget_step_shift')|0], #bold Ctrl#!-click for [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_budget_step_ctrl')|0].\n#italic Estimated: the hub pays for goods through its production method like any other building, so this cap is applied as units the budget can cover at the current price, after replacing this week's decay. It is a per-week cap, not a pot that carries over.#!\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)31' ) ).End )]"
 st_res_policy_label_buy_thr:0 "Buy below (% of base price)"
 st_res_policy_label_buy_thr_down_tooltip:0 "#bold Lower the purchase threshold#!\nBuy only once the price has fallen further below base price.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_thr_step')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)20' ) ).End )]"
 st_res_policy_label_buy_thr_up_tooltip:0 "#bold Raise the purchase threshold#!\nStart buying at a smaller discount. The purchase threshold cannot rise above base price, and it must stay far enough below the release threshold that the two bands never overlap.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_thr_step')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)21' ) ).End )]"
 st_res_policy_label_ceil_pct:0 "Target stockpile (% of capacity)"
 st_res_policy_label_ceil_pct_down_tooltip:0 "#bold Lower the target stockpile#!\nStop buying at a lower fill level.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_pct_step')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)28' ) ).End )]"
 st_res_policy_label_ceil_pct_up_tooltip:0 "#bold Raise the target stockpile#!\nKeep buying up to a higher fill level.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_pct_step')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)29' ) ).End )]"
 st_res_policy_label_floor_pct:0 "Protected stockpile (% of capacity)"
 st_res_policy_label_floor_pct_down_tooltip:0 "#bold Lower the protected stockpile#!\nProtect less stock, leaving more of the reserve available to sell.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_pct_step')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)26' ) ).End )]"
 st_res_policy_label_floor_pct_up_tooltip:0 "#bold Raise the protected stockpile#!\nProtect more stock. The policy will never sell below this level, however high the price.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_pct_step')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)27' ) ).End )]"
 st_res_policy_label_max_flow:0 "Maximum weekly flow (units)"
 st_res_policy_label_max_flow_down_tooltip:0 "#bold Lower the maximum weekly flow#!\nMove fewer units a week. A gentler policy moves the market less and costs less.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_flow_step')|0]; #bold Shift#!-click for [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_flow_step_shift')|0], #bold Ctrl#!-click for [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_flow_step_ctrl')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)24' ) ).End )]"
 st_res_policy_label_max_flow_up_tooltip:0 "#bold Raise the maximum weekly flow#!\nMove more units a week, up to [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_flow_max')|0]: your hub's weekly flow cap, which Silos raise, or [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_flow_max_base')|0] while the cap is lower. The cap itself still applies on top of this.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_flow_step')|0]; #bold Shift#!-click for [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_flow_step_shift')|0], #bold Ctrl#!-click for [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_flow_step_ctrl')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)25' ) ).End )]"
 st_res_policy_label_price_memory:0 "Price memory (weeks averaged)"
 st_res_policy_label_price_memory_down_tooltip:0 "#bold Shorten the price memory#!\nReact to a shorter average of the national market price. At 1 week the policy reacts to the live price, exactly as it did before smoothing existed.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_memory_step')|0].\n#italic Each week the average moves one part in N of the way to the current price, so N weeks is the averaging time constant, not a hard window.#!\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)32' ) ).End )]"
 st_res_policy_label_price_memory_up_tooltip:0 "#bold Lengthen the price memory#!\nReact to a longer average of the national market price. A longer memory shrugs off one-week spikes — including the ones the reserve's own trading causes — at the cost of reacting later to a real move.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_memory_step')|0].\n#italic Each week the average moves one part in N of the way to the current price, so N weeks is the averaging time constant, not a hard window.#!\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)33' ) ).End )]"
 st_res_policy_label_ramp:0 "Response ramp (% points past threshold)"
 st_res_policy_label_ramp_down_tooltip:0 "#bold Steepen the response#!\nReach the maximum weekly flow closer to the threshold. At 0 the policy is a switch: full flow the moment the averaged price crosses a threshold, held on by the hysteresis band until the price recovers.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_ramp_step')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)34' ) ).End )]"
 st_res_policy_label_ramp_up_tooltip:0 "#bold Soften the response#!\nSpread the response over a wider price range: the flow rises from nothing at the threshold to the maximum this many points beyond it, so the reserve leans harder the further the price strays and eases off as it recovers. With a ramp above 0 the hysteresis band is not used — the response is already continuous.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_ramp_step')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)35' ) ).End )]"
 st_res_policy_label_sell_thr:0 "Release above (% of base price)"
 st_res_policy_label_sell_thr_down_tooltip:0 "#bold Lower the release threshold#!\nStart releasing at a smaller premium. The release threshold cannot fall below base price, and it must stay far enough above the purchase threshold that the two bands never overlap.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_thr_step')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)22' ) ).End )]"
 st_res_policy_label_sell_thr_up_tooltip:0 "#bold Raise the release threshold#!\nHold out for a higher price before releasing.\nSteps by [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_thr_step')|0].\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)23' ) ).End )]"
 st_res_policy_manual:0 "Manual"
 st_res_policy_manual_tooltip:0 "#bold Manual#!\nYou set this good's weekly rate yourself with the controls above. Nothing is automated.\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)0' ) ).End )]"
 st_res_policy_panel_policy_header:0 "#bold Policy#!"
 st_res_policy_panel_preset_header:0 "#bold Presets#!  #italic fill every setting below in one click#!"
 st_res_policy_panel_settings_header:0 "#bold Settings#!"
 st_res_policy_range_possible:0 "Stays within this setting's range"
 st_res_policy_reason_budget:0 "#R Paused#! — this week's purchase budget is spent."
 st_res_policy_reason_buying:0 "#G Buying#! — the averaged market price is below your purchase threshold."
 st_res_policy_reason_buying_budget:0 "#G Buying#! — below your purchase threshold, but this week's purchase budget only covers part of the flow you asked for."
 st_res_policy_reason_ceiling:0 "#Y Paused#! — target stockpile reached."
 st_res_policy_reason_floor:0 "#Y Paused#! — protected stockpile reached."
 st_res_policy_reason_manual:0 "#Y Manual control#! — you set this good's rate by hand."
 st_res_policy_reason_no_hub:0 "#R Paused#! — no Strategic Reserve Hub is operating."
 st_res_policy_reason_releasing:0 "#O Releasing#! — the averaged market price is above your release threshold."
 st_res_policy_reason_understaffed:0 "#R Paused#! — the hub is understaffed, so it trades nothing this week."
 st_res_policy_reason_waiting:0 "#Y Waiting#! — the averaged market price has not crossed a trigger threshold."
 st_res_policy_release_high:0 "Release When Expensive"
 st_res_policy_release_high_tooltip:0 "#bold Release When Expensive#!\nEach week, sell out of the reserve while the averaged national market price sits above your release threshold. With a response ramp of 0 it sells at full flow and stops once the price falls back past that threshold minus [JournalEntry.GetCountry.MakeScope.ScriptValue('st_res_policy_sell_band')|0] points; with a ramp above 0 the flow scales with how far the price sits above the threshold. Never buys.\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)2' ) ).End )]"
 st_res_policy_select_possible:0 "This is not already the active policy"
 st_res_policy_short_buy_cheap:0 "Buy Cheap"
 st_res_policy_short_manual:0 "Manual"
 st_res_policy_short_release_high:0 "Release High"
 st_res_policy_short_stabilize:0 "Stabilize"
 st_res_policy_stabilize:0 "Stabilize Prices"
 st_res_policy_stabilize_tooltip:0 "#bold Stabilize Prices#!\nBoth sides: buys below the purchase threshold and sells above the release threshold, leaning against the market in either direction. This influences the price, it does not pin it — a reserve big enough to set the price is a reserve big enough to run out.\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)3' ) ).End )]"
 st_res_policy_stock_band_possible:0 "Keeps the protected stockpile below the target stockpile"
 st_res_preset_aggressive:0 "Aggressive"
 st_res_preset_aggressive_tooltip:0 "#bold Aggressive#!\nTrades on small price moves and fills the reserve to the brim: buy below -5%, release above +10%, at most 600 units a week, keeping between 10% and 95% of capacity, on a @money!40000 weekly budget. Acts on a 2-week price average with a 5-point response ramp.\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)12' ) ).End )]"
 st_res_preset_conservative:0 "Conservative"
 st_res_preset_conservative_tooltip:0 "#bold Conservative#!\nWaits for a real bargain and holds a deep protected stockpile: buy below -20%, release above +30%, at most 100 units a week, keeping between 40% and 60% of capacity, on a @money!5000 weekly budget. Acts on an 8-week price average with a 20-point response ramp, so one week's spike never moves it.\n#italic This is also the preset the AI runs.#!\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)10' ) ).End )]"
 st_res_preset_standard:0 "Standard"
 st_res_preset_standard_tooltip:0 "#bold Standard#!\nA balanced setting: buy below -10%, release above +20%, at most 250 units a week, keeping between 20% and 80% of capacity, on a @money!15000 weekly budget. Acts on a 4-week price average with a 10-point response ramp.\n#italic Every good starts here.#!\n\n[ScriptedGui.IsValidTooltip( GuiScope.SetRoot( JournalEntry.GetCountry.MakeScope ).AddScope( 'op', MakeScopeValue( '(CFixedPoint)11' ) ).End )]"

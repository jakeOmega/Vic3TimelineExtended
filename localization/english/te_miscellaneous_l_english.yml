 un_veto_isolation_modifier:0 "Diplomatic Isolation After [concept_un_veto]"
 un_vote_aid_request_passed_tt:0 "The humanitarian aid program was authorized. #G UN delivery +1, moving [concept_un_authority]'s target.#! Contributing nations will provide aid. The requesting country receives benefits scaled by donor count."
 un_vote_bloc_leverage_gain_tt:0 "Our [concept_power_bloc] gains #G 3#! [concept_power_bloc_leverage] in each of its other members that sits in the Assembly: we have shown the bloc we can deliver."
 un_vote_bloc_leverage_loss_tt:0 "Our [concept_power_bloc] loses #R 3#! [concept_power_bloc_leverage] in each of its other members that sits in the Assembly: we could not carry the vote we called."
 un_vote_climate_passed_tt:0 "The Climate Accord was adopted. #G UN credibility +1.5, moving [concept_un_authority]'s target.#! The UN Environment Programme (UNEP) is established."
 un_vote_condemn_passed_tt:0 "The condemnation resolution passed. #G UN credibility +1, moving [concept_un_authority]'s target.#! Relations with the condemned nation deteriorate. Its penalties are scaled by the UN's [concept_un_enforcement] (#v ×[GetGlobalVariable('un_enforcement_now').GetValue|1]#! at the current tier)."
 un_vote_condemn_passed_vetoed_tt:0 "The condemnation passed the GA but was vetoed in the Security Council. #G UN credibility +0.5, moving [concept_un_authority]'s target.#! The target receives a non-binding rebuke instead of formal condemnation, scaled by the UN's [concept_un_enforcement] (#v ×[GetGlobalVariable('un_enforcement_now').GetValue|1]#!)."
 un_vote_decolonization_passed_tt:0 "The [concept_decolonization_system] Resolution was adopted. #G UN credibility +1.5, moving [concept_un_authority]'s target.#! Colonial powers face increased international pressure."
 un_vote_expulsion_failed_tt:0 "The motion fell short of the 2/3 supermajority. #R UN credibility −1, moving [concept_un_authority]'s target.#! The target retains its permanent seat — and will remember who voted yes."
 un_vote_expulsion_passed_tt:0 "The motion carried by 2/3 supermajority. #G UN credibility +1, moving [concept_un_authority]'s target.#! The target forfeits its permanent seat on the Security Council."
 un_vote_failed_tt:0 "The resolution failed. #R UN credibility −1, moving [concept_un_authority]'s target.#! The proposer loses [concept_prestige]."
 un_vote_failure_penalty:0 "Failed UN Resolution"
 un_vote_heritage_passed_tt:0 "The Cultural Heritage Program was adopted. #G UN credibility +1, moving [concept_un_authority]'s target.#! The UN Educational, Scientific and Cultural Organization (UNESCO) is established."
 un_vote_human_rights_passed_tt:0 "The Universal Declaration was adopted. #G UN credibility +1.5, moving [concept_un_authority]'s target.#! The UN Human Rights Council (UNHRC) is established."
 un_vote_icc_passed_tt:0 "The Rome Statute was adopted. #G UN credibility +1, moving [concept_un_authority]'s target.#! The International Criminal Court (ICC) is established."
 un_vote_icc_passed_vetoed_tt:0 "The ICC referral passed the GA but was vetoed in the Security Council. #G UN credibility +0.5, moving [concept_un_authority]'s target.#! The General Assembly issues a symbolic censure of the last power to veto it, which is recorded as having #R Rejected the Rome Statute#! unless the UN is Moribund — no court jurisdiction is established."
 un_vote_initiated_tt:0 "#bold A General Assembly vote has been called.#! All UN member states will vote on this resolution over the next year. Results will depend on the balance of support and opposition."
 un_vote_law_of_sea_passed_tt:0 "The Convention on the Law of the Sea was adopted. #G UN credibility +1, moving [concept_un_authority]'s target.#! The International Tribunal for the Law of the Sea (ITLOS) is established."
 un_vote_military_mandate_passed_tt:0 "The Assembly authorized the mandate. #G UN credibility +1, moving [concept_un_authority]'s target.#! The proposer may pursue the named [concept_state_region] against the named state at no [concept_infamy], for five years, in one [concept_diplomatic_play] only. It covers that one demand only: any other demand against that country for territory, subjugation, regime change or humiliation voids the authorization and is condemned. Other demands — reparations, opening markets and the like — are allowed at their normal price."
 un_vote_military_mandate_passed_vetoed_tt:0 "A [concept_un_permanent_member] cast a [concept_un_veto]. An authorization to use force has no graduated form, so the resolution is blocked outright and no mandate is issued."
 un_vote_npt_passed_tt:0 "The Non-Proliferation Treaty was adopted. #G UN credibility +1.5, moving [concept_un_authority]'s target.#! The International Atomic Energy Agency (IAEA) is established."
 un_vote_pandemic_passed_tt:0 "The Pandemic Cooperation Resolution was adopted. #G UN credibility +1.5, moving [concept_un_authority]'s target.#! The World Health Organization (WHO) is established."
 un_vote_peacekeeping_request_passed_tt:0 "The peacekeeping deployment was authorized. #G UN delivery +1, moving [concept_un_authority]'s target.#! Contributing nations will deploy forces. The requesting country receives peacekeeping benefits scaled by donor count."
 un_vote_peacekeeping_request_passed_vetoed_tt:0 "The peacekeeping request passed the GA but was vetoed in the Security Council. #G UN delivery +0.5, moving [concept_un_authority]'s target.#! Only an observer mission is dispatched — no contributing forces are levied."
 un_vote_peacekeeping_request_passed_weak_tt:0 "The peacekeeping request passed, but the United Nations is below the Established tier and can field no force. #G UN delivery +0.5, moving [concept_un_authority]'s target.#! Only an observer mission is dispatched — no contributing forces are levied."
 un_vote_reform_1_passed_tt:0 "Charter Reform I is adopted by a two-thirds supermajority. #G The ceiling on [concept_un_authority]'s target rises from 70 to 85#!, opening the Strong tier — where sanctions become embargoes, condemnation isolates, and [concept_un_dues] rise to 0.4% of GDP — and #G UN credibility +2#!."
 un_vote_reform_2_passed_tt:0 "Charter Reform II is adopted by a two-thirds supermajority. #G The ceiling on [concept_un_authority]'s target rises from 85 to 100#!, opening the Supranational tier — where [concept_un_dues] rise to 1% of GDP and every major member embargoes the sanctioned — and #G UN credibility +2#!. #Y Veto restraint:#! from now on a two-thirds supermajority carries a resolution over a [Concept('concept_un_veto','veto')]."
 un_vote_reform_passed_tt:0 "The Charter Reform was adopted. #G UN credibility +1.5, moving [concept_un_authority]'s target.#!"
 un_vote_reform_passed_vetoed_tt:0 "The charter reform carried the Assembly but was vetoed in the Security Council. Charter changes need the permanent members' consent — there is no graduated fallback, and the ceiling stays where it is."
 un_vote_refugee_passed_tt:0 "The International Refugee Resolution was adopted. #G UN credibility +1, moving [concept_un_authority]'s target.#! The UN High Commissioner for Refugees (UNHCR) is established."
 un_vote_sanctions_passed_tt:0 "The sanctions resolution has passed. Sanctions are now in effect against the target nation, scaled by the UN's [concept_un_enforcement] (#v ×[GetGlobalVariable('un_enforcement_now').GetValue|1]#! at the current tier). #G UN credibility +1, moving [concept_un_authority]'s target.#!"
 un_vote_sanctions_passed_vetoed_tt:0 "The sanctions resolution passed the GA but was vetoed in the Security Council. #G UN credibility +0.5, moving [concept_un_authority]'s target.#! Voluntary partial sanctions only — no enforcer benefits, milder penalties on the target, scaled by the UN's [concept_un_enforcement] (#v ×[GetGlobalVariable('un_enforcement_now').GetValue|1]#!)."
 un_vote_space_passed_tt:0 "The Space Cooperation Resolution was adopted. #G UN credibility +1, moving [concept_un_authority]'s target.#! The UN Office for Outer Space Affairs (UNOOSA) is established."
 un_vote_success_reward:0 "Successful UN Resolution"
 un_vote_veto_overridden_tt:0 "#G The veto was overridden.#! Under Charter Reform II (veto restraint), a two-thirds supermajority of the members with a vote carries a resolution over a permanent member's veto, in its full form."

 un_mission_pk_fallback_tt:0 "Every one of the requester's states already holds another UN mission, so no peacekeeping mission can deploy. #G The requester receives the country-wide peacekeeping support instead.#!"
 un_mission_pk_opened_tt:0 "A #G UN peacekeeping mission#! deploys to the requester's most devastated state, with the members who pledge as its contributors. It works in that state, and succeeds after two years of peace for the host. If no member joins it within six months, it lapses."

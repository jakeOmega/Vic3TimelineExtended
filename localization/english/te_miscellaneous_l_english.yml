 GW_CLIMATE_ADAPTATION_ROW:0 "Climate Adaptation"
 GW_EMISSION_STANDARDS_DESC:0 "Impose binding industrial emission standards across your entire market.\n[GetStaticModifier('emission_standards_modifier').GetDesc]\nApplies to every country in your market. Available once global warming reaches mild levels. #bold Market leaders only#!."
 GW_EMISSION_STANDARDS_ROW:0 "Emission Standards"
 GW_FOSSIL_FUEL_DIVESTMENT:0 "Mandate Fossil Fuel Divestment"
 GW_FOSSIL_FUEL_DIVESTMENT_DESC:0 "Force state and private capital out of coal and oil industries.\n[GetStaticModifier('fossil_fuel_divestment_modifier').GetDesc]\nAvailable to all nations once warming reaches #v 1.0°C#!."
 GW_FOSSIL_FUEL_DIVESTMENT_ROW:0 "Fossil-Fuel Divestment"
 GW_GREEN_BUILDING_CODES:0 "Enact Green Building Codes"
 GW_GREEN_BUILDING_CODES_DESC:0 "Require energy-efficient standards in new construction.\n[GetStaticModifier('green_building_codes_modifier').GetDesc]\nAvailable to all nations once global warming reaches mild levels."
 GW_GREEN_BUILDING_CODES_ROW:0 "Green Building Codes"

 nd_stage_next_1:0 "Now a private #v Warning#!. It becomes a #v Confrontation#! if the threat is refused or answered with a counter-threat, made public, or backed by an exercise."
 nd_stage_next_2:0 "Now a #v Confrontation#!. It turns #R Acute#! at danger #v 70#!, when the threatening side holds firm at its deadline, when it is at High Alert while the other side is at Heightened or higher, if the play becomes a war, or after an intercepted launch."
 nd_stage_next_3:0 "Now #R Acute#!, the last stage. From here it ends only in an outcome."
 nd_stakes_long_private:0 "If they concede, our credibility rises by 10. If we back down it falls by 5. A mutual stand-down raises it by 5."
 nd_stakes_long_public:0 "If they concede, our credibility rises by 15. If we back down it falls by 15, and by 5 more if our doctrine made it a bluff; if the deadline lapses, by 10. A mutual stand-down costs 5, unless we were defending."
 nd_stakes_long_target:0 "If we concede, our credibility falls by 5. If they back down, ours rises by 10. A mutual stand-down raises it by 5."
 nd_stakes_short_private:0 "#G +10#! / #R -5#!"
 nd_stakes_short_public:0 "#G +15#! / #R -15#!"
 nd_stakes_short_target:0 "#R -5#! / #G +10#!"
 nd_system_outcome_held:0 "An officer at the relay station refused to pass the order on until the capital answered. Nothing flew."
 nd_system_outcome_recalled:0 "The system did what it was built to do — and the capital caught it with seconds left. The launch was recalled, but the country it took for the attacker saw every step of it."
 nd_system_outcome_struck:0 "The system did what it was built to do. By the time the capital understood, the missiles had struck the country it took for the attacker."
 nd_tt_act_accept_standdown:0 "We accept, and the crisis ends:"
 nd_tt_act_back_down:0 "We abandon the threat, and the crisis ends"
 nd_tt_act_counter:0 "We answer threat with threat"
 nd_tt_act_execute:0 "#R We carry out the threat: a nuclear strike on them.#!"
 nd_tt_act_exercise:0 "An exercise they can see — and could mistake for the real thing"
 nd_tt_act_extend:0 "We give them #v 6#! more weeks. Hesitation is noticed"
 nd_tt_act_fight_conventional:0 "We fight without nuclear weapons. The threat was not carried out, everyone saw, and our #v credibility#! falls"
 nd_tt_act_go_public:0 "The threat becomes a public ultimatum"
 nd_tt_act_hold:0 "We hold firm: the crisis turns #R Acute#!"
 nd_tt_act_refuse_talks:0 "We refuse to stand down, and talks close"
 nd_tt_act_reject:0 "We refuse, and leave them to decide what their threat meant"
 nd_tt_act_stand_firm:0 "We do not bend. Nothing changes: they press again in #v 6#! weeks, and the deadline is theirs to act on"
 nd_tt_act_talks:0 "We propose a mutual stand-down"
 nd_tt_act_yield:0 "We give them what they demand, and the crisis ends:"
 nd_tt_alert_held:0 "Our readiness stays where it is, and we ask [SCOPE.sCountry('nd_exerciser').GetName] through the usual channels what it thinks it is doing"
 nd_tt_allies_alarmed:0 "Every country we protect: relations #R -10#!. Every subject under our nuclear umbrella: #R +5#! liberty desire. A crisis against any of them now weighs our arsenal at half while our warheads stay in storage"
 nd_tt_already_current:0 "This is not already our choice"
 nd_tt_already_public:0 "The threat is still private"
 nd_tt_already_under_umbrella:0 "They are not our direct subject — a subject is already under our nuclear umbrella"
 nd_tt_assemble_for_retaliation:0 "Our warheads are put back on their delivery systems (readiness #v Routine#!, two weeks away). When they are ready, and if we are still at war with the country that struck us, we decide how to answer"
 nd_tt_authority_consequence:0 "#R An incident can now end in a launch without further approval from us.#! The chance that someone in the chain halts it is shown in the Forces section."
 nd_tt_authority_consequence_automatic:0 "#R A nuclear strike on our cities will be answered in full — up to three warheads — without a decision from us,#! and a weapons accident at home during a war or an acute crisis can be read as an attack. Upkeep rises by @money!#v [GetPlayer.MakeScope.ScriptValue('nd_upkeep_weekly_automatic_step')|D]#!/week"
 nd_tt_authority_tenure:0 "Our launch authority has been in force at least a year"
 nd_tt_cooldown_clear:0 "We have not had a nuclear crisis with them in the last two years (waived in war)"
 nd_tt_counter_danger:0 "The crisis danger rises by #R 10#! while our counter-threat stands"

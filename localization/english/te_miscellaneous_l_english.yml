 covert_op_phase_warning_tt:0 "For its first six months the operation is #R Preparatory#! and does nothing. From month 6 it is #Y Establishing#! and has the effects above; from month 12 it is #G Fully Operational#! and they are #G x[GetPlayer.MakeScope.ScriptValue('covert_op_phase_full_mult')|0]#!. A network of ours already in the target shortens the wait. Raising the operation's priority multiplies them again, #G x[GetPlayer.MakeScope.ScriptValue('covert_op_priority_2_effect_mult')|2]#! at priority 2 and #G x[GetPlayer.MakeScope.ScriptValue('covert_op_priority_3_effect_mult')|2]#! at priority 3, for a larger share of the covert budget. A later phase also costs more when an operation is exposed: the further along the network, the heavier the infamy and the breach in relations."

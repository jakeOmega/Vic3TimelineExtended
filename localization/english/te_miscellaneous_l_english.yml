 TE_CM_DECREASE_TT:0 "#header Buy Less Construction#!\n#v Click#!: -1 per week\n#v Shift+Click#!: -10\n#v Ctrl+Click#!: -100\n#v Alt+Click#!: -1,000\n#v Right-click#!: set to 0"
 TE_CM_HOW_IT_WORKS:0 "How does the construction market work?"
 TE_CM_HOW_IT_WORKS_BODY:0 "#b 1. Supply.#! Construction comes from $building_construction_sector$ buildings, which sell it on the market like any factory. More levels and better production methods mean more construction; cheap wood, iron and steel make it cheaper.\n\n#b 2. Your purchase.#! The number above is how many points the government buys each week, from the treasury. Only what the government queue can use that week is bought, so a large number is harmless but buys nothing extra when the queue is short. Set it to 0 to stop government construction without idling the construction sector: the construction it would have bought stays on the market for private investors.\n\n#b 3. Private purchase.#! Investors buy for private projects automatically, spending roughly the investment pool's weekly income, more when the pool has built up.\n\n#b 4. Delivery.#! Construction Sites, placed automatically where construction is under way, turn purchased construction into construction points. The private/government split of those points follows the two purchases instead of your economic-system law.\n\n#b 5. Shortages.#! Unless the Free Market Construction game rule has turned it off, factories and infrastructure also use a little construction as maintenance. When everyone together wants more than is on sale, the price rises and each buyer gets less. Watch the market line above, and add $building_construction_sector$ levels if demand keeps outrunning supply."
 TE_CM_INCREASE_TT:0 "#header Buy More Construction#!\n#v Click#!: +1 per week\n#v Shift+Click#!: +10\n#v Ctrl+Click#!: +100\n#v Alt+Click#!: +1,000\n#v Right-click#!: +10,000"
 TE_CM_PURCHASE_TT:0 "#header Government Construction Purchase#!\nHow many construction points the government buys from the market each week, paid from the [concept_treasury]. Buying more lets the government queue build faster, as long as the market has construction to sell.\n\nOnly what the government queue can use this week is actually bought, so a number larger than that costs nothing extra. Set it to 0 to halt government construction; private construction carries on.\n\nAI countries choose their own purchase from their income, reserves and debt."
 TE_CM_SECTION_HEADER:0 "Construction Market"
 TE_CM_SECTION_INTRO:0 "@construction! [concept_construction] is a tradeable good. $building_construction_sector$ buildings produce it and sell it on the [concept_market], and Construction Sites turn what is bought into the construction points that the queues below spend. Set how much the government buys each week; private investors buy for their own projects from the [concept_investment_pool]. How it all fits together: [concept_te_construction_market]."
 TE_CM_STAT_GOVERNMENT:0 "Government buys: @construction! #v [GetPlayer.MakeScope.ScriptValue('te_construction_market_display_public_use')|1]#! per week, ~@money!#v [GetPlayer.MakeScope.ScriptValue('te_construction_market_display_public_cost')|1*]#! from the treasury[SelectLocalization( GreaterThan_CFixedPoint( GetPlayer.MakeScope.ScriptValue('te_construction_market_display_public_target'), GetPlayer.MakeScope.ScriptValue('te_construction_market_display_public_use') ), 'TE_CM_STAT_GOVERNMENT_CAPPED', '' )]"
 TE_CM_STAT_GOVERNMENT_CAPPED:0 " #italic (capped at what the queue can use)#!"
 TE_CM_STAT_GOVERNMENT_TT:0 "#header Government Purchase in Force#!\nYou have set: @construction! #v [GetPlayer.MakeScope.ScriptValue('te_construction_market_display_public_target')|0]#! per week\nThe government queue can use: @construction! #v [GetPlayer.MakeScope.ScriptValue('te_construction_market_display_public_queue_cap')|1]#! per week\nBought this week: @construction! #v [GetPlayer.MakeScope.ScriptValue('te_construction_market_display_public_use')|1]#! per week\n\nThe purchase in force is the smaller of the first two, and zero while construction is paused. The queue can use at most one week's maximum progress per queued level. The treasury cost is an estimate at the current price."
 TE_CM_STAT_MARKET:0 "Your market: @construction! #v [GetPlayer.MakeScope.ScriptValue('te_construction_market_display_market_supply')|1]#! on sale, #v [GetPlayer.MakeScope.ScriptValue('te_construction_market_display_market_demand')|1]#! wanted[SelectLocalization( GreaterThan_CFixedPoint( GetPlayer.MakeScope.ScriptValue('te_construction_market_display_market_demand'), GetPlayer.MakeScope.ScriptValue('te_construction_market_display_market_supply') ), 'TE_CM_STAT_MARKET_SHORT', '' )]"
 TE_CM_STAT_MARKET_SHORT:0 " #R (shortage)#!"
 TE_CM_STAT_MARKET_TT:0 "#header Construction in Your Market#!\n#v On sale#!: construction offered by every $building_construction_sector$ in the market, plus imports.\n#v Wanted#!: construction every buyer in the market asks for (government and private purchases, and buildings that use it for maintenance or production), plus exports.\n\nWhen more is wanted than is on sale, the price rises and every buyer receives less than it asked for, so both construction queues slow down. More $building_construction_sector$ levels, or better production methods for them, are the remedy."
 TE_CM_STAT_PRICE:0 "Price: @money!#v [GetPlayer.MakeScope.ScriptValue('te_construction_market_display_price')|0]#! per construction point"
 TE_CM_STAT_PRICE_TT:0 "#header Price of Construction#!\nWhat one construction point costs right now: the [concept_market_price] of construction in your market (base @money!1000), scaled up in richer countries by [concept_construction_cost_scaling].\n\nThe price rises when buyers want more construction than is on sale, and falls when construction goes unsold."
 TE_CM_STAT_PRIVATE:0 "Private investors buy: @construction! #v [GetPlayer.MakeScope.ScriptValue('te_construction_market_display_private_use')|1]#! per week (#v [GetPlayer.MakeScope.ScriptValue('te_construction_market_display_private_share')|0]%#! of construction goes to private projects)"
 TE_CM_STAT_PRIVATE_TT:0 "#header Private Construction#!\nInvestors buy construction for private projects automatically, paid from the [concept_investment_pool]. They spend roughly the pool's weekly income, more when the pool has built up and less when it is running low, up to what the private queue can use this week.\n\nThe share of construction points allocated to private projects is recalculated every week from the government and private purchases. Your economic-system [concept_law] does not set it while the construction market is running."
 TE_DC_SECTION_HEADER:0 "Direct Construction"
 TE_DC_SECTION_INTRO:0 "The Free Market Construction game rule is off, so construction works as in the base game. Your $te_construction_market_site$ buildings are your construction sector: build, expand and downsize them like any government building. Each level provides construction points according to its production method, the government pays the wages, and the materials for each point spent are bought as in the base game. To build faster, add levels or switch to a better production method.\n\n#b Construction Sites must currently be built from the state view.#! This is a technical limitation that is being worked on."
 TE_DC_STAT_CAPACITY:0 "Construction: @construction! #v [GetPlayer.MakeScope.ScriptValue('te_direct_construction_display_capacity')|1]#! per week"
 TE_DC_STAT_CAPACITY_TT:0 "#header Construction Capacity#!\nEvery $te_construction_market_site$ level provides construction according to its production method, from 1 per week for $pm_wooden_buildings$ to 16 for $pm_nanomaterial_buildings$, scaled by how fully it is staffed and by its throughput. $te_direct_construction_base_modifier$ and Barracks under the Engineering & Logistics principle add to it. The base is the same for every country, so a country without Construction Sites can still build them.\n\nThe sites buy their method's materials only for the points your queues actually spend: wood and fabric at first, then iron, steel, glass and electricity."
 TE_DC_STAT_SHARE:0 "Private share: #v [GetPlayer.MakeScope.ScriptValue('te_direct_construction_law_private_share')|0]%#! of construction, set by your economic-system law"
 TE_DC_STAT_SHARE_TT:0 "#header Private Construction#!\nAs in the base game, your economic-system [concept_law] sets the share of construction allocated to private projects, funded from the [concept_investment_pool]:\n$law_traditionalism$: 25%\n$law_interventionism$, $law_agrarianism$, $law_extraction_economy$, $law_industry_banned$: 50%\n$law_laissez_faire$: 75%\n$law_cooperative_ownership$: 35%\n$law_command_economy$: 10%\n\nOther modifiers can add to it. When one queue cannot use its share in a week, the other can use the rest."
 TE_EA_IR_AGENT_CAUGHT_TT:0 "The agent is caught: [SCOPE.sCountry('espionage_catcher').GetName] decides what to do with him, and when we hear of it his reports stop."
 TE_EA_IR_AGENT_UNDETECTED_TT:0 "The agent works undetected."
 TE_EA_IR_BUILDUP_RIVAL_TT:0 "[SCOPE.sCountry('arms_race_instigator').GetName] will see the buildup and decide how to answer it."
 TE_EA_IR_CELL_HIDDEN_TT:0 "The cell stays hidden."
 TE_EA_IR_CELL_UNCOVERED_TT:0 "The cell is uncovered: [SCOPE.sCountry('terror_cell_target').GetName] traces it to us and decides how to answer."
 TE_EA_IR_MEDDLING_RIVAL_TT:0 "[SCOPE.sCountry('interference_target').GetName]'s analysts will notice the campaign and trace it to us, and its government will decide how to answer."
 TE_EA_IR_PROPAGANDA_RIVAL_TT:0 "[SCOPE.sCountry('propaganda_instigator').GetName] will hear the broadcasts and decide whether to answer them."
 TE_FX_SHOCK_MINUS_10_DESC:0 "The currency weakens: #v Exchange Rate Index#! about #R −10#! over the coming year, fading after"
 TE_FX_SHOCK_MINUS_5_DESC:0 "The currency weakens: #v Exchange Rate Index#! about #R −5#! over the coming year, fading after"
 TE_FX_SHOCK_PLUS_5_DESC:0 "The currency is propped up: #v Exchange Rate Index#! about #G +5#! over the coming year, fading after"
 TE_HOMELAND_CREATION:0 "Creation"
 TE_HOMELAND_CREATION_THRESHOLD:0 "Blocked: needs #tooltippable #tooltip:[State.GetTooltipTag],TE_HOMELAND_CREATION_THRESHOLD_TT #v [State.MakeScope.ScriptValue('homeland_culture_form_threshold')|%0]#!#!#! population."
 TE_HOMELAND_CREATION_THRESHOLD_CLAMPED:0 "\nThe modifiers below total #v [State.GetModifier.GetValueFor('state_homeland_creation_threshold_add')|%0]#!, but the threshold is held between #v 10%#! and #v 90%#!."
 TE_HOMELAND_CREATION_THRESHOLD_TT:0 "#tooltip_header Creation Threshold#!\nA primary culture without a [concept_homeland] here needs at least #v [State.MakeScope.ScriptValue('homeland_culture_form_threshold')|%0]#! of the state's population before its homeland can start forming.[SelectLocalization(NotEqualTo_CFixedPoint(State.GetModifier.GetValueFor('state_homeland_creation_threshold_add'), State.MakeScope.ScriptValue('homeland_culture_form_threshold')), 'TE_HOMELAND_CREATION_THRESHOLD_CLAMPED', '')]\n$TOOLTIP_DELIMITER$\n[State.GetModifier.GetDescFor('state_homeland_creation_threshold_add')]"
 TE_HOMELAND_NOTHING_TO_CHANGE:0 "No culture here can gain or lose homeland status."
 TE_HOMELAND_PAUSED_LOCKED:0 "Paused: needs a #tooltippable #tooltip:[State.GetTooltipTag],TE_HOMELAND_PAUSED_LOCKED_TT law, principle or technology#!#! that enables homeland changes."
 TE_HOMELAND_PAUSED_LOCKED_TT:0 "#tooltip_header Enabling Homeland Changes#!\n[State.GetOwner.GetName] has not enabled homeland changes, so no [concept_homeland] in its states can form or disappear. Any one of these enables them:\n$TE_HOMELAND_UNLOCK_SOURCES$"
 TE_HOMELAND_PAUSED_SPLIT:0 "Paused: region divided between owners."
 TE_HOMELAND_PROJECT_INVALID:0 "No longer eligible; progress resets."
 TE_HOMELAND_REMOVAL:0 "Removal"
 TE_HOMELAND_REMOVAL_THRESHOLD:0 "Blocked: must be below #tooltippable #tooltip:[State.GetTooltipTag],TE_HOMELAND_REMOVAL_THRESHOLD_TT #v [State.MakeScope.ScriptValue('homeland_culture_disappear_threshold')|%0]#!#!#! population."
 TE_HOMELAND_REMOVAL_THRESHOLD_CLAMPED:0 "\nThe modifiers below total #v [State.GetModifier.GetValueFor('state_homeland_removal_threshold_add')|%0]#!, but the threshold is held between #v 0%#! and #v 100%#!."
 TE_HOMELAND_REMOVAL_THRESHOLD_TT:0 "#tooltip_header Removal Threshold#!\nA non-primary culture with a [concept_homeland] here must fall below #v [State.MakeScope.ScriptValue('homeland_culture_disappear_threshold')|%0]#! of the state's population before that homeland can start being removed.[SelectLocalization(NotEqualTo_CFixedPoint(State.GetModifier.GetValueFor('state_homeland_removal_threshold_add'), State.MakeScope.ScriptValue('homeland_culture_disappear_threshold')), 'TE_HOMELAND_REMOVAL_THRESHOLD_CLAMPED', '')][SelectLocalization(EqualTo_CFixedPoint(State.MakeScope.ScriptValue('homeland_culture_disappear_threshold'), '(CFixedPoint)0'), 'TE_HOMELAND_REMOVAL_THRESHOLD_ZERO', '')]\n$TOOLTIP_DELIMITER$\n[State.GetModifier.GetDescFor('state_homeland_removal_threshold_add')]"
 TE_HOMELAND_REMOVAL_THRESHOLD_ZERO:0 "\nAt #v 0%#! no homeland here can be removed. Laws and technologies that raise the threshold make removal possible."
 TE_HOMELAND_TARGET_CULTURE:0 "[THIS.GetCulture.GetName]"
 TE_HOMELAND_TRACK_ACTIVE:0 "+[State.MakeScope.ScriptValue('te_homeland_monthly_points')|2] points/month"
 TE_HOMELAND_TRACK_WAITING:0 "Starts next month."
 TE_HOMELAND_UNLOCK_SOURCES:0 "[Concept('concept_law', '$concept_laws$')]: [GetLawType('law_ethnostate').GetName] ($lawgroup_citizenship$), [GetLawType('law_minority_rights_violent_hostility').GetName] ($lawgroup_minority_rights$) or [GetLawType('law_linguistic_purity').GetName] ($lawgroup_language_policy$)\n[concept_power_bloc_principle]: [GetPowerBlocPrincipleGroup('principle_group_cultural_unity').GetName] tier II or higher in the country's [concept_power_bloc]\n[concept_technology]: [GetTechnology('mass_media').GetName]"
 TE_STATE_ANTIMATTER_STATUS:0 "[concept_antimatter_facility]"
 TE_STATE_ANTIMATTER_TT:0 "#bold [concept_antimatter_facility] Points#!\n\nTotal Generated: #v [State.GetOwner.MakeScope.ScriptValue('antimatter_total_generated_points')|0]#!\nActive Structures: #v [State.GetOwner.MakeScope.ScriptValue('antimatter_points_consumed')|0]#!\nReserved (incl. queued): #v [State.GetOwner.MakeScope.ScriptValue('antimatter_points_reserved')|0]#!\nNet Available: #G [State.GetOwner.MakeScope.ScriptValue('antimatter_sub_building_slots_remaining')|0]#!\n\nEach [concept_antimatter_facility] level provides 5 sub-building slots for Antimatter Engines and Warhead Plants."
 TE_STATE_ARABLE_ROW_MULT:0 "Multiplier"
 TE_STATE_ARABLE_ROW_REGIONAL:0 "Regional"
 TE_STATE_ARABLE_ROW_TOTAL:0 "Total"
 TE_STATE_ARABLE_STATUS:0 "[concept_arable_land]"
 TE_STATE_ARABLE_TT:0 "#bold [concept_arable_land]#!\n\nTotal: #v [State.MakeScope.ScriptValue('arable_land_total')|0]#!\nGeographic Base: #v [State.MakeScope.ScriptValue('arable_land_base')|0]#!\nRegional Additions: #G +[State.MakeScope.ScriptValue('arable_land_from_modifiers')|0]#!\n\nMultiplier: [State.GetModifier.GetValueWithBreakdownFor('state_arable_land_mult')]\n\nAgricultural technologies and other arable-land effects expand [concept_arable_land] beyond the geographic base. In [Concept('concept_split_state', 'split states')], the regional additions line sums same-owner additions across the whole [concept_state_region] so [concept_migration_crowding] thresholds stay accurate."
 TE_STATE_CROWDING_ROW_POP:0 "Population"
 TE_STATE_CROWDING_ROW_PULL:0 "Pull Penalty"
 TE_STATE_CROWDING_ROW_RATIO:0 "Ratio"
 TE_STATE_CROWDING_ROW_THRESHOLD:0 "Threshold"
 TE_STATE_CROWDING_STATUS:0 "[concept_migration_crowding]"
 TE_STATE_CROWDING_TT:0 "#bold [concept_migration_crowding]#!\n\nPopulation: #v [State.GetPopulationSize|Kv]#!\nCrowding Threshold: #v [State.MakeScope.ScriptValue('migration_crowding_threshold_pop')|Kv]#!\nMigration Pull Penalty: #R -[State.MakeScope.ScriptValue('migration_crowding_pull_pct')|%0]#!\n\n#bold Crowding Ratio:#! #v [State.MakeScope.ScriptValue('migration_crowding_ratio')|%0]#!\n0% is the floor where crowding starts. 100% is the 10x density knee where the formula switches from quadratic growth to a linear tail. Values above 100% mean the state is already in that linear tail.\n\nUrban Capacity: [State.GetModifier.GetValueWithBreakdownFor('state_migration_crowding_density_mult')]\n\n#bold How the curve works:#!\nFrom the floor up to the 10x knee, crowding scales as #v 4.5 × r²#!, so the penalty ramps in gradually. Beyond the knee, it becomes #v 9 × r - 4.5#!, adding a steady #R 10 percentage points#! of migration-pull penalty for each extra 1x density above the knee.\n\nExamples:\n· At the floor: #R 0%#! penalty\n· At the 10x knee: #R 45%#! penalty\n· At 20x density: #R 145%#! penalty\n\nHigher #bold Urban Capacity#! (from Urban Planning, highways, airports, and other [concept_infrastructure]) lowers effective density, shifting the state back toward the floor so the same population produces a smaller penalty."
 TE_STATE_HOMELAND_STATUS:0 "[concept_homeland_dynamics]"
 TE_STATE_HOMELAND_TT:0 "#bold [concept_homeland_dynamics]#!\n\nEach eligible culture has independent progress. Multiple homelands can form or decay in parallel, advancing monthly to #v 100%#!, without random rolls.\n\nCreation: a primary culture without a homeland here must reach #tooltippable #tooltip:[State.GetTooltipTag],TE_HOMELAND_CREATION_THRESHOLD_TT #v [State.MakeScope.ScriptValue('homeland_culture_form_threshold')|%0]#!#!#! of the state's population.\nRemoval: a non-primary homeland culture must fall below #tooltippable #tooltip:[State.GetTooltipTag],TE_HOMELAND_REMOVAL_THRESHOLD_TT #v [State.MakeScope.ScriptValue('homeland_culture_disappear_threshold')|%0]#!#!#!.\n\nBase Rate: #v 10#! percentage points per year.\nModified Rate: #v [State.MakeScope.ScriptValue('te_homeland_annual_progress')|2]#! points per year.\nChange Speed: [State.GetModifier.GetValueWithBreakdownFor('state_homeland_change_speed_mult')]\n\nTurmoil of 25% / 50% multiplies progress by 1.25 / 1.5. Legitimacy below 25 halves progress; legitimacy of 75 or more multiplies it by 1.25.\n\nRequires the entire state region to have the same owner, and homeland changes to be enabled by any one of:\n$TE_HOMELAND_UNLOCK_SOURCES$\nLosing either condition pauses progress. A change of owner, primary-culture status, population eligibility or homeland status resets the affected culture's progress."
 TE_STATE_POINTS_ROW_AVAILABLE:0 "Available"
 TE_STATE_POINTS_ROW_GENERATED:0 "Generated"
 TE_STATE_SOLAR_STATUS:0 "[concept_solar_collector_array]"
 TE_STATE_SOLAR_TT:0 "#bold [concept_solar_collector_array] Points#!\n\nTotal Generated: #v [State.GetOwner.MakeScope.ScriptValue('solar_total_generated_points')|0]#!\nActive Structures: #v [State.GetOwner.MakeScope.ScriptValue('solar_points_consumed')|0]#!\nReserved (incl. queued): #v [State.GetOwner.MakeScope.ScriptValue('solar_points_reserved')|0]#!\nNet Available: #G [State.GetOwner.MakeScope.ScriptValue('solar_receiver_slots_remaining')|0]#!\n\nEach [concept_solar_collector_array] level provides 10 sub-building slots for Solar Receivers."
 TE_STATE_UN_NAME_AID:0 "Aid"
 TE_STATE_UN_NAME_PEACEKEEPING:0 "Peacekeeping"
 TE_STATE_UN_NAME_STABILISATION:0 "Stabilisation"
 TE_STATE_UN_ROW_MONTHS:0 "Months"
 TE_STATE_UN_ROW_PROGRESS:0 "Progress"
 TE_STATE_UN_ROW_STRENGTH:0 "Strength"
 TE_STATE_UN_ROW_STRENGTH_VALUE:0 "#v ×[State.MakeScope.ScriptValue('un_state_mission_strength')|2]#!"
 TE_STATE_UN_ROW_TYPE:0 "Mission"
 TE_STATE_UN_ROW_TYPE_VALUE:0 "#v [AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.ScriptValue('un_state_mission_type'), '(CFixedPoint)1'), 'TE_STATE_UN_NAME_PEACEKEEPING')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.ScriptValue('un_state_mission_type'), '(CFixedPoint)2'), 'TE_STATE_UN_NAME_AID')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.ScriptValue('un_state_mission_type'), '(CFixedPoint)3'), 'TE_STATE_UN_NAME_STABILISATION')]#!"
 TE_STATE_UN_STATUS:0 "[concept_un_mission]"
 TE_STATE_UN_TT:0 "#header United Nations Mission#!\nA UN mission is working in this state, with #v [State.MakeScope.ScriptValue('un_state_mission_contributors')|0]#! contributing countries.\n$TOOLTIP_DELIMITER$\nIts effect here is multiplied by its #bold strength#!, #v ×[State.MakeScope.ScriptValue('un_state_mission_strength')|2]#!: the UN's [concept_un_enforcement], less what withheld [concept_un_dues] cost the budget, and more for every contributor up to three.\n$TOOLTIP_DELIMITER$\nPeacekeeping succeeds after two years of peace for this country; aid when this state has no famine and a standard of living of 10; stabilisation once the collapse is over and a year has passed. A mission fails if this country is attacked or every contributor leaves, and ends after five years. The chamber of the United Nations journal entry lists every mission."
 UN_ARMS_CONTROL_DESC:0 "Join UN arms control agreements. $UN_ARMS_CONTROL_EFFECTS$ Requires Humanitarian Regulations, Limited War, or War Crimes Forbidden law. While it runs, it counts toward the UN's #bold funding#! pillar in proportion to our weight in world affairs ([concept_major_power] members and above)."
 UN_CHAMPION_ORDER_DESC:0 "Use our nation's diplomatic weight to strengthen the United Nations. While active, we count as a champion in the UN's #G great-power commitment#! pillar, weighted by our share of world power, which raises the target [concept_un_authority] moves toward. $UN_CHAMPION_ORDER_EFFECTS$ [Concept('concept_great_power', 'Great Powers')] only. Toggle off to stop."
 UN_CONVENE_CONFERENCE_TT:0 "We will convene a #bold founding conference#! for a new United Nations. It sits for 12 months; then the new organisation is founded, with us as founder, headquarters host and (as a [concept_great_power]) a permanent member. It starts weak (authority 25) under the founding charter, with no reforms and no agencies. The world's leading power, if it is not us, is asked to join, stay out, or #R oppose#! — and its opposition ends the conference and bars another for ten years. Costs [concept_prestige] and [concept_bureaucracy]."
 UN_DEFUND_DEVELOPMENT_DESC:0 "Stop contributing to UN development programs. $UN_DEFUND_DEVELOPMENT_EFFECTS$ It stops counting toward the UN's #bold funding#! pillar."
 UN_END_PEACEKEEPING_DESC:0 "Withdraw our forces from peacekeeping operations. $UN_END_PEACEKEEPING_EFFECTS$ It stops counting toward the UN's #bold funding#! pillar."
 UN_FUND_DEVELOPMENT_DESC:0 "Contribute to UN development programs. $UN_FUND_DEVELOPMENT_EFFECTS$ A recurring expense scaled to [Concept('concept_gdp', 'GDP')] applies while the contribution is active. Requires [concept_major_power] rank. While it runs, it counts toward the UN's #bold funding#! pillar in proportion to our weight in world affairs ([concept_major_power] members and above)."
 UN_HUMAN_RIGHTS_DESC:0 "Champion a human rights resolution at the UN. $UN_HUMAN_RIGHTS_EFFECTS$ Requires Multiculturalism, Universal Suffrage, or Protected Speech. While it runs, it counts toward the UN's #bold funding#! pillar in proportion to our weight in world affairs ([concept_major_power] members and above)."
 UN_LIFT_SANCTIONS_DESC:0 "Lift all [concept_un_sanctions] currently in effect, removing the penalties from each sanctioned target. $UN_LIFT_SANCTIONS_EFFECTS$"
 UN_LOBBY_ACCEPT_BASE:0 "from pledging a vote away before the debate is even heard"
 UN_LOBBY_ACCEPT_OBLIGATION:0 "from the [concept_obligation] [SCOPE.sCountry('actor').GetName] would owe us in return"
 UN_LOBBY_ACCEPT_RELATIONS:0 "from [SCOPE.GetRootScope.GetCountry.GetAdjectiveNoFormatting]-[SCOPE.sCountry('actor').GetAdjectiveNoFormatting] [concept_relations] being [SCOPE.GetRootScope.GetCountry.GetRelationsWithDesc(SCOPE.sCountry('actor'))]"
 UN_LOBBY_ACCEPT_RIVALRY:0 "from [SCOPE.sCountry('actor').GetName] being our [concept_rivalry]"
 UN_LOBBY_ACCEPT_STANDING:0 "from the record [SCOPE.sCountry('actor').GetName] has built in the [concept_un_general_assembly]"
 UN_LOBBY_ACCEPT_TARGET_ALLY:0 "from the resolution being aimed at an ally of ours"
 UN_LOBBY_ACCEPT_TARGET_BLOC:0 "from the resolution being aimed at a fellow member of our [concept_power_bloc]"
 UN_LOBBY_ACCEPT_TARGET_RIVAL:0 "from the resolution being aimed at a [concept_rivalry] of ours"
 UN_PAY_DUES_DESC:0 "Resume paying our assessed [concept_un_dues], settling at once everything we owe from the months we withheld them. A member in arrears regains its vote the moment it pays."
 UN_PROPOSE_CHARTER_REFORM:0 "Table a charter reform"
 UN_PROPOSE_CHARTER_REFORM_DESC:0 "Move the [concept_un_general_assembly] to amend the [concept_un_charter]. Reform I raises the ceiling on [concept_un_authority] from 70 to 85, Reform II from 85 to 100. It may be tabled only once authority has held within 5 points of the ceiling for 24 months running, and not within five years of the last reform vote. It needs a #bold two-thirds supermajority#! of all members, and it is #bold binding#!: any [concept_un_permanent_member] may [concept_un_veto] it, and a veto blocks it outright. [Concept('concept_major_power','Major powers')] and above only."
 UN_PROPOSE_CHARTER_REFORM_TT:0 "We will table the next reform of the [concept_un_charter] in the [concept_un_general_assembly]. It needs a #G two-thirds supermajority#! of all members, and any [concept_un_permanent_member] may [concept_un_veto] it outright. If it carries, the ceiling on [concept_un_authority] rises."
 UN_PROPOSE_CONDEMN_DESC:0 "Propose a General Assembly resolution condemning a rival nation's military aggression. Its record must give the Assembly grounds: a case strength of 30 or more (see #bold Our Exposure#! in the chamber for how a record is built). Triggers a vote among all UN members. If passed, the target receives diplomatic penalties and we gain [concept_prestige] as the resolution sponsor."
 UN_PROPOSE_CONDEMN_TT:0 "#bold A General Assembly vote has been called#! to condemn military aggression. All UN members will vote over the next 30 days. Results will follow."
 UN_PROPOSE_EXPULSION_DESC:0 "Call a 2/3 supermajority [concept_un_general_assembly] vote to strip a recently-vetoing [concept_un_permanent_member] of its [concept_un_security_council] seat. The motion is itself non-vetoable. If it carries, the target loses its [concept_un_veto] power for the rest of the game."
 UN_PROPOSE_EXPULSION_TT:0 "We will propose a motion in the [concept_un_general_assembly] calling for the expulsion of a [concept_un_permanent_member] who has recently abused the [concept_un_veto]. As a [concept_un_resolution_recommendatory] motion against the Council itself, it requires a #G 2/3 supermajority#! to pass."
 UN_PROPOSE_MANDATE_DESC:0 "Move the General Assembly to authorize us, by name, to recover one [concept_state_region] we hold a [concept_claim] on from a state whose record gives the Assembly grounds (a case strength of 60 or more; see #bold Our Exposure#! in the chamber for how a record is built). This is a #bold binding#! resolution: any [concept_un_permanent_member] may [concept_un_veto] it, and a veto blocks it outright — there is no weaker form of a licence to use force. If it carries we receive a mandate, which makes the #v $war_goal_te_un_mandate_restore_state_type_name$#! [concept_war_goal] available against that state, for that territory only, at no [concept_infamy]. Every other demand keeps its normal price, and adding any other demand against that country for territory, subjugation, regime change or humiliation voids the mandate and is condemned (reparations, opening markets and the like are allowed). Requires [concept_un_authority] 40+ and no mandate of our own already in force."
 UN_PROPOSE_MANDATE_TT:0 "#bold A General Assembly vote has been called#! on an authorized military mandate. All UN members will vote over the next 30 days, and a [concept_un_permanent_member] may [concept_un_veto] it. Results will follow."
 UN_PROPOSE_SANCTIONS_DESC:0 "Propose [concept_un_sanctions] against a rival. The General Assembly will vote over a year. If passed, the target receives severe trade and diplomatic penalties, and you become the sanctions enforcer. #G UN credibility +1 if passed.#! Requires [concept_major_power] rank and an unsanctioned rival whose record gives the Assembly grounds: a case strength of 50 or more."
 UN_PROPOSE_SANCTIONS_TT:0 "Propose [concept_un_sanctions] against a rival nation. The General Assembly will vote on the measure over the next 90 days."
 UN_REQUEST_AID_DESC:0 "Request the General Assembly to authorize international humanitarian assistance for our country. Triggers a vote among all UN members. If passed, contributing nations provide aid and we receive economic benefits scaled by the number of donors."
 UN_REQUEST_AID_TT:0 "#bold A General Assembly vote has been called#! to authorize humanitarian aid. All UN members will vote over the next 30 days. Results will follow."
 UN_REQUEST_PEACEKEEPERS_DESC:0 "Request the General Assembly to authorize deployment of peacekeeping forces to our territory. Triggers a vote among all UN members. If passed, contributing nations deploy forces and we receive stability benefits scaled by the number of contributors."
 UN_REQUEST_PEACEKEEPERS_TT:0 "#bold A General Assembly vote has been called#! to authorize peacekeeping deployment. All UN members will vote over the next 30 days. Results will follow."
 UN_STOP_CHAMPIONING_DESC:0 "Cease active efforts to champion the international order. $UN_STOP_CHAMPIONING_EFFECTS$"
 UN_STOP_UNDERMINING_DESC:0 "Cease active efforts to undermine the international order. $UN_STOP_UNDERMINING_EFFECTS$"
 UN_UNDERMINE_ORDER_DESC:0 "Use our nation's weight to weaken the United Nations and assert sovereign independence. While active, we count against the UN's #R great-power commitment#! pillar, weighted by our share of world power, which lowers the target [concept_un_authority] moves toward. $UN_UNDERMINE_ORDER_EFFECTS$ [Concept('concept_great_power', 'Great Powers')] only. Toggle off to stop."
 UN_VOTE_ACCEPT_TARGET_TT:0 "Acknowledge the resolution and accept its verdict. Pre-empts #bold UN Condemnation#! / #bold [concept_un_sanctions]#! if the resolution passes — but international observers read the gesture as performative, and the regime visibly loses face at home."
 UN_VOTE_AGAINST_TT:0 "Cast our vote #bold against#! the resolution."
 UN_VOTE_BALLOT_ALREADY_CAST_TT:0 "#v Our vote on this resolution is already on the record — answering here changes nothing.#!"
 UN_VOTE_COMMITMENT_BREAK_TT:0 "#R We pledged this vote to the resolution's sponsor.#! Casting it the other way goes back on our word: #R −4 International Standing#!, #R −20 [concept_relations]#! with the sponsor, and the [concept_obligation] they took on to secure the pledge is struck off — we lose the favour we were owed."
 UN_VOTE_COMMITMENT_KEEP_TT:0 "#G We pledged this vote to the resolution's sponsor, and this honours it.#! A small gain in International Standing, #G +10 [concept_relations]#! with the sponsor, and the [concept_obligation] they owe us stands."
 UN_VOTE_IN_FAVOR_TT:0 "Cast our vote #bold in favor#! of the resolution."

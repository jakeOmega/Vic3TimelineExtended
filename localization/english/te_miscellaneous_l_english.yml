 te_imposed_peg_pretext_tt:0 "The imposing country sets a policy rate of its own and is a [concept_major_power] or better — and the country to be pegged is #R in default#!. An insolvent government is the only ground for demanding this."
 te_inflation_band_comfort:0 "Inflation: Stable Prices"
 te_inflation_band_comfort_desc:0 "Prices are moving slowly enough that nobody has to think about them. Wages hold their value between one payday and the next, savers are not being quietly taxed, and the tax office collects roughly what it assessed. This band costs you nothing — and it is the only band in which higher wages pay a #b real-wage dividend#! back into the economy."
 te_inflation_band_deflation:0 "Inflation: Deflation"
 te_inflation_band_deflation_desc:0 "Prices are falling. Every debt already owed grows heavier in real terms while the income to service it shrinks, so farmers and workers who borrowed are squeezed hardest and landowners holding paper claims do well out of it. Purchases are postponed because next year is cheaper, which drains the confidence out of the financial cycle. Your government feels it too: the interest it pays is a #b real#! cost, and falling prices raise it."
 te_inflation_band_elevated:0 "Inflation: Elevated"
 te_inflation_band_elevated_desc:0 "Prices are rising faster than people expected when they agreed their wages. The poorest feel it first, because food and fuel are most of what they buy — they expect a standard of living their pay no longer reaches, and the gap breeds radicals. Shopkeepers and small proprietors, whose savings are the business, watch those savings shrink."
 te_inflation_band_high:0 "Inflation: High"
 te_inflation_band_high_desc:0 "Prices are rising fast enough to disorganise the economy. Tax assessed at last season's prices is collected at this season's, so a share of the revenue simply evaporates before it reaches the treasury. Saving becomes pointless and the investment pool dries up. Anyone on a fixed income — rentiers, officers, pensioners — is being quietly expropriated, and says so."
 te_inflation_band_hyper:0 "Inflation: Hyperinflation"
 te_inflation_band_hyper_desc:0 "The currency is failing. Wages are spent the hour they are paid, tax revenue arrives worthless, saving has stopped entirely, and the printing press has stopped helping — nobody will hold the money long enough for new notes to buy anything, so the government's own seigniorage collapses with everything else. It can be waited out, and that is the slow and ruinous way: prices do come back down once the press stops, over years, with all of this running the whole time. The quick ways out are a currency reform or adopting somebody else's money — and the government that caused it often goes with either."
 te_inflation_band_very_high:0 "Inflation: Very High"
 te_inflation_band_very_high_desc:0 "Prices are rising fast enough that holding money is a loss, so everyone is buying anything real instead — land, buildings, goods — which inflates asset prices on top of everything else. The treasury's own printing press is losing its value to the state: nobody holds the currency long enough for newly minted money to buy anything, so #b seigniorage collapses#! even as the mint runs. Real seigniorage follows a curve with a peak, and this is the far side of it."
 te_irredentist_bloc_check_peace_target_tt:0 "[SCOPE.sCountry('target_country').GetName]'s bloc situation permits this union: they are not in a [concept_power_bloc], they lead one themselves, their bloc is a Diplomatic Framework, they belong to a bloc that we lead, or their [Concept('concept_power_bloc_leader', 'bloc leader')] has blessed the union."
 te_irredentist_bloc_check_peace_unifier_tt:0 "Our bloc situation permits this union: we are not in a [concept_power_bloc], we lead one ourselves, our bloc is a Diplomatic Framework, [SCOPE.sCountry('target_country').GetName] leads the bloc we are in, or our [Concept('concept_power_bloc_leader', 'bloc leader')] has blessed the union."
 te_irredentist_bloc_check_war_tt:0 "Our bloc situation permits this war of reunification: we are not in a [concept_power_bloc], we lead one ourselves, or our [Concept('concept_power_bloc_leader', 'bloc leader')] has endorsed the war. A member asks for that blessing with the #b $irr_seek_war_blessing$#! diplomatic action on the country it would fight; a war on the bloc leader itself cannot be blessed."
 te_lolr_already_guaranteed_tt:0 "The ward has no other $lender_of_last_resort$"
 te_lolr_calls_tt:0 "[SCOPE.sCountry('te_lolr_ward').GetName] has now had its guarantee called #v [SCOPE.sCountry('te_lolr_ward').MakeScope.ScriptValue('te_mon_lolr_calls_display')|0]#! time(s). Every call costs its guarantor half as much again as the last — and buys the ward less: the relief a guarantee is worth falls to #v 35%#!, then #v 20%#!, then nothing at all on the third default. Ten quiet years forget one call."
 te_lolr_guarantor_solvent_tt:0 "The guarantor is not in default"
 te_map_mode_overlay:0 "Active Map-Mode Overlay"
 te_military_morale_boost:0 "Esprit de Corps Restored"
 te_military_morale_drain:0 "Barracks Discontent"
 te_mon_arrangement_provider:0 "Backstops Extended"
 te_mon_arrangement_provider_desc:0 "Swap lines and guarantees we have extended. Each costs us the recipient's benefit, scaled by how large its economy is beside ours."
 te_mon_arrangement_recipient:0 "Monetary Backstops"
 te_mon_arrangement_recipient_desc:0 "Swap lines and guarantees other central banks have extended to us. Lenders price the help we could call on."
 te_mon_arrangement_standing:0 "Anchored Currency"
 te_mon_arrangement_standing_desc:0 "Credit standing earned through a currency peg — by borrowing a credible currency, or by being the currency others borrow."
 te_mon_board_seigniorage:0 "Seigniorage from Currency Boards"
 te_mon_board_seigniorage_desc:0 "Half the minting of every subject that runs a currency board on our money. It is worth what their gold mines are worth — for a colony without gold, next to nothing."
 te_mon_board_subject:0 "Currency Board"
 te_mon_board_subject_desc:0 "We have no money of our own: we issue our overlord's, against their reserves, and half of what our mint earns is theirs. More autonomy would end it."
 te_mon_board_wrong_stance:0 "The Overlord’s Rate"
 te_mon_board_wrong_stance_desc:0 "For half a year and more the interest rate we are made to use has been plainly wrong for us — far too tight, or far too loose — because it is set for somebody else's economy. It lasts until our policy stance leaves the extreme."
 te_mon_currency_reform_premium:0 "Currency Reform"
 te_mon_currency_reform_premium_desc:0 "This government called in its own notes and reissued them at a new value. Everyone holding the old ones paid for it in a single morning, and lenders have not forgotten: money is lent to this treasury at a premium for a decade afterwards, whatever its books look like in the meantime."
 te_mon_dollarised_modifier:0 "Dollarised Economy"
 te_mon_dollarised_modifier_desc:0 "Your people gave up on the currency before your government did, and the state followed them: prices, wages and contracts are now written in foreign money. Inflation is somebody else's problem, and so is the interest rate. What is gone is #b seigniorage#! — the quiet income a state earns by issuing the money its people use. Three quarters of it now accrues to whoever prints the notes in your shopkeepers' tills."
 te_mon_gold_carry_expense:0 "Interest on Borrowed Gold"
 te_mon_gold_carry_expense_desc:0 "The central bank drew gold in from abroad with a high rate, and the balances that came are paid that rate for as long as they stay. The gold sits in the vault earning nothing; the interest is real, and the treasury pays it."
 te_mon_lolr_reneged:0 "Broken Guarantee"
 te_mon_lolr_reneged_desc:0 "We refused to honour a lender-of-last-resort guarantee when it was called. While this lasts, our remaining guarantees are worth nothing to the countries that hold them."
 te_mon_peg_broken_premium:0 "Broken Peg"
 te_mon_peg_broken_premium_desc:0 "We walked away from a currency peg. Lenders remember a parity that was promised and not kept."
 te_mon_peg_credibility_lost:0 "A Promise Once Broken"
 te_mon_peg_credibility_lost_desc:0 "A gold standard is cheap to borrow on because the promise has never been broken. This one has. Lenders will give the peg its old benefit of the doubt again, but not for ten years."
 te_mon_peg_devaluation_pressure:0 "Devaluation Pass-Through"
 te_mon_peg_devaluation_pressure_desc:0 "Imports cost more in the devalued currency, and the rise works its way through every price that depends on them until the economy has digested it."
 te_mon_peg_devalued:0 "Devalued Peg"
 te_mon_peg_devalued_desc:0 "#lore (From an earlier version: a devaluation now moves the Exchange Rate Index instead.)#! The currency still converts to gold — at a worse price than it did. Everything this country sells abroad is suddenly cheap and everything it buys is dear, an advantage that wears off as prices at home catch up."
 te_mon_peg_suspension:0 "Convertibility Suspended"
 te_mon_peg_suspension_desc:0 "The government has stopped paying gold for its notes. The law still says gold standard; the counter says otherwise. Until the suspension ends the central bank sets its rate as freely as any paper-money bank and is judged like one — and lenders charge for the broken promise for as long as it stays broken."
 te_mon_real_wage_dividend:0 "Real-Wage Dividend"
 te_mon_real_wage_dividend_desc:0 "A pay rise is only a pay rise if prices stay still. Organised workers and a welfare floor raise what your lower strata #b expect#! of life; while inflation is in the stable band, the pay rise those same laws won actually arrives, so part of that expectation is met rather than disappointed — fewer people feel cheated at the same standard of living. The money they spend feeds back into the financial cycle as demand as well. Both halves scale with how strong those laws are, and both switch off the moment inflation leaves the stable band, because wages rising into rising prices buy nothing."
 te_mon_stance_politics_loose:0 "Cheap Money Politics"
 te_mon_stance_politics_loose_desc:0 "For half a year now your central bank has read its own rate as #b loose#! — below what it believes the economy can bear. Cheap money is the debtor's friend, and everyone who owes rather than owns has noticed: industrialists rolling over working capital, mortgaged farmers, and the workers whose jobs depend on both borrowing cheaply. The people whose income is a claim on somebody else's debt have noticed too, and they are not pleased — rents, mortgage interest and the family savings all buy less than they did. This reflects the stance as the bank #b reads#! it, not the true cost of money, which nobody knows. It fades once the bank returns to a neutral setting — within six months, and sooner the shorter the stance ran — and lifts at once if it tightens instead."
 te_mon_stance_politics_tight:0 "Dear Money Politics"
 te_mon_stance_politics_tight_desc:0 "For half a year now your central bank has read its own rate as #b tight#! — above what it believes the economy can bear. Dear money rewards whoever holds the paper: landowners living off rents and mortgage interest, and shopkeepers whose savings are the family's capital. Everyone who owes pays for it. The industrialist rolls over working capital at the higher rate, the mortgaged farmer pays it out of the same harvest, and the jobs that depend on both get scarcer. This reflects the stance as the bank #b reads#! it, not the true cost of money, which nobody knows. It fades once the bank returns to a neutral setting — within six months, and sooner the shorter the stance ran — and lifts at once if it starts easing instead."
 te_mon_union_adopt_effect_tt:0 "You #b adopt your bloc leader's currency#!. Your policy rate becomes theirs, your exchange rate jumps to theirs, you can no longer monetise your deficit, and you gain #G +5%#! export and import advantage. Your inflation, your cycle and your debts remain your own."
 te_mon_union_adopter:0 "Common Currency"
 te_mon_union_adopter_desc:0 "We use our power bloc's common currency. Trade across the bloc's money needs no conversion."
 te_mon_union_banking_union:0 "Banking Union"
 te_mon_union_banking_union_desc:0 "Our banks are supervised, and our depositors guaranteed, by the whole currency union rather than by us alone. Crashes are rarer, the cycle is steadier, and one more intervention is held in reserve for when one comes anyway."
 te_mon_union_exit_premium:0 "Left the Common Currency"
 te_mon_union_exit_premium_desc:0 "We abandoned our bloc's common currency. Lenders who held our debt in one money were repaid in another, and they are slow to forget it."
 te_mon_union_independence:0 "Monetary Independence"
 te_mon_union_independence_desc:0 "We were asked to give up our currency, and refused. A country that will not be leaned on over its money is harder to lean on over anything."
 te_mon_union_leave_effect_tt:0 "You #b leave the common currency#!. Your exchange rate falls at once to where it would have floated. #R +3#! points of credit standing, decaying over ten years; you lose #v 2%#! of GDP from the investment pool and #R 5%#! of your people turn radical; the leader's relations fall by #R 30#! and the bloc loses #R 5%#! cohesion. You cannot re-adopt for #b ten years#!."
 te_mon_union_press_effect_tt:0 "You #b press for monetary convergence#!. While it lasts you pay #R 50#! influence per holdout; holdouts lose the cooperation benefit, may adopt whatever their debts, and are put the question. Each one that #b refuses#! costs the bloc #R 5%#! cohesion and sours relations."
 te_mon_union_press_off_effect_tt:0 "You stop pressing. Holdouts regain the cooperation benefit, and the debt criterion applies again."
 te_mon_union_pressure:0 "Pressing for Monetary Convergence"
 te_mon_union_pressure_desc:0 "We are leaning on the members of our bloc that have not adopted our currency. It costs influence for every one of them."
 te_mon_union_req_can_lead_tt:0 "You have fiat or digital currency and a policy rate of your own"
 te_mon_union_req_debt_tt:0 "Your debt is under half your credit limit — or the leader is pressing for convergence"
 te_mon_union_req_inflation_tt:0 "Your inflation is within #v 3#! points of the leader's"
 te_mon_union_req_lock_tt:0 "Ten years have passed since you last left"
 te_mon_union_req_not_member_tt:0 "You have not already adopted it"
 te_mon_union_req_regime_tt:0 "You have fiat or digital currency and a national bank, and are neither on a currency board nor pegged to another currency by treaty"
 te_mon_union_req_tier_tt:0 "Your power bloc has a common currency, and its leader can issue one (fiat or digital money, with a policy rate of its own)"
 te_mon_union_reserve:0 "Reserve Currency"
 te_mon_union_reserve_desc:0 "The money we use is held the world over. Our traders quote prices in it at both ends of a bargain, and our lenders wanted the currency before they wanted our debt."
 te_mon_union_seigniorage:0 "Seigniorage from the Reserve Currency"
 te_mon_union_seigniorage_desc:0 "The world parks balances in our money, and issuing them costs us nothing. It is worth whatever share of the world ties its currency to ours."
 te_monetary_rate_paid:0 "Monetary Policy: Market Interest Rate"
 te_monetary_rate_paid_desc:0 "The yearly interest your government pays on its debt, and the only rate it pays — it replaces the flat rate every country used to borrow at. It is the market yield on your paper — your policy rate, or the world reference rate plus the inflation lenders expect of you, whichever is higher — plus what they charge for what your country is and for what is happening to it, less the inflation that actually occurred. The Banking journal entry breaks the figure down line by line."
 te_monetisation_minting:0 "Monetising the Deficit"
 te_monetisation_minting_desc:0 "Your government is paying its bills with money the national bank creates for it rather than with money it has borrowed or raised. The mint runs beyond what the economy needs, and the extra lands in the treasury. It is the fastest revenue a state can raise and the most expensive: per pound financed it pushes prices roughly eight times as hard as borrowing the same amount, and lenders charge you for doing it."
 te_open_map_mode_survey:0 "Open Map-Mode Survey"
 te_receivership_pretext_tt:0 "The receiving country keeps a national bank and outranks the debtor or has the larger economy — and the debtor is #R in default#!. An insolvent government is the only ground for demanding this."
 te_receivership_receiver_solvent_tt:0 "The receiving country is not itself in default"
 te_receivership_regime_valid_tt:0 "The receiver has a national bank and is solvent; neither country is a command economy"
 te_research_speed_boost:0 "Domestic Research Stimulus"
 te_research_speed_chill:0 "Research Climate Cools"
 te_state_tourism_appeal_tt:0 "#bold [concept_tourism_base_appeal]#!\nA fixed score for each state, set by its landscape, climate and history. Nothing changes it.\n\nMaximum: #v +100%#!"
 te_state_tourism_applied_label:0 "All modifiers"
 te_state_tourism_art_tt:0 "#bold [concept_tourism_art]#!\nEach $building_art_academy$ level adds #v +1%#! up to level 20, #v +0.25%#! up to level 100, #v +0.05%#! up to level 500 and #v +0.01%#! up to level 1,500.\n\nMaximum: #v +70%#!"
 te_state_tourism_cities_ranked:0 "[concept_tourism_cities] #grey (rank [State.MakeScope.ScriptValue('city_size_rank')|0])#!"
 te_state_tourism_cities_tt:0 "#bold [concept_tourism_cities]#!\nThe world's 20 largest cities draw tourists: #v +100%#! for the largest, #v 5%#! less for each place below it, and nothing below 20th. City ranks are recalculated every month.\n\nMaximum: #v +100%#!"
 te_state_tourism_cities_unranked:0 "[concept_tourism_cities] #grey (unranked)#!"
 te_state_tourism_monuments_tt:0 "#bold [concept_tourism_monuments]#!\nA $building_skyscraper$ adds #v +10%#!, and every monument #v +25%#!. There is no maximum.\n\nA $building_grand_monument$ is not counted here: its bonus is a separate modifier, included in the #bold All modifiers#! line below."
 te_state_tourism_output_applied_tt:0 "#bold [concept_tourism_output] on this state#!\nEvery modifier on this state that changes tourism output: the sources above, as last applied, plus any others, such as airports, pollution and [concept_turmoil]. Hover the value for the full breakdown.\n\nThe sources above are re-applied each month, so a change there shows up here after the next monthly update."
 te_state_tourism_output_tt:0 "#bold [concept_tourism_output]#!\n$concept_tourism_output_desc$\n\nThe sources below come to #v [State.MakeScope.ScriptValue('total_tourism_output_bonus_percent')|+=0%]#!. It is applied to the state as a modifier and refreshed each month. The bar under each source shows how close it is to its maximum."
 te_state_tourism_parks_tt:0 "#bold [concept_tourism_parks]#!\nA $building_national_park$ adds a flat #v +25%#!."
 te_state_tourism_ports_tt:0 "#bold [concept_tourism_ports]#!\nEach $building_port$ level adds #v +0.2%#! up to level 100, then #v +0.04%#! per level up to level 500.\n\nMaximum: #v +36%#!"
 te_state_tourism_throughput_applied_tt:0 "#bold [concept_tourism_throughput] on this state#!\nEvery modifier on this state that changes tourism throughput: the sources above, as last applied, plus any others, such as decrees and a $building_grand_monument$. Hover the value for the full breakdown.\n\nThe sources above are re-applied each month, so a change there shows up here after the next monthly update."
 te_state_tourism_throughput_tt:0 "#bold [concept_tourism_throughput]#!\n$concept_tourism_throughput_desc$\n\nThe sources below come to #v [State.MakeScope.ScriptValue('total_tourism_throughput_bonus_percent')|+=0%]#!. It is applied to the state as a modifier and refreshed each month. The bar under each source shows how close it is to its maximum."
 te_state_tourism_transit_tt:0 "#bold [concept_tourism_transit]#!\nEach $building_railway$ level and each $building_highway$ level adds #v +0.1%#! up to level 100, then #v +0.02%#! per level up to level 500.\n\nMaximum: #v +36%#! (#v +18%#! from each)"

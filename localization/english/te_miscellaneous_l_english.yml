 CAPITAL_CONTROLS_GP_RELATIONS_TT:0 "#R -2#! relations with all [concept_great_power]s."
 CB_ASSET_RELIEF_DESC:"The State shall purchase 'toxic' or non-performing assets from private ledgers to cleanse the [concept_banking_cycle]. This provides a clean slate for growth without the crushing weight of a credit hike."
 CB_BAIL_IN_DESC:"When a bank fails, its bondholders and large depositors take the loss instead of the taxpayer: their claims are written down and turned into the bank's new capital. It costs the treasury nothing and teaches lenders to price risk again, but the wealthy creditors who pay are furious, and debt that can be written down costs more to issue."
 CB_BANK_HOLIDAY_DESC:"Close every bank in the country for up to ninety days, so a run has nowhere to run to. Examiners sort the sound banks from the insolvent while the doors are shut, and the panic has time to pass. Nobody can reach their money in the meantime, and commerce limps along on whatever cash is already in hand."
 CB_CAPITAL_CONTROLS_OUT:"Capital Controls (Outflows)"
 CB_CAPITAL_CONTROLS_OUT_DESC:"To prevent 'Capital Flight' during times of crisis or war, we forbid the movement of investment funds across our borders. Money that cannot leave cannot punish us for our interest rate: while controls hold, the gap between our rate and the world's moves our exchange rate, our gold and confidence in our peg only a #b quarter#! as much. They do nothing for a currency that is distrusted for its inflation or its debts — and in peacetime, every year they stay costs us more with the people whose capital we have trapped."
 CB_COUNTERCYCLICAL_BUFFER_DESC:"Forcing financial institutions to retain a higher percentage of their earnings during [concept_banking_cycle] boom years builds a 'war chest' for the lean years, though it slows the immediate rate of reinvestment from our wealthiest citizens."
 CB_DIRECTED_CREDIT_AGRI:"Directed Credit to Agriculture"
 CB_DIRECTED_CREDIT_AGRI_DESC:"Land-mortgage banks lend against farms, estates and plantations, so the countryside can drain, fence and mechanise on borrowed money. Cheap farm credit has fed more than one land boom, and every land boom has ended in foreclosures."
 CB_DIRECTED_CREDIT_ARMS:"Directed Credit to Armaments"
 CB_DIRECTED_CREDIT_ARMS_DESC:"The State guarantees the loans of arsenals, munitions works and shipyards, and buys what they make. With the government as the buyer there is less room for speculation than in other lending, but the Intelligentsia ask what else the money could have built."
 CB_DIRECTED_CREDIT_ELEC:"Directed Credit to Electrification & High Tech"
 CB_DIRECTED_CREDIT_ELEC_DESC:"Public lending carries power lines where no private utility would build them, and backs the laboratories of new industry. The private utilities, which would rather set the pace of electrification themselves, fight it every step of the way."
 CB_DIRECTED_CREDIT_HEAVY:"Directed Credit to Heavy Industry"
 CB_DIRECTED_CREDIT_HEAVY_DESC:"Development banks lend to steelworks, engineering and chemical works on the State's terms, at rates no private lender would offer. The Industrialists welcome the capital; the Landowners watch credit that once went to the land go to the furnaces instead."
 CB_DIRECTED_CREDIT_INFRA:"Directed Credit to [concept_infrastructure]"
 CB_DIRECTED_CREDIT_INFRA_DESC:"By mandating that credit flow toward national [concept_infrastructure] and manufacturing, we can force industrialization even when the private market is hesitant. The Industrialists may chafe at the loss of control, but the State's goals must come first."
 CB_DISABLE_ASSET_RELIEF:"End Asset Relief Program"
 CB_DISABLE_ASSET_RELIEF_DESC:"Terminate the asset relief program and remove its ongoing support from the [concept_banking_cycle]."
 CB_DISABLE_BAIL_IN:"End the Bail-in Regime"
 CB_DISABLE_BAIL_IN_DESC:"Stop writing down creditors' claims. Failing banks go back to the old choice between rescue and ruin."
 CB_DISABLE_BANK_HOLIDAY:"Reopen the Banks"
 CB_DISABLE_BANK_HOLIDAY_DESC:"End the bank holiday early and let depositors back in. The five-year wait before another one still runs."
 CB_DISABLE_CAPITAL_CONTROLS_OUT:"End Capital Controls (Outflows)"
 CB_DISABLE_CAPITAL_CONTROLS_OUT_DESC:"Lift the emergency restrictions on capital outflows and allow investment funds to move abroad again."
 CB_DISABLE_COUNTERCYCLICAL_BUFFER:"End Counter-cyclical Buffer"
 CB_DISABLE_COUNTERCYCLICAL_BUFFER_DESC:"Suspend the counter-cyclical capital buffer and stop forcing financial institutions to retain extra [concept_banking_cycle] reserves."
 CB_DISABLE_DIRECTED_CREDIT_AGRI:"End Directed Credit to Agriculture"
 CB_DISABLE_DIRECTED_CREDIT_AGRI_DESC:"Stop steering credit to the land and return lending decisions to the market."
 CB_DISABLE_DIRECTED_CREDIT_ARMS:"End Directed Credit to Armaments"
 CB_DISABLE_DIRECTED_CREDIT_ARMS_DESC:"Stop guaranteeing the arms industry's borrowing and return lending decisions to the market."
 CB_DISABLE_DIRECTED_CREDIT_ELEC:"End Directed Credit to Electrification & High Tech"
 CB_DISABLE_DIRECTED_CREDIT_ELEC_DESC:"Stop financing power and high technology on the State's terms and return lending decisions to the market."
 CB_DISABLE_DIRECTED_CREDIT_HEAVY:"End Directed Credit to Heavy Industry"
 CB_DISABLE_DIRECTED_CREDIT_HEAVY_DESC:"Stop steering credit into heavy industry and return lending decisions to the market."
 CB_DISABLE_DIRECTED_CREDIT_INFRA:"End Directed Credit to [concept_infrastructure]"
 CB_DISABLE_DIRECTED_CREDIT_INFRA_DESC:"Stop directing credit into [concept_infrastructure] and manufacturing and return lending decisions to the market."
 CB_DISABLE_EMERGENCY_LIQUIDITY:"End Emergency Liquidity Program"
 CB_DISABLE_EMERGENCY_LIQUIDITY_DESC:"Close the emergency liquidity facilities and withdraw the standing lender-of-last-resort support."
 CB_DISABLE_EXPAND_DEPOSIT_GUARANTEE:"End Deposit Guarantee Expansion"
 CB_DISABLE_EXPAND_DEPOSIT_GUARANTEE_DESC:"Scale back the expanded deposit guarantee and remove its continuing stabilizing effect."
 CB_DISABLE_EXPORT_CREDIT:"End Export Credit Facility"
 CB_DISABLE_EXPORT_CREDIT_DESC:"Shut down the export credit facility, ending the subsidized lending program and its ongoing fiscal burden."
 CB_DISABLE_MORAL_SUASION:"End Moral Suasion"
 CB_DISABLE_MORAL_SUASION_DESC:"Cease the Bank's informal pressure campaign and remove its cautionary guidance from the market."
 CB_DISABLE_OPEN_MARKET_OPS:"End Open-Market Operations"
 CB_DISABLE_OPEN_MARKET_OPS_DESC:"Stop the special open-market purchases and remove their continuing liquidity support."
 CB_DISABLE_RAISE_MARGIN_REQ:"Lower Margin Requirements"
 CB_DISABLE_RAISE_MARGIN_REQ_DESC:"Relax elevated margin requirements and remove the extra collateral burden from borrowers."
 CB_DISABLE_RESERVE_REQUIREMENTS:"Lower Reserve Requirements"
 CB_DISABLE_RESERVE_REQUIREMENTS_DESC:"Let the banks lend out more of their deposits again."
 CB_EMERGENCY_LIQUIDITY_DESC:"As the 'Lender of Last Resort,' we must open the vaults to provide credit to banks facing a run. It is an expensive and risky move that can reignite speculation, but it is often the fastest way to arrest a systemic panic and restore confidence."
 CB_EXPAND_DEPOSIT_GUARANTEE:"Expand Deposit Guarantee"
 CB_EXPAND_DEPOSIT_GUARANTEE_DESC:"To prevent a total collapse of public trust during a panic, the State will guarantee the savings of the common citizen. This ensures loyalty and social stability, even as the markets tremble."
 CB_EXPORT_CREDIT_DESC:"Establishing a facility to provide subsidized, low-interest credit to firms engaged in the export of manufactured goods allows our industry to undercut foreign competitors and dominate global markets. The ongoing cost of maintaining these favorable terms is a continuous drain on the public purse."
 CB_MORAL_SUASION_DESC:"Sometimes a stern word from the Governor of the Bank is enough. Through informal 'arm-twisting' and guidance, we can encourage lenders to be more cautious without the need for heavy-handed legislation."
 CB_OPEN_MARKET_OPS:"Open-Market Operations"
 CB_OPEN_MARKET_OPS_DESC:"The proactive purchase of government securities and commercial paper injects immediate cash into the [concept_banking_cycle], stimulating service-sector growth and encouraging new capital ventures. The bank pays for those securities with money it creates, so only a #bold fiat#! or #bold digital#! currency can do this — and only once the policy rate has run out of room to fall, because a rate cut is the cheaper way to do the same job."
 CB_RAISE_MARGIN_REQ:"Raise Margin Requirements"
 CB_RAISE_MARGIN_REQ_DESC:"Speculation on credit has become too common among the [concept_middle_strata]. By requiring higher upfront collateral for loans, we ensure that only stable ventures proceed, protecting the economy."
 CB_RESERVE_REQUIREMENTS_DESC:"Require every bank to hold a larger share of its deposits in cash or at the central bank. Less of each deposit can be lent out again, so credit — and the money it creates — grows more slowly in a boom. It needs no modern instruments: reserve rules are as old as banking regulation itself."
 CE_ADMIN_CAMPAIGN_DESC:0 "Launch a bureau-wide efficiency drive, replacing or removing underperforming planners. Clears significant [concept_bubble_pressure] at the cost of intelligentsia and industrialist approval."
 CE_CONSOLIDATION_ORDER_DESC:0 "Mandate the merger of redundant parallel production units into consolidated complexes. Reduces [concept_bubble_pressure] but requires investment from the pool; best used during stable periods."
 CE_COORDINATION_PROTOCOL_DESC:0 "Establish a permanent multi-ministry joint committee to proactively resolve allocation conflicts. Cheap and steady; best deployed before crisis develops."
 CE_CULTURAL_ASSIMILATION_BODY:0 "Direct the [concept_bureaucracy] to extend metropolitan language, schooling, and civic identity into colonial territories. A one-shot program startup payment from the [concept_treasury] enables the apparatus; ongoing [concept_bureaucracy] and [concept_authority] costs sustain it. The reward accelerates [concept_assimilation] and [concept_conversion] in the colonies — but the policy itself politicises the colonised, accelerating radicalism in those who resist it."
 CE_CULTURAL_ASSIMILATION_DESC:0 "$CE_CULTURAL_ASSIMILATION_BODY$\n\n#bold Bar contribution while active:#! [ROOT.GetCountry.GetModifier.GetValueWithBreakdownFor('country_colonial_assim_effectiveness_add')] / month"
 CE_DISABLE_ADMIN_CAMPAIGN:0 "End Performance Campaign"
 CE_DISABLE_ADMIN_CAMPAIGN_DESC:0 "Wind down the efficiency drive and allow political relations with administrators to recover."
 CE_DISABLE_CONSOLIDATION_ORDER:0 "Revoke Consolidation Order"
 CE_DISABLE_CONSOLIDATION_ORDER_DESC:0 "Cancel the ongoing plant consolidation program."
 CE_DISABLE_COORDINATION_PROTOCOL:0 "Dissolve Coordination Protocol"
 CE_DISABLE_COORDINATION_PROTOCOL_DESC:0 "Retire the joint committee and return each ministry to independent operation."
 CE_DISABLE_DISTRIBUTION_UPGRADE:0 "Suspend Distribution Upgrade"
 CE_DISABLE_DISTRIBUTION_UPGRADE_DESC:0 "Halt the logistics investment program and free up planning budget capacity."
 CE_DISABLE_EMERGENCY_ALLOCATION:0 "Close Emergency Allocation"
 CE_DISABLE_EMERGENCY_ALLOCATION_DESC:0 "Withdraw the priority-sector resource redirect and restore normal distribution channels."
 CE_DISABLE_PLAN_REVISION:0 "Lift Plan Revision"
 CE_DISABLE_PLAN_REVISION_DESC:0 "Restore prior production directives and close the emergency revision order."
 CE_DISABLE_STRATEGIC_STOCKPILE:0 "Release Strategic Stockpile"
 CE_DISABLE_STRATEGIC_STOCKPILE_DESC:0 "Stand down the stockpile accumulation order and return resources to active circulation."
 CE_DISABLE_TARGET_REDUCTION:0 "Restore Production Targets"
 CE_DISABLE_TARGET_REDUCTION_DESC:0 "Rescind the target reduction order and restore prior production commitments."
 CE_DISTRIBUTION_UPGRADE_DESC:0 "Invest in rail, depot, and logistics capacity to permanently improve input [concept_throughput] across the planned network. Strong long-term benefit; expensive and slow: avoid during crisis."
 CE_EMERGENCY_ALLOCATION_DESC:0 "Redirect critical materials and transport to a priority deficit sector. Accelerates coordination momentum but risks building new imbalances elsewhere: best used during panic or deep downturn."
 CE_INVEST_IN_DEVELOPMENT:0 "Invest in Colonial Development"
 CE_INVEST_IN_DEVELOPMENT_BODY:0 "Pour resources into developing [concept_infrastructure] and institutions in our colonial territories. A one-shot program startup payment from the [concept_treasury], an ongoing GDP-scaled monthly cost, and disapproval from the [Concept('ig_industrialists', 'Industrialists')] and [Concept('ig_petty_bourgeoisie', 'Petite Bourgeoisie')] are the price; in exchange, the colonies become a credible destination for migrants and [concept_colonial_stability] steadily rises."
 CE_INVEST_IN_DEVELOPMENT_DESC:0 "$CE_INVEST_IN_DEVELOPMENT_BODY$\n\n#bold Bar contribution while active:#! [ROOT.GetCountry.GetModifier.GetValueWithBreakdownFor('country_colonial_invest_effectiveness_add')] / month"
 CE_INVEST_POOL_INJECT:0 "Capital Injection"
 CE_INVEST_POOL_INJECT_DESC:0 "Transfer funds from the state treasury into the national [concept_investment_pool], accelerating construction of planned projects. Costs #bold 0.2%#! of [Concept('concept_gdp', 'GDP')]."
 CE_INVEST_POOL_WITHDRAW:0 "Capital Withdrawal"
 CE_INVEST_POOL_WITHDRAW_DESC:0 "Redirect funds from the national [concept_investment_pool] back to the state treasury. Withdraws up to #bold 0.2%#! of [Concept('concept_gdp', 'GDP')] (or all remaining funds if less)."
 CE_MILITARY_GARRISON_BODY:0 "Station military forces in colonial territories to maintain order. Costs [concept_authority], army projection, and bureaucratic capacity. While active, [concept_infamy] decays more slowly — every diplomatic incident, every war, the one-shot infamy hit on activation, all linger longer — so the international reputation cost compounds across the run."
 CE_MILITARY_GARRISON_DESC:0 "$CE_MILITARY_GARRISON_BODY$\n\n#bold Bar contribution while active:#! [ROOT.GetCountry.GetModifier.GetValueWithBreakdownFor('country_colonial_garrison_effectiveness_add')] / month"
 CE_NEEDS_COLONIAL_STATES:0 "Must have colonial territories (non-[concept_homeland] states)."
 CE_NEEDS_COLONIAL_STATES_OR_SUBJECTS:0 "Must have colonial territories (non-[concept_homeland] states) or qualifying colonial subjects."
 CE_PLANNED_DECOLONIZATION_DESC:0 "[concept_decolonization_system]: release all remaining colonial territories as independent nations in an orderly fashion. A graceful end to empire."
 CE_PLAN_REVISION_DESC:0 "Force an emergency revision of overambitious production targets, reallocating inputs and easing supply-chain friction. Reduces [concept_bubble_pressure] and slows [concept_banking_momentum] accumulation."
 CE_RELEASE_COLONIAL_TERRITORY:0 "Release Colonial Territory"
 CE_RELEASE_COLONIAL_TERRITORY_DESC:0 "Release one colonial territory as an independent nation. Improves stability and grants a peaceful [concept_decolonization_system] [concept_prestige] bonus."
 CE_REMOVE_CULTURAL_ASSIMILATION:0 "End Cultural Assimilation"
 CE_REMOVE_CULTURAL_ASSIMILATION_DESC:0 "Cease the cultural [concept_assimilation] program."
 CE_REMOVE_INVEST_IN_DEVELOPMENT:0 "End Development Investment"
 CE_REMOVE_INVEST_IN_DEVELOPMENT_DESC:0 "Cease the colonial development program."
 CE_REMOVE_MILITARY_GARRISON:0 "Withdraw Military Garrison"
 CE_REMOVE_MILITARY_GARRISON_DESC:0 "Withdraw military forces from colonial territories."
 CE_ROUND_TABLE_CONFERENCE:0 "Convene a Round Table Conference"
 CE_ROUND_TABLE_CONFERENCE_DESC:0 "Negotiate a structured transition for the largest sufficiently-accepted colonial territory. The colony becomes independent on friendly terms with a Commonwealth Legacy: positive starting relations, technological cooperation, no [concept_infamy]. Costs 200 [concept_authority] up front and stalls the colony's bar pressure for a year. Distinct from a unilateral release — the Round Table is for the colonies you want to leave on good terms."
 CE_ROUND_TABLE_REQUIRES_ACCEPTABLE_COLONY:0 "Requires at least one overseas colonial state with no severely unaccepted population."
 CE_STRATEGIC_STOCKPILE_DESC:0 "Order the accumulation of national material reserves as a buffer against sudden input shortages. A steady, defensive tool providing modest [concept_bubble_pressure] reduction at low planning cost."
 CE_TARGET_REDUCTION_DESC:0 "Formally scale back overambitious plan targets to provisioned capacity, clearing systemic friction. Reduces [concept_bubble_pressure] significantly but irritates [concept_upper_strata] who invested in ambitious output projections."
 CE_WITHDRAW_POSSIBLE_TT:0 "Must have funds in the [concept_investment_pool]"
 CH_CULTURAL_INSTITUTES_DESC:0 "Expand museums, academies, and scholarships to turn domestic culture into a more reliable source of global influence."
 CH_CULTURAL_PROTECTIONISM_DESC:0 "Shield domestic cultural industries from foreign competition, gaining authority and cultural [concept_power_bloc_cohesion] at the cost of openness."
 CH_DECREASE_PROGRAM_FUNDING:0 "Decrease Cultural Program Funding"
 CH_DECREASE_PROGRAM_FUNDING_DESC:0 "Reduce direct cultural patronage and lower its recurring financial burden."
 CH_DISABLE_CULTURAL_INSTITUTES:0 "Defund Cultural Institutes"
 CH_DISABLE_CULTURAL_INSTITUTES_DESC:0 "Scale back the state's cultural patronage network and recover the [concept_bureaucracy] tied up in it."
 CH_DISABLE_CULTURAL_PROTECTIONISM:0 "End Cultural Protectionism"
 CH_DISABLE_CULTURAL_PROTECTIONISM_DESC:0 "Relax defensive cultural policy and reopen the country to outside media and ideas."
 CH_DISABLE_GLOBAL_MEDIA_CAMPAIGN:0 "End Global Media Campaign"
 CH_DISABLE_GLOBAL_MEDIA_CAMPAIGN_DESC:0 "Stop dedicating state authority to exporting our media and narrative abroad."
 CH_DISABLE_WORLD_EXPOSITION:0 "End International Cultural Outreach"
 CH_DISABLE_WORLD_EXPOSITION_DESC:0 "Wind down the state-sponsored cultural outreach program and stop the ongoing expenditure."
 CH_GLOBAL_MEDIA_CAMPAIGN:0 "Launch Global Media Campaign"
 CH_GLOBAL_MEDIA_CAMPAIGN_DESC:0 "Use mass media as an arm of state influence, converting authority into [concept_prestige] and [concept_cultural_pull] abroad."
 CH_INCREASE_PROGRAM_FUNDING:0 "Increase Cultural Program Funding"
 CH_INCREASE_PROGRAM_FUNDING_DESC:0 "Raise the funding level for direct cultural patronage. Each step adds flat [concept_cultural_pull] and a matching recurring expense."
 CH_MEDIA_BLOCKED_BY_PROTECTIONISM:0 "Cannot launch a Global Media Campaign while Cultural Protectionism is in effect."
 CH_PROGRAM_FUNDING_NOT_MAX:0 "Funding is not already at maximum ([ROOT.GetCountry.GetModifier.GetValueWithBreakdownFor('country_cultural_program_max_funding_add')|0])."
 CH_PROGRAM_FUNDING_NOT_MIN:0 "Funding is above zero."
 CH_PROTECTIONISM_BLOCKED_BY_GLOBAL_MEDIA:0 "Cannot enact Cultural Protectionism while a Global Media Campaign is active."
 CH_REQUIRES_MASS_MEDIA_TT:0 "Requires [GetTechnology('mass_media').GetName]."
 CH_REQUIRES_MINISTRY_TT:0 "Requires [GetLawType('law_ministry_of_culture').GetName]."
 CH_WORLD_EXPOSITION_DESC:0 "Dedicate state resources to sustained cultural projection abroad — touring shows, foreign cultural centers, sponsored translations. Costs scale with GDP while the program runs."
 CONTAGION_SCARE_CYCLE_CMD_DESC:0 "[concept_banking_cycle] Value: #R -1#! (state controls absorb most spillovers)"

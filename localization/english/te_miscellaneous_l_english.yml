 banking_dash_momentum_label:0 "Momentum"
 banking_dash_momentum_rising_tag:0 "#R (overheating)#!"
 banking_dash_momentum_tt:0 "#header Momentum#!\nAdded to the cycle every month, so it decides how fast conditions are moving rather than where they are. You see its direction and rough strength, not the figure.\n$TOOLTIP_DELIMITER$\n#title Pushed each month by:#!\nA steady decay towards zero (a tenth of current momentum)\n#variable [JournalEntry.GetCountry.MakeScope.ScriptValue('banking_display_momentum_monthly_add')|+=1]#! from active policies, laws and events\nYour policy stance, currently [JournalEntry.GetCountry.GetCustom('te_mon_stance_band_name')] — [JournalEntry.GetCountry.GetCustom('te_mon_stance_momentum_effect')], on your central bank's own estimate of what your economy can bear\n#lore Plus a monthly random nudge that pulls the cycle back towards the middle of its range; the further from the middle, the stronger the pull.#!"
 banking_dash_momentum_value:0 "[JournalEntry.GetCountry.GetCustom('banking_dash_momentum_band')]"
 banking_dash_mon_anchor_label:0 "Monetary Anchor"
 banking_dash_mon_anchor_state_board:0 "currency board on #v [JournalEntry.GetCountry.MakeScope.Var('te_mon_anchor').GetCountry.GetName]#! — rate #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_anchor_rate_display')|2]%#! + #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_anchor_spread_display')|2]#!"
 banking_dash_mon_anchor_state_none:0 "none — your money is your own"
 banking_dash_mon_anchor_state_peg:0 "pegged to #v [JournalEntry.GetCountry.MakeScope.Var('te_mon_anchor').GetCountry.GetName]#! — rate #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_anchor_rate_display')|2]%#! + #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_anchor_spread_display')|2]#!"
 banking_dash_mon_anchor_state_peg_imposed:0 "pegged to #v [JournalEntry.GetCountry.MakeScope.Var('te_mon_anchor').GetCountry.GetName]#! #R under compulsion#! — rate #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_anchor_rate_display')|2]%#! + #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_anchor_spread_display')|2]#!"
 banking_dash_mon_anchor_state_reserve:0 "others hold your currency"
 banking_dash_mon_anchor_state_union:0 "common currency of #v [JournalEntry.GetCountry.MakeScope.Var('te_mon_anchor').GetCountry.GetName]#! — rate #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_anchor_rate_display')|2]%#!"
 banking_dash_mon_anchor_tt:0 "#header Monetary Anchor#!\nWhether your money is tied to another country's. An anchored country #b has no dial#!: it takes its anchor's policy rate, plus a spread, and its anchor's exchange rate. It cannot monetise its deficit or buy assets — it is not its currency to print.\n$TOOLTIP_DELIMITER$\n#title What it buys:#! the anchor's credibility. Your expected inflation is pulled toward the anchor's target as firmly as #v 80%#! of its central bank's word is worth, if that is more than your own.\n#title What it costs:#! your inflation, your cycle and your neutral rate stay your own, so the borrowed rate is the wrong one whenever the two economies part ways — and you cannot devalue your way out. #v $banking_dash_mon_fx_effect_label$#! shows how far you have drifted from the currency you borrowed.\n$TOOLTIP_DELIMITER$\n#title Three ways to be anchored:#!\nA #v $currency_peg$#! treaty — spread #v +0.5#!, credit standing #G −0.5#! points, and a peg the markets can break.\nA power bloc's #v common currency#! — no spread, and no peg to break: the premium rises instead.\nA #v currency board#! — a puppet, vassal, colony or crown land uses its overlord's money, spread #v +0.25#!.\n$TOOLTIP_DELIMITER$\n#title As an anchor:#! every #v 5%#! of world GDP pegged to your currency is #G −0.1#! points of credit standing, to #G −0.5#!.\n#title Credit standing from arrangements now:#! #G −[JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_arr_standing_display')|2]#!."
 banking_dash_mon_anchor_value:0 "[JournalEntry.GetCountry.GetCustom('te_mon_anchor_state')]"
 banking_dash_mon_anchoring_label:0 "$country_inflation_anchoring_add$"
 banking_dash_mon_anchoring_tt:0 "#header $country_inflation_anchoring_add$#!\n$country_inflation_anchoring_add_desc$\n$TOOLTIP_DELIMITER$\nAbsorbing #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_pressure_anchoring')|1]%#! of the wage and price pressure above, out of #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_anchoring_capacity_display')|1]%#! it could.\n#title Where it comes from:#!\n[JournalEntry.GetCountry.GetModifier.GetValueWithBreakdownFor('country_inflation_anchoring_add')]"
 banking_dash_mon_anchoring_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_pressure_anchoring')|1]% / [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_anchoring_capacity_display')|1]%#!"
 banking_dash_mon_anchorpeg_tt:0 "#header Peg Confidence#!\nHow far the world believes you will hold your parity with #v [JournalEntry.GetCountry.MakeScope.Var('te_mon_anchor').GetCountry.GetName]#!. You have no rate of your own to defend it with, so it moves on one thing: #b overvaluation#! — how far their exchange rate sits above where your own currency would float.\n$TOOLTIP_DELIMITER$\n#title Each month:#!\n#G +1#! while you are overvalued by #v 5#! points or less\n#R −1#! for every #v 2#! points of overvaluation beyond #v 5#! (a quarter of that under capital controls)\n#G +2#! with a #v $swap_line$#!\n$TOOLTIP_DELIMITER$\nOvervalued by #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_overvaluation_display')|1]#! now. Your parity sits #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_peg_parity_offset_display')|1]#! points under theirs.\nAt #v 20#! the markets force the question: shut the door, break the peg, or re-peg lower."
 banking_dash_mon_anchorpeg_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_peg_confidence').GetValue|0]#! of #v 100#!"
 banking_dash_mon_backstops_drawn:0 ". Drawn @money!#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_swap_drawn_display')|D]#! of @money!#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_swap_line_limit_display')|D]#!"
 banking_dash_mon_backstops_label:0 "Backstops"
 banking_dash_mon_backstops_tt:0 "#header Backstops#!\nPoints of risk premium your monetary treaties move, each way.\n$TOOLTIP_DELIMITER$\n#title Received:#!\nA #v $swap_line$#!: #G −1#! point, #G +2#! peg confidence a month, and in a panic borrowed gold leaves at the ordinary speed instead of double. In a slump, a run on your peg or a hyperinflation the provider also lends you #v 0.1%#! of your GDP a month, to a ceiling of #v 2%#! — and a war is #b not#! one of those: a swap line is a central bank's liquidity instrument, not war finance.\n#title It is a loan.#! Once the crisis passes the same #v 0.1%#! a month flows back, interest-free, until the balance is clear; whatever is still outstanding when the line ends is settled in one payment, into debt if that is what it takes. You may hold #b one line at a time#!.\nA #v $lender_of_last_resort$#!: #b half#! of what your debt load adds to your premium, and imported panics start a fifth less deep. Worth nothing while your guarantor is living down a guarantee it broke — and #b less every time you call it#!: half, then #v 35%#!, then #v 20%#!, then nothing at all on the third default. Ten quiet years forget one call.\n$TOOLTIP_DELIMITER$\n#title Extended:#! what you grant costs you #b the recipient's benefit × its GDP ÷ yours#!, never more than the whole. Backing a minor is a sliver; backing an equal costs all of it — and a ward that defaults calls the guarantee."
 banking_dash_mon_backstops_undrawn:0 ""
 banking_dash_mon_backstops_value:0 "#G −[JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_arr_recipient_display')|2]#! received, #R +[JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_arr_provider_display')|2]#! extended[JournalEntry.GetCountry.GetCustom('te_mon_swap_drawn_note')]"
 banking_dash_mon_band_label:0 "Price Band"
 banking_dash_mon_band_tt:0 "#header Price Band#!\nWhich of six bands your inflation falls in. The band is a modifier on your country, so whatever it costs is in your modifier list beside everything else — this row is only where you find out that it is there.\n$TOOLTIP_DELIMITER$\n#title The ladder:#!\n$banking_dash_price_band_deflation$ below #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_band_edge_deflation')|0]%#!, $banking_dash_price_band_comfort$ to #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_band_edge_elevated')|0]%#!, $banking_dash_price_band_elevated$ to #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_band_edge_high')|0]%#!, $banking_dash_price_band_high$ to #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_band_edge_very_high')|0]%#!, $banking_dash_price_band_very_high$ to #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_band_edge_hyper')|0]%#!, $banking_dash_price_band_hyper$ above that\nThe boundaries stick: you stay in the band you are in until prices are #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_band_hysteresis')|2]%#! past the edge, so a figure resting on a boundary does not move you back and forth month after month.\n$TOOLTIP_DELIMITER$\n#title [JournalEntry.GetCountry.GetCustom('te_mon_inflation_band_name')]#!\n[JournalEntry.GetCountry.GetCustom('te_mon_inflation_band_cost')]"
 banking_dash_mon_band_value:0 "[JournalEntry.GetCountry.GetCustom('te_mon_inflation_band_name')]"
 banking_dash_mon_bankgold_label:0 "Bank's Gold Reserve"
 banking_dash_mon_bankgold_tt:0 "#header Bank's Gold Reserve#!\nThe gold your central bank holds against its notes. It is #b the bank's, not the treasury's#!: the government cannot spend it, and nothing that happens to it shows in your budget. It is what a gold standard actually rests on — when the world wants gold for your paper, this is what pays.\n$TOOLTIP_DELIMITER$\nIts limit grows with your economy, so a vault nobody tops up thins out by itself over the decades.\nBelow #v 50%#! a bank on #v $banking_dash_mon_mandate_peg$#! starts holding its rate above the world's to draw gold in. Below #v 10%#! it can no longer pay out, and #v $banking_dash_mon_pegconf_label$#! starts to fall instead.\n$TOOLTIP_DELIMITER$\nTwo things fill it: a rate above the world rate, which #b borrows#! gold from abroad, and #v $banking_dash_mon_btn_recapitalise$#!, which buys it with the treasury's own money. Nothing takes it back out for the government's use."
 banking_dash_mon_bankgold_value:0 "@money!#v [JournalEntry.GetCountry.MakeScope.Var('te_bank_gold').GetValue|D]#! — #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_bank_gold_pct')|0]%#! of its limit"
 banking_dash_mon_btn_delegate:0 "Delegate"
 banking_dash_mon_btn_recapitalise:0 "Recapitalise the Bank"
 banking_dash_mon_btn_take_control:0 "Take Control"
 banking_dash_mon_btn_union_adopt:0 "Adopt the Common Currency"
 banking_dash_mon_btn_union_leave:0 "Leave the Common Currency"
 banking_dash_mon_btn_union_press:0 "Press for Convergence"
 banking_dash_mon_btn_union_press_off:0 "Stop Pressing"
 banking_dash_mon_delegation_bound:0 "#lore Bound by mandate#!"
 banking_dash_mon_delegation_delegated:0 "Delegated"
 banking_dash_mon_delegation_direct:0 "Your government"
 banking_dash_mon_delegation_label:0 "Delegation"
 banking_dash_mon_delegation_tt:0 "#header Delegation#!\nHand the dial to the central bank and it will set the target from its mandate every month, instead of leaving it wherever you last put it. Free to switch on, free to switch off, and when you take it back the target stays where the bank left it.\n$TOOLTIP_DELIMITER$\n$law_central_bank_independence$ makes the arrangement permanent and removes the switch. You cannot overrule the bank, and you cannot quietly run the economy loose in the year before a war. In exchange, lenders believe the mandate: a lower credit-standing floor, a smaller premium, and a bank that reads its own economy more accurately.\n#lore A government that intends to inflate away a war debt should not want that law.#!"
 banking_dash_mon_delegation_value:0 "[JournalEntry.GetCountry.GetCustom('te_mon_delegation_state')]"
 banking_dash_mon_expected_label:0 "Expected Inflation"
 banking_dash_mon_expected_tt:0 "#header Expected Inflation#!\nWhat your lenders and your workers assume prices are going to do. It is the expensive half: inflation nobody saw coming erodes a debt, and inflation everybody expects is simply priced in.\n$TOOLTIP_DELIMITER$\n#title Where it lands:#!\nIt is the floor under your borrowing. Nobody will hold your paper below a normal return over the inflation they expect, so your lenders charge at least the world reference rate plus this figure however low your own policy rate goes — which is why cutting your way out stops working.\nOnce it strays more than #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_unanchored_tolerance')|0]%#! from your bank's target of #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_inflation_anchor')|0]%#!, they charge a premium for the doubt on top; that line is in #title $banking_dash_mon_premium_label$#!.\nIt is not what your bank is aiming at, either: a delegated bank steers on the underlying trend, not on this figure.\n$TOOLTIP_DELIMITER$\nExpectations creep toward the target rather than jumping to it, and how fast depends on who is believed. An independent central bank is believed twice as quickly as a delegated one; a bank the treasury owns is barely believed at all; and a currency redeemable in metal is believed without having to say anything, which is what convertibility buys.\n#lore Belief is also conditional: the further prices run from the target, the less of the target anybody prices in — which is how expectations come unanchored and why they are so slow to come back.#!"
 banking_dash_mon_expected_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_inflation_expected').GetValue|1]%#!"
 banking_dash_mon_fx_controls_off:0 "#lore $concept_capital_controls$ would cut the interest-rate term to a quarter, and nothing else.#!"
 banking_dash_mon_fx_controls_on:0 "#title $banking_capital_controls_out$:#! the interest-rate term above is cut to a #v quarter#!"
 banking_dash_mon_fx_effect_float:0 "exports #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_export_edge_pct')|+=1]%#! · prices #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_imported_display')|+=1]#! pts"
 banking_dash_mon_fx_effect_label:0 "Trade and Prices"
 banking_dash_mon_fx_effect_none:0 "#lore none — the currency does not trade#!"
 banking_dash_mon_fx_effect_peg:0 "overvalued by #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_overvaluation_display')|1]#!"
 banking_dash_mon_fx_effect_tt:0 "#header Trade and Prices#!\nWhat the exchange rate is doing to you.\n$TOOLTIP_DELIMITER$\n#title Trade:#! every point under par is #G +1.25%#! $state_export_advantage_mult$ and #R −1.25%#! $state_import_advantage_mult$ in every state, and every point over par the reverse. A weak currency also adds #R +0.05#! points of risk premium a point — debts owed abroad get heavier.\n#title Prices:#! only a #b change#! is inflationary. Your currency is measured against its own average of the last three years (#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_avg_display')|1]#!), and each point it sits below that adds #v 0.15#! points to your cost of living — more for a market that lives by trade, less for one that barely trades. It shares the #v 6#!-point cap with the price of goods, and a delegated bank looks through it as it would a bad harvest.\n$TOOLTIP_DELIMITER$\n#title Under a fixed parity#! the index cannot move, so the same forces show up as #b overvaluation#!: how far par sits above where your currency would float (#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_shadow_display')|1]#!). On a gold standard every #v 2#! points of it beyond #v 5#! costs a point of #v $banking_dash_mon_pegconf_label$#! a month, not counting whatever a rate under the world's put there — your gold already pays for that. Inflate at home under a fixed parity and you price yourself out of it.\n#title On commodity money#! there is no reserve to lose, so the same overvaluation is paid in #b prices#! instead: every point of it that your own inflation put there, beyond the first #v 2#!, takes a point off the inflation pressure you carry — coin leaving a country whose prices have run ahead of the world's. The whole of it stops at #v 6#! points of pressure, which is why a debasement or a war you have paid for in coin still shows up in your prices."
 banking_dash_mon_fx_effect_value:0 "[JournalEntry.GetCountry.GetCustom('te_mon_fx_effect')]"
 banking_dash_mon_fx_label:0 "Exchange Rate Index"
 banking_dash_mon_fx_state_anchored:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_index_display')|1]#! — #v [JournalEntry.GetCountry.MakeScope.Var('te_mon_anchor').GetCountry.GetName]#!'s"
 banking_dash_mon_fx_state_command:0 "#v Par#! (inconvertible)"
 banking_dash_mon_fx_state_devalued:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_index_display')|1]#! (devalued)"
 banking_dash_mon_fx_state_float:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_index_display')|1]#!"
 banking_dash_mon_fx_state_par:0 "#v Par#! (convertible)"
 banking_dash_mon_fx_tt:0 "#header Exchange Rate Index#!\nHow dear your currency is to foreigners, in real terms: #v 100#! is par, lower is a weak currency, higher a strong one. Nobody sets it. On metal it #b is#! the parity and stays at par; otherwise it follows its target below, closing a twelfth of the distance each month.\n$TOOLTIP_DELIMITER$\n#title Where it is heading:#! #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_target_value')|1]#!\nPar: #v 100#!\nYour real rate against the world's (#v 4#! a point, to five points): #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_term_rate')|+=1]#!\nYour inflation against the world's #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_world_inflation_display')|1]%#! (#v 2#! a point, to ten points): #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_term_inflation')|+=1]#!\nFlight from your risk premium (#v 1.5#! a point): #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_term_premium')|+=1]#!\nEvents still working through: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_fx_shock_display')|+=1]#!\n[JournalEntry.GetCountry.GetCustom('te_mon_fx_controls_note')]\n$TOOLTIP_DELIMITER$\n#lore A high rate and a weak currency are not a contradiction: the first term is what holding your money pays, the second is whether anyone trusts it. A country without a national bank takes the market's rate and earns no carry either way.#!"
 banking_dash_mon_fx_value:0 "[JournalEntry.GetCountry.GetCustom('te_mon_fx_state')]"
 banking_dash_mon_goldcarry_label:0 "Interest on It"
 banking_dash_mon_goldcarry_value:0 "@money!#v [JournalEntry.GetCountry.MakeScope.Var('te_gold_carry').GetValue|D]#! a month"
 banking_dash_mon_goldflow_label:0 "Gold Flow"
 banking_dash_mon_goldflow_tt:0 "#header Gold Flow#!\nGold entering or leaving your #b central bank's reserve#! this month because of the gap between your rate and the world's. It moves the #v $banking_dash_mon_bankgold_label$#!, never your treasury, so it appears nowhere in your budget.\n$TOOLTIP_DELIMITER$\n#title Borrowed gold in the vault:#! @money!#v [JournalEntry.GetCountry.MakeScope.Var('te_gold_hot_money').GetValue|D]#!\nGold drawn in by a high rate is #b hot money#!: it is here for the return, and it will want to go home. The moment your rate is no longer above the world's it leaves #b first#!, at #b twice#! the ordinary speed, before any other drain begins. Attracting gold is borrowing it — #b at your own policy rate#!. It came for that return and it is paid that return, while the gold it bought sits in the vault earning nothing.\n#title Interest on it:#! @money!#v [JournalEntry.GetCountry.MakeScope.Var('te_gold_carry').GetValue|D]#! a month\n#lore This is the one part of all this your treasury sees: it is charged to your budget week by week as #v $te_mon_gold_carry_expense$#!. It is why nobody fills a vault this way for long — and why a government with the money simply buys the gold instead.#!\n$TOOLTIP_DELIMITER$\nGold stops coming in once the reserve reaches its limit. Gold stops going #b out#! when the reserve falls under a tenth of its limit — and #v $banking_dash_mon_pegconf_label$#! drains instead.\n#lore Gold arriving pushes your prices up and gold leaving pulls them down, by about half a point of inflationary pressure for every 1% of GDP a year that moves. A country pulling gold in prices itself out of its own advantage; one bleeding gold deflates its way back.#!\n#lore Leave the gold standard, or lose your national bank, and the borrowed gold goes home out of the vault at once.#!"
 banking_dash_mon_goldflow_value:0 "@money!#v [JournalEntry.GetCountry.MakeScope.Var('te_gold_flow').GetValue|D+]#! a month"
 banking_dash_mon_goldgap_label:0 "Gap to World Rate"
 banking_dash_mon_goldgap_tt:0 "#header Gap to World Rate#!\nYour policy rate less the #v $banking_dash_mon_worldrate_label$#!. Your notes are as good as gold, so a lender compares the two directly — and moves his gold to wherever it earns more.\n$TOOLTIP_DELIMITER$\nEach point of gap moves gold worth #v 0.2%#! of your GDP a month: #G into#! your central bank's reserve when you pay more than the world, #R out of#! it when you pay less. Nothing beyond #v 5#! points moves it any faster.\n#lore It is the bank's gold that moves, not the treasury's. Gold coming in is lent, not earned: see #v $banking_dash_mon_goldflow_label$#!.#!"
 banking_dash_mon_goldgap_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_gold_flow_gap').GetValue|+=1]#! points"
 banking_dash_mon_hotmoney_label:0 "Borrowed Gold"
 banking_dash_mon_hotmoney_value:0 "@money!#v [JournalEntry.GetCountry.MakeScope.Var('te_gold_hot_money').GetValue|D]#!"
 banking_dash_mon_inflation_label:0 "Inflation"
 banking_dash_mon_inflation_tt:0 "#header Inflation#!\nWhat the prices your people actually pay did over the last year. It is a reading, not a lever: you reach it through the rate, through what you print, and through the laws that set what labour costs.\n$TOOLTIP_DELIMITER$\n#title Where it lands:#!\nIt comes off the #title $banking_dash_mon_paid_label$#! above. Every debt is written in money, so what prices did is a discount on what the debt cost you in real terms — the one part of borrowing a government can quietly arrange for itself, and the reason it is always tempting.\nIt sets the real price of credit in your economy: your policy rate less this figure. Whether that is loose or tight for the economy you have is reported as your #title $banking_dash_mon_stance_label$#! below.\nIt puts you in a #title $banking_dash_mon_band_label$#!, and the band is what inflation actually costs you.\nPast #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_band_edge_high')|0]%#! it starts feeding itself: at that point workers bargain for next year's prices rather than last year's, and the labour laws in #title $banking_dash_mon_wage_label$#! count a second time."
 banking_dash_mon_inflation_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_inflation').GetValue|1]%#!"
 banking_dash_mon_mandate_growth:0 "Growth"
 banking_dash_mon_mandate_label:0 "Mandate"
 banking_dash_mon_mandate_peg:0 "Peg Defence"
 banking_dash_mon_mandate_price:0 "Price Stability"
 banking_dash_mon_mandate_tt:0 "#header Mandate#!\nThe rule a delegated bank follows when it sets the target each month. It does nothing at all while you are holding the dial yourself.\n$TOOLTIP_DELIMITER$\n#title $banking_dash_mon_mandate_price$#! leans against inflation first. For every point prices run above its target it puts the rate up by more than a point, so credit really does tighten as inflation climbs instead of quietly loosening. On top of that it leans against the financial cycle with its full weight: tightening into a boom, hard into a frenzy, and cutting hard in a panic. It judges the cycle by where it is heading rather than where it stands, so it stops leaning on a boom that is already turning and starts easing before a slump arrives. It will accept a slump to get prices back down.\n#title $banking_dash_mon_mandate_growth$#! runs about a point looser and reacts only half as hard to the cycle, and it ignores inflation altogether until it passes about four percent — above that it leans on prices as hard as the other mandate does, because inflation left to run past eight percent sets off a wage spiral that no rate may be able to catch. Cheaper credit, more momentum, faster bubbles and more crashes: that is the trade, not an oversight.\n#lore Growth will never set a tighter rate than $banking_dash_mon_mandate_price$ would, so its looseness is only worth something while there is inflation to ignore. When inflation is low, and through a downturn or a panic where the other mandate is already cutting harder than this one would, the two ask for exactly the same rate.#!\n#title $banking_dash_mon_mandate_peg$#! holds the world rate, to the tenth of a point — up to a point above it while the vault is short of gold — so that gold does not drain away, and ignores your domestic cycle entirely. Only a convertible gold standard can run it.\n#lore A change takes effect at the next monthly update.#!"
 banking_dash_mon_mandate_value:0 "[JournalEntry.GetCountry.GetCustom('te_mon_mandate_name')]"
 banking_dash_mon_monetise_label:0 "Monetise Deficit"
 banking_dash_mon_monetise_tt:0 "#header Monetising the Deficit#!\nHow much of your spending your bank simply creates the money for, instead of your government borrowing it. It is the oldest way to pay for a war, and the reason wars end in inflation.\n$TOOLTIP_DELIMITER$\nThe press belongs to the treasury rather than to the bank, so using it takes a currency your state can create, a national bank to create it through, and a bank that still takes your government's instructions. The buttons say what a step is worth and, where you cannot use it, which of those is missing.\n#lore A change takes effect at the next monthly update.#!"
 banking_dash_mon_monetise_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_monetisation_level').GetValue|0]#! of #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_monetisation_max')|0]#!"
 banking_dash_mon_monetise_why_allowed:0 "Your treasury may have money printed to pay its bills"
 banking_dash_mon_monetise_why_backed:0 "Your currency is one your state can create at will — money redeemable in metal, and money nobody issues, cannot be printed into existence"
 banking_dash_mon_monetise_why_cbi:0 "Your central bank still takes instruction from your government"
 banking_dash_mon_monetise_why_command:0 "Your spending is financed on a market rather than allocated by a plan"
 banking_dash_mon_monetise_why_dollarised:0 "You still have a currency of your own to print"
 banking_dash_mon_monetise_why_no_bank:0 "You have a national bank to create the money through"
 banking_dash_mon_no_dial_line:0 "[JournalEntry.GetCountry.GetCustom('te_mon_no_dial_reason')]"
 banking_dash_mon_not_ready:0 "#lore No monetary reading yet. Your treasury reports at the next monthly update.#!"
 banking_dash_mon_paid_label:0 "Rate You Pay"
 banking_dash_mon_paid_script_tag:0 "#lore (expected [JournalEntry.GetCountry.MakeScope.Var('te_rate_paid_pts').GetValue|1]%)#!"
 banking_dash_mon_paid_tt:0 "#header Rate You Pay#!\nThe yearly interest on your debt, taken from the treasury's own books. Beside it is what your central bank and your lenders between them expected to charge. Both are shown on purpose — if the two part company, something outside this system is moving your rate and you can watch it happen.\n$TOOLTIP_DELIMITER$\n#title What adds up:#!\n#v [JournalEntry.GetCountry.MakeScope.Var('te_market_yield').GetValue|1]%#! market yield — the higher of your #v [JournalEntry.GetCountry.MakeScope.Var('te_policy_rate').GetValue|1]%#! policy rate and the #v [JournalEntry.GetCountry.MakeScope.Var('te_mon_era_base_now').GetValue|1]%#! world reference rate plus the #v [JournalEntry.GetCountry.MakeScope.Var('te_inflation_expected').GetValue|1]%#! inflation your lenders expect of you\n#v [JournalEntry.GetCountry.MakeScope.Var('te_premium_structural').GetValue|1]%#! credit standing\n#v [JournalEntry.GetCountry.MakeScope.Var('te_premium_cyclical').GetValue|=+1]%#! risk premium\n#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_inflation_offset')|=+1]%#! inflation — every debt is written in money, so what prices actually did comes off what the debt cost you\n#lore Whatever those four lines come to, you never pay less than #v 0.5%#!. Inflating a debt away can make borrowing very nearly free; it cannot make it free, and the floor is why the lines above may not appear to add up.#!\n$TOOLTIP_DELIMITER$\nNobody will hold your paper below a normal return over the inflation they expect, so cutting the rate beneath that floor stops saving you anything. And only inflation your lenders did not see coming erodes a debt: once they have priced it in, the floor rises with them and you are paying the same in real terms as before.\n$TOOLTIP_DELIMITER$\n#lore Percentage discounts and surcharges from elsewhere — interest-group leaders, constitutional amendments, companies, state-owned debt — scale the finished total rather than any single line of it, which is why the two figures can drift a little apart.#!"
 banking_dash_mon_paid_value:0 "#v [GetPlayer.GetYearlyInterestRate|1%]#!"
 banking_dash_mon_peg_state_breaking:0 "#R Breaking#!"
 banking_dash_mon_peg_state_defending:0 "#Y Being defended#!"
 banking_dash_mon_peg_state_doubted:0 "#R Doubted#!"
 banking_dash_mon_peg_state_suspended:0 "#R Convertibility suspended#!"
 banking_dash_mon_peg_state_trusted:0 "#G Trusted#!"
 banking_dash_mon_peg_state_watched:0 "#Y Watched#!"
 banking_dash_mon_pegconf_label:0 "Peg Confidence"
 banking_dash_mon_pegconf_tt:0 "#header Peg Confidence#!\nHow far the world believes your central bank will go on paying gold for its notes. It only falls when the bank has almost nothing left to pay with: while the #v $banking_dash_mon_bankgold_label$#! is under a tenth of its limit. How rich your treasury is does not enter into it — unless you use it to #v $banking_dash_mon_btn_recapitalise$#!.\n$TOOLTIP_DELIMITER$\n#title While that lasts, each month:#!\n#R −3#! for every point your rate sits under the world rate\n#R −2#! in a downturn or a panic\n#R −2#! while your debt is half your credit limit or more\n#G +2#! while your rate is at or above the world rate and no borrowed gold is waiting to leave\n#lore Borrowed gold that wants to go home and cannot be paid counts double, and as a gap of at least half a point. That is what a run on a currency is.#!\n$TOOLTIP_DELIMITER$\nOut of trouble it recovers a point a month — but only while your rate is at or above the world rate and no borrowed gold is waiting to leave. While gold is draining from a vault that can still pay, confidence holds where it is: the vault is taking the strain, and confidence only starts to fall when the vault cannot.\nAt #v 20#! or under the question is put to you: defend the peg, suspend convertibility, or devalue.\n#lore Suspension: #v [JournalEntry.GetCountry.MakeScope.Var('te_peg_suspended_months').GetValue|0]#! months left. Defence of the peg: #v [JournalEntry.GetCountry.MakeScope.Var('te_peg_defend_months').GetValue|0]#! months left.#!"
 banking_dash_mon_pegconf_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_peg_confidence').GetValue|0]#! of #v 100#! — [JournalEntry.GetCountry.GetCustom('te_mon_peg_state')]"
 banking_dash_mon_premium_label:0 "Risk Premium"
 banking_dash_mon_premium_tt:0 "#header Risk Premium#!\nThe half of your borrowing premium that moves: where the financial cycle stands, which crisis tools you have reached for, and how far you are already borrowed.\nIt is charged after the credit-standing floor rather than folded into it, so a panic bites a great power exactly as hard as it bites anyone else instead of vanishing into a floor the great power was already under.\n$TOOLTIP_DELIMITER$\n#title Computed from your position:#!\n#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_scaled_debt_premium')|1]%#! debt load — nothing while your debt stays under a quarter of your credit limit, then climbing to #v +4.0%#! as it reaches the limit\n#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_premium_unanchored')|1]%#! unanchored expectations — nothing while your lenders expect inflation within three points of your target, then a quarter of a point for every further point they expect of you\n#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_premium_monetisation')|1]%#! monetisation — half a point for every level of spending you are financing by printing money rather than borrowing it\n$TOOLTIP_DELIMITER$\n#title From the cycle, your tools and events:#!\n[JournalEntry.GetCountry.GetModifier.GetValueWithBreakdownFor('country_risk_premium_add')]"
 banking_dash_mon_premium_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_premium_cyclical').GetValue|=+1]%#!"
 banking_dash_mon_pressure_label:0 "Inflationary Pressure"
 banking_dash_mon_pressure_tt:0 "#header $country_inflation_pressure_add$#!\n$country_inflation_pressure_add_desc$\n$TOOLTIP_DELIMITER$\n#title What is pushing right now:#!\n[JournalEntry.GetCountry.GetModifier.GetValueWithBreakdownFor('country_inflation_pressure_add')]"
 banking_dash_mon_pressure_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_other_pressure_display')|=+1]%#!"
 banking_dash_mon_range_commodity:0 "#lore Your coin is the commodity, so the price of credit here can never stray far from what the metal costs everywhere else. Your bank may hold its discount rate up to one point under the world's, or up to three over it: cheap money sends coin abroad, while dear money was always a bank's answer to a panic and costs only what it costs your borrowers and your treasury. Enough to lean against a season, not enough to run a policy. Prices are held from outside rather than by the dial: let your own inflation run more than a point above the world's and coin goes abroad until it stops. A formal standard would free the dial and make your reserves pay for it instead.#!"
 banking_dash_mon_range_free:0 "#lore Nothing you have promised to redeem constrains the dial: the range is yours to use, and what it costs you is what it does to your prices.#!"
 banking_dash_mon_range_gold:0 "#lore A gold standard leaves the dial free and makes your reserves pay for it: a rate under the world rate bleeds gold abroad month after month, and when the vault is nearly empty it bleeds confidence in the peg instead.#!"
 banking_dash_mon_range_gold_suspended:0 "#lore Convertibility is suspended, so nothing is redeemable and nothing constrains the dial. Your bank has a fiat currency's range for as long as the suspension lasts — and a fiat currency's inflation to go with it.#!"
 banking_dash_mon_rate_label:0 "Policy Rate"
 banking_dash_mon_rate_tt:0 "#header Policy Rate#!\nThe price of short-term credit in your country, and the floor every other borrowing cost is built on.\nWhere there is a central bank to set it, this is a decision: the rate closes on the chosen target by #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_drift_step')|2]#! of a point a month, so changing course takes seasons rather than weeks. A central bank running its mandate cuts #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_emergency_cut_factor')|0]×#! as fast while the financial cycle is in #yellow Stagnation#! or worse, so it is not still leaning on an economy that has already broken. Everywhere else it is simply what credit costs: an administered rate, or the world rate plus the inflation lenders expect of you plus a spread.\n$TOOLTIP_DELIMITER$\nA rate below what your economy can bear feeds the financial cycle's momentum and builds bubble pressure; a rate above it leans against both. Which side you are on is reported as your policy stance below."
 banking_dash_mon_rate_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_policy_rate').GetValue|1]%#!"
 banking_dash_mon_stance_impact_line:0 "#lore As your bank reads it, this stance is [JournalEntry.GetCountry.GetCustom('te_mon_stance_momentum_effect')], and [JournalEntry.GetCountry.GetCustom('te_mon_stance_bubble_effect')].#!"
 banking_dash_mon_stance_label:0 "Policy Stance"
 banking_dash_mon_stance_tt:0 "#header Policy Stance#!\nWhether your rate is loose or tight against what your economy can bear right now. A loose stance adds to the financial cycle's momentum and builds bubble pressure; a tight one drains both. This is how the dial reaches the cycle at all.\n$TOOLTIP_DELIMITER$\n#title At [JournalEntry.GetCountry.GetCustom('te_mon_stance_band_name')], your rate is:#!\n[JournalEntry.GetCountry.GetCustom('te_mon_stance_momentum_effect')]\n[JournalEntry.GetCountry.GetCustom('te_mon_stance_bubble_effect')]\n#lore For scale, the phase of the cycle you are in moves Momentum by 0.05 to 0.2 and Bubble Pressure by 1 to 7 a month.#!\n$TOOLTIP_DELIMITER$\nNobody knows what the economy can bear — not you, and not your own central bank, whose reading carries its own error. The band above is that bank's estimate, so the real push can be stronger or weaker than it says, and stepping the dial to hunt for the exact turning point will not find it."
 banking_dash_mon_stance_value:0 "[JournalEntry.GetCountry.GetCustom('te_mon_stance_band_name')]"
 banking_dash_mon_standing_label:0 "Credit Standing"
 banking_dash_mon_standing_tt:0 "#header Credit Standing#!\nThe permanent half of your borrowing premium: what lenders think your country is, rather than what is happening to it this year. Access to capital markets, your standing among the powers, your institutions and the credibility of your monetary arrangements all sit here.\nIt is floored at #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_standing_floor')|2]%#!, so standing earned past the floor buys nothing at all. Credibility has a lower bound, and that is it.\n$TOOLTIP_DELIMITER$\n#title Computed from your position:#!\n#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_access_premium')|1]%#! capital-market access — your finance technologies, and whether you have a stock exchange at all\n$TOOLTIP_DELIMITER$\n#title From laws, technologies and events:#!\n[JournalEntry.GetCountry.GetModifier.GetValueWithBreakdownFor('country_credit_standing_add')]"
 banking_dash_mon_standing_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_premium_structural').GetValue|1]%#!"
 banking_dash_mon_sub_arrangements:0 "International Arrangements"
 banking_dash_mon_sub_bank:0 "THE CENTRAL BANK"
 banking_dash_mon_sub_borrowing:0 "WHAT BORROWING COSTS"
 banking_dash_mon_sub_fx:0 "EXCHANGE RATE"
 banking_dash_mon_sub_gold:0 "GOLD AND THE PEG"
 banking_dash_mon_sub_prices:0 "PRICES"
 banking_dash_mon_sub_rates:0 "THE RATE"
 banking_dash_mon_target_label:0 "Rate Target"
 banking_dash_mon_target_tt:0 "#header Rate Target#!\nWhere you want the policy rate to end up. Stepping it does not move the rate today: the rate closes the gap by #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_drift_step')|2]#! of a point a month.\nThere is no fee and no cooldown for changing it. The cost of a wrong setting is what it does to your economy, not what it costs to press.\n$TOOLTIP_DELIMITER$\n#title Your monetary law allows:#! #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_target_min')|1]%#! to #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_target_max')|1]%#!\n[JournalEntry.GetCountry.GetCustom('te_mon_dial_range_note')]"
 banking_dash_mon_target_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_policy_rate_target').GetValue|1]%#!"
 banking_dash_mon_union_label:0 "Monetary Union"
 banking_dash_mon_union_state_adopter:0 "adopted — overvaluation premium #R +[JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_union_overvaluation_premium_display')|2]#!"
 banking_dash_mon_union_state_coop:0 "monetary cooperation"
 banking_dash_mon_union_state_holdout:0 "holding out"
 banking_dash_mon_union_state_leader:0 "your currency — #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_union_holdouts_display')|0]#! holdouts (#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_union_refusers_display')|0]#! would refuse)"
 banking_dash_mon_union_state_leader_coop:0 "you lead — monetary cooperation only"
 banking_dash_mon_union_state_leader_pressing:0 "your currency — #R pressing#! #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_union_holdouts_display')|0]#! holdouts (#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_union_refusers_display')|0]#! would refuse)"
 banking_dash_mon_union_state_locked:0 "left — may re-adopt in #v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_union_lock_display')|0]#! months"
 banking_dash_mon_union_state_member_dormant:0 "adopted — suspended by a higher arrangement"
 banking_dash_mon_union_state_outside:0 "outside — your money does not qualify"
 banking_dash_mon_union_state_pressed:0 "holding out — #R under pressure#!"
 banking_dash_mon_union_tt:0 "#header Monetary Union#!\nYour power bloc's monetary principle, and where you stand in it. Tiers do not stack; each includes the one before.\n$TOOLTIP_DELIMITER$\n#title Monetary cooperation:#! every member gets half a swap line from the leader — #G −0.5#! points of risk premium, #G +1#! peg confidence a month. The leader pays the usual cost, scaled by each member's GDP beside its own.\n#title Common currency:#! members #b may adopt#! the leader's money. An adopter has no dial: it takes the leader's rate with no spread, its exchange rate and up to #v 80%#! of its credibility, and gains #G +5%#! $state_export_advantage_mult$ and $state_import_advantage_mult$. There is no peg to break, so overvaluation beyond #v 5#! points raises the adopter's risk premium by #R +0.1#! a point instead.\n#title Fiscal backstop:#! the leader is lender of last resort to every adopter — half their debt-load premium, paid for by the leader, and a default calls the guarantee — and the overvaluation premium is halved.\n$TOOLTIP_DELIMITER$\n#title To adopt:#! fiat or digital currency with a national bank; inflation within #v 3#! points of the leader's; debt under half your credit limit — #b waived#! while the leader is pressing.\n#title To leave:#! your currency falls at once to where it would float; #R +3#! points of credit standing decaying over ten years, an investment-pool loss, radicals, the leader's relations and the bloc's cohesion; no way back for ten years.\n#title Pressure:#! a leader may press holdouts to converge, at #v 50#! influence per holdout. A pressed holdout loses the cooperation benefit and is put the question — and one that refuses costs the bloc cohesion and gains #v +250#! $country_leverage_resistance_add$ for ten years."
 banking_dash_mon_union_value:0 "[JournalEntry.GetCountry.GetCustom('te_mon_union_state')]"
 banking_dash_mon_wage_label:0 "Wage Pressure"
 banking_dash_mon_wage_tt:0 "#header $country_wage_pressure_add$#!\n$country_wage_pressure_add_desc$\n$TOOLTIP_DELIMITER$\n#title What your laws come to:#!\n[JournalEntry.GetCountry.GetModifier.GetValueWithBreakdownFor('country_wage_pressure_add')]"
 banking_dash_mon_wage_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('te_mon_wage_pressure_display')|=+1]%#!"
 banking_dash_mon_why_board:0 "#lore As a subject without monetary autonomy you run a currency board on #v [JournalEntry.GetCountry.MakeScope.Var('te_mon_anchor').GetCountry.GetName]#!'s money: their rate plus a quarter point, their exchange rate, and half your minting goes to them. More autonomy would end it.#!"
 banking_dash_mon_why_command:0 "#lore A command economy allocates credit by plan, not by price. The rate below is administered centrally and there is no dial to turn.#!"
 banking_dash_mon_why_crypto:0 "#lore A decentralised currency has no issuer, so there is nobody to set a rate. That is the point of it, and the cost of it.#!"
 banking_dash_mon_why_dollarised:0 "#lore Your people gave up on the currency and your government followed them: prices, wages and contracts are written in foreign money now. There is no rate to set, because it is not your money — enacting a monetary law would put a currency of your own back into people's hands, at a price.#!"
 banking_dash_mon_why_has_dial:0 "#lore Your central bank sets the policy rate.#!"
 banking_dash_mon_why_no_bank:0 "#lore Without a national bank there is no institution that could set a rate. You borrow at the world rate, plus whatever inflation your lenders expect of you, plus a spread; a national bank law would hand you the dial.#!"
 banking_dash_mon_why_peg:0 "#lore Your currency is pegged to #v [JournalEntry.GetCountry.MakeScope.Var('te_mon_anchor').GetCountry.GetName]#!'s by treaty. You take their rate plus half a point and their exchange rate; there is no rate of your own to set while the treaty stands. Withdrawing from it gives the dial back — and lets your currency fall to wherever it would have floated.#!"
 banking_dash_mon_why_union:0 "#lore You have adopted the common currency of your power bloc, and #v [JournalEntry.GetCountry.MakeScope.Var('te_mon_anchor').GetCountry.GetName]#! sets its rate. There is no rate of your own to set; leaving the common currency is possible, and expensive.#!"
 banking_dash_mon_world_label:0 "World Reference Rate"
 banking_dash_mon_world_tt:0 "#header World Reference Rate#!\nThe long-run price of capital in the world at large. It is the same figure for every country, and it falls as the world's great powers reach later eras and capital grows plentiful.\n$TOOLTIP_DELIMITER$\nNobody will lend to any government below this figure plus the inflation they expect of it, whatever its central bank does — it is the floor under the #v Rate You Pay#!.\nIt is also what the #v $banking_dash_mon_worldrate_label$#! below falls back to while no great power is setting a rate of its own."
 banking_dash_mon_world_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_mon_era_base_now').GetValue|1]%#!"
 banking_dash_mon_worldrate_label:0 "World Rate"
 banking_dash_mon_worldrate_tt:0 "#header World Rate#!\nWhat capital actually earns in the world this month: the policy rates of the great powers that set their own, each taken net of the inflation its lenders expect, and weighted by the size of its economy. It is a #b real#! rate — a great power at 13% with 10% inflation is offering 3%, not 13%.\n$TOOLTIP_DELIMITER$\nA country with no national bank, or on a decentralised currency, sets no rate of its own: it borrows at this figure, plus the inflation its lenders expect of it, plus a point. A national bank on commodity money may set its discount rate from one point under this figure to three over it.\nEvery floating currency is priced against it too: a real rate above the world's pulls the exchange rate up, one below it lets it slide.\nOn a gold standard, gold flows toward whoever pays more than this and away from whoever pays less.\n#lore A great power that is itself part of this average is shown the rate of the #b rest#! of the world — nobody's gold moves on a gap against themselves.#!\n#title $banking_dash_mon_mandate_peg$#! parks the target on it.\n$TOOLTIP_DELIMITER$\n#lore Only great powers choosing their own rate are counted. A bank defending a peg is following this figure, not making it, and a country with no dial pays it plus a spread — count either and the world rate would be chasing itself. While nobody qualifies it rests on the #v $banking_dash_mon_world_label$#!.#!"
 banking_dash_mon_worldrate_value:0 "#v [JournalEntry.GetCountry.MakeScope.Var('te_mon_world_rate_now').GetValue|1]%#!"
 banking_dash_no_active:0 "#lore No financial intervention is currently in force.#!"
 banking_dash_phase_boom_value:0 "#blue Boom#!"
 banking_dash_phase_downturn_value:0 "#gold Downturn#!"
 banking_dash_phase_expansion_value:0 "#green Expansion#!"
 banking_dash_phase_frenzy_value:0 "#red Frenzy#!"
 banking_dash_phase_label:0 "Cycle Phase"
 banking_dash_phase_panic_value:0 "#red Panic#!"
 banking_dash_phase_stable_value:0 "#white Stable#!"
 banking_dash_phase_stagnation_value:0 "#yellow Stagnation#!"
 banking_dash_phase_tt:0 "#header Cycle Phase#!\nWhere the financial cycle currently stands, from Panic through Stable to Frenzy. The phase decides which phase modifier is applied each month, how likely a crash is, and which interventions the situation calls for. The bar shows roughly where in the phase you are; the exact reading is not published.\n$TOOLTIP_DELIMITER$\n#title Pushed each month by:#!\nCurrent momentum (see below)\n#variable [JournalEntry.GetCountry.MakeScope.ScriptValue('banking_display_value_monthly_add')|+=1]#! directly from active policies, laws and events"
 banking_dash_price_band_comfort:0 "Stable prices"
 banking_dash_price_band_command:0 "Set by plan"
 banking_dash_price_band_cost_command:0 "A planned economy sets its prices by administrative decision, so its band is nominal — it is recorded as stable because nothing is measuring it — and it pays none of the costs of a band. It earns none of the credit either: the #b real-wage dividend#! the stable band pays is never paid to a country whose wages and prices are both set by the same office."

 CRASH_SOFTEN_CAPITAL_CONTROLS_DESC:0 "Emergency capital controls pin asset prices: [concept_banking_cycle] Value softens by #G +5#!"
 CRASH_SOFTEN_CORRESPONDENT_LIQUIDITY_DESC:0 "Correspondent banks pool liquidity to steady the interbank market: [concept_banking_cycle] Value softens by #G +6#!, [concept_banking_momentum] softens by #G +1#!"
 CRASH_SOFTEN_DEPOSIT_GUARANTEE_DESC:0 "The deposit guarantee scheme calms savers and stops the run: [concept_banking_cycle] Value softens by #G +10#!, [concept_banking_momentum] softens by #G +2#!"
 CRASH_SOFTEN_DEV_BANK_LENDING_DESC:0 "Development-bank emergency lending refloats credit lines: [concept_banking_cycle] Value softens by #G +6#!, [concept_banking_momentum] softens by #G +1#!"
 CRASH_SOFTEN_DISCOUNT_WINDOW_DESC:0 "The emergency discount window lends freely against good collateral: [concept_banking_cycle] Value softens by #G +5#!, [concept_banking_momentum] softens by #G +1#!"
 CRASH_SOFTEN_KEYNESIAN_STIMULUS_DESC:0 "Fiscal stimulus props up aggregate demand: [concept_banking_cycle] Value softens by #G +10#!, [concept_banking_momentum] softens by #G +2#!"
 CRASH_SOFTEN_MUTUAL_CLEARING_DESC:0 "The mutual clearing-house bailout props up member banks: [concept_banking_cycle] Value softens by #G +4#!, [concept_banking_momentum] softens by #G +1#!"
 CRASH_SOFTEN_NATIONALIZE_DESC:0 "State takeover stabilises balance sheets: [concept_banking_cycle] Value softens by #G +12#!, [concept_banking_momentum] softens by #G +3#!"
 CRASH_SOFTEN_OPEN_MARKET_DESC:0 "Open-market operations flood the system with liquidity: [concept_banking_cycle] Value softens by #G +10#!, [concept_banking_momentum] softens by #G +2#!"
 CRASH_SOFTEN_SUSPEND_CONVERTIBILITY_DESC:0 "The convertibility freeze halts capital flight: [concept_banking_cycle] Value softens by #G +3#!, [concept_banking_momentum] softens by #G +1#!"
 CRASH_SOFTEN_SWAP_LINES_DESC:0 "International swap lines ease foreign-currency stress: [concept_banking_cycle] Value softens by #G +4#!, [concept_banking_momentum] softens by #G +1#!"
 CREATE_NEW_RELIGION_DESC:0 "Finalize the creation of the new religion."
 CR_COOPTATION_REQUIRES_TT:0 "Requires non-progressive minority law (cooptation is unnecessary under protection / affirmative action)"
 CR_COOPTATION_TOKEN_REFORM:0 "Cooptation / Token Reform"
 CR_COOPTATION_TOKEN_REFORM_DESC:0 "Promote moderate leaders, fund symbolic appointments, pass cosmetic statutes. Buys 12 months of demobilization, then the movement learns. Compatible with simultaneous suppression of [Concept('concept_radical', 'radicals')]."
 CR_FEDERAL_PROTECTION_DESC:0 "Send marshals, dispatch civil rights commissions, prosecute violations. The strongest pro-movement push, but expensive in [concept_bureaucracy] and authority. Requires at least minor-power capacity and a non-discriminatory minority law."
 CR_FEDERAL_PROTECTION_REQUIRES_TT:0 "Requires non-discriminatory minority law and [concept_minor_power] rank"
 CR_GRADUALIST_ACCOMMODATION_DESC:0 "Quiet desegregation, blue-ribbon committees, and 'all deliberate speed.' Pushes the bar slowly but cools [concept_turmoil]. The path of least resistance."
 CR_GRASSROOTS_ORGANIZING_DESC:0 "Tolerate (and quietly assist) church, union, and student networks. Builds movement support steadily; raises [Concept('concept_radical', 'radicals')] as suppressed grievances find voice. Can stack with other pro-movement policies."
 CR_REMOVE_COOPTATION_TOKEN_REFORM:0 "End Cooptation"
 CR_REMOVE_COOPTATION_TOKEN_REFORM_DESC:0 "Stop the token-appointment program. Resets the cooptation window."
 CR_REMOVE_FEDERAL_PROTECTION:0 "Suspend Federal Protection"
 CR_REMOVE_FEDERAL_PROTECTION_DESC:0 "Stand down federal enforcement of civil rights statutes."
 CR_REMOVE_GRADUALIST_ACCOMMODATION:0 "End Gradualist Approach"
 CR_REMOVE_GRADUALIST_ACCOMMODATION_DESC:0 "Stop the slow-walk and pick a real side."
 CR_REMOVE_GRASSROOTS_ORGANIZING:0 "Withdraw Grassroots Support"
 CR_REMOVE_GRASSROOTS_ORGANIZING_DESC:0 "Step back from active facilitation of organizing networks."
 CR_REMOVE_SEGREGATIONIST_CONSOLIDATION:0 "End Segregationist Push"
 CR_REMOVE_SEGREGATIONIST_CONSOLIDATION_DESC:0 "Stand down the regime-consolidation effort."
 CR_REMOVE_SUPPRESSION_CRACKDOWN:0 "End Crackdown"
 CR_REMOVE_SUPPRESSION_CRACKDOWN_DESC:0 "Stand down police operations against the movement."
 CR_SEGREGATIONIST_CONSOLIDATION_DESC:0 "Codify the regime — pass new restrictions, formalize what was informal. The hardest push to crush the movement; massive radicalization risk if it fails."
 CR_SEGREGATIONIST_REQUIRES_TT:0 "Requires a discriminatory minority law"
 CR_SUPPRESSION_CRACKDOWN_DESC:0 "Police raids, surveillance, mass arrests of organizers. Pushes the bar down hard; [concept_turmoil] rises in the long run as suppression breeds martyrs."

 irr_seek_war_blessing_action_propose_name:0 "Seek Blessing for Reunification"
 irr_seek_war_blessing_effect_tt:0 "Our [Concept('concept_power_bloc_leader', 'bloc leader')] will be asked to bless a war to reunify [SCOPE.sCountry('target_country').GetName] with us. If it agrees, our [concept_power_bloc] will not stand in the way of that war for #v 5 years#!; the reunification [concept_war_goal]'s other requirements, above all enough [Concept('concept_claim', 'claims')] on their [concept_homeland] states, still apply. If it refuses, our [concept_relations] with it fall by #N 10#!, and the refusal stirs up radicals at home for #v 5 years#!, during which we cannot ask again"
 irr_union_forbidden_modifier:0 "[Concept('concept_power_bloc_leader', 'Bloc Leader')] Forbade Union"
 irr_war_blessing_candidate_tt:0 "[SCOPE.sCountry('target_country').GetName] is a candidate for reunification: it shares one of our [concept_primary_cultures] and holds no [concept_homeland] of a people we do not share, it holds a homeland state of ours that we [Concept('concept_claim', 'claim')] and where our people still live, it borders us or we both have a coast, and neither of us is a subject of the other's overlord"
 irr_war_blessing_driver_tt:0 "Our government gives the reunification cause a voice: a law such as $law_ethnostate$, $law_national_supremacy$, $law_council_republic$ or $law_multicultural$, a governing [concept_interest_group] whose leader's ideology takes up the cause, or the Chinese reunification journal entry"
 irr_war_blessing_no_standing_approval_tt:0 "We do not already hold our [Concept('concept_power_bloc_leader', 'bloc leader')]'s blessing for a war of reunification"
 irr_war_blessing_not_historic_unification_tt:0 "[SCOPE.sCountry('target_country').GetName] is not in the midst of a historic unification of its own (German, Italian or Chinese), which follows its own path"
 irr_war_blessing_not_pending_tt:0 "We are not already awaiting our [Concept('concept_power_bloc_leader', 'bloc leader')]'s answer to such a request"
 irr_war_blessing_not_vetoed_tt:0 "Our [Concept('concept_power_bloc_leader', 'bloc leader')] has not refused us such a blessing in the last #v 5 years#!"

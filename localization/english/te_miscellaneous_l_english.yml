 SR_ISRU_SMELTING_FAIL_TT:0 "Regolith composition proved unsuitable for direct smelting. More research needed."
 SR_ISRU_SMELTING_SUCCESS_TT:0 "The smelting process worked: local metal production is viable."
 SR_ISS_COOPERATION_RELATIONS_TT:0 "#G +15#! relations with all spacefaring UN member nations."
 SR_MANUAL_OVERRIDE_FAIL_TT:0 "Manual control wasn't enough. A hard landing damaged equipment and set the program back."
 SR_MANUAL_OVERRIDE_SUCCESS_TT:0 "The pilot seized manual control and brought the lander down safely: a remarkable feat of skill under pressure."
 SR_MARS_DIRECT_CHOSEN_TT:0 "We will attempt a direct landing on Mars: bold, fast, and high-risk. The dramatic moment will yield enduring [concept_prestige] and cultural influence."
 SR_MARS_ORBITAL_CHOSEN_TT:0 "We will establish orbital [concept_infrastructure] around Mars before attempting a surface landing. The reusable orbital infrastructure will accelerate our research and space-program output for years to come."
 SR_MARS_ROBOTIC_CHOSEN_TT:0 "Robotic precursors will prepare a landing site and cache supplies before human arrival. The robotic mining and survey systems will permanently boost our space-mine output and innovation capacity."
 SR_MAX_FUNDING_NOT_REACHED:0 "Funding is not yet at maximum."
 SR_MIN_FUNDING_NOT_REACHED:0 "Funding is not yet at minimum."
 SR_MOON_BASE_INDUSTRIAL_CHOSEN_TT:0 "The lunar base will be an industrial facility for mining and materials processing. Lunar mining will permanently boost our space-mine [concept_throughput] and launch-capacity output."
 SR_MOON_BASE_MILITARY_CHOSEN_TT:0 "The lunar base will be a military installation providing strategic observation capabilities. The high ground will accelerate military research, broaden influence, and reduce [Concept('concept_military_good', 'military goods')] costs."
 SR_MOON_BASE_SCIENTIFIC_CHOSEN_TT:0 "The lunar base will be a scientific outpost dedicated to pure research. International collaboration will permanently raise our research speed and innovation cap."
 SR_MULTINATIONAL_VESSEL_RELATIONS_TT:0 "#G +20#! relations with all spacefaring nations."
 SR_NOT_ALREADY_AMBITIOUS:0 "Not already using the Ambitious Approach."

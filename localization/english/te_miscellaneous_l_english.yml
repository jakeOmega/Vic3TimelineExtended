 nd_tt_exercise_notified:0 "They are told in advance and invited to observe: talks open and the danger eases"
 nd_tt_exercise_notified_talks_open:0 "They are told in advance and invited to observe. Talks are already open"
 nd_tt_exercise_running:0 "No exercise is already under way"
 nd_tt_forces_assembled:0 "Our warheads are mated to their delivery systems (readiness #v Routine#! or higher; from #v Recessed#! that is two weeks away)"
 nd_tt_go_public_terms:0 "The crisis becomes a #v Confrontation#! with a new deadline #v 8#! weeks from now. From here, backing down costs #R 15#! credibility instead of #R 5#!, and letting the deadline lapse costs #R 10#!"
 nd_tt_guarantee_abandon:0 "We walk away from our guarantee. Our #v credibility#! collapses and every country we protect takes note"
 nd_tt_guarantee_decline:0 "We decline to answer for a war they made nuclear. It does not count as walking away: no #v credibility#! lost, and the other countries we protect do not take it as a broken promise. The guarantee stands"
 nd_tt_guarantee_honour:0 "We stand with them publicly: their attacker faces our guarantee, and our #v credibility#! rises"
 nd_tt_guarantee_join_war:0 "#R We enter the war#! against [SCOPE.sCountry('nd_guarantee_attacker').GetName] on [SCOPE.sCountry('nd_guarantee_beneficiary').GetName]'s side: they used the bomb on a country we protect"
 nd_tt_guarantee_retaliate:0 "#R We answer the strike on them with a nuclear strike of our own.#! Our #v credibility#! rises"
 nd_tt_guarantor_answer_strike:0 "#R A day from now, if we are at war with [SCOPE.sCountry('nd_guarantee_attacker').GetName], one of our warheads falls on their most important city.#! It is retaliation for a country we cover, not a first strike, under any doctrine"
 nd_tt_guarantor_armed:0 "The guarantor holds nuclear weapons"
 nd_tt_has_dispute:0 "There is a dispute to threaten over: a diplomatic play they lead against us, a war with them, an attack on a country we guarantee, a weapons programme of a rival, or a rival's forces on alert"
 nd_tt_has_pledge_with_target:0 "We have pledged not to use nuclear weapons against them"
 nd_tt_hold_alert_2w:0 "Our forces reach #v High Alert#! in #v 2#! weeks. At High Alert their pressure to concede rises by #G 10#!, and so do our upkeep and the odds of an accident"

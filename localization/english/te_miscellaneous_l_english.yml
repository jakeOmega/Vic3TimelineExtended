 un_dues_resume_effect_tt:0 "We pay the #v [ROOT.GetCountry.MakeScope.ScriptValue('un_disp_arrears_months')|0]#! months of [concept_un_dues] we owe: #R @money![ROOT.GetCountry.MakeScope.ScriptValue('un_disp_arrears_owed')|D]#! from our treasury, at once. Our arrears are cleared, any lost vote is restored, and our dues of @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('un_dues_weekly_value')|D]#! a week are charged again."
 un_dues_withhold_effect_tt:0 "We stop paying our [concept_un_dues] of @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('un_dues_weekly_value')|D]#! a week.\n#R International Standing: −3#! for withholding them.\nEvery month we withhold while dues are assessed is a month in arrears, and what we would have paid is added to what we owe; dues are billed by the month, so this month's are owed at once. The funding of the United Nations falls with our share of the members' GDP.\n#R After 24 months in arrears we lose our vote in the [concept_un_general_assembly]#! (Article 19): no ballots, no resolutions tabled, and no place in a two-thirds supermajority, until we pay."

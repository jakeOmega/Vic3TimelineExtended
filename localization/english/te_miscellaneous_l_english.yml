 gw_cond_emis_label:0 "Our Market's Emissions"
 gw_cond_emis_tt:0 "Annual greenhouse-gas output of the whole market this country belongs to, from its oil and coal consumption, less whatever its synthetic-fuel plants capture.\n\n#lore Emissions are a property of a market, not of one member: the figure is stored on the market leader and every member reads the same number. Updated each January.#!"
 gw_cond_emis_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('gw_market_emis_display')|0]#! (#v [JournalEntry.GetCountry.MakeScope.ScriptValue('gw_capture_display')|0]#! captured)"

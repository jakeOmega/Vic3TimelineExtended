 nd_tt_open_over_war:0 "Over: #v our war with them#!. If they concede, their war support in that war falls by #R 35#!, which can force them to capitulate"
 nd_tt_open_stakes_bluff:0 "If this bluff is called, every government will know it: #R 5#! more credibility lost"
 nd_tt_open_stakes_private:0 "Stakes: if they concede, our #v credibility#! rises by #G 10#!. If we back down it falls by #R 5#!"
 nd_tt_open_stakes_public:0 "Stakes: if they concede, our #v credibility#! rises by #G 15#!. If we back down it falls by #R 15#!; if the deadline lapses, by #R 10#!"
 nd_tt_open_uncertain:0 "#Y Uncertain:#! our doctrine would let us carry this out only if this became a war that threatened what it protects. No effect on their pressure"
 nd_tt_outcome_already_settled:0 "#lore This outcome was already settled when a later crisis closed. Nothing more happens.#!"
 nd_tt_outcome_cooldown:0 "No new crisis with them for #v 24#! months, unless we are at war"
 nd_tt_outcome_doves_approve:0 "Our advocates of restraint approve (a decaying approval bonus)"
 nd_tt_outcome_hawks_approve:0 "Our militarists and officers approve (a decaying approval bonus)"
 nd_tt_outcome_hawks_disapprove:0 "Our militarists and officers disapprove (a decaying approval penalty)"
 nd_tt_parties_free:0 "Neither country is already in a nuclear crisis"
 nd_tt_pledge_broken:0 "Our #v credibility#! falls, and the broken pledge is remembered for ten years"
 nd_tt_pledge_permits_strike:0 "No non-use pledge with this enemy stands in the way"
 nd_tt_readiness_locked:0 "No stand-down agreement or concession holds our readiness at Routine or below"
 nd_tt_readiness_step_down:0 "Our forces step down one level of readiness"
 nd_tt_readiness_step_up:0 "Our forces step up one level of readiness"
 nd_tt_recessed_alarms_allies:0 "#R The countries we protect will be alarmed#! when our warheads reach storage: #v credibility#! #R -5#!, relations #R -10#! with each of them, #R +5#! liberty desire for each subject under our umbrella — every time we go to Recessed"
 nd_tt_refuse_talks_no_pressure_yet:0 "There is no pressure before a #v Confrontation#!"
 nd_tt_refuse_talks_resume:0 "The pressure events resume in #v 6#! weeks"
 nd_tt_reject_defiance:0 "The threat was public, so our refusal is recorded as #R defiance#!: under #v Nuclear Compellence#!, that licenses them to strike us in a war"
 nd_tt_reliability_down_15:0 "#v Command reliability#! falls by #R 15#! now, then recovers over the following months to the level our safeguards and crew strain support"
 nd_tt_reliability_up_10:0 "#v Command reliability#! rises by #G 10#! now, then drifts back over the following months to the level our safeguards and crew strain support"
 nd_tt_reliability_up_3:0 "#v Command reliability#! rises by #G 3#! now, then drifts back over the following months to the level our safeguards and crew strain support"
 nd_tt_stage_to_confrontation:0 "The crisis becomes a #v Confrontation#!: from now on they press us every #v 6#! weeks"
 nd_tt_standdown_signal:0 "The other side sees us standing down at once"
 nd_tt_standdown_terms:0 "Both sides stand down to #v Routine#!, held there for #v 24#! months, and pledge never to use nuclear weapons on each other; renouncing that pledge later costs #R 15#! credibility and #R 5#! infamy. The war or play goes on"
 nd_tt_strain_down_20:0 "#v Crew strain#! falls by #G 20#!"
 nd_tt_strain_down_30:0 "#v Crew strain#! falls by #G 30#!"
 nd_tt_strain_up_10:0 "#v Crew strain#! rises by #R 10#!"
 nd_tt_strain_up_5:0 "#v Crew strain#! rises by #R 5#!"
 nd_tt_talks_cred_plus:0 "A stand-down raises our #v credibility#! by #G 5#!"
 nd_tt_talks_cred_public_demand:0 "Trading a public demand for a stand-down costs our #v credibility#! #R 5#!"
 nd_tt_talks_meanwhile:0 "While they consider it, the pressure events stop and the crisis danger falls by #G 15#!"
 nd_tt_talks_pending:0 "No proposal to stand down is already waiting for an answer"
 nd_tt_talks_terms:0 "If they accept, both sides stand down to #v Routine#!, held there for #v 24#! months, and pledge never to use nuclear weapons on each other; renouncing that pledge later costs #R 15#! credibility and #R 5#! infamy. The war or play goes on"
 nd_tt_then_back_down_private:0 "The outcome notice that follows settles our reputation: our #v credibility#! falls by #R 5#!. Nothing was public, so nothing else"
 nd_tt_then_back_down_public:0 "The outcome notice that follows settles our reputation: our #v credibility#! falls by #R 15#!, the climb-down is remembered, and our militarists and officers turn on us"
 nd_tt_then_bluff_called:0 "Our doctrine never allowed this, and every government knew it: #R 5#! more"
 nd_tt_then_yield:0 "The outcome notice that follows settles our reputation: our #v credibility#! falls by #R 5#!, and our militarists and officers resent it"
 nd_tt_umbrella_needs_arsenal:0 "We have tested a nuclear weapon"
 nd_tt_umbrella_withdrawn:0 "They are no longer under our nuclear umbrella: our arsenal no longer lifts the nuclear shadow from their war support or weighs in a crisis against them, and we are no longer asked to answer threats against them. While this stands their #v liberty desire#! grows by #R 0.1#! a week"
 nd_tt_war_law_permits_strike:0 "Our #v Rules of War#! law permits a nuclear strike — neither Humanitarian Regulations nor Limited War — unless we have been struck, or face annexation in a war we are fighting"
 nd_tt_war_law_permits_tactical_strike:0 "Our #v Rules of War#! law is not Limited War — unless we have been struck, or face annexation in a war we are fighting"
 nd_tt_yield_alert:0 "Our forces stand down to #v Routine#! and are held there for #v 24#! months"
 nd_tt_yield_freeze:0 "Our weapons programme is frozen for #v 10#! years"
 nd_tt_yield_guarantee:0 "We leave the country they protect alone: we back down in the play, or our war support in that war falls by #R 35#!"
 nd_tt_yield_play:0 "We back down in the diplomatic play: their side wins it"
 nd_tt_yield_war:0 "Our war support in the war with them falls by #R 35#!, which can force us to capitulate"
 nd_w_arsenal_label:0 "Warheads held"
 nd_w_arsenal_tt:0 "#tooltip_header Arsenal#!\n$TOOLTIP_DELIMITER$\nOur exact count, and what the world believes it to be. Other countries' estimates are re-observed once a year with an error, and snap to the truth after a test or a strike. Additional warheads add less and less to deterrence, and cost upkeep all the same."
 nd_w_arsenal_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_stockpile')|0]#! #lore (the world estimates [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_public_estimate')|0])#!"
 nd_w_authority_choice_1:0 "Central Authorization"
 nd_w_authority_choice_1_tt:0 "#tooltip_header Central Authorization#!\n$TOOLTIP_DELIMITER$\nOnly the government may order a launch. The strongest political control and the lowest risk of unauthorised use; the most vulnerable to a disrupted chain of command."
 nd_w_authority_choice_2:0 "Conditional Delegation"
 nd_w_authority_choice_2_tt:0 "#tooltip_header Conditional Delegation#!\n$TOOLTIP_DELIMITER$\nCommanders may use their weapons if they believe the conditions are met and the capital cannot be reached. Retaliation stays credible when communications fail — and a commander cut off in a war can misread what is happening.\n\n#R An incident can end in a launch without further approval.#!"
 nd_w_authority_choice_3:0 "Launch on Warning"
 nd_w_authority_choice_3_tt:0 "#tooltip_header Launch on Warning#!\n$TOOLTIP_DELIMITER$\nOur missiles fly on warning, before the enemy's arrive. The most credible response for vulnerable forces — and a false warning can become a launch under standing orders.\n\n#R An incident can end in a launch without further approval.#!"
 nd_w_authority_choice_4:0 "Automatic Retaliation"
 nd_w_authority_choice_4_tt:0 "#tooltip_header Automatic Retaliation#!\n$TOOLTIP_DELIMITER$\nA system that answers a nuclear strike on our territory by itself, whether or not anyone is left to give the order. Retaliation becomes certain however vulnerable our forces are, so a threat against us carries less weight. An early warning still goes to the government, which can wait for proof.\n\n#R A strike on our cities is answered in full, with no choice left to us, and a weapons accident at home during a war or an acute crisis can set it off.#! Restraint-minded groups disapprove.\n\nExtra upkeep: @money!#v [GetPlayer.MakeScope.ScriptValue('nd_upkeep_weekly_automatic_step')|D]#!/week"
 nd_w_authority_label:0 "Launch authority"
 nd_w_authority_legend:0 "Launch authority can be changed once a year. Delegation needs radar; launch on warning needs missiles as well; automatic retaliation also needs mainframe computers."
 nd_w_authority_tt:0 "#tooltip_header Launch authority#!\n$TOOLTIP_DELIMITER$\nWho may act when the warning is uncertain. Under central authorization nothing is launched unless the government orders it. Under conditional delegation or launch on warning, an incident can end in a launch with #bold no further approval#! — only the chance that someone in the chain refuses stands in the way. Under automatic retaliation, a strike on our cities is answered in full by the system."
 nd_w_authority_value:0 "#v [JournalEntry.GetCountry.GetCustom('nd_authority_name')]#!"
 nd_w_btn_adopt:0 "Adopt"
 nd_w_btn_order:0 "Order"
 nd_w_capabilities_header:0 "Forces"
 nd_w_credibility_label:0 "Credibility"
 nd_w_credibility_tt:0 "#tooltip_header Credibility#!\n$TOOLTIP_DELIMITER$\nWhether our word holds. Achieving what we threatened over, honouring guarantees and restraint raise it; abandoning a threat — above all a public one — breaking a pledge or walking away from a guarantee lower it. It drifts back toward the middle over time. Other governments read it when they decide whether to give way to us."
 nd_w_credibility_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_credibility')|0]#! / 100"
 nd_w_crisis_act_back_down:0 "Let the threat go"
 nd_w_crisis_act_back_down_btn:0 "Back down"
 nd_w_crisis_act_back_down_tt:0 "Abandon the threat. Walking back a public ultimatum is costly."
 nd_w_crisis_act_exercise:0 "Hold an exercise they can see"
 nd_w_crisis_act_exercise_btn:0 "Exercise"
 nd_w_crisis_act_exercise_tt:0 "Makes the threat clearer for a few weeks, costs money, strains the crews — and an exercise can be mistaken for the real thing."
 nd_w_crisis_act_public:0 "Make the threat public"
 nd_w_crisis_act_public_btn:0 "Go public"
 nd_w_crisis_act_public_tt:0 "A public ultimatum: a clearer signal, a shorter deadline, and a commitment we cannot quietly walk away from."
 nd_w_crisis_act_talks:0 "Propose a mutual stand-down"
 nd_w_crisis_act_talks_btn:0 "Propose"
 nd_w_crisis_act_talks_tt:0 "If they agree, both sides stand down to routine for two years and pledge not to use nuclear weapons against each other. The dispute underneath is not settled by it."
 nd_w_crisis_act_yield:0 "Concede"
 nd_w_crisis_act_yield_btn:0 "Concede"
 nd_w_crisis_act_yield_tt:0 "Give them what they demand. The concession is real and immediate."
 nd_w_crisis_actions_legend:0 "Our moves. The other side answers through its own decisions. The crisis also ends if the war or play it is about ends."
 nd_w_crisis_concede_label_them:0 "If they concede"
 nd_w_crisis_concede_label_us:0 "If we concede"
 nd_w_crisis_concede_label_value:0 "[JournalEntry.GetCountry.GetCustom('nd_crisis_concede_label')]"
 nd_w_crisis_concession_tt:0 "#tooltip_header What conceding costs#!\n$TOOLTIP_DELIMITER$\n[JournalEntry.GetCountry.GetCustom('nd_crisis_concession_long')]"
 nd_w_crisis_concession_value:0 "[JournalEntry.GetCountry.GetCustom('nd_crisis_concession_short')]"
 nd_w_crisis_danger_label:0 "Danger"
 nd_w_crisis_danger_tt:0 "#tooltip_header Danger#!\n$TOOLTIP_DELIMITER$\nHow easily this could go wrong. As it rises, accidents and misreadings grow likelier on both sides, and at #v 70#! a Confrontation turns Acute. It fires nothing by itself.\n$TOOLTIP_DELIMITER$\n"
 nd_w_crisis_danger_value:0 "[JournalEntry.GetCountry.GetCustom('nd_crisis_danger_word')] #lore ([JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_crisis_danger')|0])#!"
 nd_w_crisis_deadline_label:0 "Weeks to the deadline"
 nd_w_crisis_deadline_tt:0 "When the deadline passes, the country that made the threat must decide what it meant. A crisis older than a year lapses."
 nd_w_crisis_deadline_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_crisis_weeks_left')|0]#!"
 nd_w_crisis_dispute_label:0 "Over"
 nd_w_crisis_dispute_tt:0 "What the threat is about, and what the target would give up if it conceded: backing down in the diplomatic play, a collapse of war support in the war, leaving a guaranteed country alone, a frozen weapons programme, or its forces stood down.\n\nA public ultimatum is a stronger signal, and a commitment: abandoning it is noticed at home and abroad."
 nd_w_crisis_dispute_value:0 "[JournalEntry.GetCountry.GetCustom('nd_crisis_dispute_word')] #lore ([JournalEntry.GetCountry.GetCustom('nd_crisis_public_word')])#!"
 nd_w_crisis_ft_label_them:0 "Can they carry it out?"
 nd_w_crisis_ft_label_us:0 "Can we carry it out?"
 nd_w_crisis_ft_label_value:0 "[JournalEntry.GetCountry.GetCustom('nd_crisis_ft_label')]"
 nd_w_crisis_ft_tt:0 "#tooltip_header Follow-through#!\n$TOOLTIP_DELIMITER$\n[JournalEntry.GetCountry.GetCustom('nd_crisis_ft_reason')]\n\nDoctrine is public: every government knows whether a threat can be carried out, and weighs it."
 nd_w_crisis_ft_value:0 "[JournalEntry.GetCountry.GetCustom('nd_crisis_ft_word')]"
 nd_w_crisis_header:0 "Nuclear Crisis"
 nd_w_crisis_next_pressure_label:0 "Next pressure"
 nd_w_crisis_next_pressure_tt:0 "From the Confrontation stage on, the threatened government is asked again every #v 6#! weeks whether to concede. Open talks pause it."
 nd_w_crisis_pressure_label:0 "Pressure on the target"
 nd_w_crisis_pressure_label_us:0 "Pressure on us"
 nd_w_crisis_pressure_label_value:0 "[JournalEntry.GetCountry.GetCustom('nd_crisis_pressure_label')]"
 nd_w_crisis_pressure_tt:0 "#tooltip_header Pressure to concede#!\n$TOOLTIP_DELIMITER$\nWhat pushes the threatened government to give way, part by part. When it is pressed, below #v 50#! it does not concede; from #v 70#! it concedes about half the time, and from #v 85#! about two times in three. A human government in its place sees the same figure.\n$TOOLTIP_DELIMITER$\n"
 nd_w_crisis_pressure_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_yield_pressure')|0]#! / 100"
 nd_w_crisis_role_label:0 "Our side"
 nd_w_crisis_role_tt:0 "The country that made the threat runs the crisis: its deadline, its stage, and whether it is public."
 nd_w_crisis_role_value:0 "[JournalEntry.GetCountry.GetCustom('nd_crisis_role_word')]"
 nd_w_crisis_stage_label:0 "Stage"
 nd_w_crisis_stage_tt:0 "#tooltip_header Stage#!\n$TOOLTIP_DELIMITER$\nWarning, confrontation, acute. Stages are not a ladder to war: a crisis can be settled at any of them.\n\n[JournalEntry.GetCountry.GetCustom('nd_crisis_stage_next')]"
 nd_w_crisis_stage_value:0 "[JournalEntry.GetCountry.GetCustom('nd_crisis_stage_word')]"
 nd_w_crisis_stakes_label:0 "Our stakes"
 nd_w_crisis_stakes_tt:0 "#tooltip_header What this crisis does to our credibility#!\n$TOOLTIP_DELIMITER$\n[JournalEntry.GetCountry.GetCustom('nd_crisis_stakes_long')]"
 nd_w_crisis_stakes_value:0 "[JournalEntry.GetCountry.GetCustom('nd_crisis_stakes_short')]"
 nd_w_doctrine_choice_1:0 "No First Use"
 nd_w_doctrine_choice_1_tt:0 "#tooltip_header No First Use#!\n$TOOLTIP_DELIMITER$\nWe will use nuclear weapons only in retaliation. Reassuring to neighbours, weak for coercion, and popular with those who fear the bomb. Leaving it later is a repudiation.\n\n[GetStaticModifier('nd_doctrine_mod_1').GetDesc]"
 nd_w_doctrine_choice_2:0 "Existential Deterrence"
 nd_w_doctrine_choice_2_tt:0 "#tooltip_header Existential Deterrence#!\n$TOOLTIP_DELIMITER$\nWe will use them if our survival is at stake: an enemy that means to annex or subjugate us, or takes our core while we are losing. The default.\n\n[GetStaticModifier('nd_doctrine_mod_2').GetDesc]"
 nd_w_doctrine_choice_3:0 "Flexible First Use"
 nd_w_doctrine_choice_3_tt:0 "#tooltip_header Flexible First Use#!\n$TOOLTIP_DELIMITER$\nWe may use them first in a war we are losing, or when our core is threatened — a check on a stronger conventional attacker. Limited use never guarantees a limited answer.\n\n[GetStaticModifier('nd_doctrine_mod_3').GetDesc]"
 nd_w_doctrine_choice_4:0 "Nuclear Compellence"
 nd_w_doctrine_choice_4_tt:0 "#tooltip_header Nuclear Compellence#!\n$TOOLTIP_DELIMITER$\nOur threats are meant: a public ultimatum that is defied licenses a strike in the war that follows. Stronger bargaining, worse reputation.\n\n[GetStaticModifier('nd_doctrine_mod_4').GetDesc]"
 nd_w_doctrine_choice_5:0 "Nuclear Warfighting"
 nd_w_doctrine_choice_5_tt:0 "#tooltip_header Nuclear Warfighting#!\n$TOOLTIP_DELIMITER$\nNuclear weapons are an instrument of any war we fight. There is no survival test — only retaliation, military sense and the price the world will make us pay.\n\n[GetStaticModifier('nd_doctrine_mod_5').GetDesc]"
 nd_w_doctrine_header:0 "Doctrine"
 nd_w_doctrine_label:0 "Doctrine"
 nd_w_doctrine_legend:0 "A doctrine can be changed once every two years. Leaving No First Use repudiates a public pledge."
 nd_w_doctrine_tt:0 "#tooltip_header Doctrine#!\n$TOOLTIP_DELIMITER$\nWhen we say we will use nuclear weapons. It decides which strikes our government may order — against an enemy we are at war with — and it has a price abroad and at home.\n\nRetaliation is always permitted. A pledge of no first use can only be left by repudiating it."
 nd_w_doctrine_value:0 "#v [JournalEntry.GetCountry.GetCustom('nd_doctrine_name')]#!"
 nd_w_forces_header:0 "Readiness and Launch Authority"
 nd_w_hardening_label:0 "Hardening"
 nd_w_hardening_tt:0 "#tooltip_header Hardening#!\n$TOOLTIP_DELIMITER$\nDispersal, silos, submarines at sea. Each level makes survivability climb faster toward its ceiling; without it, survivability slowly erodes."
 nd_w_hardening_value:0 "Level #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_hardening')|0]#! · @money! #N [GetPlayer.MakeScope.ScriptValue('nd_upkeep_weekly_hardening_step')|D]#!/level/week"
 nd_w_hold_label:0 "Chance a sequence is halted"
 nd_w_hold_tt:0 "#tooltip_header If a delegated launch begins#!\n$TOOLTIP_DELIMITER$\nUnder conditional delegation or launch on warning, a false warning or a commander who believes the war has begun can start a launch that the government never approves. This is the chance that someone in the chain refuses. It follows command reliability and safeguards, falls if we punish those who question orders, and is lower under launch on warning."
 nd_w_hold_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_hold_chance')|0]%#!"
 nd_w_home_header:0 "At Home"
 nd_w_home_legend:0 "How each interest group receives our posture. The Armed Forces judge it as officers and the Industrialists as business; every other group by its stance on the Rules of War — #v Total War#! makes it militarist, #v Limited War#! restrained. Their leader's politics can make the Armed Forces or the Industrialists #v hawkish#! or #v restrained#! about doctrine too. Totals are capped at ±2, or ±1 for a mild view; the number is the one in the group's approval breakdown."
 nd_w_last_outcome:0 "[JournalEntry.GetCountry.GetCustom('nd_crisis_last_outcome_word')]"
 nd_w_pledge_label:0 "Pledges"
 nd_w_pledge_tt:0 "Non-use pledges come from mutual stand-downs. A strike on a country we have pledged not to strike is only possible after repudiating the pledge — unless it struck us first."
 nd_w_pledge_value:0 "[JournalEntry.GetCountry.GetCustom('nd_pledge_state_word')]"
 nd_w_posture_header:0 "Nuclear Posture"
 nd_w_readiness_choice_0:0 "Recessed"
 nd_w_readiness_choice_0_tt:0 "#tooltip_header Recessed#!\n$TOOLTIP_DELIMITER$\nWarheads stored apart from their delivery systems. The cheapest and safest posture — custody costs half, incidents are half as likely as at Routine, and a crisis with us is less dangerous — and the least usable: #R nothing can be launched, not even in retaliation, until our forces are back at Routine, two weeks away.#! A threat we make is taken less seriously. Restraint-minded groups approve; the officers do not.\n\nUpkeep at this level: @money!#v [GetPlayer.MakeScope.ScriptValue('nd_upkeep_weekly_at_readiness_0')|D]#!/week"
 nd_w_readiness_choice_1:0 "Routine"
 nd_w_readiness_choice_1_tt:0 "#tooltip_header Routine#!\n$TOOLTIP_DELIMITER$\nThe cheapest posture, the slowest response. Crews recover; incidents are rare.\n\nUpkeep at this level: @money!#v [GetPlayer.MakeScope.ScriptValue('nd_upkeep_weekly_at_readiness_1')|D]#!/week"
 nd_w_readiness_choice_2:0 "Heightened"
 nd_w_readiness_choice_2_tt:0 "#tooltip_header Heightened#!\n$TOOLTIP_DELIMITER$\nA prepared response and a credible warning, at a manageable cost in money and fatigue.\n\n[GetStaticModifier('nd_readiness_mod_2').GetDesc]\nUpkeep at this level: @money!#v [GetPlayer.MakeScope.ScriptValue('nd_upkeep_weekly_at_readiness_2')|D]#!/week"
 nd_w_readiness_choice_3:0 "High Alert"
 nd_w_readiness_choice_3_tt:0 "#tooltip_header High Alert#!\n$TOOLTIP_DELIMITER$\nThe best short-term response, and the most dangerous thing to keep up for long: strain builds every month, and with it accidents and misread warnings.\n\n[GetStaticModifier('nd_readiness_mod_3').GetDesc]\nUpkeep at this level: @money!#v [GetPlayer.MakeScope.ScriptValue('nd_upkeep_weekly_at_readiness_3')|D]#!/week"
 nd_w_readiness_label:0 "Readiness"
 nd_w_readiness_legend:0 "Readiness moves one step every two weeks toward the level ordered. An agreed or conceded stand-down holds it at Routine or below for two years."
 nd_w_readiness_tt:0 "#tooltip_header Readiness#!\n$TOOLTIP_DELIMITER$\nHow quickly our forces can respond. Higher readiness makes a threat credible and a response prepared, and costs money, wears the crews down and makes incidents more likely. Recessed takes the warheads off their delivery systems: nothing can be launched from it. A change takes two weeks per step."
 nd_w_readiness_value:0 "#v [JournalEntry.GetCountry.GetCustom('nd_readiness_name')]#![JournalEntry.GetCountry.GetCustom('nd_readiness_moving')]"
 nd_w_reliability_label:0 "Command reliability"
 nd_w_reliability_tt:0 "#tooltip_header Command reliability#!\n$TOOLTIP_DELIMITER$\nHow well the chain of command holds under pressure. Safeguards and satellite communications raise it; crew strain, an enemy's sabotage of our communications, a buried incident or a punished sceptic lower it. It makes incidents rarer and decides whether a delegated launch sequence is halted."
 nd_w_reliability_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_reliability')|0]#!"
 nd_w_reputation_header:0 "Reputation"
 nd_w_reputation_legend:0 "Aggression is a separate reputation from reliability: infamy records the first, credibility the second."
 nd_w_risk_label:0 "Incident exposure"
 nd_w_risk_tt:0 "#tooltip_header Incident exposure#!\n$TOOLTIP_DELIMITER$\nHow often something goes wrong with our forces: false warnings, accidents, a commander cut off from the capital. It rises with readiness, crew strain, poor command reliability and a dangerous crisis.\n\nMost incidents cost money, readiness or reputation. A launch is a separate and much rarer thing: it needs a war with the country in question and either an order from us or a delegated authority that nobody in the chain refuses. Outside a war, a launch sequence is recalled — and the other side sees it."
 nd_w_risk_value:0 "[JournalEntry.GetCountry.GetCustom('nd_risk_band_word')]"
 nd_w_safeguards_label:0 "Safeguards"
 nd_w_safeguards_tt:0 "#tooltip_header Safeguards#!\n$TOOLTIP_DELIMITER$\nTwo-person rules, permissive action links, training, inspections. Each level raises command reliability, makes a delegated launch likelier to be halted, and costs money every week."
 nd_w_safeguards_value:0 "Level #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_safeguards')|0]#! · @money! #N [GetPlayer.MakeScope.ScriptValue('nd_upkeep_weekly_safeguards_step')|D]#!/level/week"
 nd_w_strain_label:0 "Crew strain"
 nd_w_strain_tt:0 "#tooltip_header Crew strain#!\n$TOOLTIP_DELIMITER$\nFatigue and deferred maintenance. It builds every month at high alert, slowly at heightened readiness, and recovers at routine. Prolonged strain brings accidents with weapons aboard."
 nd_w_strain_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_strain')|0]#!"
 nd_w_survivability_label:0 "Survivability"
 nd_w_survivability_tt:0 "#tooltip_header Survivability#!\n$TOOLTIP_DELIMITER$\nHow much of our force would survive a first strike to answer it. It grows toward a ceiling our technology sets — radar, missiles in silos, missile submarines, missile defence — only while we pay for hardening, and it erodes slowly when we stop. A small survivable arsenal deters better than a large vulnerable one: a surviving force is what makes a threatened country hard to coerce."
 nd_w_survivability_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_survivability')|0]#! / [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_survivability_cap')|0]"
 nd_w_umbrella_label:0 "Nuclear umbrella"
 nd_w_umbrella_tt:0 "#tooltip_header Nuclear umbrella#!\n$TOOLTIP_DELIMITER$\nOur direct subjects count as under our nuclear guarantee without a treaty: our arsenal lifts the nuclear shadow from their war support, weighs in any crisis against them, and we are asked to answer when they are threatened or struck. A nuclear strike on one of them lets us retaliate under any doctrine.\n\nWithdrawing it is a diplomatic action on the subject: #R +10#! liberty desire at once, and more every week while it stands."
 nd_w_umbrella_value:0 "#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_umbrella_count')|0]#! subjects"
 nd_w_upkeep_label:0 "Upkeep"
 nd_w_upkeep_tt:0 "#tooltip_header Upkeep#!\n$TOOLTIP_DELIMITER$\nWhat the deterrent costs every week, whatever the weapons programme is doing: custody of the arsenal, readiness above routine, safeguards and hardening. It scales with our GDP and with the size of the arsenal, and is capped at about two percent of GDP a year."
 nd_w_upkeep_value:0 "@money!#R [JournalEntry.GetCountry.MakeScope.ScriptValue('nd_display_upkeep_weekly')|D]#!/week"

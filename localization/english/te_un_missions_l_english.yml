l_english:

#
# UN PHASE 7 — THE STANDING UN FORCE (standing_force)
#
 UN_PROPOSE_STANDING_FORCE:0 "Establish the Standing UN Force"
 UN_PROPOSE_STANDING_FORCE_DESC:0 "Propose that the General Assembly found a [concept_un_standing_force]. The vote takes a year. If it carries, every UN peacekeeping and stabilisation mission counts the Force as a contributor and can no longer lapse or fail for want of one, the Force takes a tenth of the UN's budget, and at the [concept_un_tier_supranational] tier no member may add a war goal against a country such a mission serves. #G UN credibility +1 if passed.#! Binding: a [concept_un_veto] blocks it outright. Requires Charter Reform I and [concept_major_power] rank."
 UN_PROPOSE_STANDING_FORCE_TT:0 "#bold A General Assembly vote has been called#! to found the [concept_un_standing_force]. Human members can vote at once; AI members vote in the ninth to eleventh month. Results follow after a year."
 je_un_chamber_propose_need_standing_force:0 "The [concept_un_standing_force] has not been founded yet"
 je_un_chamber_propose_topic_standing_force:0 "#tooltippable;tooltip:je_un_chamber_propose_topic_standing_force_tt #bold Establish the Standing UN Force#!#!"
 je_un_chamber_propose_topic_standing_force_tt:0 "Would found the [concept_un_standing_force]. Every UN peacekeeping and stabilisation mission would count it as one contributor, so none could lapse or fail for want of one. It would take a tenth of the UN's budget, and at the [concept_un_tier_supranational] tier no member could make war on a country such a mission serves.\n\nFounded once; it stands until the United Nations dissolves."
 je_un_chamber_propose_no_case_standing_force:0 "#tooltippable;tooltip:je_un_chamber_propose_no_case_standing_force_tt #Y Already Founded#!#!"
 je_un_chamber_propose_no_case_standing_force_tt:0 "The [concept_un_standing_force] already stands."
 je_un_chamber_propose_preview_standing_force:0 "#bold Cost:#! a tenth of the UN's budget, @money!#v [THIS.ScriptValue('un_force_budget_preview_value')|D]#! a week at present"
 je_un_chamber_topic_standing_force:0 "#bold [concept_un_standing_force]#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_chamber_conseq_standing_force:0 "  #bold If it carries:#! $un_vote_standing_force_passed_tt$"
 je_un_chamber_conseq_standing_force_vetoed:0 "  #bold If it carries:#! $un_vote_standing_force_passed_vetoed_tt$"
 je_un_led_topic_standing_force:0 "        Standing UN Force"
 un_vote.1.t_standing_force:0 "Standing UN Force Vote"
 un_vote.1.d_standing_force:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has asked the General Assembly to found a Standing UN Force: a body of troops under the UN flag, held ready and paid from the UN's budget, so that the Assembly's peacekeepers no longer depend on whichever members choose to send a contingent. Every peacekeeping and stabilisation mission would count it as one of its contributors. At the Supranational tier it would also bar every member from making war on a country such a mission serves. The great powers lose some freedom of action; the countries the missions protect gain a guarantee. A [concept_un_permanent_member] can block it outright."
 un_vote.2.d_standing_force_passed:0 "The General Assembly has founded the Standing UN Force. The vote carried [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. From now on every UN peacekeeping and stabilisation mission has at least one contingent it can count on."
 un_vote.2.d_standing_force_failed:0 "The proposal for a Standing UN Force has been rejected by the General Assembly. The vote failed [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. The Assembly's missions still depend on the members willing to send troops."
 un_vote.2.d_standing_force_passed_vetoed:0 "The Assembly carried the resolution and a [concept_un_permanent_member] struck it down. There is no lesser form of a standing force, so it is blocked outright. The majority is on the record, and nothing else."
 un_vote_standing_force_passed_tt:0 "The [concept_un_standing_force] is founded. #G UN credibility +1, moving [concept_un_authority]'s target.#! Every UN peacekeeping and stabilisation mission counts it as a contributor and can no longer lapse or fail for want of one. It takes a tenth of the UN's budget. At the [concept_un_tier_supranational] tier no member may add a war goal against a country such a mission serves."
 un_vote_standing_force_passed_vetoed_tt:0 "A [concept_un_permanent_member] cast a [concept_un_veto]. A standing force has no graduated form, so the resolution is blocked outright and no force is founded."
 un_standing_force_need_major_power_tt:0 "We are a [concept_major_power] or greater"
 concept_un_standing_force:0 "Standing UN Force"
 concept_un_standing_force_desc:0 "A body of troops held ready under the UN flag and paid from the UN's budget, founded once by a binding resolution of the [concept_un_general_assembly] under Charter Reform I. A [concept_major_power] member tables it; a [concept_un_veto] blocks it outright. It stands until the United Nations dissolves.\n\n#bold Missions#!\nEvery [Concept('concept_un_mission_peacekeeping', 'peacekeeping')] and [Concept('concept_un_mission_stabilisation', 'stabilisation')] mission counts the Force as one contributor, so its strength is 0.25 higher (up to the usual three). Such a mission no longer lapses when no member joins it within six months, and no longer fails when its last contributor goes home.\n\n#bold Budget#!\nThe Force takes a tenth of what the paying members' [concept_un_dues] bring in each week, which the UN's lending facility can no longer lend.\n\n#bold War goals#!\nFrom the Strong tier a war goal against a country that hosts an active peacekeeping or stabilisation mission already costs twice the usual [concept_infamy] surcharge, Force or no Force. While the Force stands, at the [concept_un_tier_supranational] tier no member may add such a war goal at all: it is struck from the play the moment it is added. A country outside the UN still only pays the doubled surcharge."
 notification_un_force_war_goal_struck_notice_name:0 "A War Goal Struck"
 notification_un_force_war_goal_struck_notice_desc:0 "We added a war goal against [SCOPE.sCountry('un_force_protected').GetName], which hosts a UN peacekeeping or stabilisation mission. With the [concept_un_standing_force] in being and the United Nations at the Supranational tier, no member may make war on a country under its protection: our goals against it have been struck from the play."
 notification_un_force_war_goal_struck_notice_tooltip:0 "#header $notification_un_force_war_goal_struck_notice_name$#!\n$notification_un_force_war_goal_struck_notice_desc$"

#
# UN PHASE 7 — REQUEST ELECTORAL OBSERVERS (observer_request)
#
 UN_PROPOSE_OBSERVER_REQUEST:0 "Request Electoral Observers"
 UN_PROPOSE_OBSERVER_REQUEST_DESC:0 "Ask the General Assembly to send observers to our next election. The vote takes a year. If it carries, an [concept_un_mission_electoral] goes to our capital, paid from the UN's budget: our [concept_legitimacy] rises, and foreign Election Interference against us is easier to catch and does half the harm to our [concept_electoral_confidence]. It succeeds when an election campaign ends while it is here. #G UN delivery +1 if passed.#! Requires Charter Reform I, elections and peace."
 UN_PROPOSE_OBSERVER_REQUEST_TT:0 "#bold A General Assembly vote has been called#! on sending observers to our next election. Human members can vote at once; AI members vote in the ninth to eleventh month. Results follow after a year."
 je_un_chamber_propose_need_observer_request:0 "We hold elections, our delegation is seated, and no UN electoral observers are at work here already"
 je_un_chamber_propose_topic_observer_request:0 "#tooltippable;tooltip:je_un_chamber_propose_topic_observer_request_tt #bold Request Electoral Observers#!#!"
 je_un_chamber_propose_topic_observer_request_tt:0 "Asks the Assembly to send an [concept_un_mission_electoral] to our next election. The observers are paid from the UN's budget, so no member has to send anyone. While they are here our [concept_legitimacy] rises and Election Interference against us is easier to catch and does half the harm. They stay until an election campaign ends, for at most five years."
 je_un_chamber_propose_no_case_observer_request:0 "#tooltippable;tooltip:je_un_chamber_propose_no_case_observer_request_tt #Y No Case#!#!"
 je_un_chamber_propose_no_case_observer_request_tt:0 "Either we hold no elections (no landed, wealth or census voting and no universal suffrage), or UN electoral observers are already at work here, or our delegation is not seated, or every one of our states already holds another UN mission."
 je_un_chamber_propose_preview_observer_request:0 "#bold Observers to:#! [SCOPE.sState('un_observer_request_state').GetName]"
 je_un_chamber_topic_observer_request:0 "#bold Electoral Observers Request#! (Resolution No. [THIS.Var('un_res_seq').GetValue|0])"
 je_un_chamber_conseq_observer_request:0 "  #bold If it carries:#! $un_vote_observer_request_passed_tt$"
 je_un_led_topic_observer_request:0 "        Electoral Observers Request"
 un_vote.1.t_observer_request:0 "Electoral Observers Vote"
 un_vote.1.d_observer_request:0 "[SCOPE.sCountry('un_vote_proposer').GetName] has asked the General Assembly to send observers to its next election. The observers would be paid from the UN's budget and would stay until an election campaign has run its course. Their presence would steady the government and make foreign meddling in the vote harder to hide. A vote in favor puts the Assembly's name behind the honesty of that election."
 un_vote.2.d_observer_request_passed:0 "The General Assembly has agreed to send observers to the next election in [SCOPE.sCountry('un_vote_proposer').GetName]. The vote carried [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. The observers are paid from the UN's budget; no member is asked to send anyone."
 un_vote.2.d_observer_request_failed:0 "The request by [SCOPE.sCountry('un_vote_proposer').GetName] for electoral observers has been rejected by the General Assembly. The vote failed [ROOT.GetCountry.MakeScope.Var('un_display_support').GetValue|0] to [ROOT.GetCountry.MakeScope.Var('un_display_oppose').GetValue|0]. Its next election goes ahead without them."
 un_vote_observer_request_passed_tt:0 "The request for electoral observers was granted. #G UN delivery +1, moving [concept_un_authority]'s target.#!"
 un_observer_request_need_peace_tt:0 "We are not at war"
 un_mission_electoral_opened_tt:0 "An #G [Concept('concept_un_mission_electoral', 'electoral observer mission')]#! goes to the requester's capital (or, if the capital already holds another UN mission, its most populous state without one), paid from the UN's budget. It succeeds when an election campaign there ends while it is present, fails if the requester is attacked or stops holding elections, and lapses after five years without an election."
 un_mission_electoral_fallback_tt:0 "The requester no longer holds elections, or every one of its states already holds another UN mission: #R no observers can be sent.#!"

#
# UN PHASE 7 — THE ELECTORAL OBSERVER MISSION AND THE FORCE IN THE FIELD
#
 concept_un_mission_electoral:0 "Electoral Observer Mission"
 concept_un_mission_electoral_desc:0 "A [concept_un_mission] that watches an election. It is opened when a member's request for electoral observers is carried, in the requester's capital (or, if the capital already holds another mission, its most populous state without one). The observers are paid from the UN's budget: the mission has no contributors, members cannot send it contingents, and it never lapses for want of them. Its strength is the UN's [concept_un_enforcement], less up to half of it as members withhold [concept_un_dues].\n\n#bold Effect#! (at strength 1): #G +5#! [concept_legitimacy] and #G +3#! ideological covert defence for the host, which makes Election Interference against it easier to detect; #G -10%#! turmoil effects and #G -10%#! radicals from political movements in its state. While it runs, the cut Election Interference deals to the host's [concept_electoral_confidence] when an election campaign ends is halved.\n\n#bold Progress#!\n50 while the host is in an election campaign, 0 otherwise.\n\n#G Accomplished#! when an election campaign in the host ends while the mission is there: UN delivery grows, and the host gains standing.\n#R Fails#! if the host is attacked after the mission arrives, or stops holding elections (which also costs the host standing).\n#v Lapses#! after five years without an election, or if its host or state is gone, or if the host leaves the UN."
 je_un_chamber_mission_electoral:0 "#bold [concept_un_mission_electoral]#! in [SCOPE.sState('un_chamber_msn_state').GetName], for [AddLocalizationIf(SCOPE.sCountry('un_chamber_msn_host').Exists, SCOPE.sCountry('un_chamber_msn_host').GetName)][AddLocalizationIf(Not(SCOPE.sCountry('un_chamber_msn_host').Exists), 'je_un_chamber_country_gone')]"
 je_un_chamber_mission_electoral_gone:0 "#bold [concept_un_mission_electoral]#!, for a country or in a state no longer on the map"
 je_un_chamber_mission_observers:0 "  Observers paid from the UN's budget; no member sends a contingent."
 je_un_chamber_mission_force:0 "    the [concept_un_standing_force]"
 un_mission_electoral_state_modifier:0 "UN Electoral Observers"
 un_mission_electoral_state_modifier_desc:0 "A [Concept('concept_un_mission_electoral', 'UN electoral observer mission')] is at work in this state. Its strength follows the UN's enforcement and its budget."
 un_electoral_observers_modifier:0 "UN Electoral Observers"
 un_electoral_observers_modifier_desc:0 "Observers sent by the United Nations are watching our elections ([Concept('concept_un_mission_electoral', 'electoral observer mission')]). The government's standing rises with them, and foreign interference in the vote is harder to hide. Its strength follows the UN's enforcement and its budget."
 un_mission_volunteer_electoral_tt:0 "This is an [Concept('concept_un_mission_electoral', 'electoral observer mission')]: its observers are paid from the UN's budget, and members do not send it contingents."
 un_mission_volunteer_need_not_electoral_tt:0 "The mission takes contingents: an electoral observer mission is staffed from the UN's budget"
 un_mission_withdraw_last_force_tt:0 "We are the last member to serve in it, but the [concept_un_standing_force] stays: the mission goes on at reduced strength."
 notification_un_mission_electoral_succeeded_notice_name:0 "An Election Observed"
 notification_un_mission_electoral_succeeded_notice_desc:0 "The UN [Concept('concept_un_mission_electoral', 'electoral observers')] in [SCOPE.sState('un_msn_state_done').GetName] have seen our election through and gone home. The Assembly's record of delivery grows, and our international standing with it."
 notification_un_mission_electoral_succeeded_notice_tooltip:0 "#header $notification_un_mission_electoral_succeeded_notice_name$#!\n$notification_un_mission_electoral_succeeded_notice_desc$"
 notification_un_mission_electoral_failed_notice_name:0 "UN Electoral Observers Withdrawn"
 notification_un_mission_electoral_failed_notice_desc:0 "The UN [Concept('concept_un_mission_electoral', 'electoral observers')] in [SCOPE.sState('un_msn_state_done').GetName] have left before an election: we were attacked, or we no longer hold elections. The Assembly's credibility suffers."
 notification_un_mission_electoral_failed_notice_tooltip:0 "#header $notification_un_mission_electoral_failed_notice_name$#!\n$notification_un_mission_electoral_failed_notice_desc$"
 notification_un_mission_electoral_lapsed_notice_name:0 "UN Electoral Observers Go Home"
 notification_un_mission_electoral_lapsed_notice_desc:0 "The UN electoral observers in our country have gone home without seeing an election: five years passed without one, or we left the United Nations."
 notification_un_mission_electoral_lapsed_notice_tooltip:0 "#header $notification_un_mission_electoral_lapsed_notice_name$#!\n$notification_un_mission_electoral_lapsed_notice_desc$"

#
# UN PHASE 7 — REASON CODES (missions: ledger 37-38, standing 45-46)
#
 je_un_led_reason_37:0 "      #lore an electoral observer mission saw an election through#!"
 je_un_led_reason_37_on:0 "      #lore the#! [Concept('concept_un_mission_electoral', 'electoral observer mission')] #lore in#! $je_un_led_subject_state$ #lore saw an election through#!"
 je_un_led_reason_38:0 "      #lore an electoral observer mission failed#!"
 je_un_led_reason_38_on:0 "      #lore the#! [Concept('concept_un_mission_electoral', 'electoral observer mission')] #lore in#! $je_un_led_subject_state$ #lore failed#!"
 je_un_standing_reason_45:0 "  Most recently: an election we held under UN observers."
 je_un_standing_reason_46:0 "  Most recently: #R we did away with our elections while UN observers watched.#!"

#
# UN PHASE 7 — THE STATE PANEL'S UN MISSION TILE
#
 TE_STATE_UN_NAME_ELECTORAL:0 "[concept_un_mission_electoral]"
 TE_STATE_UN_ROW_KIND_VALUE:0 "#v [AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.ScriptValue('un_state_mission_type'), '(CFixedPoint)1'), 'TE_STATE_UN_NAME_PEACEKEEPING')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.ScriptValue('un_state_mission_type'), '(CFixedPoint)2'), 'TE_STATE_UN_NAME_AID')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.ScriptValue('un_state_mission_type'), '(CFixedPoint)3'), 'TE_STATE_UN_NAME_STABILISATION')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.ScriptValue('un_state_mission_type'), '(CFixedPoint)4'), 'TE_STATE_UN_NAME_ELECTORAL')]#!"
 TE_STATE_UN_MISSION_TT:0 "#header United Nations Mission#!\nA UN mission is working in this state. Contributing countries: #v [State.MakeScope.ScriptValue('un_state_mission_contributors')|0]#![AddLocalizationIf(GreaterThan_CFixedPoint(State.MakeScope.ScriptValue('un_state_mission_force'), '(CFixedPoint)0'), 'TE_STATE_UN_MISSION_FORCE')][AddLocalizationIf(EqualTo_CFixedPoint(State.MakeScope.ScriptValue('un_state_mission_type'), '(CFixedPoint)4'), 'TE_STATE_UN_MISSION_OBSERVERS')][AddLocalizationIf(GreaterThan_CFixedPoint(State.MakeScope.ScriptValue('un_state_mission_barred'), '(CFixedPoint)0'), 'TE_STATE_UN_MISSION_BARRED')]\n$TOOLTIP_DELIMITER$\nIts effect here is multiplied by its #bold strength#!, #v ×[State.MakeScope.ScriptValue('un_state_mission_strength')|2]#!: the UN's [concept_un_enforcement], less what withheld [concept_un_dues] cost the budget, and more for every contributor up to three.\n$TOOLTIP_DELIMITER$\nA [Concept('concept_un_mission_peacekeeping', 'peacekeeping mission')] succeeds after two years of peace for this country; an [Concept('concept_un_mission_aid', 'aid mission')] when this state has no famine and a standard of living of 10; a [Concept('concept_un_mission_stabilisation', 'stabilisation mission')] once the collapse is over and a year has passed; an [Concept('concept_un_mission_electoral', 'electoral observer mission')] when an election campaign here ends. A mission fails if this country is attacked; a peacekeeping or stabilisation mission also fails if every contributor leaves while the [concept_un_standing_force] does not serve in it, and an electoral one if this country stops holding elections. The chamber of the United Nations journal entry lists every mission."
 TE_STATE_UN_MISSION_OBSERVERS:0 "\nIt is an electoral observer mission: its observers are paid from the UN's budget, and it has no contributors."
 TE_STATE_UN_MISSION_FORCE:0 "\nThe [concept_un_standing_force] serves in it as one more contributor."
 TE_STATE_UN_MISSION_BARRED:0 "\n#v No member of the United Nations may add a war goal against this country while the mission is here.#!"

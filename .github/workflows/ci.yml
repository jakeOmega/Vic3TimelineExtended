# Game-independent checks for the mod + its Python tooling (issue #247).
#
# Everything here runs without a Victoria 3 install: the dummy VIC3_* paths below
# satisfy path_constants' lazy resolution, and no step starts mod_state_server.
# Audits that need the vanilla game stay out of CI — without the base game they
# degrade to noise. A few audits build a ModState anyway, taking vanilla from the
# committed vanilla_parsed/ snapshot; loc_coverage_audit, pm_employment_audit
# and concept_reference_audit build the full one
# (mod_state_server.cli_mod_state, ~7 s each). A stale snapshot
# (`python3 vanilla_parsed.py check`) could make them flag or hide a vanilla key.
name: CI

on:
  # `push` is scoped to main so a PR branch doesn't run the whole matrix twice
  # (once for the branch push, once for the pull_request event). `pull_request`
  # still covers every branch, including forks.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The whole job takes 14-17 minutes (November 2026), nearly all of it the
    # unit tests; 30 caps a hung step instead of burning the default 6-hour
    # allowance.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      # path_constants resolves lazily, so these only need to be set, not real.
      VIC3_BASE_GAME: /nonexistent/game
      VIC3_MOD_DEPLOY_TARGET: /nonexistent/deploy
      VIC3_VANILLA_REPO: /nonexistent/vic3
      VIC3_VANILLA_DOCS_RUNTIME: /nonexistent/docs
      VIC3_GAME_LOGS: /nonexistent/logs
    steps:
      - name: Check out (without gfx/)
        uses: actions/checkout@v4
        with:
          # gfx/ is ~1.7 GB of textures that nothing in this job reads; the
          # dds-dimensions job below fetches the ones it scans.
          sparse-checkout: |
            /*
            !/gfx/
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          # Ruff is pinned to an exact version on purpose: requirements.txt's
          # `ruff>=0.5,<1` is right for a developer machine, but a new ruff
          # release can add rules (or change an existing one's behaviour) and
          # redden CI on a commit that changed nothing. Bump this deliberately,
          # after running `ruff check .` locally on the new version. pytest and
          # pytest-xdist (the unit-test runner) are pinned for the same reason.
          python3 -m pip install "ruff==0.15.8" "pytest==9.1.1" "pytest-xdist==3.8.0"
          ruff --version

      # Every check from here on is one entry in scripts/preflight.py's CHECKS
      # table, grouped; each step runs one group. Adding a check there adds it
      # here, and `.venv/bin/python scripts/preflight.py` runs the same list on
      # a developer's machine. The audits are one group: their roster,
      # arguments and suppression comments are audit_registry.py's, and
      # scripts/run_audits.py runs them in parallel. test_audit_registry.py
      # fails if a group has no step below.
      #
      # compileall, the 3.11 f-string scan and `ruff check .` (rules in
      # ruff.toml, `[lint] select = ["F"]`; zero findings since #277).
      - name: Python — compile, lint
        if: ${{ !cancelled() }}
        run: python3 scripts/preflight.py --ci --only python

      # The tests are unittest classes; pytest runs them unchanged, one worker
      # per CPU (-n auto). --dist loadfile runs each file whole, in order, on one
      # worker, as unittest does: under loadscope a file's classes are split into
      # batches, and pytest runs tearDownModule after each, so
      # test_econ_save_series lost its temporary directory midway. This step
      # takes about 14 minutes on the runner's cores (November 2026).
      # --durations=25 lists the slowest tests, so a new slow one shows in the
      # log. `python3 -m unittest discover -s . -p 'test_*.py'` still runs the
      # same tests serially.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: python3 scripts/preflight.py --ci --only tests

      # Tab indentation, localization file sanity, American spelling,
      # organize_loc (its --check, then the writer and a clean tree: a key
      # filed where it would not put it moves on the next reload, and
      # committing half of that move drops keys, #613, #617), and the CRLF docs.
      - name: Mod content — tabs, localization files, spelling, line endings
        if: ${{ !cancelled() }}
        run: python3 scripts/preflight.py --ci --only content

      # Thirty-odd audits, each flagging something the engine accepts silently.
      # A failing one prints what the flag means and the comment that
      # suppresses an intended one. docs/guides/audits.md lists them all.
      - name: Audits (audit_registry.py)
        if: ${{ !cancelled() }}
        run: python3 scripts/preflight.py --ci --only audits

      # docs/guides/audits.md against the registry, the post-load rosters
      # against the docs that list them (#248), and the player guide: its style
      # lint, and the committed PDF against its sources (neither needs pandoc
      # or Typst).
      - name: Docs — generated pages, rosters, player guide
        if: ${{ !cancelled() }}
        run: python3 scripts/preflight.py --ci --only docs

  dds-dimensions:
    name: DDS texture dimensions
    runs-on: ubuntu-latest
    # A PR scans the textures it adds or changes; a push to main scans all of
    # gfx/ (~1.7 GB). That download takes about 30 s, but GitHub sometimes
    # sends nothing for it: git has no timeout of its own, and 6 of 100 runs on
    # 2026-10-06/07 hung until this job was killed. The fetch step below gives
    # each attempt 150 s and tries three times; this limit sits above that.
    timeout-minutes: 12
    steps:
      - name: Check out the checker only
        uses: actions/checkout@v4
        with:
          # Commits and trees, but file contents only for these two files;
          # the textures come in the fetch step. Depth 2 gives HEAD^1, the
          # base side of a PR's merge commit, to diff against.
          sparse-checkout: |
            /scripts/analysis/check_dds_dimensions.py
            /scripts/analysis/dds_dimension_allowlist.txt
          sparse-checkout-cone-mode: false
          filter: blob:none
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip install: the checker is stdlib-only (it reads DDS headers directly).
      # It prints `gfx/` alone for the full sweep, which a PR gets when it
      # touches the checker, the allowlist or a listed texture.
      - name: Choose the textures to scan
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/analysis/check_dds_dimensions.py --pr-scope=HEAD^1 > "$RUNNER_TEMP/dds_scope"
          else
            echo gfx/ > "$RUNNER_TEMP/dds_scope"
          fi
          if [ -s "$RUNNER_TEMP/dds_scope" ]; then
            cat "$RUNNER_TEMP/dds_scope"
            echo "scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "This PR adds or changes no texture under gfx/; nothing to scan."
          fi

      - name: Fetch them (time-limited, retried)
        if: steps.scope.outputs.scan == 'true'
        run: |
          xargs -d '\n' -a "$RUNNER_TEMP/dds_scope" git ls-tree -r HEAD -- \
            | awk '{print $3}' > "$RUNNER_TEMP/dds_blobs"
          echo "Fetching $(wc -l < "$RUNNER_TEMP/dds_blobs") file(s)"
          # The same fetch git runs on demand for a blobless checkout, run
          # here so it can be timed out (timeout kills its whole process
          # group) and shows progress, the server's included.
          for attempt in 1 2 3; do
            if timeout 150 git -c fetch.negotiationAlgorithm=noop fetch --progress \
                --no-tags --no-write-fetch-head --recurse-submodules=no \
                --filter=blob:none --stdin origin < "$RUNNER_TEMP/dds_blobs"; then
              break
            elif [ "$attempt" = 3 ]; then
              echo "::error::Fetching the textures failed or stalled three times; re-run the job."
              exit 1
            fi
            echo "::warning::Texture fetch attempt $attempt failed or stalled; retrying."
          done
          # Every blob is local now, so this only writes files.
          sed 's|^|/|' "$RUNNER_TEMP/dds_scope" | git sparse-checkout add --stdin

      - name: Block-compressed textures must be multiples of 4
        if: steps.scope.outputs.scan == 'true'
        run: |
          # Bare for the full sweep: only that runs the stale-allowlist check.
          if [ "$(cat "$RUNNER_TEMP/dds_scope")" = gfx/ ]; then
            python3 scripts/analysis/check_dds_dimensions.py
          else
            xargs -d '\n' -a "$RUNNER_TEMP/dds_scope" python3 scripts/analysis/check_dds_dimensions.py
          fi

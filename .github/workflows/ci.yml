# Game-independent checks for the mod + its Python tooling (issue #247).
#
# Everything here runs without a Victoria 3 install: the dummy VIC3_* paths below
# satisfy path_constants' lazy resolution, and no step builds a ModState or starts
# mod_state_server. Audits that need the vanilla game stay out of CI — without the
# base game they degrade to noise.
name: CI

on:
  # `push` is scoped to main so a PR branch doesn't run the whole matrix twice
  # (once for the branch push, once for the pull_request event). `pull_request`
  # still covers every branch, including forks.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The whole job is ~2 minutes today; 20 caps a hung step instead of burning
    # the default 6-hour allowance.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      # path_constants resolves lazily, so these only need to be set, not real.
      VIC3_BASE_GAME: /nonexistent/game
      VIC3_MOD_DEPLOY_TARGET: /nonexistent/deploy
      VIC3_VANILLA_REPO: /nonexistent/vic3
      VIC3_VANILLA_DOCS_RUNTIME: /nonexistent/docs
      VIC3_GAME_LOGS: /nonexistent/logs
    steps:
      - name: Check out (without gfx/)
        uses: actions/checkout@v4
        with:
          # gfx/ is ~1.8 GB of textures that nothing in this job reads; the
          # dds-dimensions job below checks it out on its own.
          sparse-checkout: |
            /*
            !/gfx/
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          # Ruff is pinned to an exact version on purpose: requirements.txt's
          # `ruff>=0.5,<1` is right for a developer machine, but a new ruff
          # release can add rules (or change an existing one's behaviour) and
          # redden CI on a commit that changed nothing. Bump this deliberately,
          # after running `ruff check .` locally on the new version.
          python3 -m pip install "ruff==0.15.8"
          ruff --version

      - name: Byte-compile every Python file
        if: ${{ !cancelled() }}
        run: python3 -m compileall -q .

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s . -p 'test_*.py'

      # Bare `ruff check .` on purpose — the rule set lives in ruff.toml
      # (`[lint] select = ["F"]`), so this is byte-for-byte the command the
      # README/CLAUDE.md tell you to run before pushing. Zero findings since #277.
      - name: Lint (ruff, pyflakes rules)
        if: ${{ !cancelled() }}
        run: ruff check .

      - name: Paradox tab indentation
        if: ${{ !cancelled() }}
        # `:(glob)` magic is deliberate. In a plain git pathspec `*` already
        # crosses `/`, so `events/**/*.txt` needs a second literal slash and
        # matches NOTHING (silently checking zero event files); under `:(glob)`,
        # `**` has gitignore semantics — zero or more directories — so both
        # pathspecs stay recursive as the tree grows subdirectories.
        #
        # The three exclusion pathspecs cover 10 files, each wholly rewritten by a
        # POST /reload generator that emits the unformatted text verbatim
        # (apply_ideologies.py, ig_feminism.py, gen_law_consistency.py), so
        # normalizing them would be undone by the next reload. See PR #272 for the
        # per-file rationale.
        run: |
          mapfile -t files < <(git ls-files \
            ':(glob)common/**/*.txt' \
            ':(glob)events/**/*.txt' \
            ':!:common/ideologies/modified.txt' \
            ':!:common/interest_groups/00_*.txt' \
            ':!:common/scripted_effects/extra_law_consistency_generated.txt')
          if [ "${#files[@]}" -eq 0 ]; then
            # Never pass an empty argv to the formatter: it would check nothing
            # and still exit 0, so a broken pathspec would look like a pass.
            echo "::warning::Tab check matched no files — the pathspecs above are stale. Skipping."
            exit 0
          fi
          echo "Checking ${#files[@]} Paradox .txt files."
          python3 scripts/format_paradox_tabs.py --check "${files[@]}"

      - name: Localization file sanity (BOM, header, duplicate keys)
        if: ${{ !cancelled() }}
        run: python3 scripts/analysis/check_localization_files.py

      - name: Audit — duplicate top-level keys
        if: ${{ !cancelled() }}
        run: python3 duplicate_key_audit.py --strict

      - name: Audit — any_* with limit
        if: ${{ !cancelled() }}
        run: python3 any_limit_audit.py --strict

      - name: Audit — localization rendering
        if: ${{ !cancelled() }}
        run: python3 loc_render_audit.py --strict

      - name: Audit — orphaned events
        if: ${{ !cancelled() }}
        run: python3 orphaned_event_audit.py --strict

      - name: Audit — attitude keys
        if: ${{ !cancelled() }}
        run: python3 attitude_key_audit.py

      - name: Audit — kill_character guards
        if: ${{ !cancelled() }}
        run: python3 kill_character_audit.py --check

      - name: Audit — iterator limit placement
        if: ${{ !cancelled() }}
        run: python3 iterator_limit_audit.py --strict

      - name: Audit — modifier multiplier variables
        if: ${{ !cancelled() }}
        run: python3 modifier_multiplier_var_audit.py --strict

      - name: Audit — event images
        if: ${{ !cancelled() }}
        run: python3 event_image_audit.py --strict

      - name: Audit — treaty leverage side
        if: ${{ !cancelled() }}
        run: python3 treaty_leverage_side_audit.py --strict

      - name: Audit — event context (system gating, unchosen actions)
        if: ${{ !cancelled() }}
        run: python3 event_context_audit.py --strict

      - name: Audit — prev resolving to a named scope
        if: ${{ !cancelled() }}
        run: python3 prev_scope_audit.py --strict

      # Fails when a POST_LOAD_REGENERATORS / POST_LOAD_AUDITS module in
      # mod_state_server.py is missing from CLAUDE.md, docs/guides/python_tools.md
      # or docs/auto_generated_files.md. Reads the rosters with `ast`, so it needs
      # no server and no game install. (#248)
      - name: Post-load roster / docs drift
        if: ${{ !cancelled() }}
        run: python3 scripts/analysis/check_post_load_rosters.py

  dds-dimensions:
    name: DDS texture dimensions
    runs-on: ubuntu-latest
    # Dominated by the gfx/ checkout (~1.8 GB, blobless); the scan itself is
    # seconds. 10 caps a stalled clone.
    timeout-minutes: 10
    steps:
      - name: Check out gfx/ only
        uses: actions/checkout@v4
        with:
          # scripts/analysis carries the checker and its allowlist.
          sparse-checkout: |
            gfx
            scripts/analysis
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip install: the checker is stdlib-only (it reads DDS headers directly).
      - name: Block-compressed textures must be multiples of 4
        run: python3 scripts/analysis/check_dds_dimensions.py

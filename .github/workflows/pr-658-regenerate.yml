name: PR 658 regenerate derived files
on:
  push:
    branches: [docs/un-narcotics-convention-spec]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIC3_BASE_GAME: /nonexistent/game
      VIC3_MOD_DEPLOY_TARGET: /nonexistent/deploy
      VIC3_VANILLA_REPO: /nonexistent/vic3
      VIC3_VANILLA_DOCS_RUNTIME: /nonexistent/docs
      VIC3_GAME_LOGS: /nonexistent/logs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/un-narcotics-convention-spec
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/gfx/
            /gfx/interface/icons/un_icons/
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python3 -m pip install -r requirements.txt -r requirements-docs.txt
      - name: Generate localization and player guide PDF
        run: |
          python3 organize_loc.py
          python3 scripts/build_player_guide.py
          python3 scripts/build_player_guide.py --check
      - name: Commit derived files to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/english docs/player_guide/Vic3TimelineExtended_Player_Guide.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: rebuild player guide and organize narcotics localization"
            git push origin HEAD:docs/un-narcotics-convention-spec
          fi
      - name: Test convention integration
        run: python3 -m unittest test_un_convention_registry test_un_state_mirror test_un_membership test_un_chamber_propose_ops test_un_layout test_un_overview_data test_un_ledger_reason_codes -v
